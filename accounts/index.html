<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号管理 · 剧读多号</title>
<style>
  :root {
    --ink: #1F2A24;
    --ink-soft: #5A6961;
    --green: #2F5D45;
    --green-soft: #EAF1EB;
    --line: #E2DED4;
    --paper: #F7F5F0;
    --orange: #8A5A33;
    --orange-bg: #FBF1E7;
    --orange-line: #E3C9A9;
    --red: #B4553F;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 0 18px 60px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  .wrap { max-width: 660px; margin: 0 auto; }
  header { padding: 30px 0 18px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 1px; color: var(--green); }
  .sub { margin: 0 0 8px; font-size: 13px; color: var(--ink-soft); }
  .sub.warn { color: #8A6A3B; }
  main { padding-top: 6px; }
  .acct-list { border-top: 1px solid var(--line); margin-top: 14px; }
  .acct-row { display: flex; align-items: flex-start; gap: 10px; padding: 16px 2px; border-bottom: 1px solid var(--line); }
  .acct-main { flex: 1; min-width: 0; }
  .acct-name-row { display: flex; align-items: center; gap: 10px; }
  .acct-name { display: block; flex: 1; min-width: 0; font-size: 16px; font-weight: 700; color: var(--ink); word-break: break-all; }
  .acct-remark { flex: 0 1 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #8A6A3B; background: #FBF3E6; border: 1px solid #EEDCC0; border-radius: 3px; padding: 1px 7px; }
  .acct-link { flex-shrink: 0; font-size: 12px; color: var(--green); text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 9px; white-space: nowrap; background: #FFFFFF; }
  .acct-link:hover { background: var(--green-soft); border-color: #B9CDBF; }
  .acct-user { display: block; margin-top: 3px; font-size: 12px; color: #8C998F; letter-spacing: .5px; word-break: break-all; }
  .acct-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ip-btn {
    border: 1px solid var(--orange-line); background: var(--orange-bg); color: var(--orange);
    border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .ip-btn:hover { background: #F7E7D7; }
  .ip-btn.on { border-color: #D2B48C; }
  .acct-gen {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--line); background: #FCFBF8; color: #7A847B;
    border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; user-select: none;
  }
  .acct-gen input { margin: 0; width: 13px; height: 13px; accent-color: var(--green); cursor: pointer; }
  .acct-gen .yes, .acct-gen .no { font-weight: 700; color: #B4BCB5; }
  .acct-gen[data-on="true"] { border-color: #B9CDBF; background: var(--green-soft); }
  .acct-gen[data-on="true"] .yes { color: var(--green); }
  .acct-gen[data-on="false"] .no { color: #7A847B; }
  .his-btn {
    border: 1px solid #C5D6C9; background: #FCFBF8; color: var(--green);
    border-radius: 4px; padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .his-btn:hover { background: var(--green-soft); }
  .acct-ops { flex-shrink: 0; display: flex; gap: 10px; padding-top: 2px; }
  .link-btn { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; color: var(--green); cursor: pointer; }
  .link-btn.del { color: var(--red); }
  .link-btn:hover { text-decoration: underline; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .btn-soft {
    height: 34px; padding: 0 14px; font: inherit; font-size: 13px; color: var(--green);
    background: #FFFFFF; border: 1px solid #C5D6C9; border-radius: 4px; cursor: pointer;
  }
  .btn-soft:hover { background: var(--green-soft); }
  .foot { margin: 16px 0 0; font-size: 12px; color: #9AA69D; line-height: 1.8; }
  .empty { margin: 22px 0; font-size: 13px; color: #9AA69D; }

  /* 单账号只读视图：访问 ?view=<key> 时，只显示这一个账号的人设 */
  body.view-mode header .sub { display: none; }
  body.view-mode .tools, body.view-mode .foot { display: none; }
  .profile-head { margin: 4px 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .profile-head h2 { margin: 0; font-size: 22px; letter-spacing: 1px; color: var(--green); word-break: break-all; }
  .profile-head .p-user { margin: 5px 0 0; font-size: 12px; color: #8C998F; letter-spacing: .5px; }
  .profile-item { margin: 0 0 16px; }
  .profile-item .k { margin: 0 0 5px; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--orange); }
  .profile-item .v { margin: 0; font-size: 14px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .profile-item .v .li { margin: 0 0 3px; }
  .profile-gen { display: inline-block; margin-top: 4px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; color: #7A847B; background: #FCFBF8; }
  .profile-gen.on { border-color: #B9CDBF; background: var(--green-soft); color: var(--green); }
  /* 单账号编辑表单（?view=<key>） */
  .profile-tip { margin: 0 0 16px; padding: 10px 12px; font-size: 12.5px; line-height: 1.7; color: #8A6A3B; background: var(--orange-bg); border: 1px solid var(--orange-line); border-radius: 6px; }
  .pf-field { margin: 0 0 14px; }
  .pf-label { display: block; margin: 0 0 5px; font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--orange); }
  .pf-input {
    width: 100%; height: 38px; padding: 0 10px; font: inherit; font-size: 14px; color: var(--ink);
    background: #FCFBF8; border: 1px solid var(--line); border-radius: 4px;
  }
  .pf-textarea {
    width: 100%; min-height: 72px; padding: 8px 10px; font: inherit; font-size: 13.5px; line-height: 1.7;
    color: var(--ink); background: #FCFBF8; border: 1px solid var(--line); border-radius: 4px; resize: vertical;
  }
  .pf-input:focus, .pf-textarea:focus { outline: none; border-color: #9DBAA8; background: #FFFFFF; }
  .pf-hint { display: block; margin-top: 3px; font-size: 11px; color: #9AA69D; }
  .pf-actions { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .pf-actions .btn-main { width: 100%; }
  .pf-actions .btn-main[disabled] { opacity: .6; cursor: default; }
  .pf-msg { min-height: 20px; margin: 10px 0 0; font-size: 12.5px; color: var(--red); text-align: center; }
  .pf-msg.ok { color: var(--green); }
  .fsbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 14px; padding: 10px 12px;
    border: 1px solid var(--orange-line); background: var(--orange-bg);
    border-radius: 6px; font-size: 12.5px; color: #8A6A3B; line-height: 1.6;
  }
  .fsbar .btn-soft { height: 30px; margin: 0; }

  .modal { position: fixed; inset: 0; z-index: 130; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(31, 42, 36, .44); }
  .sheet { width: 100%; max-width: 410px; max-height: 88vh; overflow: auto; padding: 22px 20px 18px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 18px 50px rgba(31, 42, 36, .18); }
  .sheet.wide { max-width: 560px; }
  .sheet h3 { margin: 0 0 10px; font-size: 17px; letter-spacing: 1px; color: var(--green); }
  .his-list { margin-top: 4px; border-top: 1px solid var(--line); }
  .his-item { border-bottom: 1px solid var(--line); }
  .his-head {
    display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    border: 0; background: none; padding: 11px 2px; font: inherit; cursor: pointer;
  }
  .his-head:hover { background: var(--green-soft); }
  .his-time { flex-shrink: 0; font-size: 12.5px; color: var(--green); font-weight: 700; }
  .his-note { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .his-cnt { flex-shrink: 0; font-size: 11px; color: #9AA69D; }
  .his-detail { display: none; padding: 4px 4px 14px; }
  .his-detail.open { display: block; }
  .his-acct { margin: 8px 0; padding: 9px 11px; background: #FBFAF6; border: 1px solid var(--line); border-radius: 5px; }
  .his-acct-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  .his-acct-mark { font-size: 11px; color: #8A6A3B; margin-left: 6px; }
  .his-acct-gen { font-size: 11px; color: var(--green); margin-left: 6px; }
  .his-persona { margin: 6px 0 0; font-size: 12px; line-height: 1.65; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; }
  .his-empty { margin: 18px 0; font-size: 13px; color: #9AA69D; text-align: center; }
  .tip { margin: 0 0 16px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; }
  .act { display: flex; gap: 8px; margin-top: 20px; }
  .btn-main {
    flex: 1; height: 40px; font: inherit; font-size: 14px; letter-spacing: 2px; color: #FFFFFF;
    background: var(--green); border: 0; border-radius: 5px; cursor: pointer;
  }
  .btn-main:hover { background: #274E3A; }
  .btn-ghost { height: 40px; padding: 0 18px; font: inherit; font-size: 13px; color: var(--ink-soft); background: #FFFFFF; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .btn-ghost:hover { background: #F7F5F0; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; letter-spacing: .5px; color: var(--ink-soft); }
  input[type="text"] {
    width: 100%; height: 38px; padding: 0 10px; font: inherit; font-size: 14px; color: var(--ink);
    background: #FCFBF8; border: 1px solid var(--line); border-radius: 4px;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: #9DBAA8; background: #FFFFFF; }
  .intro-select {
    width: 100%; height: 38px; padding: 0 10px; font: inherit; font-size: 14px; color: var(--ink);
    background: #FCFBF8; border: 1px solid var(--line); border-radius: 4px;
  }
  .intro-select:focus { outline: none; border-color: #9DBAA8; background: #FFFFFF; }
  .intro-input {
    width: 100%; min-height: 66px; padding: 8px 10px; font: inherit; font-size: 13.5px; line-height: 1.6;
    color: var(--ink); background: #FCFBF8; border: 1px solid var(--line); border-radius: 4px; resize: vertical;
  }
  .intro-input:focus { outline: none; border-color: #9DBAA8; background: #FFFFFF; }
  .ip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ip-grid .wide { grid-column: 1 / -1; }
  .row-line { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 6px; }
  .row-line textarea {
    flex: 1; min-height: 38px; padding: 8px 10px; font: inherit; font-size: 13.5px; line-height: 1.6;
    color: var(--ink); background: #FCFBF8; border: 1px solid var(--line); border-radius: 4px; resize: vertical;
  }
  .row-del { flex-shrink: 0; height: 30px; margin-top: 4px; padding: 0 7px; font: inherit; font-size: 11px; color: #9AA69D; background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
  .row-del:hover { color: var(--red); border-color: #E3C6BE; }
  .row-add { margin-top: 2px; padding: 2px 8px; font: inherit; font-size: 11.5px; letter-spacing: .5px; color: var(--green); background: none; border: 1px dashed #B9CDBF; border-radius: 3px; cursor: pointer; }
  .row-add:hover { background: var(--green-soft); }
  .err { min-height: 18px; margin: 10px 0 0; font-size: 12.5px; color: var(--red); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(10px);
    max-width: 82vw; padding: 10px 16px; font-size: 13px; color: #FFFFFF;
    background: rgba(31, 42, 36, .92); border-radius: 6px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 200;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 520px) {
    .ip-grid { grid-template-columns: 1fr; }
    body { padding: 0 12px 48px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>账号管理</h1>
    <p class="sub">每个账号一套人设（IP）。点「个人定位」填好九项，写稿就照这套人设落笔；点「修改」可以改名字。</p>
    <p class="sub">「生成文章」勾成「是」的账号，下次发链接才会给它写一篇。</p>
    <p class="sub warn" id="storeTip">正在连接云端…</p>
  </header>
  <main>
    <div class="acct-list" id="acctList"></div>
    <div class="tools">
      <button class="btn-soft" id="addBtn" type="button">＋ 新增账号</button>
      <button class="btn-soft" id="historyBtn" type="button">更新记录</button>
      <button class="btn-soft" id="exportBtn" type="button">导出备份</button>
      <button class="btn-soft" id="importBtn" type="button">导入备份</button>
      <input type="file" id="fileBox" accept="application/json,.json" hidden>
    </div>
    <p class="foot">数据保存在云端，手机、电脑打开这个网址都能看到同一份，改完自动保存。写稿时会从云端读取这份人设。「导出备份」可存一份到本地留档。</p>
  </main>
</div>

<!-- 个人定位 -->
<div class="modal" id="ipMask" hidden>
  <div class="sheet wide">
    <h3 id="ipTitle">个人定位</h3>
    <p class="tip">按下面九项填，保存后写稿会直接照这套人设落笔。改动只作用于当前账号，不影响别的号。</p>
    <div class="ip-grid">
      <div class="fld"><label for="ipName">名字</label><input id="ipName" data-ip="名字" type="text" placeholder="填写名字"></div>
      <div class="fld"><label for="ipGender">性别</label>
        <select id="ipGender" data-ip="性别" class="intro-select">
          <option value="">选填</option>
          <option value="女">女</option>
          <option value="男">男</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="fld"><label for="ipCity">城市</label><input id="ipCity" data-ip="城市" type="text" placeholder="填写城市"></div>
      <div class="fld" style="grid-column:1/-1"><label for="ipJob">职业</label><input id="ipJob" data-ip="职业" type="text" placeholder="填写职业"></div>
      <div class="fld wide"><label for="ipIntro">个人介绍</label><textarea id="ipIntro" data-ip="个人介绍" class="intro-input" rows="3" placeholder="一两句话介绍自己，写稿时会带上"></textarea></div>
      <div class="fld wide" data-multi="性格"><label>性格</label><div class="row-list" data-rows="性格"></div><button class="row-add" type="button" data-add="性格">＋ 添加一行</button></div>
      <div class="fld wide" data-multi="经历"><label>经历</label><div class="row-list" data-rows="经历"></div><button class="row-add" type="button" data-add="经历">＋ 添加一行</button></div>
      <div class="fld wide" data-multi="兴趣"><label>兴趣</label><div class="row-list" data-rows="兴趣"></div><button class="row-add" type="button" data-add="兴趣">＋ 添加一行</button></div>
      <div class="fld wide" data-multi="讨厌的事"><label>讨厌的事</label><div class="row-list" data-rows="讨厌的事"></div><button class="row-add" type="button" data-add="讨厌的事">＋ 添加一行</button></div>
    </div>
    <p class="err" id="ipErr"></p>
    <div class="act"><button class="btn-main" id="ipSave" type="button">保存</button><button class="btn-ghost" id="ipClose" type="button">关闭</button></div>
  </div>
</div>

<!-- 改名字 / 新增账号 -->
<div class="modal" id="editMask" hidden>
  <div class="sheet">
    <h3 id="editTitle">修改名字</h3>
    <p class="tip" id="editTip">名字是列表里显示的名字。账号编号不变，人设和「生成文章」开关都不受影响。</p>
    <div class="fld"><label for="editName">名字</label><input id="editName" type="text" placeholder="显示用的名字"></div>
    <div class="fld"><label for="editRemark">备注（只在这个列表的名字旁显示，专属链接页看不到）</label><input id="editRemark" type="text" placeholder="给这个号记一句，比如：写古装剧"></div>
    <div class="fld" id="editUserWrap"><label for="editUser">登录账号（仅作标记，已不需要登录）</label><input id="editUser" type="text" placeholder="test001"></div>
    <p class="err" id="editErr"></p>
    <div class="act"><button class="btn-main" id="editSave" type="button">保存</button><button class="btn-ghost" id="editCancel" type="button">取消</button></div>
  </div>
</div>

<!-- 更新记录：按时间点列出每次保存的快照 -->
<div class="modal" id="historyMask" hidden>
  <div class="sheet wide">
    <h3 id="historyTitle">更新记录</h3>
    <p class="tip" id="historyTip">每次改动账号，都会自动存一份快照。点某一条可展开看当时每个账号的人设。</p>
    <div class="his-list" id="historyList"></div>
    <div class="act"><button class="btn-ghost" id="historyClose" type="button">关闭</button></div>
  </div>
</div>

<!-- 确认 -->
<div class="modal" id="askMask" hidden>
  <div class="sheet">
    <h3 id="askTitle">确认</h3>
    <p class="tip" id="askText"></p>
    <div class="act"><button class="btn-main" id="askOk" type="button">确定</button><button class="btn-ghost" id="askCancel" type="button">取消</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(function () {
  'use strict';

  var SEED = {"version": 1, "accounts": []};
  var IP_FIELDS = ['名字', '性别', '个人介绍', '城市', '职业', '经历', '性格', '兴趣', '讨厌的事'];
  var IP_MULTI = ['经历', '性格', '兴趣', '讨厌的事'];
  var IP_ONE = ['名字', '性别', '个人介绍', '城市', '职业'];

  var el = {
    list: document.getElementById('acctList'),
    storeTip: document.getElementById('storeTip'),
    addBtn: document.getElementById('addBtn'),
    historyBtn: document.getElementById('historyBtn'),
    historyMask: document.getElementById('historyMask'),
    historyTitle: document.getElementById('historyTitle'),
    historyTip: document.getElementById('historyTip'),
    historyList: document.getElementById('historyList'),
    historyClose: document.getElementById('historyClose'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    fileBox: document.getElementById('fileBox'),
    ipMask: document.getElementById('ipMask'),
    ipTitle: document.getElementById('ipTitle'),
    ipSave: document.getElementById('ipSave'),
    ipClose: document.getElementById('ipClose'),
    ipErr: document.getElementById('ipErr'),
    editMask: document.getElementById('editMask'),
    editTitle: document.getElementById('editTitle'),
    editTip: document.getElementById('editTip'),
    editName: document.getElementById('editName'),
    editRemark: document.getElementById('editRemark'),
    editUser: document.getElementById('editUser'),
    editUserWrap: document.getElementById('editUserWrap'),
    editSave: document.getElementById('editSave'),
    editCancel: document.getElementById('editCancel'),
    editErr: document.getElementById('editErr'),
    askMask: document.getElementById('askMask'),
    askTitle: document.getElementById('askTitle'),
    askText: document.getElementById('askText'),
    askOk: document.getElementById('askOk'),
    askCancel: document.getElementById('askCancel'),
    toast: document.getElementById('toast')
  };

  var state = { accounts: [], editing: null, adding: false, askResolve: null };
  var toastTimer = null;

  /* ---------- 单账号独立链接 ---------- */
  // 带 ?view=<key> 打开时只显示这一个账号的人设（只读，无管理入口）
  function urlParam(name) {
    try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
  }
  var VIEW_KEY = urlParam('view');

  // 链接的 view 值优先用「登录账号」（username），没填的回退用 key，避免空值
  function viewToken(a) {
    var u = String(a.username || '').trim();
    return u || a.key;
  }

  function accountLink(a) {
    var base = location.protocol + '//' + location.host + location.pathname;
    var sc = urlParam('sharecode');
    var q = [];
    if (sc) q.push('sharecode=' + encodeURIComponent(sc));
    q.push('view=' + encodeURIComponent(viewToken(a)));
    return base + '?' + q.join('&');
  }

  function toast(msg) {
    if (!el.toast) return;
    el.toast.textContent = msg;
    el.toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('on'); }, 2200);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function clone(v) { return JSON.parse(JSON.stringify(v)); }

  /* ---------- 云数据库（无口令，公开读写） ---------- */
  var cloud = null;
  var cloudReady = false;
  var SAVE_QUEUE = Promise.resolve();

  var PUBLIC_CONFIG = {
    endpoint: 'https://jvdu-accounts.app.workbuddy.host',
    publishableKey: 'wbpk_vfHcKVNqyEtIseEeR2Wj87_HhjodATN2dBFY8gaHskqzX6zO10eShxV'
  };

  function initCloud() {
    try {
      cloud = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: PUBLIC_CONFIG.endpoint,
        publishableKey: PUBLIC_CONFIG.publishableKey
      });
      cloudReady = true;
      return true;
    } catch (e) {
      return false;
    }
  }

  function cloudLoad() {
    if (!cloudReady) return Promise.resolve(null);
    return cloud.database.from('account_snapshot').select('data').eq('id', 1).maybeSingle()
      .then(function (res) {
        var row = res && res.data;
        if (row && row.data && Array.isArray(row.data.accounts)) return row.data.accounts;
        return null;
      }).catch(function () { return null; });
  }

  function payloadData() {
    var rows = sorted().map(function (a, i) {
      return {
        key: a.key,
        name: a.name,
        remark: a.remark || '',
        username: a.username || '',
        generate_post: !!a.generate_post,
        sort_order: i + 1,
        persona: a.persona || ''
      };
    });
    return {
      '账号数': rows.length,
      '导出时间': new Date().toISOString(),
      'accounts': rows
    };
  }

  function cloudSaveNow(note) {
    if (!cloudReady) return Promise.resolve(false);
    var data = payloadData();
    var now = new Date().toISOString();
    return cloud.database.from('account_snapshot')
      .update({ data: data, updated_at: now })
      .eq('id', 1)
      .select()
      .then(function (res) {
        // 主数据写成功后，追加一条历史快照（快照写失败不影响本次保存结果）
        if (res && res.data && res.data.length) {
          try {
            cloud.database.from('account_history').insert({
              data: data, note: note || '', created_at: now
            }).then(function () {}).catch(function () {});
          } catch (e) {}
          return true;
        }
        return false;
      }).catch(function () { return false; });
  }

  function save(msg) {
    SAVE_QUEUE = SAVE_QUEUE.then(function () { return cloudSaveNow(msg || ''); }).then(function (ok) {
      if (msg) toast(ok ? msg + '（已存到云端）' : msg + '（云端保存失败，请检查网络）');
    });
    return SAVE_QUEUE;
  }

  function sorted() {
    return state.accounts.slice().sort(function (a, b) {
      return (a.sort_order || 0) - (b.sort_order || 0);
    });
  }

  function find(key) {
    for (var i = 0; i < state.accounts.length; i++) {
      if (state.accounts[i].key === key) return state.accounts[i];
    }
    return null;
  }

  // view 参数现在可能是登录账号（username）或旧的 key，两者都要能找到
  function findByView(v) {
    if (!v) return null;
    for (var i = 0; i < state.accounts.length; i++) {
      var a = state.accounts[i];
      if (viewToken(a) === v) return a;
    }
    return find(v);
  }

  function render() {
    if (VIEW_KEY) { renderProfile(); return; }
    var rows = sorted();
    if (!rows.length) {
      el.list.innerHTML = '<p class="empty">还没有账号，点下面「新增账号」加一个。</p>';
      return;
    }
    el.list.innerHTML = rows.map(function (a) {
      var on = !!a.generate_post;
      var hasIp = !!(a.persona && String(a.persona).trim());
      return '<div class="acct-row">'
        + '<div class="acct-main">'
        + '<div class="acct-name-row">'
        + '<b class="acct-name">' + esc(a.name) + '</b>'
        + (a.remark ? '<span class="acct-remark">' + esc(a.remark) + '</span>' : '')
        + '<a class="acct-link" href="' + esc(accountLink(a)) + '" target="_blank" rel="noopener">链接↗</a>'
        + '</div>'
        + '<span class="acct-user">' + esc(a.username || a.key) + '</span>'
        + '<div class="acct-flags">'
        + '<button class="ip-btn' + (hasIp ? ' on' : '') + '" type="button" data-ip="' + esc(a.key) + '">个人定位</button>'
        + '<label class="acct-gen" data-on="' + on + '">'
        + '<input type="checkbox" data-gen="' + esc(a.key) + '"' + (on ? ' checked' : '') + '>'
        + '<span>生成文章：</span><span class="yes">是</span><span>／</span><span class="no">否</span>'
        + '</label>'
        + '<button class="his-btn" type="button" data-his="' + esc(a.key) + '">记录</button>'
        + '</div></div>'
        + '<div class="acct-ops">'
        + '<button class="link-btn" type="button" data-edit="' + esc(a.key) + '">修改</button>'
        /* 线上版隐藏删除账号按钮：账号只能改、不能从线上删，防止误删/删光 */
        + '</div></div>';
    }).join('');
  }

  /* ---------- 单账号可编辑视图（?view=<key>）：发给别人可改人设并保存 ---------- */
  function renderProfile() {
    document.body.classList.add('view-mode');
    document.title = '编辑个人信息';
    var h1 = document.querySelector('header h1');
    if (h1) h1.textContent = '编辑个人信息';
    var a = findByView(VIEW_KEY);
    if (!a) {
      el.list.innerHTML = '<p class="empty">这个链接对应的账号不存在，可能已被改名或删除。</p>';
      return;
    }
    var p = parsePersona(a.persona);
    var one = ['名字', '性别', '个人介绍', '城市', '职业'];
    var multi = ['经历', '性格', '兴趣', '讨厌的事'];
    var html = '';
    html += '<div class="profile-head">'
      + '<h2>' + esc(a.name) + '</h2>'
      + '<p class="p-user">' + esc(a.username || a.key) + '</p>'
      + '</div>';
    html += '<p class="profile-tip">这是「' + esc(a.name) + '」的专属编辑页。改完点最下方的「保存修改」，改动会存到云端，别人和你自己打开都能看到最新版本。</p>';
    one.forEach(function (k) {
      html += '<div class="pf-field"><label class="pf-label">' + esc(k) + '</label>'
        + '<input class="pf-input" type="text" data-pf="' + esc(k) + '" value="' + esc(p[k] || '') + '"' + (k === '名字' ? ' placeholder="必填"' : '') + '></div>';
    });
    multi.forEach(function (k) {
      var vals = p[k] || [];
      if (!vals.length) vals = [''];
      html += '<div class="pf-field"><label class="pf-label">' + esc(k) + '</label>'
        + '<div class="pf-rows" data-pf-rows="' + esc(k) + '">';
      vals.forEach(function (v) {
        html += '<div class="row-line"><textarea class="pf-row-ta" rows="1" data-pf-row="' + esc(k) + '" placeholder="填写' + esc(k) + '，一行一条">' + esc(v) + '</textarea>'
          + '<button class="row-del" type="button">删</button></div>';
      });
      html += '</div>'
        + '<button class="row-add" type="button" data-pf-add="' + esc(k) + '">＋ 添加一行</button></div>';
    });
    html += '<div class="pf-actions">'
      + '<button class="btn-main" type="button" data-action="pf-save" id="pfSave">保存修改</button>'
      + '<p class="pf-msg" id="pfMsg"></p>'
      + '</div>';
    el.list.innerHTML = html;
    [].forEach.call(el.list.querySelectorAll('[data-pf-row]'), function (ta) { autoGrow(ta); });
  }

  /* ---------- 单账号编辑页的多值行操作（作用域在 el.list） ---------- */
  function pfRowsBox(field) {
    return el.list.querySelector('[data-pf-rows="' + field + '"]');
  }
  function pfAddRow(field, value) {
    var box = pfRowsBox(field);
    if (!box) return;
    var line = document.createElement('div');
    line.className = 'row-line';
    var ta = document.createElement('textarea');
    ta.rows = 1;
    ta.setAttribute('data-pf-row', field);
    ta.placeholder = '填写' + field + '，一行一条';
    ta.value = value || '';
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'row-del';
    del.textContent = '删';
    line.appendChild(ta);
    line.appendChild(del);
    box.appendChild(line);
    autoGrow(ta);
    pfSyncDel(field);
    setTimeout(function () { ta.focus(); }, 0);
  }
  function pfSyncDel(field) {
    var box = pfRowsBox(field);
    if (!box) return;
    var lines = box.querySelectorAll('.row-line');
    [].forEach.call(lines, function (l) {
      var d = l.querySelector('.row-del');
      if (d) d.style.visibility = lines.length > 1 ? 'visible' : 'hidden';
    });
  }

  function collectProfileForm() {
    var out = [];
    IP_FIELDS.forEach(function (k) {
      if (IP_MULTI.indexOf(k) >= 0) {
        var box = pfRowsBox(k);
        if (!box) return;
        [].forEach.call(box.querySelectorAll('[data-pf-row]'), function (t) {
          var v = String(t.value || '').trim().replace(/\s*\n+\s*/g, ' ');
          if (v) out.push(k + '：' + v);
        });
      } else {
        var f = el.list.querySelector('[data-pf="' + k + '"]');
        if (!f) return;
        var v = String(f.value || '').trim().replace(/\s*\n+\s*/g, ' ');
        if (v) out.push(k + '：' + v);
      }
    });
    return out.join('\n');
  }

  function saveProfile() {
    var btn = document.getElementById('pfSave');
    var msg = document.getElementById('pfMsg');
    var text = collectProfileForm();
    var pm = parsePersona(text);
    if (!pm['名字']) { if (msg) { msg.className = 'pf-msg'; msg.textContent = '「名字」不能空着'; } return; }
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    if (msg) { msg.textContent = ''; }
    // 先拉云端最新 accounts，只改本账号，避免整份覆盖掉别人刚在别处改的内容
    cloudLoad().then(function (latest) {
      if (latest && latest.length) state.accounts = latest;
      var a = findByView(VIEW_KEY);
      if (!a) throw new Error('账号不存在');
      a.persona = text;
      a.name = pm['名字'];
      return save('已保存');
    }).then(function () {
      if (btn) { btn.disabled = false; btn.textContent = '保存修改'; }
      if (msg) { msg.className = 'pf-msg ok'; msg.textContent = '已保存，云端已更新'; }
      var h2 = el.list.querySelector('.profile-head h2');
      if (h2) h2.textContent = pm['名字'];
    }).catch(function () {
      if (btn) { btn.disabled = false; btn.textContent = '保存修改'; }
      if (msg) { msg.className = 'pf-msg'; msg.textContent = '保存失败，请检查网络后重试'; }
    });
  }

  /* ---------- 人设文本 <-> 表单 ---------- */
  function parsePersona(text) {
    var map = { '名字': '', '性别': '', '个人介绍': '', '城市': '', '职业': '', '经历': [], '性格': [], '兴趣': [], '讨厌的事': [] };
    var any = false;
    String(text || '').split('\n').forEach(function (line) {
      var m = line.match(/^(名字|性别|个人介绍|城市|职业|经历|性格|兴趣|讨厌的事)：(.*)$/);
      if (!m) return;
      any = true;
      var k = m[1];
      if (IP_ONE.indexOf(k) >= 0) { if (!map[k]) map[k] = m[2].trim(); }
      else if (m[2].trim()) map[k].push(m[2].trim());
    });
    if (!any && String(text || '').trim()) map['经历'] = [String(text).trim()];
    return map;
  }

  function rowsBox(field) {
    return el.ipMask.querySelector('[data-rows="' + field + '"]');
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, 220) + 'px';
  }

  function addRow(field, value) {
    var box = rowsBox(field);
    if (!box) return;
    var line = document.createElement('div');
    line.className = 'row-line';
    var ta = document.createElement('textarea');
    ta.rows = 1;
    ta.setAttribute('data-row', field);
    ta.placeholder = '填写' + field + '，一条一行';
    ta.value = value || '';
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'row-del';
    del.textContent = '删';
    del.addEventListener('click', function () {
      var lines = box.querySelectorAll('.row-line');
      if (lines.length <= 1) { ta.value = ''; autoGrow(ta); return; }
      line.remove();
      syncDel(field);
    });
    ta.addEventListener('input', function () { autoGrow(ta); });
    line.appendChild(ta);
    line.appendChild(del);
    box.appendChild(line);
    autoGrow(ta);
    syncDel(field);
  }

  function syncDel(field) {
    var box = rowsBox(field);
    if (!box) return;
    var lines = box.querySelectorAll('.row-line');
    [].forEach.call(lines, function (l) {
      var d = l.querySelector('.row-del');
      if (d) d.style.visibility = lines.length > 1 ? 'visible' : 'hidden';
    });
  }

  function rowValues(field) {
    var box = rowsBox(field);
    if (!box) return [];
    return [].map.call(box.querySelectorAll('[data-row="' + field + '"]'), function (t) {
      return String(t.value || '').trim().replace(/\s*\n+\s*/g, ' ');
    }).filter(Boolean);
  }

  function oneValue(field) {
    var input = el.ipMask.querySelector('[data-ip="' + field + '"]');
    return input ? String(input.value || '').trim().replace(/\s*\n+\s*/g, ' ') : '';
  }

  function collect() {
    var out = [];
    IP_FIELDS.forEach(function (k) {
      if (IP_MULTI.indexOf(k) >= 0) {
        rowValues(k).forEach(function (v) { out.push(k + '：' + v); });
      } else {
        var v = oneValue(k);
        if (v) out.push(k + '：' + v);
      }
    });
    return out.join('\n');
  }

  function fill(text) {
    var map = parsePersona(text);
    IP_ONE.forEach(function (k) {
      var input = el.ipMask.querySelector('[data-ip="' + k + '"]');
      if (input) input.value = map[k] || '';
    });
    IP_MULTI.forEach(function (k) {
      var box = rowsBox(k);
      if (!box) return;
      box.innerHTML = '';
      var vals = map[k] || [];
      if (vals.length) vals.forEach(function (v) { addRow(k, v); });
      else addRow(k, '');
    });
  }

  function openIp(key) {
    var a = find(key);
    if (!a) { toast('找不到这个账号'); return; }
    state.editing = key;
    fill(a.persona || '');
    el.ipErr.textContent = '';
    el.ipTitle.textContent = '个人定位 · ' + a.name;
    el.ipMask.hidden = false;
    el.ipMask.scrollTop = 0;
  }

  function closeIp() {
    el.ipMask.hidden = true;
    state.editing = null;
  }

  function saveIp() {
    var a = find(state.editing);
    if (!a) return;
    var text = collect();
    if (!oneValue('名字')) { el.ipErr.textContent = '名字不能空着'; return; }
    a.persona = text;
    // 七项里的「名字」与人设标题保持同步，列表上看到的就是它
    if (oneValue('名字') && a.name !== oneValue('名字')) {
      // 不强行改账号显示名，避免用户只是想在人设里写昵称
    }
    save('人设已保存');
    el.ipErr.textContent = '';
    closeIp();
    render();
  }

  /* ---------- 改名字 / 新增 ---------- */
  function openEdit(key) {
    var a = find(key);
    if (!a) return;
    state.editing = key;
    state.adding = false;
    el.editTitle.textContent = '修改 · ' + a.name;
    el.editTip.textContent = '名字是列表里显示的名字。账号编号（' + a.key + '）不变，人设和「生成文章」开关都不受影响。';
    el.editName.value = a.name || '';
    el.editRemark.value = a.remark || '';
    el.editUser.value = a.username || '';
    el.editUserWrap.hidden = false;
    el.editErr.textContent = '';
    el.editMask.hidden = false;
    setTimeout(function () { el.editName.focus(); }, 50);
  }

  function openAdd() {
    state.adding = true;
    state.editing = null;
    el.editTitle.textContent = '新增账号';
    el.editTip.textContent = '填一个名字就行。加完点「个人定位」把七项填上。';
    el.editName.value = '';
    el.editRemark.value = '';
    el.editUser.value = '';
    el.editUserWrap.hidden = true;
    el.editErr.textContent = '';
    el.editMask.hidden = false;
    setTimeout(function () { el.editName.focus(); }, 50);
  }

  function saveEdit() {
    var name = String(el.editName.value || '').trim();
    var remark = String(el.editRemark.value || '').trim();
    if (!name) { el.editErr.textContent = '名字不能空着'; return; }
    var msg = '';
    if (state.adding) {
      var maxSort = 0;
      state.accounts.forEach(function (a) { maxSort = Math.max(maxSort, a.sort_order || 0); });
      state.accounts.push({
        key: 'acct-' + Date.now().toString(36),
        name: name,
        remark: remark,
        username: '',
        generate_post: false,
        sort_order: maxSort + 1,
        persona: '名字：' + name
      });
      msg = '已新增「' + name + '」';
    } else {
      var a = find(state.editing);
      if (!a) return;
      a.name = name;
      a.remark = remark;
      if (el.editUser.value.trim()) a.username = el.editUser.value.trim();
      msg = '已保存';
    }
    save(msg);
    el.editMask.hidden = true;
    render();
  }

  function ask(text, okText) {
    return new Promise(function (resolve) {
      state.askResolve = resolve;
      el.askTitle.textContent = '确认';
      el.askText.textContent = text;
      el.askOk.textContent = okText || '确定';
      el.askMask.hidden = false;
    });
  }

  function closeAsk(result) {
    el.askMask.hidden = true;
    var r = state.askResolve;
    state.askResolve = null;
    if (r) r(result);
  }

  /* ---------- 更新记录：按时间点查看历史快照 ---------- */
  var historyFilter = null; // 为某个 key 时只看该账号；null 看全部

  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso || '';
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function loadHistory(filterKey) {
    historyFilter = filterKey || null;
    var a = filterKey ? find(filterKey) : null;
    el.historyTitle.textContent = a ? ('更新记录 · ' + (a.name || '')) : '更新记录';
    el.historyTip.textContent = a
      ? '这是「' + (a.name || '') + '」这个账号每次改动后留下的人设快照，按时间从新到旧排列。'
      : '每次改动账号，都会自动存一份快照。点某一条可展开看当时每个账号的人设。';
    el.historyList.innerHTML = '<p class="his-empty">正在读取更新记录…</p>';
    el.historyMask.hidden = false;
    if (!cloudReady) { el.historyList.innerHTML = '<p class="his-empty">云端未连接，无法读取记录</p>'; return; }
    cloud.database.from('account_history')
      .select('id,data,note,created_at')
      .order('created_at', { ascending: false })
      .limit(100)
      .then(function (res) {
        var rows = (res && res.data) || [];
        if (!rows.length) { el.historyList.innerHTML = '<p class="his-empty">还没有记录，改动一次账号后就会出现。</p>'; return; }
        el.historyList.innerHTML = rows.map(function (r) {
          var d = r.data || {};
          var accts = Array.isArray(d.accounts) ? d.accounts : [];
          return '<div class="his-item">'
            + '<button class="his-head" type="button" data-his-open="' + r.id + '">'
            + '<span class="his-time">' + esc(fmtTime(r.created_at)) + '</span>'
            + '<span class="his-note">' + esc(r.note || '账号有改动') + '</span>'
            + '<span class="his-cnt">' + accts.length + ' 个号</span>'
            + '</button>'
            + '<div class="his-detail" id="hisDetail-' + r.id + '">' + renderHistoryDetail(accts) + '</div>'
            + '</div>';
        }).join('');
      }).catch(function () {
        el.historyList.innerHTML = '<p class="his-empty">读取记录失败，请检查网络后重试</p>';
      });
  }

  function renderHistoryDetail(accts) {
    var list = historyFilter
      ? accts.filter(function (a) { return a.key === historyFilter; })
      : accts;
    if (!list.length) return '<p class="his-empty">这次快照里没有该账号</p>';
    return list.map(function (a) {
      var gen = a.generate_post ? '下次写稿：是' : '下次写稿：否';
      return '<div class="his-acct">'
        + '<span class="his-acct-name">' + esc(a.name || '') + '</span>'
        + (a.remark ? '<span class="his-acct-mark">' + esc(a.remark) + '</span>' : '')
        + '<span class="his-acct-gen">' + gen + '</span>'
        + '<p class="his-persona">' + esc(a.persona || '') + '</p>'
        + '</div>';
    }).join('');
  }

  /* ---------- 导入导出 ---------- */
  function exportJson() {
    var rows = sorted().map(function (a, i) {
      return {
        key: a.key,
        name: a.name,
        remark: a.remark || '',
        username: a.username || '',
        generate_post: !!a.generate_post,
        sort_order: i + 1,
        persona: a.persona || ''
      };
    });
    var payload = {
      '_说明': '账号人设快照（本机导出）。写稿时读这一份作为唯一人设来源。',
      '导出时间': new Date().toISOString(),
      '账号数': rows.length,
      'accounts': rows
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '账号人设快照.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('已导出「账号人设快照.json」');
  }

  function importJson(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(String(reader.result || ''));
        var rows = d && Array.isArray(d.accounts) ? d.accounts : null;
        if (!rows || !rows.length) throw new Error('empty');
        state.accounts = rows.map(function (a, i) {
          return {
            key: a.key || ('acct-' + i + '-' + Date.now().toString(36)),
            name: a.name || a.key || '未命名',
            remark: a.remark || '',
            username: a.username || '',
            generate_post: a.generate_post !== false,
            sort_order: a.sort_order || i + 1,
            persona: typeof a.persona === 'string' ? a.persona
              : JSON.stringify(a.persona || {}, null, 0)
          };
        });
        save('已导入 ' + rows.length + ' 个账号');
        render();
      } catch (e) {
        toast('这个文件读不出来，要导出的那份 json');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /* ---------- 事件 ---------- */
  el.list.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : e.target.parentNode;
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-action');
    if (act === 'pf-save') { saveProfile(); return; }
    var pfAdd = t.getAttribute && t.getAttribute('data-pf-add');
    if (pfAdd) { pfAddRow(pfAdd, ''); return; }
    if (t.classList && t.classList.contains('row-del') && t.closest && t.closest('.pf-rows')) {
      var box = t.closest('.pf-rows');
      var field = box.getAttribute('data-pf-rows');
      var lines = box.querySelectorAll('.row-line');
      if (lines.length <= 1) {
        var onlyTa = lines[0].querySelector('textarea');
        if (onlyTa) { onlyTa.value = ''; autoGrow(onlyTa); }
      } else {
        t.closest('.row-line').remove();
      }
      pfSyncDel(field);
      return;
    }
    var ip = t.getAttribute('data-ip');
    if (ip) { openIp(ip); return; }
    var his = t.getAttribute('data-his');
    if (his) { loadHistory(his); return; }
    var ed = t.getAttribute('data-edit');
    if (ed) { openEdit(ed); return; }
    var dl = t.getAttribute('data-del');
    if (dl) {
      /* 线上版禁用删除账号：即便误加回按钮也不执行删除 */
      toast('线上版不能删除账号，请在本地管理页操作');
      return;
    }
  });

  el.list.addEventListener('input', function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-pf-row')) autoGrow(e.target);
  });

  el.list.addEventListener('change', function (e) {
    var key = e.target.getAttribute && e.target.getAttribute('data-gen');
    if (!key) return;
    var a = find(key);
    if (!a) return;
    a.generate_post = !!e.target.checked;
    var wrap = e.target.closest ? e.target.closest('.acct-gen') : null;
    if (wrap) wrap.setAttribute('data-on', a.generate_post ? 'true' : 'false');
    save(a.name + (a.generate_post ? '：下次发链接会给这个号写稿' : '：下次发链接跳过这个号'));
  });

  el.ipMask.addEventListener('click', function (e) {
    var add = e.target.getAttribute && e.target.getAttribute('data-add');
    if (add) { addRow(add, ''); }
  });

  el.addBtn.addEventListener('click', openAdd);
  el.historyBtn.addEventListener('click', function () { loadHistory(null); });
  el.historyClose.addEventListener('click', function () { el.historyMask.hidden = true; });
  el.historyList.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : e.target.parentNode;
    var open = t && t.getAttribute && t.getAttribute('data-his-open');
    if (!open) return;
    var detail = document.getElementById('hisDetail-' + open);
    if (detail) detail.classList.toggle('open');
  });
  el.historyMask.addEventListener('click', function (e) {
    if (e.target === el.historyMask) el.historyMask.hidden = true;
  });
  el.exportBtn.addEventListener('click', exportJson);
  el.importBtn.addEventListener('click', function () { el.fileBox.click(); });
  el.fileBox.addEventListener('change', function (e) {
    importJson(e.target.files && e.target.files[0]);
    e.target.value = '';
  });
  el.ipSave.addEventListener('click', saveIp);
  el.ipClose.addEventListener('click', closeIp);
  el.editSave.addEventListener('click', saveEdit);
  el.editCancel.addEventListener('click', function () { el.editMask.hidden = true; });
  el.askOk.addEventListener('click', function () { closeAsk(true); });
  el.askCancel.addEventListener('click', function () { closeAsk(false); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!el.askMask.hidden) { closeAsk(false); return; }
    if (!el.historyMask.hidden) { el.historyMask.hidden = true; return; }
    if (!el.editMask.hidden) { el.editMask.hidden = true; return; }
    if (!el.ipMask.hidden) closeIp();
  });

  el.editName.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') saveEdit();
  });

  if (VIEW_KEY) {
    document.body.classList.add('view-mode');
    el.list.innerHTML = '<p class="empty">正在读取账号信息…</p>';
  } else {
    render();
  }
  var ok = initCloud();
  if (!ok) {
    el.storeTip.textContent = '云端连接组件加载失败，请刷新页面重试。';
    return;
  }
  cloudLoad().then(function (accts) {
    if (accts && accts.length) {
      state.accounts = accts;
      render();
      el.storeTip.textContent = '已连接云端：改动会自动保存，手机、电脑打开看到同一份。';
    } else {
      if (VIEW_KEY) el.list.innerHTML = '<p class="empty">读取账号信息失败，请稍后刷新重试。</p>';
      else el.storeTip.textContent = '云端还没数据，点「新增账号」建第一个；也可用「导入备份」恢复。';
    }
  }).catch(function () {
    if (VIEW_KEY) el.list.innerHTML = '<p class="empty">读取账号信息失败，请检查网络后刷新。</p>';
    else el.storeTip.textContent = '读取云端失败，请检查网络后刷新。';
  });
})();
</script>
</body>
</html>

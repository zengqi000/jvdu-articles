<script id="pageData" type="application/json">{"batch": "放学五个表现", "latest": ["20261126-pangniudexinhao-e3c7e591"], "articles": [{"id": "20261126-pangniudexinhao-e3c7e591", "title": "孩子放学进门有这5个小反应，比追问成绩更能看出他在学校过得好不好", "plain": "孩子放学进门有这5个小反应，比追问成绩更能看出他在学校过得好不好\n\n孩子一进家门，不少当爸妈的第一反应就是迎上去问：今天有没有被批评，作业多不多。问得急了，孩子干脆回一句「没事」，书包一放就钻进房间。翻过几本儿童心理方面的书才慢慢明白，他在学校待得舒不舒服，其实不用靠盘问，进门后那几个藏不住的小反应，早把答案说了。你追着问十句，抵不过他进门那一会儿的自然样子。\n\n这几个反应装不出来，也用不着特意教。一样一样摆出来看，孩子这一天过得松不松，心里就能有个准数。\n\n一、进门先找吃的，说明这一天没绷着\n\n书包还没放下，人先拐进厨房，翻出面包或者水果就啃，嘴里还念叨今天食堂的菜难吃。看着没个正形，其实是好事。\n\n心理学里有个基本规律，人在放松、没有防备的时候，胃口才开得出来。孩子在学校要是受了委屈、一直紧绷着，身体会先进入戒备状态，那种时候根本不觉得饿。肚子肯先说话的孩子，心里多半没绷着。\n\n所以别嫌他吃相急，顺手给他递杯水，让他边吃边讲。这份松弛，是他一天里难得的歇脚时刻。\n\n吃完这口，看他肯不肯开口说话。\n\n二、肯跟你讲没头没尾的闲话，是没把你当成要交差的人\n\n有的孩子回家话特别密：同桌上课打瞌睡被点名了，体育课玩拔河输了，哪个同学带了个奇怪的橡皮。听着全是没营养的碎碎念，可这正是好信号。\n\n愿意把这些小东西讲给你听，说明他在学校有来有往，有自己的一圈朋友，没把自己封闭起来。反倒是那些一句「今天学了什么」就问哑的家长要想想，问法太像查岗，孩子自然应付了事。闲话讲得越多，孩子跟你之间越通。\n\n他讲的时候，别急着纠正、别往学习上引，先听完。听完这一段，他后面才敢把考砸的事也端出来。\n\n话多话少看完了，再看一样最实际的东西：书包。\n\n三、书包乱不要紧，该带的东西都在就稳了\n\n别急着嫌书包乱。掏出来一看，课本、作业本、文具盒一样不缺，虽然折了角、卷了边，但都在，这说明孩子跟得上学校的节奏，知道什么课要带什么书，收尾的事他自己做完了。\n\n要留意的是另一种：作业本三天两头找不到，铅笔丢了不吭声，连名字都懒得写。这不是粗心那么简单，可能是他这一天魂不守舍，心根本没放在课堂上。东西收拾得利索，孩子这一天基本是清醒的。\n\n发现东西总缺，先别骂，问问他这一天是怎么过的，把背后的原因找出来再对症。\n\n书包是外在的，情绪是里子的，接着往下看。\n\n四、回家敢发脾气，反而是心里没攒事\n\n不少爸妈怕孩子回家闹脾气，觉得在学校准是受了委屈。方向其实反了。孩子因为积木搭不好急得跺脚，或者你碰了他的玩具他嚷起来，这恰恰说明他在学校没憋着什么，还有余力在熟悉的人面前撒气。\n\n真正要操心的是相反的样子：进门一声不吭，问他三句答一句，连之前追着看的动画片都懒得点开。情绪一直压着没地方放，才说明这一天出了他自己消不掉的问题。敢在你面前发火的孩子，是把最不设防的一面留给了你。\n\n他闹的时候稳住别跟着急，等他平静下来再问发生了什么。家里能接得住他的火气，他心里那根弦才不会一直绷着。\n\n情绪放完了，最后看一觉睡得怎么样。\n\n五、躺下很快睡着，这一天就没过不去的坎\n\n睡眠最诚实。洗完澡往床上一躺，没几分钟呼吸就匀了，第二天早上到点自己能起，这说明他心里没挂着事，脑子真正歇下来了。\n\n反过来，翻来覆去半天睡不着，半夜惊醒、说梦话，早上赖着不肯起、一提上学就磨蹭，这些信号连起来看，可能是学校里有什么事在他心里过不去，大人还没察觉。觉睡得沉，这一天才算真的过去了。\n\n睡觉前那半小时别安排学习的事，聊聊闲的，让他带着松快劲儿入睡。真发现连着几天睡不安稳，就找个轻松的时候，慢慢问出学校里的事。\n\n结语\n\n孩子在学校过得好不好，从来不在老师夸没夸他，也不在那张卷子的分数上。进了家门先找吃的、肯讲一箩筐闲话、书包乱但东西齐全、闹得出来脾气、躺下就睡得着，这五样凑齐了，他在学校的日子大概率是舒展的。\n\n当爸妈的不用天天盯着班级群，也不用一进门就连着追问。我辅导两个娃作业这些年，也练出一点体会：每次话到嘴边想替他把答案说了，就先咽回去，改成问他这一天过得顺不顺。问话一换，孩子肯讲的反而多了，急脾气也少了一半。\n\n少问一句成绩，多看一眼他进 x27;Microsoft YaHei&#x27;,sans-serif;color:#3a3a3a;text-align:left;letter-spacing:0;background-color:#ffffff;\">\n<p style=\"margin:30px 0 0;text-align:center;font-size:12px;letter-spacing:.18em;color:#6b4e9e;line-height:22px;background-color:transparent;\">· 家庭教育 ·<\/p>\n\n<p style=\"margin:0 0 24px;padding:16px 18px;border-left:3px solid #6b4e9e;border-radius:8px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:0;background-color:#f7f5fb;\">孩子一进家门，不少当爸妈的第一反应就是迎上去问：今天有没有被批评，作业多不多。问得急了，孩子干脆回一句「没事」，书包一放就钻进房间。翻过几本儿童心理方面的书才慢慢明白，他在学校待得舒不舒服，其实不用靠盘问，进门后那几个藏不住的小反应，早把答案说了。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">你追着问十句，抵不过他进门那一会儿的自然样子。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这几个反应装不出来，也用不着特意教。一样一样摆出来看，孩子这一天过得松不松，心里就能有个准数。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、进门先找吃的，说明这一天没绷着<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">书包还没放下，人先拐进厨房，翻出面包或者水果就啃，嘴里还念叨今天食堂的菜难吃。看着没个正形，其实是好事。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">心理学里有个基本规律，人在放松、没有防备的时候，胃口才开得出来。孩子在学校要是受了委屈、一直紧绷着，身体会先进入戒备状态，那种时候根本不觉得饿。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">肚子肯先说话的孩子，心里多半没绷着。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">所以别嫌他吃相急，顺手给他递杯水，让他边吃边讲。这份松弛，是他一天里难得的歇脚时刻。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">吃完这口，看他肯不肯开口说话。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、肯跟你讲没头没尾的闲话，是没把你当成要交差的人<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">有的孩子回家话特别密：同桌上课打瞌睡被点名了，体育课玩拔河输了，哪个同学带了个奇怪的橡皮。听着全是没营养的碎碎念，可这正是好信号。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">愿意把这些小东西讲给你听，说明他在学校有来有往，有自己的一圈朋友，没把自己封闭起来。反倒是那些一句「今天学了什么」就问哑的家长要想想，问法太像查岗，孩子自然应付了事。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">闲话讲得越多，孩子跟你之间越通。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">他讲的时候，别急着纠正、别往学习上引，先听完。听完这一段，他后面才敢把考砸的事也端出来。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">话多话少看完了，再看一样最实际的东西：书包。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">三、书包乱不要紧，该带的东西都在就稳了<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">别急着嫌书包乱。掏出来一看，课本、作业本、文具盒一样不缺，虽然折了角、卷了边，但都在，这说明孩子跟得上学校的节奏，知道什么课要带什么书，收尾的事他自己做完了。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">要留意的是另一种：作业本三天两头找不到，铅笔丢了不吭声，连名字都懒得写。这不是粗心那么简单，可能是他这一天魂不守舍，心根本没放在课堂上。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">东西收拾得利索，孩子这一天基本是清醒的。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">发现东西总缺，先别骂，问问他这一天是怎么过的，把背后的原因找出来再对症。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">书包是外在的，情绪是里子的，接着往下看。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">四、回家敢发脾气，反而是心里没攒事<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不少爸妈怕孩子回家闹脾气，觉得在学校准是受了委屈。方向其实反了。孩子因为积木搭不好急得跺脚，或者你碰了他的玩具他嚷起来，这恰恰说明他在学校没憋着什么，还有余力在熟悉的人面前撒气。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">真正要操心的是相反的样子：进门一声不吭，问他三句答一句，连之前追着看的动画片都懒得点开。情绪一直压着没地方放，才说明这一天出了他自己消不掉的问题。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">敢在你面前发火的孩子，是把最不设防的一面留给了你。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">他闹的时候稳住别跟着急，等他平静下来再问发生了什么。家里能接得住他的火气，他心里那根弦才不会一直绷着。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">情绪放完了，最后看一觉睡得怎么样。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">五、躺下很快睡着，这一天就没过不去的坎<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">睡眠最诚实。洗完澡往床上一躺，没几分钟呼吸就匀了，第二天早上到点自己能起，这说明他心里没挂着事，脑子真正歇下来了。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">反过来，翻来覆去半天睡不着，半夜惊醒、说梦话，早上赖着不肯起、一提上学就磨蹭，这些信号连起来看，可能是学校里有什么事在他心里过不去，大人还没察觉。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">觉睡得沉，这一天才算真的过去了。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">睡觉前那半小时别安排学习的事，聊聊闲的，让他带着松快劲儿入睡。真发现连着几天睡不安稳，就找个轻松的时候，慢慢问出学校里的事。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">结语<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">孩子在学校过得好不好，从来不在老师夸没夸他，也不在那张卷子的分数上。进了家门先找吃的、肯讲一箩筐闲话、书包乱但东西齐全、闹得出来脾气、躺下就睡得着，这五样凑齐了，他在学校的日子大概率是舒展的。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">当爸妈的不用天天盯着班级群，也不用一进门就连着追问。我辅导两个娃作业这些年，也练出一点体会：每次话到嘴边想替他把答案说了，就先咽回去，改成问他这一天过得顺不顺。问话一换，孩子肯讲的反而多了，急脾气也少了一半。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">少问一句成绩，多看一眼他进门后的样子，孩子过得好不好，你自己就能看出来。<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5; <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

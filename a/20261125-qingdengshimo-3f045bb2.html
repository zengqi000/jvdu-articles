<script id="pageData" type="application/json">{"batch": "历史六位捡漏皇帝", "latest": ["20261125-qingdengshimo-3f045bb2"], "articles": [{"id": "20261125-qingdengshimo-3f045bb2", "title": "六位皇帝都是捡漏坐上龙椅的，有人成明君，有人把江山败光", "plain": "六位皇帝都是捡漏坐上龙椅的，有人成明君，有人把江山败光\n\n刘恒接到诏书那会儿，人还在代地，离长安的权力中心十万八千里。母亲薄姬不受宠，母子俩早被打发到这边，皇位这种事他从来不敢想。周勃、陈平把吕氏一锅端了，挑新皇帝挑来挑去，挑中了这个不起眼的代王，理由说出来有点好笑，娘家底子薄，性子仁厚，好拿捏。使者到了代地，他还反复确认了几遍才敢动身。\n\n后来的人都知道，这一趟接走的，是汉朝难得的一位仁君。和他一样被推上龙椅的，还有五个人，结局却天差地别。把六个人的履历摆在一起看才发现，捡漏从来不是天上掉馅饼那么便宜的事。\n\n一、位子是别人递过来的，结局却得自己写下去\n\n被挑中，往往不是因为你强，而是因为你“合适”。刘恒合适在娘家没势力，赵佶合适在醉心书画不掺和朝局，载湉合适在只有四岁、好控制在手里。挑人的人打的算盘很响，要的是一个能听安排的位子。\n\n我暑假在本地书店帮过忙，把历史区那些乱塞的书照朝代一本本归架，归完才明白，摆在哪儿是能由人定的，一本书里写了什么却早就定了。皇位也一样，谁能坐上去是别人定的，坐上去之后怎么写，谁也替不了。\n\n二、真正拉开差距的，是坐上去之后那几步\n\n同样是捡来的皇位，刘恒轻徭薄赋、废除肉刑，把日子过得踏实；赵昚平反岳飞冤案、整顿吏治，换来乾淳之治；刘询从民间长大，知道百姓的难处，整饬吏治、发展生产，创出孝宣中兴。也有人反过来，赵佶把北宋家底一点点败光，载湉到死没真正掌过权。起点一样，走法不一样，结局就分了岔。\n\n社团那次讲唐代衣冠，我提前把能找到的论文都翻了一遍，才敢站上台。不是脑子好，是怕讲错一个出处让人笑话。后来想想，皇帝坐稳靠的也是这个笨办法，一件件去做，把别人的期待换成自己的本事。刘恒刚坐上皇位时也没人看好，可他减免赋税、废掉肉刑，把一件件小事做成了文景之治。位子是捡来的，日子却是自己一日一日过出来的。\n\n三、时间不认运气，只认你留下的东西\n\n朱祁钰在土木堡之变后临危登基，重用于谦打赢北京保卫战，把快塌的大明撑住；可英宗一回来，夺门之变，他被废、软禁，三十岁就没了，连帝号都被削掉。赵昚在位二十七年，最后自己禅位当太上皇，六十八岁善终。一个把位子当成任务，一个把位子当成了自己的，时间给出的答案完全不同。\n\n我省着生活费凑的那套旧版二十四史，搬宿舍时别的东西都能扔，唯独这几本得自己抱着。翻多了就知道，史书不记你当初怎么捡到位的，只记你后来做了什么。运气能把人推上龙椅，可坐得稳不稳，看的从来不是运气。\n\n赵昚坐了二十七年，最后主动禅位给儿子，自己当太上皇，安安稳稳活到六十八岁。载湉被抱进宫时才四岁，一辈子被攥在慈禧手里，三十八岁就暴崩在瀛台。同样是被命运塞上来的位子，一个越坐越稳，一个到死都没能自己做一回主。\n\n说到底，那六位“捡漏”登基的人，开局都是别人递来的机会。有人把机会过成了明君的路，有人把机会过成了一场空。天上掉下来的皇位从来不是白给的礼物，捡到只是入场券，坐稳才是真本事。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "刘恒接到诏书那会儿，人还在代地，离长安的权力中心十万八千里。母亲薄姬不受宠，母子俩早被打发到这边，皇位这种事他从来不敢想。周勃、陈平把吕氏一锅端了，挑新皇帝挑来挑去，挑中了这个不起眼的代王，理由说出来有点好笑，娘家底子薄，性子仁厚，好拿捏。使者到了代地，他还反复确认了几遍才敢动身。\n\n后来的人都知道，这一趟接走的，是汉朝难得的一位仁君。和他一样被推上龙椅的，还有五个人，结局却天差地别。把六个人的履历摆在一起看才发现，捡漏从来不是天上掉馅饼那么便宜的事。\n\n一、位子是别人递过来的，结局却得自己写下去\n\n被挑中，往往不是因为你强，而是因为你“合适”。刘恒合适在娘家没势力，赵佶合适在醉心书画不掺和朝局，载湉合适在只有四岁、好控制在手里。挑人的人打的算盘很响，要的是一个能听安排的位子。\n\n我暑假在本地书店帮过忙，把历史区那些乱塞的书照朝代一本本归架，归完才明白，摆在哪儿是能由人定的，一本书里写了什么却早就定了。皇位也一样，谁能坐上去是别人定的，坐上去之后怎么写，谁也替不了。\n\n二、真正拉开差距的，是坐上去之后那几步\n\n px solid #dddad5;background-color:transparent;\">一、位子是别人递过来的，结局却得自己写下去<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">被挑中，往往不是因为你强，而是因为你“合适”。刘恒合适在娘家没势力，赵佶合适在醉心书画不掺和朝局，载湉合适在只有四岁、好控制在手里。挑人的人打的算盘很响，要的是一个能听安排的位子。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我暑假在本地书店帮过忙，把历史区那些乱塞的书照朝代一本本归架，归完才明白，摆在哪儿是能由人定的，一本书里写了什么却早就定了。皇位也一样，谁能坐上去是别人定的，坐上去之后怎么写，谁也替不了。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">二、真正拉开差距的，是坐上去之后那几步<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">同样是捡来的皇位，刘恒轻徭薄赋、废除肉刑，把日子过得踏实；赵昚平反岳飞冤案、整顿吏治，换来乾淳之治；刘询从民间长大，知道百姓的难处，整饬吏治、发展生产，创出孝宣中兴。也有人反过来，赵佶把北宋家底一点点败光，载湉到死没真正掌过权。起点一样，走法不一样，结局就分了岔。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">社团那次讲唐代衣冠，我提前把能找到的论文都翻了一遍，才敢站上台。不是脑子好，是怕讲错一个出处让人笑话。后来想想，皇帝坐稳靠的也是这个笨办法，一件件去做，把别人的期待换成自己的本事。刘恒刚坐上皇位时也没人看好，可他减免赋税、废掉肉刑，把一件件小事做成了文景之治。位子是捡来的，日子却是自己一日一日过出来的。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">三、时间不认运气，只认你留下的东西<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">朱祁钰在土木堡之变后临危登基，重用于谦打赢北京保卫战，把快塌的大明撑住；可英宗一回来，夺门之变，他被废、软禁，三十岁就没了，连帝号都被削掉。赵昚在位二十七年，最后自己禅位当太上皇，六十八岁善终。一个把位子当成任务，一个把位子当成了自己的，时间给出的答案完全不同。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我省着生活费凑的那套旧版二十四史，搬宿舍时别的东西都能扔，唯独这几本得自己抱着。翻多了就知道，史书不记你当初怎么捡到位的，只记你后来做了什么。运气能把人推上龙椅，可坐得稳不稳，看的从来不是运气。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">赵昚坐了二十七年，最后主动禅位给儿子，自己当太上皇，安安稳稳活到六十八岁。载湉被抱进宫时才四岁，一辈子被攥在慈禧手里，三十八岁就暴崩在瀛台。同样是被命运塞上来的位子，一个越坐越稳，一个到死都没能自己做一回主。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">说到底，那六位“捡漏”登基的人，开局都是别人递来的机会。有人把机会过成了明君的路，有人把机会过成了一场空。天上掉下来的皇位从来不是白给的礼物，捡到只是入场券，坐稳才是真本事。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dddad5;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAHLBDgDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABQYEBwECAwAI/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABNBouvG2dWrQga1Yq+brPMs4UGPIRkIpHTxGvXiOpap2yJJIfss/noAtnSPK5aEEVNmecgDJNpaU1Eomin9CPVZ6ZdBLQo22U0KzStRXDVlp3OM89zGOvNv3TXaY1Q3yuWpM0M/TIYK0irYTqlOibadPW6V840rJZzdpu1rt71mePTMuNveStGrogVbG+uTIorGlSn6lbVkJ6rXWxItmhLGtds67r7OmyY319GQ5cSJLKENSKewwdbYKgIbJWxfDjQpLACrl/4xIQQKqTWac1UpBAqkHrTapBOoyr49flah8lSLkURvCGWck9dJLFV9gqLPorOT+fIQjUKxHSc7JbpLAYV1krX2u5jPsWa5x5rbO2kznHPnXfXO7WPY8VgRT5Ocno0EspgNN3OHIXE <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

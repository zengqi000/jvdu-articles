到深圳，换过几座城，才慢慢明白，有些位置不是靠努力就能换来的，得有人肯给。肯给的人一旦收回，那种落空不是面子，是整个人的来处被抽掉了。绍安毁的其实不是阿贝，是他自己那个“被选中”的指望。\n\n这一话最扎我的，是那句夸孩子“真的很想进步”和结尾“零原创料理人”摆在一起。一个曾经把夸一碗面说得极用力的孩子，最后靠记别人的方子过活。零原创的料理人，做的永远是别人的方子，走的也是别人的路。冥界篇这碗面，表面写料理，底下写的是一个孩子怎么把“想被承认”走成了“得不到就毁掉”。阿贝没做错什么，她只是把一个学徒当成了家人。可一旦这份错位落了地，善意就变成了账，越认真越难收场。\n\n文末小记\n\n我倒愿意把这一话当成一句提醒：别把一个人对你的好，默认成他欠你一个位置。阿贝那份好是真的，绍安那份委屈也是真的，只是两件事从来不兑换。看懂这一点，比骂一句白眼狼有用得多。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "html": "<section style=\"font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;color:#2b2f36;text-align:left;letter-spacing:0;background-color:#ffffff;\">\n<p style=\"margin:8px 0 18px;text-align:left;font-size:12px;line-height:22px;font-weight:700;color:#2f4b7c;border-bottom:1px solid #2f4b7c;padding-bottom:6px;letter-spacing:0;background-color:transparent;\">［ 剧评观察 ］<\/p>\n<h1 style=\"margin:10px 0 26px;font-size:25px;line-height:1.5;font-weight:800;color:#1d2431;letter-spacing:-.02em;text-align:left;background-color:transparent;\">《中华小当家》冥界篇：一碗五文钱的面，喂不熟一个想当儿子的学徒<\/h1>\n\n<p style=\"margin:0 0 22px;padding:0 0 14px;border-bottom:2px solid #2f4b7c;font-size:19px;line-height:1.85;font-weight:700;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">一个孩子把“想进步”写在脸上，未必是真想学好，有时只是想换来一个位置。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">冥界篇第十七话把镜头拉回多年前的一碗二郎神面。十三岁的绍安头一回尝到阿贝做的料理，夸到找不出词，作者干脆借御林军的排场替这碗面撑腰。阿贝用普洱茶解腻的法子压住重口，是真本事；五文钱一碗，也是真便宜。可我盯着这一话，想的不是面，是那孩子夸面时用力过猛的样子。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">一个被这样喂过的孩子，后来怎么就白了眼？作者给的答案挺干脆：小当家出生后，绍安终于看清，自己再受善待也不过是个帮工，那份亲近永远轮不到他。既然求不来，索性翻脸。这说法是作者的猜测，方向我却认。<strong style=\"font-size:1.07em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">他要的从来不是一碗面，是坐在母亲旁边那个位子。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">我刚做平面设计那阵，师傅攥着最后一道工序不肯撒手，我天天盼着能独立完成一张稿，后来才懂，我急的不是手艺，是被当成一个能拿主意的人。这份急，跟绍安隔着一碗面却是一个道理。再往里追一层，阿贝那句“本该成为母亲”的话，其实是一个女人把自己放进了母亲的位置。她给的是饭、是手艺、是容身处，孩子要的却是名分。两样东西同在一个屋檐下，根本不是一回事。<strong style=\"font-size:1.07em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">阿贝给的是饭和手艺，孩子要的却是名分。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">刘贝莎这样的女人，做得出口味压得住御林军的面，却留不住一个一心想留下的学徒。她把会的全教出去，唯独给不了那个身份。当一个人把善意当成关系的全部，最容易忘的就是问一句对方究竟缺什么。<strong style=\"font-size:1.07em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">给得越多，越该问清楚对方要的是什么。<\/strong>这不是她不够好，是她把“我对你好”当成了“你该满足”。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.07em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">得不到就翻脸，说到底是他从来没被真正看见。<\/strong>后来我从中山到深圳，换过几座城，才慢慢明白，有些位置不是靠努力就能换来的，得有人肯给。肯给的人一旦收回，那种落空不是面子，是整个人的来处被抽掉了。绍安毁的其实不是阿贝，是他自己那个“被选中”的指望。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">这一话最扎我的，是那句夸孩子“真的很想进步”和结尾“零原创料理人”摆在一起。一个曾经把夸一碗面说得极用力的孩子，最后靠记别人的方子过活。<strong style=\"font-size:1.07em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">零原创的料理人，做的永远是别人的方子，走的也是别人的路。<\/strong>冥界篇这碗面，表面写料理，底下写的是一个孩子怎么把“想被承认”走成了“得不到就毁掉”。阿贝没做错什么，她只是把一个学徒当成了家人。可一旦这份错位落了地，善意就变成了账，越认真越难收场。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">文末小记<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">我倒愿意把这一话当成一句提醒：<strong style=\"font-size:1.07em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">别把一个人对你的好，默认成他欠你一个位置。<\/strong>阿贝那份好是真的，绍安那份委屈也是真的，只是两件事从来不兑换。看懂这一点，比骂一句白眼狼有用得多。<\/p>\n<p style=\"margin:32px 0 0;text-align:center;line-height:1;font-size:13px;letter-spacing:10px;color:#2f4b7c;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAHLBDcDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAYEBQcDAgEI/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAAB2UAA8nrn0DzFl0xYce1WfJKvfknj04HKD4jFhwlxj33WuhPoW1hM/wDOkxitl0dYN/VaZT746eD1089Dz35dj578+jn7+egCpKRjSdEMK0q5sT7RXsY41ketLnjR9S1+R5Aqssj6eYvrFTd4PrODSmurWxhqGJSHw8eiFRcFIvesiMN/r52PMrn0CNJTzvHurcAAAAAAAAPkOaGdd31FJaYxUJiQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB+zAAACmuV4vaFi5HDz5+HznF6FHc0rAUNC7JAyLVloRX2YAAAAAFCn6dwI/vOtAJHXz0PHXx7AA+fQDINIqzONy8Z8PVOl2R1q7erKdsopxPp7vyVPC0pCd89fBl6pDSTDwvDnb4jqAvWi5PLxkRXwWqhiVBzXoNsMnvz1D6LBFv490AAAAAAAAAAAAACKo7Ri5jYAAAAAAAB9+fT4ffgAAAAAAAAAAAAAAAAAAAAAAAAB+zAAAI1Kx/D55+1xL8e+ZAgypJTS5HIp41TrB9AAAAAAAAADlmunwzp3z3Qj56AAAAEB8zu2K7tVSyf4rORd/aDgdruLyJNbEYijuIC6X3r72PNf6vTvJSXM5M1JxG/isQxJ3DLNOPdLeUxQuqe5Hz6BXr   var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

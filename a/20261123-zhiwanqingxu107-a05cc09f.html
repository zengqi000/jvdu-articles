全砸回来，会议室里全是抱怨。\n\n那会儿我就明白了一件事：前面的工序省掉，不是没人做，是换个人在后面做。戏里也一样，他省掉的是对队伍的诚意，最后是整支队伍替他还。\n\n有人在评论区说他哭得恶心，我倒觉得这四个字说得准，只是别安在演员身上。恶心的是这个人：一把年纪，还要靠眼泪去讨一个愿意跟他走的人。\n\n也有人说，演反派演到让人恨，就算成功。这话只对一半。让人恨容易，让人恨完还想再看一遍，难。他这回算做到了。\n\n我更在意另一头。整部戏里让人记住的哭，其实都不响。响的那一场，最后只落成一个笑话。\n\n还有个细节值得说。他求人留下的时候，从头到尾没问过对方愿不愿意。他只讲自己怎么不容易、怎么没人懂他。把话说成这样，本来就不是商量，是通知。\n\n戏里没写他回自己屋里以后怎么想。我猜他不想，只会睡。一个人把责任推干净了，觉就睡得着。\n\n所以我看哭戏，先看他哭之前做了什么。做够了，一个眼神就够；没做够，哭得再卖力也补不回来。\n\n一个人在关键那步只想着自己，往后的路就一格一格变窄。\n\n最后想说\n\n假哭别演正剧，这话听着像在骂人，其实是在夸他演对了。真正该被骂的是那种把观众当傻子的演法。李乃文把假演成了假，所以我们恨得起来，也笑得出来。\n\n一个人把最难走的那一步用来护自己，往后的路就只剩往回退。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "html": "<section style=\"font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;color:#2b2f36;text-align:left;letter-spacing:0;background-color:#ffffff;\">\n<h1 style=\"margin:10px 0 26px;font-size:25px;line-height:1.5;font-weight:800;color:#1d2431;letter-spacing:-.02em;text-align:left;background-color:transparent;\">假哭别演正剧！《伟大的长征》大结局：李乃文鼻涕横流演张国焘一场大哭，把角色哭成了历史笑柄<\/h1>\n\n<p style=\"margin:0 0 22px;padding:0 0 16px;border-bottom:1px solid #dfe4ee;font-size:19.5px;line-height:1.8;font-weight:600;color:#1f2f4d;text-align:justify;letter-spacing:0;background-color:transparent;\">哭戏演得对不对，看的不是眼泪，是他替谁在哭。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">这剧六十集，十月九日开播，十一月十五日收官，站内评分九点六，豆瓣八点八。收官这一集里，他哭到鼻涕挂到嘴边，那副样子我看了两遍。弹幕一半在夸演技，一半在说太吵。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">我属于后一半里比较温和的那类。不是他哭得难看，是<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">这场哭没有把我带进去，反倒把我推了出来。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">为什么推出来？因为他哭的时候还在顾自己的姿态。声音一层层往上顶，脸要仰起来，得让镜头收得到。<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">真崩了的人，顾不上好看。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">再往下问一层。他为什么非要这个人留下？剧里给的理由是情分，可前面几十集里，他关心过谁的情分？他记得住的只有谁的位子该动、谁的话得听。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">到这儿戏就通了。<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">他哭的不是人要走，是自己手里没人了。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">史书把这层写得比剧本直。1935 年 10 月，他在卓木碉另立山头，自任主席，把队伍往南带。这一步走出去，后面每一步都是下坡，坡底就是那一把鼻涕。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">同集还有一场哭，我看了两遍。于和伟坐在路边，遇见一对讨饭的祖孙，一句话没说，眼泪先下来。那场没有任何设计感，就是一个人被什么扎了一下。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">一个在演，一个在疼，观众分得清。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">我自己也当过那个验收的人。有一年公司把项目外包出去，开发做完没测就直接交业务验收，第一天点哪哪报错，几百个 bug 全砸回来，会议室里全是抱怨。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">那会儿我就明白了一件事：<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">前面的工序省掉，不是没人做，是换个人在后面做。<\/strong>戏里也一样，他省掉的是对队伍的诚意，最后是整支队伍替他还。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">有人在评论区说他哭得恶心，我倒觉得这四个字说得准，只是别安在演员身上。恶心的是这个人：一把年纪，还要靠眼泪去讨一个愿意跟他走的人。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">也有人说，演反派演到让人恨，就算成功。这话只对一半。<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">让人恨容易，让人恨完还想再看一遍，难。<\/strong>他这回算做到了。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">我更在意另一头。整部戏里让人记住的哭，其实都不响。响的那一场，最后只落成一个笑话。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">还有个细节值得说。他求人留下的时候，从头到尾没问过对方愿不愿意。他只讲自己怎么不容易、怎么没人懂他。<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">把话说成这样，本来就不是商量，是通知。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">戏里没写他回自己屋里以后怎么想。我猜他不想，只会睡。<strong style=\"font-size:1.07em;font-weight:700;color:#2f4b7c;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">一个人把责任推干净了，觉就睡得着。<\/strong><\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">所以我看哭戏，先看他哭之前做了什么。做够了，一个眼神就够；没做够，哭得再卖力也补不回来。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">一个人在关键那步只想着自己，往后的路就一格一格变窄。<\/p>\n<p style=\"margin:34px 0 16px;font-size:18px;line-height:1.55;font-weight:800;color:#2f4b7c;border-left:0;text-align:center;letter-spacing:.08em;background-color:transparent;\">最后想说<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">假哭别演正剧，这话听着像在骂人，其实是在夸他演对了。真正该被骂的是那种把观众当傻子的演法。李乃文把假演成了假，所以我们恨得起来，也笑得出来。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">一个人把最难走的那一步用来护自己，往后的路就只剩往回退。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dfe4ee;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAD4AkgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABAACAwUGAQf/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAGvsdAN8568NBedTyRvoI2sZAHTH5PGhehkWeeW2sPpUhNwmV1ioAMdVkWieUoKNJIFOE8vMJ1c1gH5fz0fO2gedvLXoOh8m2fJ26ftPBwdd+sYYnplmgU9fzBUDXqweGthXJedkuNHZee2CNJHT3kaTNhDG+Ayqc2puN41sIMqS3fQ1RSDew8uU2awazMG1lpefv389LOlXQDIK4seLlcLWVGojzOgqSUKqWWvPNLvzOrbzjTUPGkspqmLPiZUmTPqQC6qkFu4sRDRrJK0yacOc4miLlpIvRD4+x0jJZqcX2/FbMYOaWMFNInbaPAip+vAjneV6Aspfc7kmHhTnorQpzX2wCZe0ML7kg6p4IjogydzW0hKdk/hMOe5q7OqPNoRW9GIBZNDT3JWmdbYyduUuOpdcztKVvc81aQzQ526IqIKqJxlLNrTIfigRrcJAvKY9lgVUz51ZDhyxc0ck <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>

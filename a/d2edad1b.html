<script id="pageData" type="application/json">{"batch": "《兰香如故》", "latest": ["d2edad1b"], "articles": [{"id": "d2edad1b", "title": "《兰香如故》皇上怎么穿紫袍？古代皇帝不都是穿黄袍吗？", "plain": "《兰香如故》皇上怎么穿紫袍？古代皇帝不都是穿黄袍吗？\n\n紫色在古装里从不是小角色，《兰香如故》给皇帝用紫，恰恰是把被忘掉的贵气请回来。\n《兰香如故》｜来源：公众号「小吴侃事」｜孔连顺饰皇帝｜剧照来自来稿\n\n看《兰香如故》那场戏时，我先注意到的是颜色，不是脸。孔连顺演的皇上穿一身紫团龙袍坐在那儿，暗红领口压着，金冠在灯下一点一点亮。旁边朋友脱口而出：皇帝不是穿黄的吗？我盯着那片紫看了几秒，忽然觉得这问题挺有意思，因为我们每个人心里都有一套颜色常识，只是很少去核对它对不对。\n\n一、我们以为的黄袍，其实是很晚才定下的规矩\n\n来稿里把脉络讲得很清楚：先秦天子有五时衣，青红白黑黄跟着季节换；秦代尚黑，大朝常服都偏深；汉代接着按四时换色；魏晋南北朝礼制散，深红、青、紫都上过身。那时候没人给皇帝配一块标准色板，喜欢什么、沿袭什么，就穿什么。\n\n黄色真正被收归皇权，是隋唐三步走。隋朝已有柘黄袍，是黄袍的源头；唐高祖先禁臣民用赤黄；到唐高宗，连浅黄也一并禁掉。从这以后，黄袍才成了皇帝日常常服的标配，后面宋元明清接着用。\n\n所以《兰香如故》里的紫袍不是穿错，是把黄袍还没垄断时的那套审美翻了出来。 皇帝的礼服本来就不止一套，祭祀、朝会、宴饮各有形制，颜色跟着场合走，而不是跟着“皇帝”两个字走。\n\n紫色更不是随便能用的颜色。唐宋公服里，三品以上才准用紫，低品官员连想都别想；唐代皇帝自己也有紫色戎服，《新唐书》里留着记录。到了明代，朝廷拿“恶紫夺朱”禁的是官员百姓，皇帝不在禁令里。万历皇帝爱穿紫袍，穿到褪色还穿，《入跸图》里他出巡那件团龙紫袍，和剧里这一身几乎是一个思路。\n\n二、紫色放在皇帝身上，是一种很聪明的视觉表达\n\n我是学画出身的，当年凭专业分考进南昌大学，复读那年学校还报销了报名费和吃住。画室里最让我着迷的是调紫，红多了发躁，蓝多了发闷，差一点点，整块颜色就塌了。后来大三回镇上雨衣厂实习，月薪五千，给样衣挑颜色时我才知道，紫色用在衣服上比用在画纸上更难，因为它太挑人，也太挑位置。\n\n《兰香如故》给皇上挑暗紫，我觉得挑得准。紫色不是抢戏的颜色，它是把人的气场往后压半步的颜色。 这位皇帝仁厚、心思沉，明黄会把他的沉压成威，暗紫反而把威收进去，留下一点让人猜的余地。\n\n想起我那盒旧水彩，有一管紫被我挤到最后，管皮皱得像老人手背，我总舍不得扔。它不鲜艳，可每次点上去，画面立刻安静。当时我只当是颜色好看，现在看剧才明白，那点安静就是分量。剧组给皇帝用紫，大概也是舍不得让这块颜色从古装剧里彻底消失。\n\n观众喊奇怪，很多时候不是衣服不对，是我们把后来的规矩当成了从古到今的唯一答案。\n\n写在最后\n\n标题问的是皇上怎么穿紫袍，答案其实藏在来稿那句考据里：黄袍是制度慢慢收紧的结果，紫袍是权力更早的一层外衣。明代皇帝能穿，万历穿过，《入跸图》画着，剧组拿它来做人设，合情合理。看清一件衣服的来路，比记住一句“皇帝都穿黄”有用得多。 下次再看见紫袍皇帝，别急着喊穿错，先看看他站在哪个朝代里。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "紫色在古装里从不是小角色，《兰香如故》给皇帝用紫，恰恰是把被忘掉的贵气请回来。\n《兰香如故》｜来源：公众号「小吴侃事」｜孔连顺饰皇帝｜剧照来自来稿\n\n看《兰香如故》那场戏时，我先注意到的是颜色，不是脸。孔连顺演的皇上穿一身紫团龙袍坐在那儿，暗红领口压着，金冠在灯下一点一点亮。旁边朋友脱口而出：皇帝不是穿黄的吗？我盯着那片紫看了几秒，忽然觉得这问题挺有意思，因为我们每个人心里都有一套颜色常识，只是很少去核对它对不对。\n\n一、我们以为的黄袍，其实是很晚才定下的规矩\n\n来稿里把脉络讲得很清楚：先秦天子有五时衣，青红白黑黄跟着季节换；秦代尚黑，大朝常服都偏深；汉代接着按四时换色；魏晋南北朝礼制散，深红、青、紫都上过身。那时候没人给皇帝配一块标准色板，喜欢什么、沿袭什么，就穿什么。\n\n黄色真正被收归皇权，是隋唐三步走。隋朝已有柘黄袍，是黄袍的源头；唐高祖先禁臣民用赤黄；到唐高宗，连浅黄也一并禁掉。从这以后，黄袍才成了皇帝日常常服的标配，后面宋元明清接着用。\n\n所以《兰香如故》里的紫袍不是穿错，是把黄袍还没垄断时的那套审美翻了出来。 皇帝的礼服本来就不止一套，祭祀、朝会 ht:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">来稿里把脉络讲得很清楚：先秦天子有五时衣，青红白黑黄跟着季节换；秦代尚黑，大朝常服都偏深；汉代接着按四时换色；魏晋南北朝礼制散，深红、青、紫都上过身。那时候没人给皇帝配一块标准色板，喜欢什么、沿袭什么，就穿什么。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">黄色真正被收归皇权，是隋唐三步走。隋朝已有柘黄袍，是黄袍的源头；唐高祖先禁臣民用赤黄；到唐高宗，连浅黄也一并禁掉。从这以后，黄袍才成了皇帝日常常服的标配，后面宋元明清接着用。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">所以《兰香如故》里的紫袍不是穿错，是把黄袍还没垄断时的那套审美翻了出来。<\/strong> 皇帝的礼服本来就不止一套，祭祀、朝会、宴饮各有形制，颜色跟着场合走，而不是跟着“皇帝”两个字走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">紫色更不是随便能用的颜色。唐宋公服里，三品以上才准用紫，低品官员连想都别想；唐代皇帝自己也有紫色戎服，《新唐书》里留着记录。到了明代，朝廷拿“恶紫夺朱”禁的是官员百姓，皇帝不在禁令里。万历皇帝爱穿紫袍，穿到褪色还穿，《入跸图》里他出巡那件团龙紫袍，和剧里这一身几乎是一个思路。<\/p>\n\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、紫色放在皇帝身上，是一种很聪明的视觉表达<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我是学画出身的，当年凭专业分考进南昌大学，复读那年学校还报销了报名费和吃住。画室里最让我着迷的是调紫，红多了发躁，蓝多了发闷，差一点点，整块颜色就塌了。后来大三回镇上雨衣厂实习，月薪五千，给样衣挑颜色时我才知道，紫色用在衣服上比用在画纸上更难，因为它太挑人，也太挑位置。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《兰香如故》给皇上挑暗紫，我觉得挑得准。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">紫色不是抢戏的颜色，它是把人的气场往后压半步的颜色。<\/strong> 这位皇帝仁厚、心思沉，明黄会把他的沉压成威，暗紫反而把威收进去，留下一点让人猜的余地。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">想起我那盒旧水彩，有一管紫被我挤到最后，管皮皱得像老人手背，我总舍不得扔。它不鲜艳，可每次点上去，画面立刻安静。当时我只当是颜色好看，现在看剧才明白，那点安静就是分量。剧组给皇帝用紫，大概也是舍不得让这块颜色从古装剧里彻底消失。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">观众喊奇怪，很多时候不是衣服不对，是我们把后来的规矩当成了从古到今的唯一答案。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">标题问的是皇上怎么穿紫袍，答案其实藏在来稿那句考据里：黄袍是制度慢慢收紧的结果，紫袍是权力更早的一层外衣。明代皇帝能穿，万历穿过，《入跸图》画着，剧组拿它来做人设，合情合理。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">看清一件衣服的来路，比记住一句“皇帝都穿黄”有用得多。<\/strong> 下次再看见紫袍皇帝，别急着喊穿错，先看看他站在哪个朝代里。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAITAhIDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAHh35y57WIEKgAE4ao1QEKIogEGKiA4QYgqEiooACpRAABgAgABBQEFRgPsSQujYErEssqquwjGTRhHUQKQqCHjAbxoDmoMABAAgESc+KwtGyxvVOEEVRC8XCKwAAABRFAAAAAAAAGIoJFAYAIBRiKJoOEN <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

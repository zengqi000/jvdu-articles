<script id="pageData" type="application/json">{"batch": "《玫瑰战争》", "latest": ["00bfb25f"], "articles": [{"id": "00bfb25f", "title": "《玫瑰战争》不是没人了，是TVB把新人练出来的那条路拆了", "plain": "《玫瑰战争》不是没人了，是TVB把新人练出来的那条路拆了\n\n《玫瑰战争》四个主演加起来一百九十三岁，念着念着就变成那句质问：TVB真没人了？\n\n我倒觉得人一直在。没了的，是把新人练成台柱的那条路。\n\n55岁的陈豪还在演娱乐大亨，52岁的马国明还在演身份暧昧的弟弟，杨茜尧、林夏薇撑着女性这条线。四个名字摆出来观众心里踏实，可这份踏实，恰恰是拿别人的成长空间换来的。\n\n一、训练班还在，训练之后那个练没了\n\n2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人一年工作不到三十天。离巢潮最凶时到了平均三天走一人，郭晋安、胡定欣、黄宗泽这批视帝视后，说走就走。\n\n走了多少人不是最要命的，最要命的是留下来的人也没多少戏拍。\n\n一个演员怎么长出来的？不是训练班发张毕业证就成角儿了。是靠几十部剧一部部磨，几百集镜头一遍遍露，在片场被老戏骨揪着走位、抠表情，摔过跟头才学会入戏。这条路得有产量养着。\n\n现在这条流水线断了。以前新人不行，旁边还有廖启智、罗兰这些老戏骨兜底，你接不住，有人替你接住，你在旁边看着也能学。现在兜底的人走了，自制剧也少了，年轻演员要么被摁在长寿情景剧里定型成符号，要么一年到头没工开。训练班还挂着牌子，可招牌底下那个练字，空了。\n\n我当年是靠画画敲开大学门的美术生，太懂这个道理。学校报销我复读的报名费和吃住，那是给了我一张入场券。可真正让我敢拿画笔去闯的，是大三那年跑回镇上雨衣厂实习，拿着五千块薪水，成了厂里最年轻的设计师。入场券谁都能给，真刀真枪上手练的位置，才是把人练出来的东西。\n\n二、不是没人敢用新人，是没人敢为新人买单\n\n为什么不用年轻人？账不允许。\n\n连年亏损之后，合拍剧成了TVB的救命稻草。可内地资方认的港剧，就是陈豪、马国明、杨茜尧这几张脸。没人肯拿几千万，去赌一个观众压根不认识的新名字。于是主角位置天然留给熟脸，新人连露个脸被记住的机会都拿不到。闭环扣死了：产量缩，新人没机会，靠老人守收视，老人继续占位，新人更没机会。\n\n我反感这套逻辑，是因为我自己就是被拿别人的标准套长大的人。从南昌大学毕业后，我没听家里的话去端铁饭碗，跑去外地漂泊，一个人扛着思乡和孤独把小日子过明白。外人看着觉得折腾，可我知道，那些自己跌的跟头，比别人替我铺好的路更算数。\n\n杨茜尧这次的复仇大女主，也是自己挣来的位置。她凭《黑色月光》杀回来，靠的是一场场戏熬出来的观众缘。可挣来了位置，递到她手上的还是复仇这类安全戏路。熟龄女演员的红利和枷锁是同一枚硬币：经验值钱了，别人就越发只肯让你重复验证过的那一面。她想要一次真正的突破，代价可能是丢掉那份来之不易的安全感。\n\n写在最后\n\n所以TVB没人了这句话，说轻了。人还在，只是让新人变成能扛剧之人的那套系统，停摆了。193岁不是病根，是症状。\n\n我现在迷上了拍照，没相机就先用手机拍，攒钱想买人生第一台相机。按下快门那一刻的兴奋，跟当年在画室调色一模一样。学会一门手艺不靠一张证书，靠的是有人肯让你一次次上手，还有你自己不肯放下。\n\n可怕的不是193岁。可怕的是等到这批人真演不动那天，我们才发现，那条练新人的路，早就拆了。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "《玫瑰战争》四个主演加起来一百九十三岁，念着念着就变成那句质问：TVB真没人了？\n\n我倒觉得人一直在。没了的，是把新人练成台柱的那条路。\n\n55岁的陈豪还在演娱乐大亨，52岁的马国明还在演身份暧昧的弟弟，杨茜尧、林夏薇撑着女性这条线。四个名字摆出来观众心里踏实，可这份踏实，恰恰是拿别人的成长空间换来的。\n\n一、训练班还在，训练之后那个练没了\n\n2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人一年工作不到三十天。离巢潮最凶时到了平均三天走一人，郭晋安、胡定欣、黄宗泽这批视帝视后，说走就走。\n\n走了多少人不是最要命的，最要命的是留下来的人也没多少戏拍。\n\n一个演员怎么长出来的？不是训练班发张毕业证就成角儿了。是靠几十部剧一部部磨，几百集镜头一遍遍露，在片场被老戏骨揪着走位、抠表情，摔过跟头才学会入戏。这条路得有产量养着。\n\n现在这条流水线断了。以前新人不行，旁边还有廖 着女性这条线。四个名字摆出来观众心里踏实，可这份踏实，恰恰是拿别人的成长空间换来的。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、训练班还在，训练之后那个练没了<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人一年工作不到三十天。离巢潮最凶时到了平均三天走一人，郭晋安、胡定欣、黄宗泽这批视帝视后，说走就走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">走了多少人不是最要命的，最要命的是留下来的人也没多少戏拍。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">一个演员怎么长出来的？不是训练班发张毕业证就成角儿了。是靠几十部剧一部部磨，几百集镜头一遍遍露，在片场被老戏骨揪着走位、抠表情，摔过跟头才学会入戏。这条路得有产量养着。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">现在这条流水线断了。以前新人不行，旁边还有廖启智、罗兰这些老戏骨兜底，你接不住，有人替你接住，你在旁边看着也能学。现在兜底的人走了，自制剧也少了，年轻演员要么被摁在长寿情景剧里定型成符号，要么一年到头没工开。训练班还挂着牌子，可招牌底下那个练字，空了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我当年是靠画画敲开大学门的美术生，太懂这个道理。学校报销我复读的报名费和吃住，那是给了我一张入场券。可真正让我敢拿画笔去闯的，是大三那年跑回镇上雨衣厂实习，拿着五千块薪水，成了厂里最年轻的设计师。入场券谁都能给，真刀真枪上手练的位置，才是把人练出来的东西。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、不是没人敢用新人，是没人敢为新人买单<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">为什么不用年轻人？账不允许。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">连年亏损之后，合拍剧成了TVB的救命稻草。可内地资方认的港剧，就是陈豪、马国明、杨茜尧这几张脸。没人肯拿几千万，去赌一个观众压根不认识的新名字。于是主角位置天然留给熟脸，新人连露个脸被记住的机会都拿不到。闭环扣死了：产量缩，新人没机会，靠老人守收视，老人继续占位，新人更没机会。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我反感这套逻辑，是因为我自己就是被拿别人的标准套长大的人。从南昌大学毕业后，我没听家里的话去端铁饭碗，跑去外地漂泊，一个人扛着思乡和孤独把小日子过明白。外人看着觉得折腾，可我知道，那些自己跌的跟头，比别人替我铺好的路更算数。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">杨茜尧这次的复仇大女主，也是自己挣来的位置。她凭《黑色月光》杀回来，靠的是一场场戏熬出来的观众缘。可挣来了位置，递到她手上的还是复仇这类安全戏路。熟龄女演员的红利和枷锁是同一枚硬币：经验值钱了，别人就越发只肯让你重复验证过的那一面。她想要一次真正的突破，代价可能是丢掉那份来之不易的安全感。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">所以TVB没人了这句话，说轻了。人还在，只是让新人变成能扛剧之人的那套系统，停摆了。193岁不是病根，是症状。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我现在迷上了拍照，没相机就先用手机拍，攒钱想买人生第一台相机。按下快门那一刻的兴奋，跟当年在画室调色一模一样。学会一门手艺不靠一张证书，靠的是有人肯让你一次次上手，还有你自己不肯放下。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">可怕的不是193岁。可怕的是等到这批人真演不动那天，我们才发现，那条练新人的路，早就拆了。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《玫瑰战争》", "created": "2026-11-16 20:37", "updated": "2026-11-16 20:37"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

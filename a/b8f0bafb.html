<script id="pageData" type="application/json">{"batch": "《兰香如故》", "latest": ["b8f0bafb"], "articles": [{"id": "b8f0bafb", "title": "《兰香如故》大结局，林锦岐51岁离世，许兰香独自带大3个儿女，这份圆满太沉", "plain": "《兰香如故》大结局，林锦岐51岁离世，许兰香独自带大3个儿女，这份圆满太沉\n\n追到《兰香如故》最后一集，我没急着关电视。屏幕上那场补上的合卺礼，红烛高照，两个满身旧伤的人终于把余生交到对方手里，看着是圆满，可我心里清楚，这份甜里掺着后来的苦。\n\n（谭松韵 刘学义 兰香如故 林锦岐 许兰香）\n\n一、他把自由还给她，转头却先走了一步\n\n林锦岐这个人物，最拧巴的地方就在“爱”字上。当年他请皇帝赐婚，把许兰香困在林府，说到底是怕失去。一个习惯了把责任扛在肩上的人，连感情都要用权势去兜底，好像攥得越紧，人就越不会跑。\n\n可剧情偏偏让他在一片荒坟前把这件事摊开。他带兰香去看当年偷偷安葬的沈家遗骨，也承认了赐婚是自私。一个人肯把自己最不体面的动机说出来，才算真正把另一个人当成了平等的伴。\n\n从那以后，那个要自由、不愿被掌控的许兰香，和那个背着家国、不敢松手的林锦岐，才算解开了最后一道心结。没有圣旨，没有逼迫，只是两个都疼过的人，重新补上当年缺的那场婚礼。看到这里我只觉得，这才是他们该有的样子。\n\n可命运没打算让他们好好相守到老。常年征战，林锦岐一身伤痕，51岁就油尽灯枯。留下30多岁的许兰香，和3个还小的孩子。\n\n二、她没改嫁，也没垮，而是把自己活成了一部戏\n\n一个女人30多岁没了丈夫，带着3个孩子，放在哪个年代都是难熬的。许兰香的选择是：撑起整个林家，一个人把孩子拉扯大，同时提笔写戏本《沈家记》，用民间传唱把沈家旧事留下来。\n\n我看到这段的时候，想起我表姨。她40岁那年表叔走了，留下一儿一女，家里人劝她改嫁，她没听，白天在厂里上班，晚上给人缝衣服补贴家用，硬是把两个孩子供到大学毕业。有一年过年我看见她，桌上摆着表叔的照片，她一边包饺子一边说，人走了，日子还得过，我不能让俩孩子没了娘。\n\n那句话很轻，可我记到现在。许兰香握着沈夫人给她的旧香囊离开人世，香囊上写着“活”字，她这一生，就是把这一个字扛到了底。\n\n剧里总说她是沈嘉兰，又说是许兰香。其实名字从来不是重点。重点是一个女人被灭门、被顶替、被赐婚、又丧夫，每一次都没被命运按下去。她没有轰轰烈烈地复仇到底，只是安安静静地把该活的日子过完，把该记的人记住。\n\n写在最后\n\n大结局最打动我的，不是谁赢了谁，是林锦岐那句“等自己死后另嫁他人”和许兰香那句“当年你护过我在意的人”之间的对照。一个舍得放手，一个记得恩情。真正的圆满从来不是永远在一起，是你走之后，我把我们共同的日子好好过下去。 这样的结局，沉，但配得上他们受过的那些苦。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "追到《兰香如故》最后一集，我没急着关电视。屏幕上那场补上的合卺礼，红烛高照，两个满身旧伤的人终于把余生交到对方手里，看着是圆满，可我心里清楚，这份甜里掺着后来的苦。\n\n（谭松韵 刘学义 兰香如故 林锦岐 许兰香）\n\n一、他把自由还给她，转头却先走了一步\n\n林锦岐这个人物，最拧巴的地方就在“爱”字上。当年他请皇帝赐婚，把许兰香困在林府，说到底是怕失去。一个习惯了把责任扛在肩上的人，连感情都要用权势去兜底，好像攥得越紧，人就越不会跑。\n\n可剧情偏偏让他在一片荒坟前把这件事摊开。他带兰香去看当年偷偷安葬的沈家遗骨，也承认了赐婚是自私。一个人肯把自己最不体面的动机说出来，才算真正把另一个人当成了平等的伴。\n\n从那以后，那个要自由、不愿被掌控的许兰香，和那个背着家国、不敢松手的林锦岐，才算解开了最后一道心结。没有圣旨，没有逼迫，只是两个都疼过的人，重新补上当年缺的那场婚礼。看到这里我只觉得，这才是他们该有的样子。\n\n可命运没打算让他们好好相守到老。常年征战，林锦岐一身伤痕，51岁就油尽灯枯。留下30多岁的许兰香，和3个还小的孩子。\n\n二、她没改嫁，也没垮，而是把自己活成了一部戏\n\n一个女人30多岁没了丈夫，带着3个孩子，放在哪个年代都是难熬的。许兰香的选择是：撑起整个林家，一个人把孩子拉扯大，同时提笔写戏本《沈家记》，用民间传唱把沈家旧事留下来。\n\n我看到这段的时候，想起我表姨。她40岁那年表叔走了，留下一儿一女，家里人劝她改嫁，她没听，白天在厂里上班，晚上给人缝衣服补贴家用，硬是把两个孩子供到大学毕业。有一年过年我看见她 算真正把另一个人当成了平等的伴。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">从那以后，那个要自由、不愿被掌控的许兰香，和那个背着家国、不敢松手的林锦岐，才算解开了最后一道心结。没有圣旨，没有逼迫，只是两个都疼过的人，重新补上当年缺的那场婚礼。看到这里我只觉得，这才是他们该有的样子。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCALQBDgDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAQIAAwQFBgcI/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB+QyTpJJCSQgYRIISSU0BtWSBdXZ03UHjnQlQiVOLpI7ldsjJdGldlPOCuxdFsRrbbMryapmnJpNFmVpD9MBpIEWQEslVV6BtmN00Rnaq9Kbe1pydfm77c2RuW6lvqzaQ1ea8UkVoCGEhhCSAyEhgIQSGIsaLWLRKgsMVS8mYa1rNNClMtWkjKSSRJIkkhAYAFSQSpJCSQkkJJCQQMEJJASRmSSpJBYYhghJJ1x1rq7+sx57c+IYTnNccIgsW1AztVy8yUMRa8DSqCkNFOazIcxmRx3SyZKGrNVVG11lehKkvqgFBm36sWyTRZTJiylaKtroF1tsxaE0RSgVlyhVa0dHldHvdnL3c7t05xqXhu+l9+nMXtheMepnjGt9edVxhEkJJIshkCWXGZ9dq89ejkzaZISSZSyu6tdra1xjYDGm8HOTpocxepE42fsc+swsGopfRJknRkvMG/KZ5Yuose4yzYpmmikSGCwwEMQQ60xyfbrPiI6/HASoYAhglNJOmdpwtZbEaR4rTDQmytLK7ZfRbLYFXABzrUaywzV7KYzx4oZ3kpZ1C9UwdQFQGWWaKbktW6ZzkXVM3Pa6gUVjKJu1qy3T20szoux3JqlbcshTIm7Ht73TXu1evXBXvJnfM3XV1M0wZr4Zm5U1OM7SO+VM0kyzZTLVor2501t7FdjS3NzunzIzSRJJIl9F8dTVm1WgNFAdarDrIIYZuX1OWmeSaj7Me2XS0fNz8/qcyzKJNw7cW+L5aYzYurzzCGWyaKN9Iu4x2vo3yH19x5P7ZVzLPimb6v84l5y78i1BpQjS5WSdMl5bMiMJlWh1l4JS1WIoKs21iX4ksj5jSCDXY1ZW2Npll6RVVrrrLXfRNKVma1iW2M6Sy96tXPCxkyCMubXVpq3qmFdUACnkFFq2q96buWLLFtxDux39XYu5U9nTfm5mfOujlwpi20yzO6rdexOW3WVcFm0mNr5nVGTpYsMe7Ntzq9o1sjGMvK6vLsyxoRWWJoz6cupqza7VDyVIYiJatqxpZj5fX5GZQCNx9uC6XqNhObr5mjLZmkmod2HUdI0mH5+3AYwRR3Yd6bCDXofQeJ9KnI4v1b1Uz+fF+h/PbqnB0cMuaSUJJciak9H ooppHjrlPJwHt9VEPbLgRhenDNsNLAxvgcKLKXq50V4bVdsv8Aw5V35Zpp0Me+4GsbMdTUop1GMeDBcwCK3KhmCXqdxwp6ligcKzZgwGXcYIEQxaLDFbDePDVDhjyOM7xEV4Huz3Z7sYKwbl/4blks9DH0sDNUDEIIVCLcuX6gfYjJmdQiqUxPfEMhfPhSiDgyruJLYkmfE2uMhFBygx9p2hLiCYlxUb5Y8USELkILaUflmYIrpL7gLV9Cxxv+SBC08AfvEAHmjLd9mc+Inl24gzNOGESB6CWV4iG5YIR0d5N0PS+gG8WPMvmHMOICmbJpyxLG8D3IyZW8z3J7jK8TVKz2JXxKzwMVcxQcf5zH0XxUOYqCKGSXx083BixOmbTDw9aLYcPA1xY5cxYimcqVKxHgYQO4cWHA0ylKrNRi3FbyMY7YRyg2HvM7O9MXz8GP1GTNq/fcsu1ln4aL+iiMRxr7QsrEGfPc32SZNYc8nhUCPAsQNzcTKeJhlMbjTXpl1D0PBnaG7w58BxjZhyNuALeBia5GCyuFPmZi5frvUHH+B9Zjy8//2Q==\" alt=\"剧照\"><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">可命运没打算让他们好好相守到老。常年征战，林锦岐一身伤痕，51岁就油尽灯枯。留下30多岁的许兰香，和3个还小的孩子。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、她没改嫁，也没垮，而是把自己活成了一部戏<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">一个女人30多岁没了丈夫，带着3个孩子，放在哪个年代都是难熬的。许兰香的选择是：撑起整个林家，一个人把孩子拉扯大，同时提笔写戏本《沈家记》，用民间传唱把沈家旧事留下来。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我看到这段的时候，想起我表姨。她40岁那年表叔走了，留下一儿一女，家里人劝她改嫁，她没听，白天在厂里上班，晚上给人缝衣服补贴家用，硬是把两个孩子供到大学毕业。有一年过年我看见她，桌上摆着表叔的照片，她一边包饺子一边说，人走了，日子还得过，我不能让俩孩子没了娘。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">那句话很轻，可我记到现在。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">许兰香握着沈夫人给她的旧香囊离开人世，香囊上写着“活”字，她这一生，就是把这一个字扛到了底。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">剧里总说她是沈嘉兰，又说是许兰香。其实名字从来不是重点。重点是一个女人被灭门、被顶替、被赐婚、又丧夫，每一次都没被命运按下去。她没有轰轰烈烈地复仇到底，只是安安静静地把该活的日子过完，把该记的人记住。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">大结局最打动我的，不是谁赢了谁，是林锦岐那句“等自己死后另嫁他人”和许兰香那句“当年你护过我在意的人”之间的对照。一个舍得放手，一个记得恩情。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">真正的圆满从来不是永远在一起，是你走之后，我把我们共同的日子好好过下去。<\/strong> 这样的结局，沉，但配得上他们受过的那些苦。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["如果你是许兰香，林锦岐51岁就走了，3个孩子还小，你会独自撑起这个家，还是给自己找个依靠？", "林锦岐在荒坟前坦白赐婚是自私，那一刻你会因为他承认得坦荡而原谅他，还是觉得伤害已经造成？", "那场补上的合卺礼，没有圣旨没有逼迫，如果你是许兰香，你会接受这份迟来的圆满吗？", "当年你护过我在意的人，就这一句，如果你是林锦岐，听到时会放心走吗？", "许兰香握着写着活字的旧香囊离世，你觉得这一个字，是她一生的写照吗？", "一个人独自带大3个孩子还要写《沈家记》，换成是你，撑得下来吗？", "林锦岐说等自己死后让她另嫁他人，如果你是许兰香，会答应他吗？", "剧里她既是沈嘉兰又是许兰香，你觉得名字对一个人真的重要吗？", "51岁就油尽灯枯，如果你是林锦岐，早知道结局还会不会请那道赐婚圣旨？", "表姨那句人走了日子还得过，你身边有没有这样一个人，让你记了很多年？"], "batch": "《兰香如故》", "created": "2026-11-17 19:39", "updated": "2026-11-17 19:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

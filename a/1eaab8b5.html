<script id="pageData" type="application/json">{"batch": "《兰香如故》", "latest": ["1eaab8b5"], "articles": [{"id": "1eaab8b5", "title": "《兰香如故》大结局：许兰香最硬的一步，不是等到公道，是自己把名字挣回来", "plain": "《兰香如故》大结局：许兰香最硬的一步，不是等到公道，是自己把名字挣回来\n\n这部剧最大的圆满不是那场补办的婚礼，是一个女人终于把自己的名字要了回来。\n\n大结局里，赵阁老的罪证被翻了出来，沈家满门的冤屈洗清，许兰香可以重新叫沈嘉兰。她从京城回到金陵，又从金陵回到京城，走的是当年离开的那条路，只是这回没人押着她。荒坟那场戏，林锦岐带她去看沈家人的遗骨，承认当年请皇帝赐婚、把她困在身边，是自私，是怕失去。年末落雪，两个人补上大婚时缺的那一礼，没有圣旨，也没有逼迫。\n\n《兰香如故》｜古装剧｜大结局（第31集）\n\n一、翻案是别人给的一纸判决，后面的日子得自己走\n\n剧情到这儿其实可以收了，可它偏要多走一段。两人有了三个孩子，林锦岐常年征战，身上旧伤压着，五十一岁就走了。三十多岁的沈嘉兰一个人撑起林家，把几个孩子养大，还坚持写那本戏本《沈家记》，让沈家的旧事在民间传唱下去。她走的时候，手里握着当年沈夫人给她的旧香囊，上面绣着一个「活」字。\n\n这一段比翻案本身更值得看。判决是别人给的，纸一递，说你家清白，可清白之后怎么活，没人替她安排。公道会迟到，日子不会等你缓过来。 她没把自己活成一个守着冤屈的人，也没靠「我是受害者」这层身份讨什么。写戏本这件事尤其要紧，她把沈家的事写下来，交给唱戏的人、听说书的人，等于把自家的说法从别人的嘴里拿了回来。\n\n名字是别人还的，往后的活法是自己一步步走出来的。 一个人守住自己的日子，本身就是最难的一种还手。\n\n那场补办的婚礼也值得多说一句。她最不喜以权势欺人，当年那桩赐婚恰恰就是权势压下来的，人被赏了，事却没问过她愿不愿意。所以合卺礼非要等到没有圣旨、没有逼迫的时候才补，晚了几十年，可只有那一次是她自己点的头。被人护着和自己肯，是两回事。 她这辈子没为前者低过头。\n\n二、说法归谁，比真相是谁的更要紧\n\n赵阁老当年一手酿成沈家灭门，靠的不是刀，是话。他给沈家安一个名目，满朝就都信了，一家人从此没了活路。这样的事搁在日子里也不新鲜：一件事被谁先说出口，往往就长成什么样，后头的人懒得再去问原委。\n\n我刚做销售那两年，组里传过一阵话，说我抢同事的单子。那几天我在食堂打饭都听得见背后有人压着嗓子讲。我没在群里吵，也没找人挨个解释，只把跟过的客户做成一张表，谁什么时候接的、跟到哪一步，一栏一栏打印出来放在办公桌上，谁想看就看。你没法堵住别人的嘴，只能把自己的凭据摆在那儿。 后来那张表没人再提，话自己就散了。\n\n沈嘉兰写《沈家记》，跟我摆那张表是一个道理。她没有满街去喊冤，只是把沈家的事一笔一笔写下来，让它能传下去。能被记住的事，才轮得到被重新说一遍。 至于那些传闲话的人，他们要的从来不是真相，是一个能嚼两天的说法。\n\n写在最后\n\n香囊上那个「活」字，是沈夫人留给她的，也是她自己挣的。一个人先把日子过住，名字才有地方落。 看完这一集我没什么大道理，只觉得她这一生难得：冤也受了，人也走了，到头来她还是沈嘉兰。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "这部剧最大的圆满不是那场补办的婚礼，是一个女人终于把自己的名字要了回来。\n\n大结局里，赵阁老的罪证被翻了出来，沈家满门的冤屈洗清，许兰香可以重新叫沈嘉兰。她从京城回到金陵，又从金陵回到京城，走的是当年离开的那条路，只是这回没人押着她。荒坟那场戏，林锦岐带她去看沈家人的遗骨，承认当年请皇帝赐婚、把她困在身边，是自私，是怕失去。年末落雪，两个人补上大婚时缺的那一礼，没有圣旨，也没有逼迫。\n\n《兰香如故》｜古装剧｜大结局（第31集）\n\n一、翻案是别人给的一纸判决，后面的日子得自己走\n\n剧情到这儿其实可以收了，可它偏要多走一段。两人有了三个孩子，林锦岐常年征战，身上旧伤压着，五十一岁就走了。三十多岁的沈嘉兰一个人撑起林家，把几个孩子养大，还坚持写那本戏本《沈家记》，让沈家的旧事在民间传唱下去。她走的时候，手里握着当年沈夫人给她的旧香囊，上面绣着一个「活」字。\n\n这一段比翻案本身更值得看。判决是别人给的，纸一递，说你家清白，可清白之后怎么活，没人替她安排。公道会迟到，日子不会等你缓过来。 她没把自己活成一个守着冤屈的人，也没靠「我是受害者」这层身份讨什么。写戏本这件事尤其要紧，她把沈家的事写下来 >这一段比翻案本身更值得看。判决是别人给的，纸一递，说你家清白，可清白之后怎么活，没人替她安排。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">公道会迟到，日子不会等你缓过来。<\/strong> 她没把自己活成一个守着冤屈的人，也没靠「我是受害者」这层身份讨什么。写戏本这件事尤其要紧，她把沈家的事写下来，交给唱戏的人、听说书的人，等于把自家的说法从别人的嘴里拿了回来。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">名字是别人还的，往后的活法是自己一步步走出来的。<\/strong> 一个人守住自己的日子，本身就是最难的一种还手。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">那场补办的婚礼也值得多说一句。她最不喜以权势欺人，当年那桩赐婚恰恰就是权势压下来的，人被赏了，事却没问过她愿不愿意。所以合卺礼非要等到没有圣旨、没有逼迫的时候才补，晚了几十年，可只有那一次是她自己点的头。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">被人护着和自己肯，是两回事。<\/strong> 她这辈子没为前者低过头。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、说法归谁，比真相是谁的更要紧<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">赵阁老当年一手酿成沈家灭门，靠的不是刀，是话。他给沈家安一个名目，满朝就都信了，一家人从此没了活路。这样的事搁在日子里也不新鲜：一件事被谁先说出口，往往就长成什么样，后头的人懒得再去问原委。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我刚做销售那两年，组里传过一阵话，说我抢同事的单子。那几天我在食堂打饭都听得见背后有人压着嗓子讲。我没在群里吵，也没找人挨个解释，只把跟过的客户做成一张表，谁什么时候接的、跟到哪一步，一栏一栏打印出来放在办公桌上，谁想看就看。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">你没法堵住别人的嘴，只能把自己的凭据摆在那儿。<\/strong> 后来那张表没人再提，话自己就散了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">沈嘉兰写《沈家记》，跟我摆那张表是一个道理。她没有满街去喊冤，只是把沈家的事一笔一笔写下来，让它能传下去。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">能被记住的事，才轮得到被重新说一遍。<\/strong> 至于那些传闲话的人，他们要的从来不是真相，是一个能嚼两天的说法。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">香囊上那个「活」字，是沈夫人留给她的，也是她自己挣的。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一个人先把日子过住，名字才有地方落。<\/strong> 看完这一集我没什么大道理，只觉得她这一生难得：冤也受了，人也走了，到头来她还是沈嘉兰。<\/p>\n<p style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《兰香如故》", "created": "2026-11-16 09:27", "updated": "2026-11-16 09:27"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

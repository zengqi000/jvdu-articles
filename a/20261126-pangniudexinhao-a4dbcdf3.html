<script id="pageData" type="application/json">{"batch": "接孩子四个细节", "latest": ["20261126-pangniudexinhao-a4dbcdf3"], "articles": [{"id": "20261126-pangniudexinhao-a4dbcdf3", "title": "接娃路上这四件小事，暴露孩子家庭教育的底色，很多家长天天做错", "plain": "接娃路上这四件小事，暴露孩子家庭教育的底色，很多家长天天做错\n\n不少家长把放学那十几分钟当成赶路的空当，脑子里还转着工作，孩子凑过来想说话，一句「作业多不多」就把话头堵了回去。有个做了十几年班主任的老师跟我聊起过，孩子身上那些说不清的急躁和畏缩，往往能在这段路上找到源头。真正的教育不在补课表里，在接娃路上那几个不起眼的动作里。\n\n把这段路拆开看，有四件小事，天天都在发生。你对着这四件对照一下，自家教育的底色是什么，基本就有数了。\n\n一、书包谁背：你替他省的那点力气，正在拿走他的责任\n\n校门口最常见的一幕，是大人伸手把书包接过去，孩子空着手走在前面。有个朋友家孩子上三年级，一出校门就把书包塞给奶奶，奶奶腰不舒服那回没法接，孩子当场急了，说书包太重，本来就该大人拿。\n\n大人觉得顺手帮一把是疼孩子，可书包这件事，本来就是孩子自己上学的本分。事事替他扛，他学不会体谅，也学不会自己的事自己收尾。苏霍姆林斯基讲过，不要把孩子保护起来、不让他劳动，那样会让他失去感恩的心。\n\n书包没重到压伤肩膀，就让他自己背。特别沉的日子搭把手可以，别天天如此。你替他背的是书包，替掉的是他对自己负责的机会。\n\n书包这件小事看完，再看时间。孩子站在门口等你的那几分钟，比你想的更长。\n\n二、你准不准时：等待在孩子心里，会被放大成很多倍\n\n有家长觉得上班脱不开身，晚十几分钟接娃不算什么，孩子在保安室待着而已。我认识的一位妈妈常晚到，孩子起初会踮着脚往路口望，后来就不说话了，接走时也不再问今天有什么好玩的事。\n\n老师提醒过她：别的孩子都被接走、只剩他一个的时候，孩子会忍不住想，是不是自己不乖，爸妈才不来。大人眼里的一小会儿，在孩子那边是被丢下的感觉。安全感不是一句「妈妈爱你」喊出来的，是一次次准时出现攒起来的。\n\n谁都有临时加班、路上堵车的时候，偶尔迟到不算错，提前打个电话说清楚、见面认真道个歉就行，别把迟到拖成常态。你稳定地出现在校门口，孩子才敢相信：自己是被放在心上的。\n\n人到了，接下来看嘴。很多人一见面就问学习，把刚才那点踏实又问没了。\n\n三、见面第一句问什么：你盯着分数，孩子就关上了话匣子\n\n两种家长，接娃路上说出来的话完全不一样。一种一见面就追问：考了吗、有没有挨批、作业多不多，孩子原本想讲班里发生的趣事，话到嘴边又咽了回去，久了干脆不讲。另一种先问今天有没有开心的事、有没有让你得意的小收获，孩子反而主动把考砸的事也说了。\n\n差别不在你关不关心成绩，而在你先看见分，还是先看见人。情绪永远排在成绩前面，审问多了，孩子的心门就关了。 他觉得说了也只会被评判，索性什么都不说。\n\n换个顺序试试：接到手先聊两句闲的，等他愿意讲了，学习的事自然带得出来。真要问作业，也别在路上连着追问，留到回家坐定再说。你先接住他的话，他才肯把更多的话交给你。\n\n问话改了，还有一样东西藏不住，就是你的脸色。\n\n四、你带着什么情绪来：父母的脸色，就是孩子世界的天气\n\n不少家长白天累了一天，接到孩子时疲惫全写在脸上，一路叹气、皱眉、抱怨工作烦。孩子敏感，会看你脸色，不敢笑闹，连讲学校的事都挑你心情好时才敢开口。\n\n有句话说得很准：父母的脸色，就是孩子世界的天气。不是要你时刻情绪完美，大人当然会累，但别把工作里那股火气，倒在放学这段路上。孩子不需要一个永远开心的父母，需要一个情绪稳定的家。\n\n真累了，接到孩子先停一停，深呼吸两口，给他一个拥抱再走。要是确实绷不住，就直说「爸爸今天有点累，缓一会儿再陪你聊」，把情绪说出来，比让孩子猜强。你稳住了，他才敢松下来。\n\n结语\n\n书包谁背、准不准时、先问什么、带着什么脸色来，这四件小事没一件需要花钱，也没一件要求你是高学历家长，难的只是天天做到。\n\n我自己也是被催着、比着长大的，当了妈之后最怕把这套又搬回自家孩子身上。家长群里比分数、亲戚见面问考第几，我听着都替孩子憋屈。可轮到老大写作业磨蹭，我也忍不住催过，嗓门一高就后悔。说到底，我们都不是天生的好父母，只是在一件件小事里慢慢学着收住自己。\n\n被人认真看见、被稳稳接住的孩子，心里是有底的。这份底气不靠说教，靠的就是你每天那段接娃路上，肯不肯把手机放一放、把脸色松一松、把第一句问话换一换。今天接孩子的时候，先挑其中一件试试看。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "不少家长把放学那十几分钟当成赶路的空当，脑子里还转着工作，孩子凑过来想说话，一句「作业多不多」就把话头堵了回去。有个做了十几年班主任的老师跟我聊起过，孩子身上那些说不清的急躁和畏缩，往往能在这段路上找到源头。真正的教育不在补课表里，在接娃路上那几个不起眼的动作里。\n\n把这段路拆开看，有四件小事，天天都在发生。你对着这四件对照一下，自家教育的底色是什么，基本就有数了。\n\n一、书包谁背：你替他省的那点力气，正在拿走他的责任\n\n校门口最常见的一幕，是大人伸手把书包接过去，孩子空着手走在前面。有个朋友家孩子上三年级，一出校门就把书包塞给奶奶，奶奶腰不舒服那回没法接，孩子当场急了，说书包太重，本来就该大人拿。\n\n大人觉得顺手帮一把是疼孩子，可书包这件事，本来就是孩子自己上学的本分。事事替他扛，他学不会体谅，也学不会自己的事自己收尾。苏霍姆林斯基讲过，不要把孩子保护起来、不让他劳动，那样会让他失去感恩的心。\n\n书包没重到压伤肩膀，就让他自己背。特别沉的日子搭把手可以，别天天如此。你替他背的是书包，替掉的是他对自己负责的机会。\n\n书包这件小事看完，再看时间。孩子站在门口等你的那几分钟，比你想的更长。\n\n二、你准不准时：等待在孩子心里，会被放大成很多倍\n\n有家长觉得上班脱不开身，晚十几分钟接娃不算什么，孩子在保安室待着而已。我认识的一位妈妈常晚到，孩子起初会踮着脚往路口望，后来就不说话了，接走时也不再问今天有什么好玩的事。\n\n老师提醒过她：别的孩子都被接走、只剩他一个的时候，孩子会忍不住想，是不是自己不乖，爸妈才不来。大人眼里的一小会儿，在孩子那边是被丢下的感觉。安全感不是一句「妈妈爱你」喊出来的，是一次次准时出现攒起来的。\n\n谁都有临时加班、路上堵车的时候，偶尔迟到不算错，提前打个电话说清楚、见面认真道个歉就行，别把迟到拖成常态。你稳定地出现在校门口，孩子才敢相信：自己是被放在心上的。\n\n人到了，接下来看嘴。很多人一见面就问学习，把刚才那点踏实又问没了。\n\n三、见面第一句问什么：你盯着分数，孩子就关上了话匣子\n\n两种家长，接娃路上说出来的话完全不一样。一种一见面就追问：考了吗、有没有挨批、作业多不多，孩子原本想讲班里发生的趣事，话到嘴边又咽了回去，久了干脆不讲。另一种先问今天有没有开心的事、有没有让你得意的小收获，孩子反而主动把考砸的事也说了。\n\n差别不在你关不关心成绩，而在你先看见分，还是先看见人。情绪永远排在成绩前面，审问多了，孩子的心门就关了。 他觉得说了也只会被评判，索性什么都不说。\n\n换个顺序试试：接到手先聊两句闲的，等他愿意讲了，学习的事自然带得出来。真要问作业，也别在路上连着追问，留到回家坐定再说。你先接住他的话，他才肯把更多的话交给你。\n\n问话改了，还有一样东西藏不住，就是你的脸色。\n\n四、你带着什么情绪来：父母的脸色，就是孩子世界的天气\n\n不少家长白天累了一天，接到孩子时疲惫全写在脸上，一路叹气、皱眉、抱怨工作烦。孩子敏感，会看你脸色，不敢笑闹，连讲学校的事都挑你心情好时才敢开口。\n\n有句话说得很准：父母的脸色，就是孩子世界的天气。不是要你时刻情绪完美，大人当然会累，但别把工作里那股火气，倒在放学这段路上。孩子不需要一个永远开心的父母，需要一个情绪稳定的家。\n\n真累了，接到孩子先停一停，深呼吸两口，给他一个拥抱再走。要是确实绷不住，就直说「爸爸今天有点累，缓一会儿再陪你聊」，把情绪说出来，比让孩子猜强。你稳住了，他才敢松下来。\n\n结语\n\n书包谁背、准不准时、先问什么、带着什么脸色来，这四件小事没一件需要花钱，也没一件要求你是高学历家长，难的只是天天做到。\n\n我自己也是被催着、比着长大的，当了妈之后最怕把这套又搬回自家孩子身上。家长群里比分数、亲戚见面问考第几，我听着都替孩子憋屈。可轮到老大写作业磨蹭，我也忍不住催过，嗓门一高就后悔。说到底，我们都不是天生的好父母，只是在一件件小事里慢慢学着收住自己。\n\n被人认真看见、被稳稳接住的孩子，心里是有底的。这份底气不靠说教，靠的就是你每天那段接娃路上，肯不肯把手机放一放、把脸色松一松、把第一句问话换一换。今天接孩子的时候，先挑其中一件试试看。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "html": "<section style=\"font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;color:#3a3a3a;text-align:left;letter-spacing:0;background-color:#ffffff;\">\n<p style=\"margin:30px 0 0;text-align:center;font-size:12px;letter-spacing:.18em;color:#6b4e9e;line-height:22px;background-color:transparent;\">· 家庭教育 ·<\/p>\n\n<p style=\"margin:0 0 24px;padding:16px 18px;border-left:3px solid #6b4e9e;border-radius:8px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:0;background-color:#f7f5fb;\">不少家长把放学那十几分钟当成赶路的空当，脑子里还转着工作，孩子凑过来想说话，一句「作业多不多」就把话头堵了回去。有个做了十几年班主任的老师跟我聊起过，孩子身上那些说不清的急躁和畏缩，往往能在这段路上找到源头。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">真正的教育不在补课表里，在接娃路上那几个不起眼的动作里。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">把这段路拆开看，有四件小事，天天都在发生。你对着这四件对照一下，自家教育的底色是什么，基本就有数了。<\/p>\n<p style=\"margin:18px 0;text-align:center;font-size:12px;line-height:22px;color:#dddddd;letter-spacing:0;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、书包谁背：你替他省的那点力气，正在拿走他的责任<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">校门口最常见的一幕，是大人伸手把书包接过去，孩子空着手走在前面。有个朋友家孩子上三年级，一出校门就把书包塞给奶奶，奶奶腰不舒服那回没法接，孩子当场急了，说书包太重，本来就该大人拿。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">大人觉得顺手帮一把是疼孩子，可书包这件事，本来就是孩子自己上学的本分。事事替他扛，他学不会体谅，也学不会自己的事自己收尾。苏霍姆林斯基讲过，不要把孩子保护起来、不让他劳动，那样会让他失去感恩的心。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">书包没重到压伤肩膀，就让他自己背。特别沉的日子搭把手可以，别天天如此。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">你替他背的是书包，替掉的是他对自己负责的机会。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">书包这件小事看完，再看时间。孩子站在门口等你的那几分钟，比你想的更长。<\/p>\n<p style=\"margin:18px 0;text-align:center;font-size:12px;line-height:22px;color:#dddddd;letter-spacing:0;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、你准不准时：等待在孩子心里，会被放大成很多倍<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">有家长觉得上班脱不开身，晚十几分钟接娃不算什么，孩子在保安室待着而已。我认识的一位妈妈常晚到，孩子起初会踮着脚往路口望，后来就不说话了，接走时也不再问今天有什么好玩的事。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">老师提醒过她：别的孩子都被接走、只剩他一个的时候，孩子会忍不住想，是不是自己不乖，爸妈才不来。大人眼里的一小会儿，在孩子那边是被丢下的感觉。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">安全感不是一句「妈妈爱你」喊出来的，是一次次准时出现攒起来的。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">谁都有临时加班、路上堵车的时候，偶尔迟到不算错，提前打个电话说清楚、见面认真道个歉就行，别把迟到拖成常态。你稳定地出现在校门口，孩子才敢相信：自己是被放在心上的。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">人到了，接下来看嘴。很多人一见面就问学习，把刚才那点踏实又问没了。<\/p>\n<p style=\"margin:18px 0;text-align:center;font-size:12px;line-height:22px;color:#dddddd;letter-spacing:0;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">三、见面第一句问什么：你盯着分数，孩子就关上了话匣子<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">两种家长，接娃路上说出来的话完全不一样。一种一见面就追问：考了吗、有没有挨批、作业多不多，孩子原本想讲班里发生的趣事，话到嘴边又咽了回去，久了干脆不讲。另一种先问今天有没有开心的事、有没有让你得意的小收获，孩子反而主动把考砸的事也说了。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">差别不在你关不关心成绩，而在你先看见分，还是先看见人。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">情绪永远排在成绩前面，审问多了，孩子的心门就关了。<\/strong> 他觉得说了也只会被评判，索性什么都不说。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">换个顺序试试：接到手先聊两句闲的，等他愿意讲了，学习的事自然带得出来。真要问作业，也别在路上连着追问，留到回家坐定再说。你先接住他的话，他才肯把更多的话交给你。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">问话改了，还有一样东西藏不住，就是你的脸色。<\/p>\n<p style=\"margin:18px 0;text-align:center;font-size:12px;line-height:22px;color:#dddddd;letter-spacing:0;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">四、你带着什么情绪来：父母的脸色，就是孩子世界的天气<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不少家长白天累了一天，接到孩子时疲惫全写在脸上，一路叹气、皱眉、抱怨工作烦。孩子敏感，会看你脸色，不敢笑闹，连讲学校的事都挑你心情好时才敢开口。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">有句话说得很准：父母的脸色，就是孩子世界的天气。不是要你时刻情绪完美，大人当然会累，但别把工作里那股火气，倒在放学这段路上。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">孩子不需要一个永远开心的父母，需要一个情绪稳定的家。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">真累了，接到孩子先停一停，深呼吸两口，给他一个拥抱再走。要是确实绷不住，就直说「爸爸今天有点累，缓一会儿再陪你聊」，把情绪说出来，比让孩子猜强。你稳住了，他才敢松下来。<\/p>\n<p style=\"margin:18px 0;text-align:center;font-size:12px;line-height:22px;color:#dddddd;letter-spacing:0;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">结语<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">书包谁背、准不准时、先问什么、带着什么脸色来，这四件小事没一件需要花钱，也没一件要求你是高学历家长，难的只是天天做到。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我自己也是被催着、比着长大的，当了妈之后最怕把这套又搬回自家孩子身上。家长群里比分数、亲戚见面问考第几，我听着都替孩子憋屈。可轮到老大写作业磨蹭，我也忍不住催过，嗓门一高就后悔。说到底，我们都不是天生的好父母，只是在一件件小事里慢慢学着收住自己。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">被人认真看见、被稳稳接住的孩子，心里是有底的。这份底气不靠说教，靠的就是你每天那段接娃路上，肯不肯把手机放一放、把脸色松一松、把第一句问话换一换。今天接孩子的时候，先挑其中一件试试看。<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color atch": "接孩子四个细节", "created": "2026-11-26 10:56", "updated": "2026-11-26 10:56"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>

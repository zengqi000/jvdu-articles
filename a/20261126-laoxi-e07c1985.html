<script id="pageData" type="application/json">{"batch": "60后晚年四篇", "latest": ["20261126-laoxi-e07c1985"], "articles": [{"id": "20261126-laoxi-e07c1985", "title": "60后退休后才懂：日子过得太用力，是跟自己过不去", "plain": "60后退休后才懂：日子过得太用力，是跟自己过不去\n\n咱们这代人，一辈子都在较劲。年轻时拼工作、赶任务，退休了又接力带孙辈、忙家务，天天睁眼就是一摊事，闭眼还惦记着没做完的。人到了五十五岁往后，越是使劲，越觉得一身疲惫。\n\n我后来读到埃克哈特·托利在《当下的力量》里说的那句话，人只有内在宁静了，才能实现觉醒和自我超越，心里忽然就松了一下。原来日子过得太用力，不是勤快，是跟自己过不去。 松不下来的一代人，该学着把劲儿松一松了。\n\n一、身体别太用力，累了就歇口气\n\n这里说的别太用力，不是让你偷懒，是别把身体掏空。感觉累了，就试着松口气，少用点劲儿，慢下来、静下来。\n\n咱们这个岁数，最要让身子骨歇一歇。老公房的张大哥，退休前是车间里的技术员，闲不住，退休后返聘又干了三年，天天早出晚归。有一回体检指标亮了红灯，医生让他必须减负，他这才把返聘辞了，每天早上去公园走半小时，慢慢气色就缓过来了。\n\n说白了，身子是自己的，绷太紧迟早要断。允许一切发生，顺着日子过，不用事事都撑到满分。身体松下来，才扛得住后面的年月。\n\n身体松了，精神也得跟着放一放。\n\n二、精神别太用力，放下才轻松\n\n过去了的事，学着放下。往事如烟，对错都是经历，得失皆是常态，揪着不放，消耗的全是当下的自己。将来的事，交给将来，世事无常，思虑太远，只会徒增烦恼。\n\n我认识一位老同事，姓周，早年评职称错过了两回，退休后还时不时在饭桌上翻出来讲，越讲越憋屈。后来他报名学了书法，每天临两页字帖，注意力慢慢挪到笔尖上，那些陈年旧气也就淡了。他跟我说，字写着写着，心就静了。\n\n专注眼前能做的那件小事，不焦虑没影的未来，精神就有了落脚的地方。人一旦把心思收回当下，紧绷的那根弦自然就松了。\n\n精神松了，心也要学会不较劲。\n\n三、心别太用力，接纳了才自在\n\n心不受力，说到底是不跟自己拧巴。咱们这代人习惯了扛，遇事总想改个结果、争个明白，可很多事，偏偏改不了。\n\n小区里有位刘阿姨，女儿远嫁外地，她起初天天念叨，愁得整夜睡不着。后来她想通了一件事，孩子的路终究要自己走，惦记可以，较劲没必要。她把空出来的心思用在养花看书上，日子反而有了滋味。\n\n这份宁静，无关财富多少，也无关境遇好坏，只看自己的心境。允许一切发生，接纳眼前的日子，顺其自然地过，心就不累了。\n\n我这些年也慢慢改了性子。早先家里大小事我都要问到底、管到底，如今学着该放手就放手。孙辈的事让儿女自己拿主意，我少操一份心，他们反倒更愿意回来跟我商量。人把心放宽了，身边的气氛也跟着松快，日子一天比一天顺。\n\n写在最后\n\n说到底，咱们60后操劳了大半辈子，晚年不该再跟自己较劲。身体松一点，精神松一点，心也松一点，日子反而过得踏实。\n\n各位老哥哥老姐姐，别再用力硬撑了。愿咱们都能把那根紧绷的弦松开，吃好睡好，安安稳稳、舒舒坦坦地把往后的日子过下去。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "咱们这代人，一辈子都在较劲。年轻时拼工作、赶任务，退休了又接力带孙辈、忙家务，天天睁眼就是一摊事，闭眼还惦记着没做完的。人到了五十五岁往后，越是使劲，越觉得一身疲惫。\n\n我后来读到埃克哈特·托利在《当下的力量》里说的那句话，人只有内在宁静了，才能实现觉醒和自我超越，心里忽然就松了一下。原来日子过得太用力，不是勤快，是跟自己过不去。 松不下来的一代人，该学着把劲儿松一松了。\n\n一、身体别太用力，累了就歇口气\n\n这里说的别太用力，不是让你偷懒，是别把身体掏空。感觉累了，就试着松口气，少用点劲儿，慢下来、静下来。\n\n咱们这个岁数，最要让身子骨歇一歇。老公房的张大哥，退休前是车间里的技术员，闲不住，退休后返聘又干了三年，天天早出晚归。有一回体检指标亮了红灯，医生让他必须减负，他这才把返聘辞了，每天早上去公园走半小时，慢慢气色就缓过来了。\n\n说白了，身子是自己的，绷太紧迟早要断。允许一切发生，顺着日子过，不用事事都撑到满分。身体松下来，才扛得住后面的年月。\n\n身体松了，精神也得跟着放一放。\n\n二、精神别太用力，放下才轻松\n\n过去了的事，学着放下。往事如烟，对错都是经历，得失皆是常态，揪着不放，消耗的全是 x;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这里说的别太用力，不是让你偷懒，是别把身体掏空。感觉累了，就试着松口气，少用点劲儿，慢下来、静下来。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">咱们这个岁数，最要让身子骨歇一歇。老公房的张大哥，退休前是车间里的技术员，闲不住，退休后返聘又干了三年，天天早出晚归。有一回体检指标亮了红灯，医生让他必须减负，他这才把返聘辞了，每天早上去公园走半小时，慢慢气色就缓过来了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">说白了，身子是自己的，绷太紧迟早要断。允许一切发生，顺着日子过，不用事事都撑到满分。身体松下来，才扛得住后面的年月。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">身体松了，精神也得跟着放一放。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">二、精神别太用力，放下才轻松<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">过去了的事，学着放下。往事如烟，对错都是经历，得失皆是常态，揪着不放，消耗的全是当下的自己。将来的事，交给将来，世事无常，思虑太远，只会徒增烦恼。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我认识一位老同事，姓周，早年评职称错过了两回，退休后还时不时在饭桌上翻出来讲，越讲越憋屈。后来他报名学了书法，每天临两页字帖，注意力慢慢挪到笔尖上，那些陈年旧气也就淡了。他跟我说，字写着写着，心就静了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">专注眼前能做的那件小事，不焦虑没影的未来，精神就有了落脚的地方。人一旦把心思收回当下，紧绷的那根弦自然就松了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">精神松了，心也要学会不较劲。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">三、心别太用力，接纳了才自在<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">心不受力，说到底是不跟自己拧巴。咱们这代人习惯了扛，遇事总想改个结果、争个明白，可很多事，偏偏改不了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">小区里有位刘阿姨，女儿远嫁外地，她起初天天念叨，愁得整夜睡不着。后来她想通了一件事，孩子的路终究要自己走，惦记可以，较劲没必要。她把空出来的心思用在养花看书上，日子反而有了滋味。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这份宁静，无关财富多少，也无关境遇好坏，只看自己的心境。允许一切发生，接纳眼前的日子，顺其自然地过，心就不累了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我这些年也慢慢改了性子。早先家里大小事我都要问到底、管到底，如今学着该放手就放手。孙辈的事让儿女自己拿主意，我少操一份心，他们反倒更愿意回来跟我商量。人把心放宽了，身边的气氛也跟着松快，日子一天比一天顺。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">说到底，咱们60后操劳了大半辈子，晚年不该再跟自己较劲。身体松一点，精神松一点，心也松一点，日子反而过得踏实。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">各位老哥哥老姐姐，别再用力硬撑了。愿咱们都能把那根紧绷的弦松开，吃好睡好，安安稳稳、舒舒坦坦地把往后的日子过下去。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dddad5;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;li <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

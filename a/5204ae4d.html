<script id="pageData" type="application/json">{"batch": "《兰香如故》", "latest": ["5204ae4d"], "articles": [{"id": "5204ae4d", "title": "《兰香如故》大结局林锦岐51岁去世、韩梁殉忠，为何唯独吕蕺儿结局蕞好", "plain": "《兰香如故》大结局林锦岐51岁去世、韩梁殉忠，为何唯独吕蕺儿结局蕞好\n\n《兰香如故》大结局播完，弹幕里一片意难平。林锦岐早逝，韩梁殉忠，许兰香独自带大3个孩子，个个都让人揪心。可我看完却觉得，真正结局好的，是那个开头谁都没太在意的吕蕺儿。\n\n（刘美含 谭松韵 兰香如故 吕蕺儿 许兰香）\n\n一、她也曾想攀附，直到那块糖把她拉了回来\n\n吕蕺儿是许兰香的发小，刚进林府做丫鬟时，聪慧灵巧，可好胜心太重，一心想攀附林锦岐。那时候她眼里的人生，就是靠着一个有权有势的人往上爬。\n\n可来稿里反复提到一块糖。那是她自己都舍不得吃的糖，她分了一块给许兰香。后来许兰香被赵星棠栽赃陷害，是她记着这份恩，冒着自己安危救了许兰香。\n\n一个人心里有没有情义，不看她说了什么，看她在你落难时肯不肯伸手。 吕蕺儿那块糖，就是她这个人最底色的一笔，她有野心，但她没有丢掉良心。\n\n这份情义，最后也救了她自己。许兰香为了救她才跟林锦岐来到京城，重获自由的吕蕺儿，从此看清了一件事：攀附别人得来的日子，随时可能塌。\n\n二、她带着小蒲自立女户，靠自己把日子过起来\n\n结局里最解气的一幕，是吕蕺儿不再依附任何人。她不依附男人、不攀附豪门，连对她有恩的许兰香也不依附，带着小蒲自立女户，靠着头脑经商谋生。\n\n离别时她和兰香道别：“我好好活，你也给我好好活。”读到这句，我眼眶是热的。这不是客套，是一个终于把命运攥回自己手里的女人，对另一个女人最郑重的承诺。\n\n我有个表姐，前些年离婚，带着孩子回娘家，家里人都劝她赶紧再找一个。她没听，报了个班学做糕点，先在小区群里接单，后来盘了个小店。头一年苦得不行，现在生意稳稳当当。她跟我说过一句话：靠谁都不如靠自己踏实，手里有活干，心里就不慌。\n\n这话搁在吕蕺儿身上，一字不差。她从林府里一个想攀高枝的丫鬟，走到能自己开店、自己拿主意的女户，中间没有一步是别人替她铺好的。她名字里的“蕺”字，是蕺草，又叫鱼腥草，长在田埂沟渠这种阴湿的地方，断了根都能活。像野草一样，生处不论，自成生机，这才是吕蕺儿这个角色真正想说的话。\n\n写在最后\n\n《兰香如故》里，每个人都在做选择，而吕蕺儿的选择最普通，也最珍贵。她没有显赫的身世，没有过人的才情，一开始甚至还有点虚荣。可她一路跌跌撞撞，最后活成了自己的名字。别人的结局是命运的因果，她的结局是自己一手挣来的。 这样的圆满，不轰动，却最踏实，也最配得上那句“我好好活”。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "《兰香如故》大结局播完，弹幕里一片意难平。林锦岐早逝，韩梁殉忠，许兰香独自带大3个孩子，个个都让人揪心。可我看完却觉得，真正结局好的，是那个开头谁都没太在意的吕蕺儿。\n\n（刘美含 谭松韵 兰香如故 吕蕺儿 许兰香）\n\n一、她也曾想攀附，直到那块糖把她拉了回来\n\n吕蕺儿是许兰香的发小，刚进林府做丫鬟时，聪慧灵巧，可好胜心太重，一心想攀附林锦岐。那时候她眼里的人生，就是靠着一个有权有势的人往上爬。\n\n可来稿里反复提到一块糖。那是她自己都舍不得吃的糖，她分了一块给许兰香。后来许兰香被赵星棠栽赃陷害，是她记着这份恩，冒着自己安危救了许兰香。\n\n一个人心里有没有情义，不看她说了什么，看她在你落难时肯不肯伸手。 吕蕺儿那块糖，就是她这个人最底色的一笔，她有野心，但她没有丢掉良心。\n\n这份情义，最后也救了她自己。许兰香为了救她才跟林锦岐来到京城，重获自由的吕蕺儿，从此看清了一件事：攀附别人得来的日子，随时可能塌。\n\n二、她带着小蒲自立女户，靠自己把日子过起来\n\n结局里最解气的一幕，是吕蕺儿不再依附任何人。她不依附男人、不攀附豪门，连对她有恩的许兰香也不依附，带着小蒲自立女户，靠着头脑经商谋生。\n\n离别时她和兰香道别：“我好好活，你也给我好好活。”读到这句，我眼眶是热的。这不是客套，是一个终于把命运攥回自己手里的女人，对另一个女人最郑重的承诺。\n\n我有个表姐，前些年离婚，带着孩子回娘家，家里人都劝她赶紧再找一个。她没听，报了个班学做糕点，先在小区群里接单，后来盘了个小店。头一年苦得不行，现在生意稳稳当当。她跟我说过一句话：靠谁都不如靠自己踏实，手里有活干，心里就不慌。\n\n这话搁在吕蕺儿身上，一字不差。她从林府里 cing:0;background-color:transparent;\">一个人心里有没有情义，不看她说了什么，看她在你落难时肯不肯伸手。<\/strong> 吕蕺儿那块糖，就是她这个人最底色的一笔，她有野心，但她没有丢掉良心。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这份情义，最后也救了她自己。许兰香为了救她才跟林锦岐来到京城，重获自由的吕蕺儿，从此看清了一件事：攀附别人得来的日子，随时可能塌。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCASuAtADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAGZO0d8v0cJL2yWcUvaC8bF2iRyDOtU5B/VOOTXrY65deoccidckcknYNXipuuccm3sHpxx2RXGt7MTjV7Jpx69gpx7eyDjk7RDjk7JF4x/YocYdolcW3tUOOOxbHJR9kpxr+xDi5OxU4h/ZhxK9sHFu7EOId2LJeSTsmJyKdXKcivZIcW7sIjkndPInJp1Tjk16ptvLL1inJp1inJJ1Tzk065sconVrZybesWOSOvF5FnYNNtUT15AQVGRZskCqNbLGjpYlUimgRRZRiK2RHDZZRkgsjGaSNwuB1z9hM3SdFaCqKWNEVVdGsSIgKrUR7EWkcjVe1TMFRKVBac5iw5WgCpCMkSKkM0JJG+wV7NZ5ZjbCSxKwBHspFIxXK20sIMh6oCIMR7owna9KYxzUc6NJZXRKaAi7pFIFZLDMoJ1YNjkQYOQSKdqDxVSMdCI3z/WPQSvVl0ZG4VZ/IGrrydD11KfPqtEdS60DjOpsnVWzStcKjhKQa8BzQRQUTPTSRVGioCiqCKgqVYxquh5s4esrZdO8c8ao6Pz7qmdOAWbYrxEkr4J0cYWNs8HkMemRMsNkTra1kmihHRvHvjcNY5wyGwgx4poEbVejGyyPhSpYBBIZBEcxaakhCSQzETlQz/MvW+R1xwPT+TuJNwPSb5g9nKk6NbZjb4zl/U+NvDN7qtRrsEqWndTn8yY7BiK2Ki2OaqGNueY+jst4X0DzZnsd+jfaRHDaDWxJwPS+YXj6nY4bZMPKm9LY4ztZ0z3ZhS+dOZ6PxlfXH0eTzf0bPpOM7Tg5NHA6Lnt8eog1uJa7Tzn0Dk2O01XxT0qI1qxXlgkVr1h741iR0TxXwPIGPdU5Atr0jUcRCTMYD1Y2x41FJIlhysVXuIUvVeJ528uopZV28Y8zW7Mp9ORZ9TMvEkvOnz9+peXc7dbm3Xt2+ada1RzIOict9OL692mdy+EnomRk88zRuXO/vOlxlyk10eXY6iVb6Mdq3E+htk4Cj6dyGuNzM3ac3sT5eXNdK2KTO+Sm6Xl9cL3FnoTDdSu6ehPOe88zvHuOI2uf1z9R89vRzV/G2qyXG9bRn n:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《兰香如故》里，每个人都在做选择，而吕蕺儿的选择最普通，也最珍贵。她没有显赫的身世，没有过人的才情，一开始甚至还有点虚荣。可她一路跌跌撞撞，最后活成了自己的名字。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">别人的结局是命运的因果，她的结局是自己一手挣来的。<\/strong> 这样的圆满，不轰动，却最踏实，也最配得上那句“我好好活”。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["吕蕺儿把自己都舍不得吃的糖分给许兰香，如果你落难，身边有这样的人吗？", "一心想攀附林锦岐的丫鬟，最后却自立女户经商，你觉得她这个转变可信吗？", "不依附男人、不攀附豪门，连恩人许兰香也不依附，换作是你做得到吗？", "我好好活，你也给我好好活，这句道别如果你是许兰香，听到会是什么心情？", "离婚带娃回娘家，被人劝赶紧再找一个却不听，你身边有这种硬气的女人吗？", "蕺草长在阴湿沟渠断了根都能活，你觉得用这种野草比喻吕蕺儿贴切吗？", "好胜心重、有点虚荣的人，最后活成了自己，你还记得身边谁有过这种变化？", "同为爱许兰香的人，韩梁殉忠林锦岐早逝，为什么唯独吕蕺儿结局好？", "结局人人意难平，你觉得编剧把最好的结局给吕蕺儿，是想说什么？", "靠谁都不如靠自己踏实，手里有活干心里就不慌，你认同这句话吗？"], "batch": "《兰香如故》", "created": "2026-11-17 19:39", "updated": "2026-11-17 19:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

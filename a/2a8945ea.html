<script id="pageData" type="application/json">{"batch": "《兰香如故》", "latest": ["2a8945ea"], "articles": [{"id": "2a8945ea", "title": "《兰香如故》大结局：吕蕺儿的圆满，跟嫁人一点关系都没有", "plain": "《兰香如故》大结局：吕蕺儿的圆满，跟嫁人一点关系都没有\n\n全剧最隆重的一场婚礼给了穿红衣的人，可最稳的一条命，是没穿红衣的那个姑娘自己挣的。\n\n年末大雪，沈嘉兰和林锦岐补上了当年缺的合卺礼，没有圣旨，也没有逼迫，两个满身旧伤的人把余下的日子交给了对方。就在这场婚礼前后，另一个人的去处也定了下来：吕蕺儿带着小蒲离开林府，自立女户，靠自己做买卖谋生。临别时她跟兰香说，我好好活，你也给我好好活。\n\n《兰香如故》｜古装剧｜据「心田上的栀子白」剧评整理\n\n一、她的转身不是因为想通了，是手里有了吃饭的本事\n\n吕蕺儿刚进林府的时候，心思全在攀附上。她是兰香的发小，人也灵巧，就是一心想往林锦岐身边站。这样的人在剧里往往被写成笑话，可编剧留了一笔：她自己舍不得吃的一块糖，掰了一块给兰香。后来她被赵星棠栽赃，是兰香救了她一条命；兰香落难时，她也豁出去救过一回。\n\n真正让她拐弯的，不是哪一句点醒的话，是她离开林府之后能自己挣饭吃了。手里有本钱、有脑子、有能搭伙的小蒲，她才敢不依附男人，也不依附那个救过她、她也救过的兰香。觉醒听着响亮，可一个人敢不敢走，先看她饿不饿得着。 心气谁都有，本事不是谁都有，光有心气的人走不出那扇门。\n\n女性角色在戏里最容易被写成一件事的附属品，要么是谁的女儿，要么是谁的妻子。吕蕺儿最后那一步的可贵，是她把自己从这些身份里挪了出来，成了「吕蕺儿」三个字本身。依附不是人品问题，是账本问题，账上没钱的时候，谁都没有底气说不。\n\n二、欠着的人情，不必拿一辈子去还\n\n她身上还有一层更难写的东西。那块糖、那两条命，她记得清清楚楚，可她没把自己赔进去抵账。放在很多戏里，这样的姑娘该留在恩人身边当一辈子帮手，端茶递水，随叫随到，还要说这是情义。\n\n我大三那年跑回镇上的雨衣厂实习，第一个月拿了五千块，成了厂里最年轻的设计师。毕业时厂里想留我，我婉拒了，心里就一个念头，先去大城市闯闯。为这事我妈念叨了小半年，说人家待你不薄。我心里明白那是好意，可把感激换成一辈子留在原地，这买卖谁算都亏。 那五千块我一直记得，不是数目大，是它第一次让我知道，我这张画图纸的手能换饭吃。\n\n还有一件事容易被看轻：她是带着小蒲一起自立女户的。那时候一个姑娘另立门户，不是一个好听的名目，是要自己应付差役、自己撑起一整个门户，多带一个人就多一张嘴、多一份担子。她自己刚站稳就肯拉一个，说明她算的不是划不划算，是这个人能不能一起往前走。\n\n吕蕺儿说「我好好活，你也给我好好活」，这话不是客套。能自己活的人说出的祝福，才有分量。 她名字里那个「蕺」是蕺草，鱼腥草，阴湿泥土里长出来的野草，踩一脚还长。这种草不需要谁给它搭架子。\n\n写在最后\n\n戏里把最大的圆满给了那场雪中的合卺礼，可我记住的是另一条路。有人把日子交给一个人，有人把日子拿回自己手里，两条都不是错。 只是后一条更硬气，因为它不靠谁点头。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "全剧最隆重的一场婚礼给了穿红衣的人，可最稳的一条命，是没穿红衣的那个姑娘自己挣的。\n\n年末大雪，沈嘉兰和林锦岐补上了当年缺的合卺礼，没有圣旨，也没有逼迫，两个满身旧伤的人把余下的日子交给了对方。就在这场婚礼前后，另一个人的去处也定了下来：吕蕺儿带着小蒲离开林府，自立女户，靠自己做买卖谋生。临别时她跟兰香说，我好好活，你也给我好好活。\n\n《兰香如故》｜古装剧｜据「心田上的栀子白」剧评整理\n\n一、她的转身不是因为想通了，是手里有了吃饭的本事\n\n吕蕺儿刚进林府的时候，心思全在攀附上。她是兰香的发小，人也灵巧，就是一心想往林锦岐身边站。这样的人在剧里往往被写成笑话，可编剧留了一笔：她自己舍不得吃的一块糖，掰了一块给兰香。后来她被赵星棠栽赃，是兰香救了她一条命；兰香落难时，她也豁出去救过一回。\n\n真正让她拐弯的，不是哪一句点醒的话，是她离开林府之后能自己挣饭吃了。手里有本钱、有脑子、有能搭伙的小蒲，她才敢不依附男人，也不依附那个救过她、她也救过的兰香。觉醒听着响亮，可一个人敢不敢走，先看她饿不饿得着。 心气谁都有，本事不是谁都有，光有心气的人走不出那扇门。\n\n女性角色在戏里最容易被写成一件事的附属品，要么是谁的女儿，要么是谁的妻子。吕蕺儿最后那一步的可贵，是她把自己从这 4nTTpLud9/wlhBGH3EUsviuaZtwcqPSvPk+81Wx0rlnE9CELI6mbxNNxlzVc+IWPrmuYn6rSJ2qIStLQZvNr91khTge9ZOpajc3FqwZuO/41C3Wq13/x6yfhXXGbbsxPY8+uj/pRxXtuiApp0LnklAPzrxC4/wCPo/UV7jpP/ILh/wB0VrmS/dnpeGEm8fVv5/kwuRub6VmsmT1rTn+8aoHrXgH6zifiYwDbjJ6U+U8YFNbpSy/0oOSWxnv6mhP50SdKSPtTR5lWT5rEx4pV70h60q1ZUGG2h+SKdSHqKTN6m6JY0HXPStCNscCqMdXY6g78BJ7F3fgdKjd9w6Up6CoqaPYk/dZyuuZ+3xnP3lU1tWuPJXmsbXf+P6D/AK5rWva/6pa7K+yPgcvk/b1Uf//Z\" alt=\"《兰香如故》剧照\"><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">全剧最隆重的一场婚礼给了穿红衣的人，可最稳的一条命，是没穿红衣的那个姑娘自己挣的。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">年末大雪，沈嘉兰和林锦岐补上了当年缺的合卺礼，没有圣旨，也没有逼迫，两个满身旧伤的人把余下的日子交给了对方。就在这场婚礼前后，另一个人的去处也定了下来：吕蕺儿带着小蒲离开林府，自立女户，靠自己做买卖谋生。临别时她跟兰香说，我好好活，你也给我好好活。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《兰香如故》｜古装剧｜据「心田上的栀子白」剧评整理<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、她的转身不是因为想通了，是手里有了吃饭的本事<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">吕蕺儿刚进林府的时候，心思全在攀附上。她是兰香的发小，人也灵巧，就是一心想往林锦岐身边站。这样的人在剧里往往被写成笑话，可编剧留了一笔：她自己舍不得吃的一块糖，掰了一块给兰香。后来她被赵星棠栽赃，是兰香救了她一条命；兰香落难时，她也豁出去救过一回。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">真正让她拐弯的，不是哪一句点醒的话，是她离开林府之后能自己挣饭吃了。手里有本钱、有脑子、有能搭伙的小蒲，她才敢不依附男人，也不依附那个救过她、她也救过的兰香。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">觉醒听着响亮，可一个人敢不敢走，先看她饿不饿得着。<\/strong> 心气谁都有，本事不是谁都有，光有心气的人走不出那扇门。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">女性角色在戏里最容易被写成一件事的附属品，要么是谁的女儿，要么是谁的妻子。吕蕺儿最后那一步的可贵，是她把自己从这些身份里挪了出来，成了「吕蕺儿」三个字本身。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">依附不是人品问题，是账本问题，账上没钱的时候，谁都没有底气说不。<\/strong><\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、欠着的人情，不必拿一辈子去还<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">她身上还有一层更难写的东西。那块糖、那两条命，她记得清清楚楚，可她没把自己赔进去抵账。放在很多戏里，这样的姑娘该留在恩人身边当一辈子帮手，端茶递水，随叫随到，还要说这是情义。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我大三那年跑回镇上的雨衣厂实习，第一个月拿了五千块，成了厂里最年轻的设计师。毕业时厂里想留我，我婉拒了，心里就一个念头，先去大城市闯闯。为这事我妈念叨了小半年，说人家待你不薄。我心里明白那是好意，可<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">把感激换成一辈子留在原地，这买卖谁算都亏。<\/strong> 那五千块我一直记得，不是数目大，是它第一次让我知道，我这张画图纸的手能换饭吃。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">还有一件事容易被看轻：她是带着小蒲一起自立女户的。那时候一个姑娘另立门户，不是一个好听的名目，是要自己应付差役、自己撑起一整个门户，多带一个人就多一张嘴、多一份担子。她自己刚站稳就肯拉一个，说明她算的不是划不划算，是这个人能不能一起往前走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">吕蕺儿说「我好好活，你也给我好好活」，这话不是客套。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">能自己活的人说出的祝福，才有分量。<\/strong> 她名字里那个「蕺」是蕺草，鱼腥草，阴湿泥土里长出来的野草，踩一脚还长。这种草不需要谁给它搭架子。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">戏里把最大的圆满给了那场雪中的合卺礼，可我记住的是另一条路。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">有人把日子交给一个人，有人把日子拿回自己手里，两条都不是错。<\/strong> 只是后一条更硬气，因为它不靠谁点头。<\/p>\n<p style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《兰香如故》", "created": "2026-11-16 09:27", "updated": "2026-11-16 09:27"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

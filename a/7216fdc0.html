<script id="pageData" type="application/json">{"batch": "《多喜一家人》", "latest": ["7216fdc0"], "articles": [{"id": "7216fdc0", "title": "《多喜一家人》原著真敢写！赛多喜走后，赛家五个孩子集体开挂了", "plain": "《多喜一家人》原著真敢写！赛多喜走后，赛家五个孩子集体开挂了\n\n老爷子一闭眼，那几个不成器的孩子反倒一个个支棱起来了，这才是《多喜一家人》原著结局最狠的一笔。\n\n《多喜一家人》 原著大结局 赛家五兄妹 家庭群像\n\n我读原著那几天，正好赶上项目收尾，天天加班到很晚，回家往沙发上一躺就翻手机看这段。赛多喜刚走，家里人围着吃饭，藤椅空着，旁边搁一杯没喝完的黄酒。就这个画面，我盯着看了好一会儿。\n\n一、一辈子受气的老大，凭什么活成了最后那个稳的人\n\n五个孩子里，我最先看到的是大儿子赛秀明。这人前半生活脱脱一个受气包。\n\n做生意被人拖欠货款，妻儿在家里等他，他连个准信都给不了；因为一场烂桃花，跟妻子闻佳音闹离婚；最要命的是为救那个“情人”，让人连捅两刀，血喷出来那一刻，他脑子里想的还是“告诉妻子看好孩子”。看到这儿我差点把手机摔了，真是又气又心疼。\n\n可原著偏偏不让他就这么窝囊下去。他老婆闻佳音是个狠角色，一边当烘焙店副总，一边把家里那摊乱事收拾得井井有条。两个人最后用一个刚出生的孩子，把摔碎的镜子重新拼了回去。\n\n一个人真正的翻身，从来不是靠谁突然开窍，而是身边有个不肯撒手的人。\n\n这就说到我自己了。我大专毕业赶上疫情刚起步，去南昌跑销售，那会儿天天在外头漂泊，货款被拖、客户变卦是常事，压力大得睡不好。那时候我女友在永修村小教书，我俩两地跑，靠追剧打发赶路和等车的时间。有阵子我特别像赛秀明，觉得日子怎么努力都攥不住。后来我发现，让我撑过来的不是哪笔单子做成了，是身边那个人一直在，把我的乱日子一点点理顺。就像闻佳音对赛秀明，真正救他的不是那两刀之后的幡然醒悟，是那个始终没走的人。\n\n所以我不觉得赛秀明的开挂有多玄乎。一个被生活打趴下过的人，只要身边有人拉一把、自己又肯接住这份好，慢慢就能直起腰。这个道理放在剧里成立，放在我们这些普通人的日子里，也一样。\n\n二、老爷子留的不是钱，是让一家人重新坐下来的理由\n\n再往下读，你会发现赛家真正的变化，不是谁发了财、谁升了职，而是这一家人散了又聚。\n\n老二赛秀亮，亲妈被家暴跳河，他从小阴郁，长成工作狂律师，结果为朋友担保欠一屁股债，还查出晚期肝癌。为了不拖累戏曲演员杨美帆，硬着心肠逼离婚，逼得人家坐到天台护栏外面。最后老丈人捐肝、妹夫主刀，命捡回来了。这一段看得人揪心，可你细想，一个男人肯用命去推开爱人，背后是“我配不上你”的疼。\n\n所谓家人，就是吵到翻脸、散到天涯，最后还是肯坐回一张桌子的那群人。\n\n三儿子赛秀河月光族，找了个比自己大十岁的女上司郝质华，丈人局长把女儿关三楼拆了梯子，他硬是靠一场地震救援感动了对方；小女儿赛千金被宠成“龙女”，二十岁嫁给大十岁的豪门医生金景然，吃醋离了婚，打工才发现老板是前夫，地震里前夫为救她受伤，两人又在病房复婚；最让人心疼的小儿子赛秀利，亲妈卷钱跑路，他自卑到离家出走，考医学院成了金景然校友。\n\n这些孩子，个个都被生活按在地上摩擦过。可赛多喜一走，他们没散，反而拧成了一股绳。端午那顿饭，藤椅空着，黄酒没动，大家照旧热闹地吃。我读到这儿突然明白了：老爷子留下的不是什么家产，是一个让全家还能坐下来的理由。人走了，那把椅子还在，这家人就还是一家人。\n\n写在最后。我后来回乡进了码头农发，过上朝九晚五的日子，把写剧评做成了长期爱好。再看《多喜一家人》这个结局，我越来越觉得它写的不是豪门恩怨，就是我们这些普通人的家。吵吵闹闹一辈子，真到那一天，坐下来一起吃顿饭，就都过去了。那杯没人喝的黄酒，才是这篇文章真正的眼泪。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "老爷子一闭眼，那几个不成器的孩子反倒一个个支棱起来了，这才是《多喜一家人》原著结局最狠的一笔。\n\n《多喜一家人》 原著大结局 赛家五兄妹 家庭群像\n\n我读原著那几天，正好赶上项目收尾，天天加班到很晚，回家往沙发上一躺就翻手机看这段。赛多喜刚走，家里人围着吃饭，藤椅空着，旁边搁一杯没喝完的黄酒。就这个画面，我盯着看了好一会儿。\n\n一、一辈子受气的老大，凭什么活成了最后那个稳的人\n\n五个孩子里，我最先看到的是大儿子赛秀明。这人前半生活脱脱一个受气包。\n\n做生意被人拖欠货款，妻儿在家里等他，他连个准信都给不了；因为一场烂桃花， UJnBNk5+KqmIRqGVzE5yzdN0Zum+b5z8+Zy8GmbM2/48Y2+XyaPBth/hCTgTT/AJfLweCbJp4ybQ0f/wAP/9k=\" alt=\"封面\"><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">老爷子一闭眼，那几个不成器的孩子反倒一个个支棱起来了，这才是《多喜一家人》原著结局最狠的一笔。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《多喜一家人》 原著大结局 赛家五兄妹 家庭群像<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我读原著那几天，正好赶上项目收尾，天天加班到很晚，回家往沙发上一躺就翻手机看这段。赛多喜刚走，家里人围着吃饭，藤椅空着，旁边搁一杯没喝完的黄酒。就这个画面，我盯着看了好一会儿。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、一辈子受气的老大，凭什么活成了最后那个稳的人<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">五个孩子里，我最先看到的是大儿子赛秀明。这人前半生活脱脱一个受气包。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">做生意被人拖欠货款，妻儿在家里等他，他连个准信都给不了；因为一场烂桃花，跟妻子闻佳音闹离婚；最要命的是为救那个“情人”，让人连捅两刀，血喷出来那一刻，他脑子里想的还是“告诉妻子看好孩子”。看到这儿我差点把手机摔了，真是又气又心疼。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">可原著偏偏不让他就这么窝囊下去。他老婆闻佳音是个狠角色，一边当烘焙店副总，一边把家里那摊乱事收拾得井井有条。两个人最后用一个刚出生的孩子，把摔碎的镜子重新拼了回去。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一个人真正的翻身，从来不是靠谁突然开窍，而是身边有个不肯撒手的人。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这就说到我自己了。我大专毕业赶上疫情刚起步，去南昌跑销售，那会儿天天在外头漂泊，货款被拖、客户变卦是常事，压力大得睡不好。那时候我女友在永修村小教书，我俩两地跑，靠追剧打发赶路和等车的时间。有阵子我特别像赛秀明，觉得日子怎么努力都攥不住。后来我发现，让我撑过来的不是哪笔单子做成了，是身边那个人一直在，把我的乱日子一点点理顺。就像闻佳音对赛秀明，真正救他的不是那两刀之后的幡然醒悟，是那个始终没走的人。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCALQBDgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAejDPT8wQwAaCmSIsWrADALEUsZapYbqlNQM5tlzULEkLq1MrLAhlohgWBzIQWhJKkkELMtZcqIYCGIsYKIQSLIYoRwBQBCLDFJhiQwEkJEFWSuBklyJJBKSx4oHNJyuNJLK4hY9Dl8qlWSuJZK5Vkri2KomnCCL5WbXiEeCEAgSCQQQSCRHUWNKAaVWWhGjQkaCxpCLaNYqlgFjwSPAR4JHiJDBY0VFsVIxaEMkEgtR1a2LAEobmI4VAyIYCGGAhiQyZpIKrJKkkHIKkgqIwBDALYogIFjQWNIBMpY8EjQEMgSQkMFjSljQWPGEDiqpZFqlkkqNhiuWhKg0ELEEaaLGgsIJIZYHCJGkCOt2Iq23tneLJW4WVoAIIysQEAklSSAIiOVKmCQYIEEXnJApiSx4sVTFzXap1MEsMkJJIkkqSFQYQSRYJGZJIkkALH0zjRUIxZFhMokhJIJIbSYZJCGjIEcoVcrAqQKpAGkIykMERopVlZRSDAggYJUIIZIkkCSIEtCCasOW9HkilWVKpINIWZFmq0EIsCFkYaLIJSDgNbWtoaqNpitmYQkgMIsMJCRZYFSEIsaSgyEhgJIkglkkgqulggi6EuTKksFIBsaSEkkSSEZWumkIgYIJILJIkEHZJYyyBkhBFoxIjxYpMMEgjiAZSqiLB2qYdQVEkCGCAFSQRWggyssKYRZIGCajQGVitSP5TL5HHXfRjbG9lCrNDbz3t9Rt8Ylx9Z2fHvVax7Uq2uTEBgBF0slcGIcEeFcaQsaLHQ2PFiua2V4sgxYrlCSCDRIWKAskCMVkNFK2KAEBR4DcyQgjkSPCkLKMBGkXOSBBzTFulZq2Vy2wVwtFcLZWxCGkVoVWGAIFMAGQqhXVAljUldBoJolLrYtYSytFRjUi3tltNL1PNNAEcRRgosYqZWgMCRVYq1oMBCoRjWabw/a8FntmptXh2W1LmjXpmZQIlAGWrGidj6F8k6e+P1OUat+elL01mmWmkeMNJIAMmgrykjSyRiqx5CB65SQahBWCQgWWWCSJJFGS/m5lm3iW512Di0F9UorUMlEu23mW2dNsS6m2ceZdSPN5SOQBxJWLAlVdlZLKbbXkiySIAYggCO1LLc1DVYqhpgAEVhGUyRBaKrcuLGgseE       ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

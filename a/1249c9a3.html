<script id="pageData" type="application/json">{"batch": "《玫瑰战争》", "latest": ["1249c9a3"], "articles": [{"id": "1249c9a3", "title": "《玫瑰战争》陈豪续约传天价、高海宁带货当一姐，TVB换了把尺子量人", "plain": "《玫瑰战争》陈豪续约传天价、高海宁带货当一姐，TVB换了把尺子量人\n\n陈豪续约的传闻里，带着一个让人咋舌的天价。另一边，高海宁靠着内地带货，坐上了一姐的位置。\n\n这两条消息，比《玫瑰战争》四个主演一百九十三岁更值得琢磨。它明明白白地告诉你：TVB衡量演员的尺子换了。以前量的是演技资历，现在量的是变现能力和确定性。尺子一换，很多看不懂的事就都看懂了。\n\n一、从演技到变现，这把尺子是怎么换的\n\n回到《玫瑰战争》。陈豪演娱乐大亨，马国明演身份暧昧的弟弟，杨茜尧演复仇大女主，林夏薇是视后。四个人加起来一百九十三岁，弹幕齐刷刷地问：TVB是不是没人了。\n\n先承认这193岁不是凑数的。陈豪是最稳的一线男主，马国明手里好几部待播剧，杨茜尧刚凭《黑色月光》杀回来，林夏薇是视后。把这几个人塞进台庆剧，图的是下限扎实。\n\n有句评论一针见血：这套阵容下限扎实，上限有限。它不会崩，可也很难冒出一个让人非看不可的意外。陈豪的戏路、杨茜尧的复仇、马国明的暧昧，全是验证过无数遍的安全选项。\n\n为什么不敢冒险？因为账不允许。2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人全年工作不到三十天。连年亏损，合拍剧成了救命稻草，可内地资方认的港剧就是这几张熟脸，没人肯拿几千万去赌一个陌生名字。\n\n闭环就此扣上：产量缩，新人没机会，靠熟脸守收视，熟脸继续占位，新人更没机会。193岁不是病因，是症状。尺子也是在这里换掉的，当一个演员的价值越来越靠确定的收益来算，选人标准就必然向熟脸倾斜。陈豪的天价续约、高海宁的带货一姐，都是这把尺子量出来的结果。\n\n二、被尺子量住的人，和被自己放过的自己\n\n我今年也到了会琢磨这把尺子的年纪。走过一地鸡毛的婚姻，经历过婆媳矛盾、育儿焦虑、职场内耗，慢慢学会把重心放回自己身上。我做软件测试，工资不高但稳定，早些年也做过一千八一个月的平面设计。这一路我算明白一件事：一个人被怎么衡量，很大程度上决定了他敢怎么活。\n\n杨茜尧这次的复仇大女主，就是个被尺子量住的人。她凭《黑色月光》杀回来，靠的是实打实的观众缘，这份底气是自己一场场戏熬出来的。可翻红之后，递到她手上的还是复仇这类安全本子。\n\n这就是熟龄女演员的处境：你的经验终于值钱了，市场也肯给你位置了，可它肯给你的，偏偏只是你已经被验证过的那一面。你想换个活法，代价可能就是丢掉这份刚挣来的安全感。是继续被反复点名，还是换一次不确定的突破，这道题没有标准答案。她的犹豫，比任何一句独立的口号都真实。\n\n身边太多姐妹在感情里吃亏。有人为了孩子把自己耗干，有人怕失去就一直忍着妥协。我从不劝人硬怼，也不灌鸡汤，只慢慢懂了：一个人值不值得，不该只由别人的尺子量。\n\n写在最后\n\n193岁不该被当成笑话，也不该被当成勋章。它只是一张账单，记着一家电视台把赌注压在熟脸上的选择。人还在，只是那个愿意慢慢练新人的耐心没了。\n\n用已知的安全换一个不确定的未来，很聪明，也很无奈。我如今更喜欢把日子过成自己的样子，手里的尺子，量自己的心就好。\n\n可怕的不是193岁。可怕的是，下一个一百九十三岁，不知道谁来凑，也不知道还有没有耐心，去等一个新人慢慢长成。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "陈豪续约的传闻里，带着一个让人咋舌的天价。另一边，高海宁靠着内地带货，坐上了一姐的位置。\n\n这两条消息，比《玫瑰战争》四个主演一百九十三岁更值得琢磨。它明明白白地告诉你：TVB衡量演员的尺子换了。以前量的是演技资历，现在量的是变现能力和确定性。尺子一换，很多看不懂的事就都看懂了。\n\n一、从演技到变现，这把尺子是怎么换的\n\n回到《玫瑰战争》。陈豪演娱乐大亨，马国明演身份暧昧的弟弟，杨茜尧演复仇大女主，林夏薇是视后。四个人加起来一百九十三岁，弹幕齐刷刷地问：TVB是不是没人了。\n\n先承认这193岁不是凑数的。陈豪是最稳的一线男主，马国明手里好几部待播剧，杨茜尧刚凭《黑色月光》杀回来，林夏薇是视后。把这几个人塞进台庆剧，图的是下限扎实。\n\n有句评论一针见血：这套阵容下限扎实，上限有限。它不会崩，可也很难冒出一个让人非看不可的意外。陈豪的戏路、杨茜尧的复仇、马国明的暧昧，全是验证过无数遍的安全选项。\ nd-color:transparent;\">这两条消息，比《玫瑰战争》四个主演一百九十三岁更值得琢磨。它明明白白地告诉你：TVB衡量演员的尺子换了。以前量的是演技资历，现在量的是变现能力和确定性。尺子一换，很多看不懂的事就都看懂了。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、从演技到变现，这把尺子是怎么换的<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">回到《玫瑰战争》。陈豪演娱乐大亨，马国明演身份暧昧的弟弟，杨茜尧演复仇大女主，林夏薇是视后。四个人加起来一百九十三岁，弹幕齐刷刷地问：TVB是不是没人了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">先承认这193岁不是凑数的。陈豪是最稳的一线男主，马国明手里好几部待播剧，杨茜尧刚凭《黑色月光》杀回来，林夏薇是视后。把这几个人塞进台庆剧，图的是下限扎实。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">有句评论一针见血：这套阵容下限扎实，上限有限。它不会崩，可也很难冒出一个让人非看不可的意外。陈豪的戏路、杨茜尧的复仇、马国明的暧昧，全是验证过无数遍的安全选项。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">为什么不敢冒险？因为账不允许。2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人全年工作不到三十天。连年亏损，合拍剧成了救命稻草，可内地资方认的港剧就是这几张熟脸，没人肯拿几千万去赌一个陌生名字。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">闭环就此扣上：产量缩，新人没机会，靠熟脸守收视，熟脸继续占位，新人更没机会。193岁不是病因，是症状。尺子也是在这里换掉的，当一个演员的价值越来越靠确定的收益来算，选人标准就必然向熟脸倾斜。陈豪的天价续约、高海宁的带货一姐，都是这把尺子量出来的结果。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、被尺子量住的人，和被自己放过的自己<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我今年也到了会琢磨这把尺子的年纪。走过一地鸡毛的婚姻，经历过婆媳矛盾、育儿焦虑、职场内耗，慢慢学会把重心放回自己身上。我做软件测试，工资不高但稳定，早些年也做过一千八一个月的平面设计。这一路我算明白一件事：一个人被怎么衡量，很大程度上决定了他敢怎么活。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">杨茜尧这次的复仇大女主，就是个被尺子量住的人。她凭《黑色月光》杀回来，靠的是实打实的观众缘，这份底气是自己一场场戏熬出来的。可翻红之后，递到她手上的还是复仇这类安全本子。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这就是熟龄女演员的处境：你的经验终于值钱了，市场也肯给你位置了，可它肯给你的，偏偏只是你已经被验证过的那一面。你想换个活法，代价可能就是丢掉这份刚挣来的安全感。是继续被反复点名，还是换一次不确定的突破，这道题没有标准答案。她的犹豫，比任何一句独立的口号都真实。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">身边太多姐妹在感情里吃亏。有人为了孩子把自己耗干，有人怕失去就一直忍着妥协。我从不劝人硬怼，也不灌鸡汤，只慢慢懂了：一个人值不值得，不该只由别人的尺子量。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">193岁不该被当成笑话，也不该被当成勋章。它只是一张账单，记着一家电视台把赌注压在熟脸上的选择。人还在，只是那个愿意慢慢练新人的耐心没了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">用已知的安全换一个不确定的未来，很聪明，也很无奈。我如今更喜欢把日子过成自己的样子，手里的尺子，量自己的心就好。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">可怕的不是193岁。可怕的是，下一个一百九十三岁，不知道谁来凑，也不知道还有没有耐心，去等一个新人慢慢长成。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《玫瑰战争》", "created": "2026-11-16 20:37", "updated": "2026-11-16 20:37"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

换个说法，段虎那场吃饭的戏也是一个道理。《无贼》里他坐在桌边，筷子夹得心不在焉，眼睛四处瞟，一会儿看门口，一会儿看旁桌的包。我当时不认识这个角色，只凭这几眼就猜他不是正经人，后来一查，果然演的是个惯偷。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">吃饭不专心，是因为他心里另有一件更要紧的事在做。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">戏对不对，不看他动了多少，看他动在了哪儿。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">这就带出第二层追问：为什么同样是吃饭，有人演出来像纪录片，有人演出来像摆姿势？<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">差别不在表情多少，在于有没有先把人物的信息量算明白。段虎知道自己是贼，知道这顿饭随时会被打断，所以坐不住；吴不平知道女儿在别人手上，知道自己一出声就完了，所以连咀嚼都不敢用力。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">情绪是结果，处境才是参数。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">我们行里有一条规矩，开发把东西做完，不经过测试不许直接交给业务去验收。有一年合作方图快，跳过了这道，第一天验收，点哪哪报错，业务当场就不干了。当时我就在现场做软件测试，一句一句解释，人家根本不听。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">没验过的东西不能交，没算清的情绪不能演。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">有些表演的问题，恰恰是跳了这一步。上来先给一个悲伤的眼神，再配一句压低的声音，至于这个人为什么悲伤、悲伤之前刚经历了什么，全不管。观众看着别扭，说不出哪儿错，其实错的是顺序。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">张国强五十七岁，在这部戏里戏份不算多。他把吴不平的信息量算得很准：能说什么，不能说什么，说完之后谁会更危险。所以那碗馄饨端在手里，观众不需要旁白，自己就替他把前因后果补齐了。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#2f4b7c;letter-spacing:.02em;border-top:1px solid #dfe4ee;border-bottom:1px solid #dfe4ee;background-color:transparent;\">好演员不是把戏演满，是把该留的地方留空，让别人填得进去。<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">写到这儿，我反倒不太想说“演技”这个词了。它听着像一门玄学，其实就是把人物此刻的处境一层层拆开，再一样一样地放回动作里。拆得越细，观众越信。<\/p>\n<p style=\"margin:34px 0 16px;font-size:18px;line-height:1.55;font-weight:800;color:#2f4b7c;border-left:0;text-align:center;letter-spacing:.08em;background-color:transparent;\">最后想说<\/p>\n<p style=\"margin:0 0 20px;font-size:16.5px;line-height:1.9;color:#2b2f36;text-align:justify;letter-spacing:0;background-color:transparent;\">这几年被夸上天的表演不少，能让人记住一个吃饭动作的不多。记住它，不是因为动作有多难，是因为它替一个父亲把说不出口的话咽了下去。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dfe4ee;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAF9A4QDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAA     return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

in:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">闻佳音是那个灶台前的嫂子。蒋欣这一回几乎不施粉黛，衣服素净，背着大黑袋子走街串巷送货挣零碎钱，在家不是守灶台就是做手工、收拾屋子。见人先笑，话没出口腰先弯，听说公公要搬出去，她红着眼眶问是不是自己哪里没做好，关起门才敢数落丈夫没用。四十三岁的她脸庞圆润，透着一股过日子的烟火气，让人愿意顺着她的眼睛去看这个家。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">杨美帆是那位酒店里的客人。娘家条件好，在电视台当主持正当红，是老三嘴里的千金大小姐。大嫂往工地上跑的那会儿，她在健身房练身材，每次露面从头发丝到鞋尖都一丝不乱。杨采钰五官立体，不说话自带一股清冷的贵气，跟公公说话嘴角挂着笑，眼神里却一点温度都没有。她开口闭口“你们赛家”，这四个字画了一条线，自己不掺和赛家的事，也不让赛家的人伸手进她的日子。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">一个满手是活、心里装着一家老小，一个精致疏离、心里只装自己。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">长相用对了，一张脸就是一个人在家里的位置，扎了根的还是借住的，观众一眼分清。<\/strong><\/p>\n\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、她的精明是被日子逼出来的<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">都说闻佳音爱算计，可看一看她身边那个男人就懂了。丈夫是个直肠子，公公话里的好赖都听不出来，更不会张嘴多要一点工钱，家里买菜做饭、闺女补课的钱样样都要她张罗。她要是不精明一点，这个家的日子根本转不动，那点算计说穿了是给一家人找活路。蒋欣以前演人物泼辣、嗓门大、眼神冲，这一回全收了起来，争得脸红脖子粗，看着也像在护自家的东西，没有半分要伤人的意思。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">看到这儿我想起自己刚回永新那几年。我从深圳辞了职回来包山坡办农场，第一批只敢进二十只羊，天天天不亮起来喂料、清圈、巡塘。有一回圈舍漏水，我一个晚上起来堵了三回，天亮时浑身是泥，蹲在塘埂上啃冷馒头。我不觉得苦，反倒踏实，因为这是我自己的选择，跟在深圳写字楼里朝九晚五、日子安逸却总觉得少了点什么，完全不一样。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一个人肯弯下腰把日子过实，不是她天生会低头，是她认准了要守的东西。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">往深里看，这两个女人其实都在守住自己认准的东西。闻佳音把自己活成这个家的底，用算计和弯腰换一家老小的安稳；杨美帆用一句“你们赛家”把自己护在门外，不让这大家子的算盘把自己吞进去。一个在里头撑，一个在外头守，谁也没比谁轻松。剧里没把她们写成谁好谁坏，这份体谅，比吵一架好看多了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">女演员长相重要吗？要紧的是和角色贴不贴。蒋欣要是收拾得太漂亮，闻佳音的委屈就没人信；杨采钰要是演得太亲和，杨美帆那份隔阂就立不住。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">两个人都肯把自己放到角色后头，观众看到的才是赛家的两个儿媳，而不只是两张明星脸。<\/strong>眼下赛多喜病了，一直站在门外的杨美帆还能不能守住那条线，值得往下看。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAIWAykDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgMAAQQFBgf/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfjlEIpV2ymjs1hiyz9GFLlc29S7zuisAgyDqriIdmyxEgqwaiUUCjqAItoF0QMqQQu6gXJAMlwbYJoBGxQZoUaGXAq6gd3kdjkgN1YXJAti2AVXYL35dIes05NgxKWKqLmjDzl3Fm24UQjlS1Vm0qmNcTeTNvWGWmhCCopkGU0FjGilQIVRhCRAuEkO76j5z1HPsgBrkZca+aKfnERCykzSQ9fOvMa8NbgnjdHBGMtYEMg4cMLqCFVdhHLtFPoAgwR3BFF3UZUuBUgtFYkBWMGRichGtoJTtzizUQUSXA7nI7HHC5UArogjF2Bmkw09Pm9Mffel4VV80EedIoqaa2qwydLmApFrJfoysT1uxam2LghAsEUpqmlCYAEkZJIlZrjTbA2ApoqlixaXQ9j4DuVPqYJ0vmKtAOB3Jf0YmjTl2ySuncnUJMXLoWplmu6CroxlIIrqUF3RjoxY       label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

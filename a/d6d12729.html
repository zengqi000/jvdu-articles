<script id="pageData" type="application/json">{"batch": "《玫瑰战争》", "latest": ["d6d12729"], "articles": [{"id": "d6d12729", "title": "《玫瑰战争》四个主演加起来一百九十三岁，这不是荣耀，是一张被反复点名的旧名单", "plain": "《玫瑰战争》四个主演加起来一百九十三岁，这不是荣耀，是一张被反复点名的旧名单\n\n55岁的陈豪，52岁的马国明，47岁的杨茜尧，39岁的林夏薇。《玫瑰战争》一开播，弹幕刷得最凶的不是剧情，是这四个数字的总和：一百九十三岁。\n\n于是那句老话又被搬出来：TVB是不是真的没人了。\n\n他们不是撑不住的一批人，恰恰是太撑得住了。撑到每次要拿一部剧压阵，名字就还是这几个。\n\n《玫瑰战争》是台庆剧，陈豪演娱乐大亨，杨茜尧演复仇大女主，马国明演身份暧昧的弟弟，林夏薇坐镇视后。四个角色，全是他们闭眼也不会出错的戏路。\n\n一、被反复点名的，从来是同一批人\n\n先别急着说TVB凉了。这193岁不是凑数的。\n\n陈豪是它最稳的一线男主，马国明手里攥着好几部待播剧，杨茜尧刚凭《黑色月光》杀回来，林夏薇是现役视后。把这几个人塞进台庆剧，图的是一个字：稳。\n\n稳听着是夸，其实是道紧箍。有评论说得很准，这套阵容下限扎实，上限有限。它不会崩，可也很难给你一个非看不可的意外。\n\n我做过几年销售，太懂这种下限逻辑。公司里业绩最稳那个人，永远第一个被派去啃最难的客户，不是偏爱他，是交给他最省心。省心久了，他就成了默认名单上的第一个名字，别人想顶都顶不上去。\n\n杨茜尧这次的复仇大女主，戏路她太熟了，熟到观众一看就放心。可我看着她那张冷静的脸，想到的不是她演得好，而是她又一次被放进了最安全的位置。一个女演员凭复仇角色翻红，翻红后接的还是复仇角色，这条线看着漂亮，其实是原地打转。她的底气是自己一场场戏挣来的，可挣来之后，能用她的地方反被这个标签圈死了。\n\n二、撑得住的人，没人问过他们累不累\n\n真正让我心里一沉的，是另一组数字。\n\n2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人全年工作不到三十天。离巢潮最凶时平均三天走一个，郭晋安、胡定欣、黄宗泽这批视帝视后集体转身。\n\n人不是突然消失的，是留下的人也没多少戏可拍。一个演员怎么长成能扛剧的人？靠几十部剧磨，靠几百集露脸，靠在片场被老戏骨手把手教走位。这套流水线，TVB现在养不起了。以前新人不行，旁边还有廖启智、罗兰兜着；现在兜底的人走了，年轻人要么在长寿情景剧里被定型，要么干脆没工开。训练班还在，可训练之后那个练字，空了。\n\n我住宿舍那几年见过一模一样的事。室友里有个特别能扛的姑娘，谁的活儿没人接，最后都落到她头上。大家都夸她靠谱，夸了两年，可没人问过她想不想一直扛，更没人想过，活儿全给她了，别人就永远学不会。她后来慢慢拎清了边界，不是不帮忙，是不再默认接下所有烂摊子。那一刻我明白，一个系统总依赖同一个靠谱的人，其实是在偷懒。\n\n陈豪续约传言里的天价，高海宁靠内地带货坐上一姐，指向同一件事：TVB量演员的尺子，已经从演技资历换成了变现能力。闭环就此扣上，193岁不是病因，是症状。\n\n写在最后\n\n所以TVB到底没人了吗。人还在，只是那个把新人养成能扛剧之人的系统，停摆了。\n\n《玫瑰战争》的193岁，是生存压力下的选择：拿已知的安全，换一个不确定的未来。聪明，也无奈。聪明在它守住了收视和广告；无奈在等陈豪、马国明这批人真演不动那天，手里可能还是没有下一张能打的牌。\n\n193岁并不可怕。可怕的是，下一个一百九十三岁，我不知道该由谁来凑。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "55岁的陈豪，52岁的马国明，47岁的杨茜尧，39岁的林夏薇。《玫瑰战争》一开播，弹幕刷得最凶的不是剧情，是这四个数字的总和：一百九十三岁。\n\n于是那句老话又被搬出来：TVB是不是真的没人了。\n\n他们不是撑不住的一批人，恰恰是太撑得住了。撑到每次要拿一部剧压阵，名字就还是这几个。\n\n《玫瑰战争》是台庆剧，陈豪演娱乐大亨，杨茜尧演复仇大女主，马国明演身份暧昧的弟弟，林夏薇坐镇视后。四个角色，全是他们闭眼也不会出错的戏路。\n\n一、被反复点名的，从来是同一批人\n\n先别急着说TVB凉了。这193岁不是凑数的。\n\n陈豪是它最稳的一线男主，马国明手里攥着好几部待播剧，杨茜尧刚凭《黑色月光》杀回来，林夏薇是现役视后。把这几个人塞进台庆剧，图的是一个字：稳。\n\n稳听着是夸，其实是道紧箍。有评论说得很准，这 >\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、被反复点名的，从来是同一批人<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">先别急着说TVB凉了。这193岁不是凑数的。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">陈豪是它最稳的一线男主，马国明手里攥着好几部待播剧，杨茜尧刚凭《黑色月光》杀回来，林夏薇是现役视后。把这几个人塞进台庆剧，图的是一个字：稳。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">稳听着是夸，其实是道紧箍。有评论说得很准，这套阵容下限扎实，上限有限。它不会崩，可也很难给你一个非看不可的意外。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我做过几年销售，太懂这种下限逻辑。公司里业绩最稳那个人，永远第一个被派去啃最难的客户，不是偏爱他，是交给他最省心。省心久了，他就成了默认名单上的第一个名字，别人想顶都顶不上去。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">杨茜尧这次的复仇大女主，戏路她太熟了，熟到观众一看就放心。可我看着她那张冷静的脸，想到的不是她演得好，而是她又一次被放进了最安全的位置。一个女演员凭复仇角色翻红，翻红后接的还是复仇角色，这条线看着漂亮，其实是原地打转。她的底气是自己一场场戏挣来的，可挣来之后，能用她的地方反被这个标签圈死了。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、撑得住的人，没人问过他们累不累<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">真正让我心里一沉的，是另一组数字。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">2025年TVB全年只拍了九部自制及合拍剧，十年最低，千禧年初一年二十部。七成签约艺人全年工作不到三十天。离巢潮最凶时平均三天走一个，郭晋安、胡定欣、黄宗泽这批视帝视后集体转身。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">人不是突然消失的，是留下的人也没多少戏可拍。一个演员怎么长成能扛剧的人？靠几十部剧磨，靠几百集露脸，靠在片场被老戏骨手把手教走位。这套流水线，TVB现在养不起了。以前新人不行，旁边还有廖启智、罗兰兜着；现在兜底的人走了，年轻人要么在长寿情景剧里被定型，要么干脆没工开。训练班还在，可训练之后那个练字，空了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我住宿舍那几年见过一模一样的事。室友里有个特别能扛的姑娘，谁的活儿没人接，最后都落到她头上。大家都夸她靠谱，夸了两年，可没人问过她想不想一直扛，更没人想过，活儿全给她了，别人就永远学不会。她后来慢慢拎清了边界，不是不帮忙，是不再默认接下所有烂摊子。那一刻我明白，一个系统总依赖同一个靠谱的人，其实是在偷懒。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">陈豪续约传言里的天价，高海宁靠内地带货坐上一姐，指向同一件事：TVB量演员的尺子，已经从演技资历换成了变现能力。闭环就此扣上，193岁不是病因，是症状。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">所以TVB到底没人了吗。人还在，只是那个把新人养成能扛剧之人的系统，停摆了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《玫瑰战争》的193岁，是生存压力下的选择：拿已知的安全，换一个不确定的未来。聪明，也无奈。聪明在它守住了收视和广告；无奈在等陈豪、马国明这批人真演不动那天，手里可能还是没有下一张能打的牌。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">193岁并不可怕。可怕的是，下一个一百九十三岁，我不知道该由谁来凑。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《玫瑰战争》", "created": "2026-11-16 20:37", "updated": "2026-11-16 20:37"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>

补品都实在。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">一、少吃一口，七分饱最养人<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">朋友聚会推杯换盏，大鱼大肉吃得尽兴，回家胃胀反酸，血压血糖也跟着往上蹿，这样的经历咱们六十岁上下的人多半有过。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">很多小毛病，就是吃出来的。那些长寿老人吃饭有个共同点，粗茶淡饭七分饱，尤其晚饭吃得少。少吃不是减肥，更不是饿肚子，是学会怎么吃。深加工的东西少碰，高油高盐高糖的少沾，丢了那股遇见爱吃的就停不下筷子的惯性。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我到现在还记得年轻时在厂里上三班倒，食堂的菜油水重，顿顿吃得满嘴流油，那时不当回事。人老了才明白，嘴里那一口贪，到老是要拿身子还的。每餐留三分余地，肠胃轻松，浑身通畅。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">吃得少了，话也得跟着少。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">二、少说两句，守口就是守身<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">中医有句话，日出千言，其气必伤。话讲多了，最耗气血。一天下来嘴没停，嗓子哑了，情绪也跟着乱。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">别人的家长里短不掺和，为一点小事争得面红耳赤更犯不着。少抱怨、少抬杠、少在背后论人长短，把嘴管住，就是护住了自己的精气神。你会发现话少了，注意力不被杂事牵着走，情绪稳了，夜里睡得安稳，气色一天天好起来。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">守口不是憋着不说话，是别把力气耗在无谓的争执上。该说的话一句不含糊，不该说的，咽回去，身子反倒舒坦。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">嘴管住了，交友也得挑一挑。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">三、交友少一点，三两知己就够<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">人到晚年，不用挤进哪个圈子凑热闹。朋友求精不求多，三两个相处不累的，就够受益。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">低质量的热闹，远不如一个人在家喝茶浇花来得自在。那些总消耗你的关系，该断就断。有些人凑在一起，不是比谁过得舒心，就是背着你说长道短，散场之后心里更堵。与其这样，不如把时间留给真正谈得来的老伙计，下下棋、遛遛弯，简简单单。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我退休后也慢慢把圈子缩小了，如今常来往的就那么几位，反倒谈得来、处得久。人老了，热闹是别人的，舒服才是自己的。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">朋友少了，家里的东西也该清一清。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">四、少囤点物，给日子腾出空间<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">咱们这代人从苦日子里过来，什么东西都舍不得扔。旧衣服留着，纸箱空瓶攒着，超市打折的洗洁精、卫生纸一箱箱往家囤。东西越堆越多，占的不只是屋子，看着心里也堵。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">定期把用不上的旧物件清一清，该扔就扔，能捐就捐。屋里收拾得亮堂，心也跟着敞亮，过日子都觉得轻快。我头些年也舍不得丢东西，柜子塞得满满当当，后来狠心清了两回，屋里一下松快了，找东西也不再翻半天。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">人老了才慢慢明白，养生从来不是做加法，而是做减法。少吃几口，肠胃轻松；少说几句，情绪不耗；少交些没用的朋友，心里不累；少囤些没用的杂物，空间不挤。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">咱们60后的晚年，不必买昂贵的补品，也别硬撑着过度锻炼，把这四少踏踏实实落到日子里，就是给自己最好的养护。往后的日子轻装上阵，把晚年过得舒坦自在，比什么都强。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dddad5;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAIfBQADASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAABAUCAwYBAAcI/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB+Y83STjkXn0QTKsRQ1z2s6GlHNrbramPMo1HKQY2105l2GZLu11S93R65RSy5QVjUyzQFd/Rn5dzndrYrGINPQNs6+5s5LroqsuYIR3bdG2echrJQjpN7lDbK17DOaLjyS1iEGcNsp7zOFUgPU3ZViEGhVsLLzjX703RfGqaEHkbFTpsvx10EeTUZNASRpIuryn0vPLNZbWqo5l3Tl9JqIFNDS8QCE61fz3X7zTUSFxOwf6l8r6KbrDmvPTXJ/Wcn7EfLwd+x5T5512qgVsCNtzvA8YgFaLWYgfnpt870pHbnrVXF/FafUphuiNHosS35nsvk30H5l2XCrxvqaBbLJfXiLMEtXzAl0Rc1VA7 <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>

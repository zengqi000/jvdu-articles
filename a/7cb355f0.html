<script id="pageData" type="application/json">{"batch": "《伟大的长征》", "latest": ["7cb355f0"], "articles": [{"id": "7cb355f0", "title": "《伟大的长征》大结局：会师时那个拥抱，抱的是没走到的人", "plain": "《伟大的长征》大结局：会师时那个拥抱，抱的是没走到的人\n\n一支队伍能走到陕北，靠的不只是腿，是有人始终记着身边少了一个谁。\n\n会宁会师那场戏，朱总司令看见毛主席，眼圈就红了，几步跑过去抱住他，两个人谁也没先说话。衣服破得看不出原来的颜色，脸被风吹得发黑，可抱在一起那一刻，眼睛是亮的。\n\n红一、红二、红四方面军三大主力在会宁会合，等于把散在几千里地的几路人重新接上。剧里没让谁发表感言，镜头就停在两双裂了口子的手上。真正走过的人，话都很少。\n\n这段之前，剧里先滚过一串数字：出发时二十二万人，会师时只剩五万上下，中间折了近十七万。中央红军八万六千人出发，到陕北只剩七千多。六百多场战斗，四十多座高山，近百条江河，总行程六万五千里。\n\n《伟大的长征》｜革命历史剧｜大结局\n\n一、十七万不是一句感慨，是十七万个再没回家的人\n\n剧里没把十七万人都拍出来，只挑了记住的几个：方志敏、瞿秋白、陈树湘，还有那个把狗娃子当亲儿子养、最后留在草地上的老郭。他自己都吃不饱，还是把口粮分给孩子，走到草地上把命留下了，孩子活着出去。一个大数字只能让人震一下，一个名字才让人疼。\n\n更让我在意的是这支队伍对人的那点在意。前头的人倒下，后头的人把枪捡起来，也把名字记下来；谁走散了有人回头找，谁伤重了有人抬。这些事在长征路上不算壮举，是每天的日常。队伍不是靠口号连起来的，是靠「这个人还在」连起来的。 会师那一下之所以动人，就是因为两个人抱住的不是一个胜利，是一个还在的老伙计。\n\n民企那几年，厂里来了个刚毕业的小孩，被组里老人支使着跑杂活，连流程都没人教。我看着不落忍，把自己记流程的旧本子给了他，告诉他哪几步容易卡住。人落到难处，最想要的不是安慰，是有人肯把他当个人。 后来他干得不错，那本子又传给了下一个新人。\n\n二、记住一个人的名字，比记住一个数字难得多\n\n大结局最用心的一笔，是没有把牺牲拍成背景。四渡赤水、飞夺泸定桥这些仗打得漂亮，戏里也给足了镜头，可它没停在痛快上，紧跟着就写代价：湘江边上、土城那一仗，倒下去的人有多少连名字都没留下。\n\n十七万这个数说出来只要两秒，真正做起来是每一天都有人替别人挡在前面。用数字记人，人就成了账；用名字记人，人才留在世上。 所以他们的结局不是打赢了，是有人记得他们为什么出发。\n\n剧里那句气量大如海、意志坚如钢，说的是总司令，我倒觉得整支队伍都配得上这八个字。走到最后的人，不是最能打的，是最肯把别人的那份重量也算进自己那一份里的。一群人能成事，往往是因为没人只想着自己那点路。 现在回头看，长征留下的不只是路程和战果，还有一种做人的法子。\n\n写在最后\n\n会师那天的太阳很好，两个人抱在一起，谁都没提那些没走到的人。可他们心里清楚，这个拥抱是替所有人领的。 记住十七万，不是记住一个数字，是记住从哪儿来的。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "一支队伍能走到陕北，靠的不只是腿，是有人始终记着身边少了一个谁。\n\n会宁会师那场戏，朱总司令看见毛主席，眼圈就红了，几步跑过去抱住他，两个人谁也没先说话。衣服破得看不出原来的颜色，脸被风吹得发黑，可抱在一起那一刻，眼睛是亮的。\n\n红一、红二、红四方面军三大主力在会宁会合，等于把散在几千里地的几路人重新接上。剧里没让谁发表感言，镜头就停在两双裂了口子的手上。真正走过的人，话都很少。\n\n这段之前，剧里先滚过一串数字：出发时二十二万人，会师时只剩五万上下，中间折了近十七万。中央红军八万六千人出发，到陕北只剩七千多。六百多场战斗，四十多座高山，近百条江河，总行程六万五千里。\n\n《伟大的长征》｜革命历史剧｜大结局\n\n一、十七万不是一句感慨，是十七万个再没回家的人\n\n剧里没把十七万人都拍出来，只挑了记住的几个：方志敏、瞿秋白、陈树湘，还有那个把狗娃子当亲儿子养、最后留在草地上的老郭。他自己都吃不饱，还是把口粮分给孩子，走到草地上把命留下了，孩子活着出去。一个大数字只能让人震一下，一个名字才让人疼。\n\n更让我在意的是这支队伍对人的那点在意。前头的人倒下，后头的人把枪捡起来，也把名字记下来；谁走散了有人回头找，谁伤重了有人抬。这些事在长征路上不算壮举，是每天的日常。队伍不是靠口号连起来的，是靠「这个人还在」连起来的。 十七万。中央红军八万六千人出发，到陕北只剩七千多。六百多场战斗，四十多座高山，近百条江河，总行程六万五千里。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《伟大的长征》｜革命历史剧｜大结局<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、十七万不是一句感慨，是十七万个再没回家的人<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">剧里没把十七万人都拍出来，只挑了记住的几个：方志敏、瞿秋白、陈树湘，还有那个把狗娃子当亲儿子养、最后留在草地上的老郭。他自己都吃不饱，还是把口粮分给孩子，走到草地上把命留下了，孩子活着出去。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一个大数字只能让人震一下，一个名字才让人疼。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">更让我在意的是这支队伍对人的那点在意。前头的人倒下，后头的人把枪捡起来，也把名字记下来；谁走散了有人回头找，谁伤重了有人抬。这些事在长征路上不算壮举，是每天的日常。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">队伍不是靠口号连起来的，是靠「这个人还在」连起来的。<\/strong> 会师那一下之所以动人，就是因为两个人抱住的不是一个胜利，是一个还在的老伙计。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">民企那几年，厂里来了个刚毕业的小孩，被组里老人支使着跑杂活，连流程都没人教。我看着不落忍，把自己记流程的旧本子给了他，告诉他哪几步容易卡住。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">人落到难处，最想要的不是安慰，是有人肯把他当个人。<\/strong> 后来他干得不错，那本子又传给了下一个新人。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、记住一个人的名字，比记住一个数字难得多<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">大结局最用心的一笔，是没有把牺牲拍成背景。四渡赤水、飞夺泸定桥这些仗打得漂亮，戏里也给足了镜头，可它没停在痛快上，紧跟着就写代价：湘江边上、土城那一仗，倒下去的人有多少连名字都没留下。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">十七万这个数说出来只要两秒，真正做起来是每一天都有人替别人挡在前面。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">用数字记人，人就成了账；用名字记人，人才留在世上。<\/strong> 所以他们的结局不是打赢了，是有人记得他们为什么出发。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">剧里那句气量大如海、意志坚如钢，说的是总司令，我倒觉得整支队伍都配得上这八个字。走到最后的人，不是最能打的，是最肯把别人的那份重量也算进自己那一份里的。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一群人能成事，往往是因为没人只想着自己那点路。<\/strong> 现在回头看，长征留下的不只是路程和战果，还有一种做人的法子。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">会师那天的太阳很好，两个人抱在一起，谁都没提那些没走到的人。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">可他们心里清楚，这个拥抱是替所有人领的。<\/strong> 记住十七万，不是记住一个数字，是记住从哪儿来的。<\/p>\n<p style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《伟大的长征》", "created": "2026-11-16 09:39", "updated": "2026-11-16 09:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>

<script id="pageData" type="application/json">{"batch": "《谷雨》", "latest": ["159f6856"], "articles": [{"id": "159f6856", "title": "《谷雨》收官，严平安的“辞职”是假的，薛凝的“温柔”才是真刀子", "plain": "《谷雨》收官，严平安的“辞职”是假的，薛凝的“温柔”才是真刀子\n\n所有人都盯着严平安摔警服那一下，可我看到的是薛凝端着牛奶走进房间的那一秒，那才是全剧最冷的一刀。\n\n《谷雨》大结局那晚我一口气刷到最后，弹幕全在讨论严平安的辞职到底是真是假。说实话我也被那身摔在副驾的警服唬了一下，可越往后看越觉得，真正让我后背发凉的，是那个看起来好得不像话的女人薛凝。\n\n一、她把温柔做得太真，真到没人舍得怀疑\n\n欧阳煦事业跌到谷底那阵子，薛凝出现了。温柔体贴，不嫌弃他，还主动提出一起去北京发展。一个事业有成的女强人，凭什么在一个男人最落魄的时候死心塌地，我当时就琢磨，要么她图感情，要么她图别的。剧情往下走，答案慢慢浮出来，她是曹亦新的人。\n\n薛凝这枚棋子最狠的地方，是她从来不演坏。她对欧阳煦的好是真的好，煲汤、陪聊、帮他捋案子，连欧阳煦自己都说你比我妈还操心。可恰恰是这份真，最要命。曹亦新需要一个稳住欧阳煦的人，因为欧阳煦太轴，软硬不吃，收买不了也吓不退，正面攻不破，就从侧面渗。薛凝的任务分两层，一层情感拉拢，让他在疲惫时有地方靠，一层监视，他见了谁、查了什么、手里攥着什么牌，都得一五一十传回去。\n\n她不需要追问，欧阳煦的反应本身就是情报。\n\n那杯热牛奶那段我看了两遍。欧阳煦半夜接完匿名电话脸色铁青，薛凝端着牛奶进来轻声问怎么了，他说没事，她就不问了，只把手搭在他肩上。镜头给到她低垂的眼睛，那里头没有心疼，只有盘算。一个女人把温柔练到这个份上，是把自己活成了一把没有刀刃的刀子，捅进去的时候，对方还在感动。\n\n二、被安排的人，最后分得清自己站在哪一边吗\n\n我不太想简单地骂薛凝一句心机女。她做的事伤害是实打实的，欧阳煦把心掏出来给她看，她把这份信任过了秤卖钱，这没什么好洗白的。可我更在意的是另一个问题：一个被曹亦新安插进去的人，她到底有多少选择的余地。\n\n我自己是学画的，从南昌大学的美术系出来，大三跑回镇上雨衣厂实习，毕业没留，一个人跑来义乌打工。这些年见过身边人被催婚、被比较、被家里安排人生，我自己也经历过，所以我特别受不了那种拿别人的标准套人的事。刚工作那阵我攒了很久的钱，就想买人生第一台相机，我哥说你一个女孩子买那玩意儿干嘛，不如存着。我当时没吵，就是没听。因为我很清楚，要是连这种小事都让别人替我拿主意，往后就得一直被人安排下去。所以看薛凝的时候，我忍不住想，她最初接过这个任务的时候，是不是也跟自己说过就这一回，后来一回变两回，两回变无数回。\n\n有些路，迈出第一步就回不了头，被推着走的人最难的不是使坏，是忘了自己原本想去哪。\n\n这就是严平安和薛凝最不一样的地方。严平安每一步都是自己选的，主动往火坑里跳，跳之前还自己浇一桶油；薛凝每一步都是被人推着走的，坐在棋盘后方，手指头都不沾灰，可每一根线都从她手里过。一个明着堕落，一个暗着奉献，说到底都是同一个问题的两种解法，当对手比你强大太多，你拿什么去撬那块铁板。曹亦新背后七把保护伞，明面上冲锋的欧阳煦被叫草芥，硬碰硬碎的只能是自己。我无意替薛凝开脱，只是觉得，一个女人就算是被推着走到这一步，她也该在某一个瞬间问自己一句，这到底是不是我想要的。\n\n写在最后\n\n严平安的隐忍和薛凝的伪装，看着是两条路，其实都在回答同一个问题：人这辈子，不怕站在哪一边，就怕不知道自己站在哪一边。大结局散场了，严平安那身警服到底穿没穿回去，剧没明说，薛凝最后有没有把自己捞出来，也没交代。我倒觉得这个留白挺好，生活里我们未必能像电视剧那样把线理得那么清，但至少可以像我攒钱买相机那样，在每一个能自己拿主意的当下，别轻易把决定权交出去。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "所有人都盯着严平安摔警服那一下，可我看到的是薛凝端着牛奶走进房间的那一秒，那才是全剧最冷的一刀。\n\n《谷雨》大结局那晚我一口气刷到最后，弹幕全在讨论严平安的辞职到底是真是假。说实话我也被那身摔在副驾的警服唬了一下，可越往后看越觉得，真正让我后背发凉的，是那个看起来好得不像话的女人薛凝。\n\n一、她把温柔做得太真，真到没人舍得怀疑\n\n欧阳煦事业跌到谷底那阵子，薛凝出现了。温柔体贴，不嫌弃他，还主动提出一起去北京发展。一个事业有成的女强人，凭什么在一个男人最落魄的时候死心塌地，我当时就 er-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">她不需要追问，欧阳煦的反应本身就是情报。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">那杯热牛奶那段我看了两遍。欧阳煦半夜接完匿名电话脸色铁青，薛凝端着牛奶进来轻声问怎么了，他说没事，她就不问了，只把手搭在他肩上。镜头给到她低垂的眼睛，那里头没有心疼，只有盘算。一个女人把温柔练到这个份上，是把自己活成了一把没有刀刃的刀子，捅进去的时候，对方还在感动。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAFyA2YDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYAAQf/xAAaAQADAQEBAQAAAAAAAAAAAAABAgMABAUG/9oADAMBAAIQAxAAAAH5P7H3p5+jPtoe2RGiQU3db3wBiB0xBactgx2K3LXaSMU6E1dEWepme6WecWrc+zY4hgj3514p6uJ3o8y+4/ZbYXYlw7PjpOqyXX45169tTm0erzGpmleTeZdeot5dfgAj1NQZQ4yuiNSDhjG82HTkuqgTE4eg/iVnztvi6t73vC3lsb9mNNIx3tdkNqfbaxun08STVzBW0+o+f/XIzUyfyXlQ2NFBFOY1vze22t+NbUZquo5aEsMftDJRVQCzM3GXKQ+ZZmopjwawmxQfQRnukxRTLqeyVCHaZpVUG0EEXOH0E5JRuPbfKzLR5XRZGK5iEh+bdb1miXo9KlPn3m8UU5kAGpzbCo1OSGa+oxsfoeo+R/QYPpFT8/jtXl9RNafPligT1vP2K1aNqeh+1xuYMQNM96Me+Oc0WR9EZwiN5/U1uZ03JDCTWy7PJ0TH57bl0i5YXn2EMjPJq6c+Krt6VrvdFx+W6vm7MzJvW5mPR9CSRl/OC4NfkaW73uU+e3FYhcfHAWk0fGPs7cB5e341GDkKzPTZU6baKtDT0+eREQfp5F4HlXL6JznOOaTfa757LRO13zvTYqV9tPVzW/R/mRHP0a1Rn7JWbZhquYD1kUB+rtrB897ifPJQU+2WGFY1tlJVqSu9ldg9w2rZH9Y9armus52nfn+l1aGWcOylD6YunPku14xGdvaMcuccF3KWh6NVzWh9S+EsXI4Li56URcicdkyzQIb8sqZSuljgWc+vSwkz574mTOp+hnIWiPQvouC7vCuNGsZbYQiHIYLLJ9BQftSVXEqzqcrFdvEtOTKnZ9sdtDc7oE2bwb7PFpedzNK+tltYdYQtAKjqdl0SLsBIM4LgedCgrmBF2Klqsdgx4uDyBAbg9PHkajq0tbpAr7cbLO7vMTspf5w2iWj3QrAbysd 的。可我更在意的是另一个问题：一个被曹亦新安插进去的人，她到底有多少选择的余地。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我自己是学画的，从南昌大学的美术系出来，大三跑回镇上雨衣厂实习，毕业没留，一个人跑来义乌打工。这些年见过身边人被催婚、被比较、被家里安排人生，我自己也经历过，所以我特别受不了那种拿别人的标准套人的事。刚工作那阵我攒了很久的钱，就想买人生第一台相机，我哥说你一个女孩子买那玩意儿干嘛，不如存着。我当时没吵，就是没听。因为我很清楚，要是连这种小事都让别人替我拿主意，往后就得一直被人安排下去。所以看薛凝的时候，我忍不住想，她最初接过这个任务的时候，是不是也跟自己说过就这一回，后来一回变两回，两回变无数回。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">有些路，迈出第一步就回不了头，被推着走的人最难的不是使坏，是忘了自己原本想去哪。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这就是严平安和薛凝最不一样的地方。严平安每一步都是自己选的，主动往火坑里跳，跳之前还自己浇一桶油；薛凝每一步都是被人推着走的，坐在棋盘后方，手指头都不沾灰，可每一根线都从她手里过。一个明着堕落，一个暗着奉献，说到底都是同一个问题的两种解法，当对手比你强大太多，你拿什么去撬那块铁板。曹亦新背后七把保护伞，明面上冲锋的欧阳煦被叫草芥，硬碰硬碎的只能是自己。我无意替薛凝开脱，只是觉得，一个女人就算是被推着走到这一步，她也该在某一个瞬间问自己一句，这到底是不是我想要的。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAHhA2wDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAABAgMFBgcI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAHyBnbWHSYEkgTs4JJDUmuTvLqKy6rOw47qcOjX8577htObI9L819MvH0KgwHhqUoKom8HHJQQTUEE1BBNmTJJkOSZS3TODpkDvF0J2QSeLhJM7HeLhJ2cbvF0SeLhJJA7xkDuzDd6oMJQlyLkkN1FwkouDvFBJ4uElFwdkmOmTHSQ0kkJKIIZAwUDgRHqEhTRo0ukrihSW5SggYe2oVFBkBRkosrqQgfPyS9blSSBJIE7IHdppyJV06yKoLy6IbePp56bnGdPzVZA nt,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["欧阳煦事业最低谷的时候薛凝突然出现，温柔体贴还主动要去北京，换成是你，你会不会也一头栽进去？", "那杯热牛奶我看了两遍，薛凝手搭在欧阳煦肩上、眼睛却低垂着，那里面真的一点心疼都没有，太冷了。", "我盯着她低垂的眼睛看了好久，突然有点分不清，她那份好到底有几分是真的，几分是演的。", "一个事业有成的女强人，凭什么在男人最落魄时死心塌地，你们觉得她是图感情，还是图别的？", "欧阳煦把心掏给她看，她转手就把信任过了秤卖钱，这算不算全剧最不动声色的一刀？", "我特别想问，被曹亦新安插进去的薛凝，她到底有多少选择余地，一句心机女就够了吗？", "就这一回、再一回，一回变无数回，你们身边有没有这种一步步被推着走到回不了头的人？", "薛凝和严平安，一个被推着走一个自己选，如果是你站在棋盘上，你更怕当哪一个？", "结尾没交代薛凝最后有没有把自己捞出来，你们觉得这是留白还是偷懒，第二部该不该补这笔？", "我攒钱买相机那点小事都被家里念叨，薛凝被安排了一整部剧，看着真不是滋味，你们那儿这种事多吗？"], "batch": "《谷雨》", "created": "2026-11-19 09:39", "updated": "2026-11-19 09:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

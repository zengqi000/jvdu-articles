<script id="pageData" type="application/json">{"batch": "能养出学霸的，往往是这5类家庭", "latest": ["20261126-pangniudexinhao-10b51d2e"], "articles": [{"id": "20261126-pangniudexinhao-10b51d2e", "title": "学霸不是天生的，家里这五件事做到位，普通孩子也能有后劲", "plain": "学霸不是天生的，家里这五件事做到位，普通孩子也能有后劲\n\n不少家长一提学霸，脑子里先蹦出三个词：脑子灵、家底厚、爹妈学历高。我认识一位带毕业班的班主任，她说起过一件让她自己都意外的事：班里后劲最足的几个孩子，家境都普通。孩子之间慢慢拉开的那段距离，很多是在家里的日常里一点点攒出来的。\n\n这话不是要把焦虑再往家长身上压一层。天赋和家底改不了，可家里那几件天天在做的小事，是普通家庭真能自己攥在手里的。今天就照着五类家庭的做法，一样样拆开给你看。\n\n一、家里少点吼，孩子的心先稳下来\n\n考砸一次，有的家里气氛立刻绷紧，大人嗓门一高，孩子整晚都不敢吭声。大人也许说完就忘了，孩子却会翻来覆去想一晚上。\n\n人心里揣着火，脑子里就装不进题。孩子光顾着看大人的脸色，错题就没心思去琢磨了。越是这种时候，越得先把火压住。\n\n分数出来，先别急着追问，坐下来一起翻卷子，看看错在哪一步。我早年在厂里画过一阵图，一张稿子被师傅退回好多回，急也没用，只能一笔一笔改到他点头为止。孩子的学习也是这个理，气顺了，思路才回得来。大人稳一寸，孩子就敢往前一步。\n\n情绪这关过了，再看家里另一种看不见的东西：大人自己平时是什么样。\n\n二、大人自己也在往前走，孩子才不觉得学习是苦差\n\n下班回家往沙发上一瘫，手机刷到半夜，转头却催孩子去看书。孩子嘴上不说，心里的账却记得清楚。\n\n学习这件事，孩子看的是大人怎么做，不是听大人怎么讲。你说一百遍要用功，抵不上他自己看见你晚上也在翻书、在处理手头的事。\n\n说白了，不用爹妈有多高的学问。晚上自己翻两页书、把白天没做完的事接着做完，孩子看久了，会觉得用功本来就是这个家本来的样子。家里有股向上的劲儿，学习就不用天天挂在嘴上催。碰上他不会的题，还可以反过来请他讲给你听，他讲一遍，比你讲三遍都管用。\n\n氛围有了，还得给责任找个落处，不能大人一直盯着。\n\n三、大方向定好，剩下的交还给孩子\n\n有的家长把盯作业当成了日常，每道题都要过目，本子翻一遍，连手机也要查一查。一天下来，大人和孩子都累。\n\n可盯得越紧，孩子越觉得学习是给大人干的活，自己反倒像个局外人。大人一松手，他就彻底撂下了。\n\n不如先把睡觉、写作业的时段和底线定清楚，至于具体怎么排、先做哪一样，让孩子自己拿主意。家里可以跟孩子商量着定几条约定，写作业的时间段、手机每天能玩多久，都白纸黑字写下来，大人也得照着办。规矩不双标，孩子才肯认。时间自己排过、后果自己扛过，这份本事才是能带走的。\n\n把主动权交回去之后，还有个托底的东西，就是日子过得有没有规律。\n\n四、作息稳、小事常做，后劲才托得住\n\n有的孩子靠熬夜堆时间，白天上课反倒犯困，题刷了一堆，成绩不见起色。看着很努力，其实是把本钱透支了。\n\n脑子要转得动，得先有稳定的作息打底，这不是多报一个班能替的。睡觉起床、学习活动，各有各的点，先把这个稳住，再谈方法。\n\n小地方也别放过。写完作业顺手把桌子收一收，错题过几天回头再看一遍，做完的事有个收尾。不用一上来就求全，每天留十分钟读点东西、睡前自己把书包理好，都是今晚就能做的。好习惯是一天天养起来的，靠催是催不出来的。\n\n最后一条，关乎孩子怎么看自己，也最容易被忽略。\n\n五、看得见孩子的进步，别总拿别人家比\n\n不少家长张口就是谁家孩子考了第几，仿佛不比一比就吃了亏。家长群里的一句排名，能让人琢磨一整晚。\n\n可比来比去，孩子接收到的信号是我还不够好。久了就不敢试、不敢问，怕又被人比下去。\n\n把话换一换，多问问今天哪一点比昨天强了。短板允许它有，看重的是往前走的那一步。孩子不怕输，才肯在一件事上沉下去。别人家的成绩单看看就罢，自家的日子还得自己过。\n\n结语\n\n这五户人家，没有一户是靠钱和学历堆出来的，靠的都是把日常一点点理顺的耐心。孩子一时普通不要紧，家里那股稳稳的劲儿在，后劲迟早会来。今晚不妨先挑一件最容易的做起来，就从少吼一句开始，家里的气氛就不一样了。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "不少家长一提学霸，脑子里先蹦出三个词：脑子灵、家底厚、爹妈学历高。我认识 pacing:.18em;background-color:transparent;\">· 家庭教育 ·<\/p>\n\n<p style=\"margin:0 0 24px;padding:15px 17px;border-left:4px solid #6b4e9e;border-radius:0 8px 8px 0;font-size:17px;line-height:1.9;color:#3a3a3a;text-align:justify;letter-spacing:0;background-color:#f7f4ef;\">不少家长一提学霸，脑子里先蹦出三个词：脑子灵、家底厚、爹妈学历高。我认识一位带毕业班的班主任，她说起过一件让她自己都意外的事：班里后劲最足的几个孩子，家境都普通。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">孩子之间慢慢拉开的那段距离，很多是在家里的日常里一点点攒出来的。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这话不是要把焦虑再往家长身上压一层。天赋和家底改不了，可家里那几件天天在做的小事，是普通家庭真能自己攥在手里的。今天就照着五类家庭的做法，一样样拆开给你看。<\/p>\n<p style=\"margin:34px 0 16px;line-height:1.55;font-weight:800;margin-left:2px;padding:2px 0 2px 13px;color:#6b4e9e;border-left:6px solid #6b4e9e;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">一、家里少点吼，孩子的心先稳下来<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">考砸一次，有的家里气氛立刻绷紧，大人嗓门一高，孩子整晚都不敢吭声。大人也许说完就忘了，孩子却会翻来覆去想一晚上。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">人心里揣着火，脑子里就装不进题。孩子光顾着看大人的脸色，错题就没心思去琢磨了。越是这种时候，越得先把火压住。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">分数出来，先别急着追问，坐下来一起翻卷子，看看错在哪一步。我早年在厂里画过一阵图，一张稿子被师傅退回好多回，急也没用，只能一笔一笔改到他点头为止。孩子的学习也是这个理，气顺了，思路才回得来。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">大人稳一寸，孩子就敢往前一步。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">情绪这关过了，再看家里另一种看不见的东西：大人自己平时是什么样。<\/p>\n<p style=\"margin:34px 0 16px;line-height:1.55;font-weight:800;margin-left:2px;padding:2px 0 2px 13px;color:#6b4e9e;border-left:6px solid #6b4e9e;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">二、大人自己也在往前走，孩子才不觉得学习是苦差<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">下班回家往沙发上一瘫，手机刷到半夜，转头却催孩子去看书。孩子嘴上不说，心里的账却记得清楚。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">学习这件事，孩子看的是大人怎么做，不是听大人怎么讲。你说一百遍要用功，抵不上他自己看见你晚上也在翻书、在处理手头的事。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">说白了，不用爹妈有多高的学问。晚上自己翻两页书、把白天没做完的事接着做完，孩子看久了，会觉得用功本来就是这个家本来的样子。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">家里有股向上的劲儿，学习就不用天天挂在嘴上催。<\/strong>碰上他不会的题，还可以反过来请他讲给你听，他讲一遍，比你讲三遍都管用。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">氛围有了，还得给责任找个落处，不能大人一直盯着。<\/p>\n<p style=\"margin:34px 0 16px;line-height:1.55;font-weight:800;margin-left:2px;padding:2px 0 2px 13px;color:#6b4e9e;border-left:6px solid #6b4e9e;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">三、大方向定好，剩下的交还给孩子<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">有的家长把盯作业当成了日常，每道题都要过目，本子翻一遍，连手机也要查一查。一天下来，大人和孩子都累。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">可盯得越紧，孩子越觉得学习是给大人干的活，自己反倒像个局外人。大人一松手，他就彻底撂下了。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不如先把睡觉、写作业的时段和底线定清楚，至于具体怎么排、先做哪一样，让孩子自己拿主意。家里可以跟孩子商量着定几条约定，写作业的时间段、手机每天能玩多久，都白纸黑字写下来，大人也得照着办。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">规矩不双标，孩子才肯认。<\/strong>时间自己排过、后果自己扛过，这份本事才是能带走的。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">把主动权交回去之后，还有个托底的东西，就是日子过得有没有规律。<\/p>\n<p style=\"margin:34px 0 16px;line-height:1.55;font-weight:800;margin-left:2px;padding:2px 0 2px 13px;color:#6b4e9e;border-left:6px solid #6b4e9e;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">四、作息稳、小事常做，后劲才托得住<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">有的孩子靠熬夜堆时间，白天上课反倒犯困，题刷了一堆，成绩不见起色。看着很努力，其实是把本钱透支了。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">脑子要转得动，得先有稳定的作息打底，这不是多报一个班能替的。睡觉起床、学习活动，各有各的点，先把这个稳住，再谈方法。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">小地方也别放过。写完作业顺手把桌子收一收，错题过几天回头再看一遍，做完的事有个收尾。不用一上来就求全，每天留十分钟读点东西、睡前自己把书包理好，都是今晚就能做的。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">好习惯是一天天养起来的，靠催是催不出来的。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">最后一条，关乎孩子怎么看自己，也最容易被忽略。<\/p>\n<p style=\"margin:34px 0 16px;line-height:1.55;font-weight:800;margin-left:2px;padding:2px 0 2px 13px;color:#6b4e9e;border-left:6px solid #6b4e9e;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">五、看得见孩子的进步，别总拿别人家比<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不少家长张口就是谁家孩子考了第几，仿佛不比一比就吃了亏。家长群里的一句排名，能让人琢磨一整晚。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">可比来比去，孩子接收到的信号是我还不够好。久了就不敢试、不敢问，怕又被人比下去。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">把话换一换，多问问今天哪一点比昨天强了。短板允许它有，看重的是往前走的那一步。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">孩子不怕输，才肯在一件事上沉下去。<\/strong>别人家的成绩单看看就罢，自家的日子还得自己过。<\/p>\n<p style=\"margin:34px 0 16px;line-height:1.55;font-weight:800;margin-left:2px;padding:2px 0 2px 13px;color:#6b4e9e;border-left:6px solid #6b4e9e;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">结语<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这五户人家，没有一户是靠钱和学历堆出来的，靠的都是把日常一点点理顺的耐心。孩子一时普通不要紧，家里那股稳稳的劲儿在，后劲迟早会来。今晚不妨先挑一件最容易的做起来，就从少吼一句开始，家里的气氛就不一样了。<\/p>\n\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《两京十五日》", "latest": ["20261123-laoxi088-16b86d3d"], "articles": [{"id": "20261123-laoxi088-16b86d3d", "title": "《两京十五日》直到朱瞻基遇险，才懂于谦为何与吴定缘一起查案", "plain": "《两京十五日》直到朱瞻基遇险，才懂于谦为何与吴定缘一起查案\n\n追《两京十五日》头几集那会儿，我跟不少人一样，看吴定缘把落水的朱瞻基捞上来、转头却想把这个“可疑小贼”送锦衣卫领赏钱，只当是个挺逗的喜剧桥段。可等朱瞻基遇险、局势一步步收紧之后才回过味来：这个张口闭口谈报酬的市井捕快，偏偏是他亲自点名要一起查案的人。\n\n一、\n\n先说这对搭档有多不搭。一个是于谦，遵守制度、崇尚法制的读书人；一个是吴定缘，贪财、嘴硬、浑身市井油滑的捕快。看头两集的时候，我一度觉得编剧是不是把两个世界的人硬凑到了一块儿。\n\n不过把宝船爆炸那场戏往细里看，就不是那么回事了。朱瞻基被救上来，吴定缘没急着救驾，先琢磨着领赏钱，很多人当成笑料，可这恰恰是朱瞻基选中他的原因。按剧里的交代，应天府衙门表面可靠，里头到处是黑手安插的眼线，三班总捕吴不平要是接了案子，消息转眼就漏给幕后的人。\n\n于谦认出太子，靠的是永乐年间殿试的记忆，还有“郑三保”这句只有亲近之人才说得出口的话。这里得说清楚，这是剧里编的艺术设定，不是真史料。可就是靠着这么一套典章、身份和证据，他认定吴定缘不尊储君、挟恩谋利，难当重任。\n\n两种看法就这么摆着：于谦信的是履历清白、久经官场，朱瞻基要的却是能钻空子、碰暗道的人。规矩摆在明面上，可真正要命的线索，往往藏在规矩照不到的暗处。\n\n二、\n\n朱瞻基看得更远的那一步，剧里其实铺得很细。虎硫药出自深宫，刺客能算准宝船爆炸的时间，连过桥时的伏击都提前布好，这是编剧一层层加码的艺术加工，为的是把“这不只是普通仇杀”钉死。要摸到铁盟那条暗线，靠原有的官僚体系已经不成，必须跳出去。\n\n这里有个对照我挺留意。船舱漏水那组特写，看着是在交代环境，其实是在给皇权动荡做隐喻，暗流无声地渗着，再牢固的大船，看不见的地方也会慢慢塌。张黎把东水关、扇骨台这些南京地标拍进运河光影里，用平视镜头对着漕运两岸，迁都之争、漕运利弊这些真历史，就藏在这趟十五天、两千二百里的归途中。史实是骨架，隐喻是剧的写法，两者得分开看。\n\n说到这儿想起我开水果店那回，照着一份自以为周全的计划盘货定价，街坊真实的买卖门道一点没摸清，几个月就折了。规矩再齐整，不懂街巷里的暗道，照样办不成事。\n\n口碑两极我也不意外。有人夸权谋层层叠叠、久违的正剧质感，也有人嫌改编取舍太大、小人物主线被削弱，还有人挑特效和台词的毛病。\n\n三、\n\n那为什么非得等到朱瞻基遇险，才看得懂于谦为什么要跟吴定缘一起查案？\n\n因为太子一旦落难，浑身是泥、眼睛红肿，褪掉了那层从容的光环，他才真正看清：身边能用的，不是按章办事的循吏，而是这股子野气。于谦要管住吴定缘的莽撞，吴定缘要撕破于谦看不到的黑暗，朱瞻基居中，拿两个人的眼睛去照这座被阴谋裹住的金陵城。\n\n吴定缘拒绝坐那顶替太子赴死的轿子，甩出一句“宝船再安稳也会炸成灰”，是小人物对权力最直白的嘲讽。这话搁在开头只是嘴硬，搁到这儿，才咂摸出分量。\n\n朝堂的规矩一旦不顶用，还能把守礼法的读书人和贪财的市井捕快绑到一处去查真相的，才是真的识人。 这才是这对不搭搭档背后，藏得最深的那层意思。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "追《两京十五日》头几集那会儿，我跟不少人一样，看吴定缘把落水的朱瞻基捞上来、转头却想把这个“可疑小贼”送锦衣卫领赏钱，只当是个挺逗的喜剧桥段。可等朱瞻基遇险、局势一步步收紧之后才回过味来：这个张口闭口谈报酬的市井捕快，偏偏是他亲自点名要一起查案的人。\n\n一、\n\n先说这对搭档有多不搭。一个是于谦，遵守制度、崇尚法制的读书人；一个是吴定缘，贪财、嘴硬、浑身市井油滑的捕快。看头两集的时候，我一度觉得编剧是不是把两个世界的人硬凑到了一块儿。\n\n不过把宝船爆炸那场戏往细里看，就不是那么回事了。朱瞻基被救上来，吴定缘没急着救驾，先琢磨着领赏钱，很多人当成笑料，可这恰恰是朱瞻基选中他的原因。按剧里的交代，应天府衙门表面可靠，里头到处是黑手安插的眼线，三班总捕吴不平要是接了案子，消息转眼就漏给幕后的人。\n\n于谦认出太子，靠的是永乐年间殿试的记忆，还有“郑三保”这句只有亲近之人才说得出口的话。这里得说清楚，这是剧里编的 缘，贪财、嘴硬、浑身市井油滑的捕快。看头两集的时候，我一度觉得编剧是不是把两个世界的人硬凑到了一块儿。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">不过把宝船爆炸那场戏往细里看，就不是那么回事了。朱瞻基被救上来，吴定缘没急着救驾，先琢磨着领赏钱，很多人当成笑料，可这恰恰是朱瞻基选中他的原因。按剧里的交代，应天府衙门表面可靠，里头到处是黑手安插的眼线，三班总捕吴不平要是接了案子，消息转眼就漏给幕后的人。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">于谦认出太子，靠的是永乐年间殿试的记忆，还有“郑三保”这句只有亲近之人才说得出口的话。这里得说清楚，这是剧里编的艺术设定，不是真史料。可就是靠着这么一套典章、身份和证据，他认定吴定缘不尊储君、挟恩谋利，难当重任。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">两种看法就这么摆着：于谦信的是履历清白、久经官场，朱瞻基要的却是能钻空子、碰暗道的人。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">规矩摆在明面上，可真正要命的线索，往往藏在规矩照不到的暗处。<\/strong><\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">朱瞻基看得更远的那一步，剧里其实铺得很细。虎硫药出自深宫，刺客能算准宝船爆炸的时间，连过桥时的伏击都提前布好，这是编剧一层层加码的艺术加工，为的是把“这不只是普通仇杀”钉死。要摸到铁盟那条暗线，靠原有的官僚体系已经不成，必须跳出去。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这里有个对照我挺留意。船舱漏水那组特写，看着是在交代环境，其实是在给皇权动荡做隐喻，暗流无声地渗着，再牢固的大船，看不见的地方也会慢慢塌。张黎把东水关、扇骨台这些南京地标拍进运河光影里，用平视镜头对着漕运两岸，迁都之争、漕运利弊这些真历史，就藏在这趟十五天、两千二百里的归途中。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">史实是骨架，隐喻是剧的写法，两者得分开看。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">说到这儿想起我开水果店那回，照着一份自以为周全的计划盘货定价，街坊真实的买卖门道一点没摸清，几个月就折了。规矩再齐整，不懂街巷里的暗道，照样办不成事。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">口碑两极我也不意外。有人夸权谋层层叠叠、久违的正剧质感，也有人嫌改编取舍太大、小人物主线被削弱，还有人挑特效和台词的毛病。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">三、<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">那为什么非得等到朱瞻基遇险，才看得懂于谦为什么要跟吴定缘一起查案？<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">因为太子一旦落难，浑身是泥、眼睛红肿，褪掉了那层从容的光环，他才真正看清：身边能用的，不是按章办事的循吏，而是这股子野气。于谦要管住吴定缘的莽撞，吴定缘要撕破于谦看不到的黑暗，朱瞻基居中，拿两个人的眼睛去照这座被阴谋裹住的金陵城。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">吴定缘拒绝坐那顶替太子赴死的轿子，甩出一句“宝船再安稳也会炸成灰”，是小人物对权力最直白的嘲讽。这话搁在开头只是嘴硬，搁到这儿，才咂摸出分量。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">朝堂的规矩一旦不顶用，还能把守礼法的读书人和贪财的市井捕快绑到一处去查真相的，才是真的识人。<\/strong> 这才是这对不搭搭档背后，藏得最深的那层意思。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQ   var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《璀璨之城》", "latest": ["069e4cec"], "articles": [{"id": "069e4cec", "title": "《璀璨之城》大结局留了个活口，观众比编剧更舍不得放手", "plain": "《璀璨之城》大结局留了个活口，观众比编剧更舍不得放手\n\n一部剧好不好，有时不看它怎么收尾，看它敢不敢留个没说完的地方。\n\nTVB《璀璨之城》大结局，孝贤喝下那杯毒牛奶，生死悬着没落地。连 TVB 高层都松了口，说有开拍第二部的可能。于是网友坐不住了，自己把第二部写了出来：孝贤没死，被四大富豪救起，扶成香港首富，杀回 LKS 董事局主席之争。\n\n这一版脑洞，倒真写在了 TVB 的骨头上。\n\n一、观众舍不得的，其实是那个没被交代的人\n\n大结局那一杯毒牛奶，把所有事都停在了半空。洪海允收到了死亡通知，墓碑都立好了，官家上下默认这个人已经走了。可观众心里那口气没顺下去。\n\n这就是留白的厉害。故事把门关上了，观众偏要去推那扇门，看后面还有没有路。\n\n网友的补法很有意思：安表叔早被买通，医生悄悄把孝贤从鬼门关拉回来；救他的四大富豪，是因为孝君许诺的股票全是假的，恼羞成怒要搞垮官家，于是把孝贤当成最锋利的刀，一路推上首富位置。投票前夜，他坐在了亲弟弟对面。\n\n层层反转，假死蛰伏，兄弟对决，完全就是 TVB 商战的经典配方。观众比编剧还懂这部剧该怎么往下走。\n\n二、好剧敢放手，因为它信观众接得住\n\n我特别能理解这种舍不得。\n\n以前看年代剧，追到结局那种空落落的感觉，我不太会跟人说。人到中年了，还为一个虚构人物的生死睡不着，好像有点不像话。可后来我想通了，那份舍不得不是幼稚，是你在一个人物身上，放进了自己的某些盼头。你会替他算那口气该不该出，会替他想要是活下来该怎么走，算着算着，其实是在替自己算。\n\n你在等编剧给个交代，其实是在等自己的那点心事有个落地。剧里的人活没活过来，跟我们的日子没关系，可他该不该活、值不值得活，答案会悄悄照回到我们自己身上。\n\n观众愿意替一部剧续写，不是嫌它没写完，是舍不得它写完。\n\n剧方敢留这个活口，也是本事。它知道这个故事撑得住，知道哪怕门虚掩着，观众也不会走。真要硬塞一个大团圆，反倒像把话说尽了，没劲。观众愿意替它把没说完的部分补上，这份心气比任何结局都金贵。\n\n写在最后\n\n当然得说清楚，这只是网友的脑洞，不是官方剧本，第二部拍不拍还是未知数。可一部剧能让这么多人自愿当编剧，本身就说明它成了。\n\n留白不是没写完，是把最后一句，交到了观众手里。 一部剧能被这么多人惦记着续下去，本身就赢了。要是真拍第二部，你更想看到孝贤翻盘，还是孝君守住？\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "一部剧好不好，有时不看它怎么收尾，看它敢不敢留个没说完的地方。\n\nTVB《璀璨之城》大结局，孝贤喝下那杯毒牛奶，生死悬着没落地。连 TVB 高层都松了口，说有开拍第二部的可能。于是网友坐不住了，自己把第二部写了出来：孝贤没死，被四大富豪救起，扶成香港首富，杀回 LKS 董事局主席之争。\n\n这一版脑洞，倒真写在了 TVB 的骨头上。\n\n一、观众舍不得的，其实是那个没被交代的人\n\n大结局那一杯毒牛奶，把所有事都停在了半空。洪海允收到了死亡通知，墓碑都立好了，官家上下默认这个人已经走了。可观众心里那口气没顺下去。\n\n这就是留白的厉害。故事把门关上了，观众偏要去推那扇门，看后面还有没有路。\n\n网友的补法很有意思：安表叔早被买通，医生悄悄把孝贤从鬼门关拉回来；救他的四大富豪，是因为孝君许诺的股票全是假的，恼羞成怒要搞垮官家，于是把孝贤当成最锋利的刀，一路推上首富位置。投票前夜，他坐在了亲弟弟对面。\n\n层层反转，假死蛰伏，兄弟对决，完全就是 TVB 商战的经典配方。观众比编剧还懂这部剧该怎么往下走。\n\n二、好剧敢放手，因为它信观众接得住\n\n我特别能理解这种舍不得。\n\n以前看年代剧，追到结局那种空落落的感觉，我不太会跟人说。人到中年了，还为一个虚构人物的生死睡不着，好像有点不像话。可后来我想通了，那份舍不得不是幼稚，是你在一个人物身上，放进了自己的某些盼头。你会替他算那口气该不该出，会替他想要是活下来该怎么走，算着算着，其实是在替自己算。\n\n你在等编剧给个交代，其实是在等自己的那点心事有个落地。剧里的人活没活过来，跟我们的日子没关系，可他该不该活、值不值得活，答案会悄悄照回到我们自己身上。\n\n观众愿意替一部剧续写，不是嫌它没写完，是舍不 ight:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">层层反转，假死蛰伏，兄弟对决，完全就是 TVB 商战的经典配方。观众比编剧还懂这部剧该怎么往下走。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、好剧敢放手，因为它信观众接得住<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我特别能理解这种舍不得。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2EAAAGkCAYAAAC4ti0RAAEAAElEQVR42tz96ZIkSZImiH3MIqp2+BUeV2ZWZlZXd9UcmMbM7GBn9wnwNHiKfivsAwBE+LMA0ewc3V3d1ZVnRMbll52qKsL4wSyHqpl5RGZXDWEQRV4R6W5uhx4izPxd9H/7v/5bERGICCCAwP4WQfoT7d8iBJRvAwSQ/Q0ImAiUvpj0IUQgVN8nGv0+QIgQexxATGB28N7BeQ/fNGjsy3kPxwznXPplpDcUY0SMESEEhCEghh5hGBCGAYN9hSFgCBEx6OPiEPLPhqHHMASEoN+LQY+JiOSPPH5F6Odlhm88XDtHM1+gWSzg2ha+aeGaBmBGYIaAMSBiiBFDDOiGAft+QDcMiBLBAv1s7OC807+dAzPnL+892nQcvAM7BybW40YEZgYxj4+zvX+RqJ8llhMoAfa9AIH+PAaBQCAhIsZg34sIYUAMA+IwQGJECHq87YoBgfS9sAPIAfb6ohcBHHuQYxAxkN4fletDJEJi1OMcBSIBYdjhw80HvP7pLe5Xazxseux7QQSB4MGjMyL5eovVyWK7lkUEIIL3DQRAiNGOu0BI/3vfdXjx8gVevvwM//U//2dczJeIEhGEEJjLVSDl2Opnqa+O9I70s/TdHucXF/j8s8+xWq+w2+3AzNhutgABXT+g7we0bQvn9fwzMfphAIggAnjfwHuHgAgQEILg+sk1vvzqV/j2u++w7zt4xwAIzB6NbwDYNdP4cg0ToZ17XFxdYda2IGI4Jgyhx3azBYExDD0AYAgRYRgQY0DbtBBmbHZbdF2Hfugxb2eQKHbNMkI/IMaIodtju92g73qICIZhwIuXL7BcLrHZbPBw/wDfeMQQMZ/P8e7NT7h+/hyz2Qzv379H2zRonMf5+QW2ux22mw2GvoeAIHEAM8DQtcJROgcMoWq9SWsJEQgMMDBrGrTNDH2/BzNhMZ/DOYfNZo3dbosY0zFieNJ7SCTCOdZ1JUYQAc45zNoZmrbR+7Ft0TYNAMF+t0MIAUwEgcA5j6ZpAABBgBADIIBnB8eEWeMxaxuwc+j7DvvtFhIHLGczPFnOsGgYngjeEeatR+sZTBEOBCDqZxeAqFp7RfRnpPeE5LVb7/0oAoiARCACRLF7WGx9p/G6rfeYVOs4QPbfad0H9Hnzemn3cbS/8z0hkteleo0iW0fr/ ZvN8PLlNX75i1/g7uY92qYRPZkhVH2J6szGLrlzBGY1cfU7nYXjXZCes274DU6+TfgMHjf/Z2xQ6SeRcGBjsUOeNWW9G6OzDl3b4v7+Dm3Xou1bkFJw7KIdeBpuqQ5crb6zZY5HITJNwp8BozWGYYhNUdjglVIoy9KbSuzRNQ2KZY68yHF5dYm//v/8NT799FNcX1+j70Wr1TQ1mrrFMAwo8hy77TYewsP6AfVuh/1+D2t9ht8BIqD8gMaxQ2YMuq7HarXEYMW5tG4bzJcr1HWNoshRaw0DwBBQXKzwgx//BHfrLZzOcHd7h6ZpsVgs8fBwD5NJ1EXbNciLHKuLFb786iv85Md/ijwv8PXXX0EpwvX1K7x9+7UgWXXt6YkNyqrCZrvB/d29HxRYvLi8QJYZ7N7v0DR1su4xiryANhqD7WPj1DYtateIq2ImMR1lUWI2n6EoS4+a7lCWJdATjNHoeodu6FFmGYwWpA4FoaxKtG2NTHsHV0XRdlkljl6SRSf04ziomBRl32wvYHqkAcMxn5E8sj66tY3FHIUAw2CR70JF6tcCJNq1uO8gMSah6FYG36Clw3LHh+YWlOBg/J02Yoxzzempn9C0Xz1ostxRA3fcfD3GskjzvBiPxwocNop04AL4HMTPAXjce9YdYJt0gA0mR0DRVG8cFiA1IKEjJO44kWx8Hs+xvNPzn95nlAz16ERjGw+MkroIo625w+j0S6BoxkEBBQvZXgrRJCcEiwdGTgxcVp5mHkOavbbMU85VZP4Ek1SVNBaYGlU88dCn1PSzmj5+bFzwyHrwDQvPCRNmooFLTIZSB0k1/T4pwhuZNMm+GBFhThtNGmuCidafALK+nhiHQDdffgkAyJPSMqvmco2Uwv8fSNeHdq9aZXQAAAAASUVORK5CYII=\" alt=\"剧照\"><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">以前看年代剧，追到结局那种空落落的感觉，我不太会跟人说。人到中年了，还为一个虚构人物的生死睡不着，好像有点不像话。可后来我想通了，那份舍不得不是幼稚，是你在一个人物身上，放进了自己的某些盼头。你会替他算那口气该不该出，会替他想要是活下来该怎么走，算着算着，其实是在替自己算。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">你在等编剧给个交代，其实是在等自己的那点心事有个落地。剧里的人活没活过来，跟我们的日子没关系，可他该不该活、值不值得活，答案会悄悄照回到我们自己身上。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">观众愿意替一部剧续写，不是嫌它没写完，是舍不得它写完。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">剧方敢留这个活口，也是本事。它知道这个故事撑得住，知道哪怕门虚掩着，观众也不会走。真要硬塞一个大团圆，反倒像把话说尽了，没劲。观众愿意替它把没说完的部分补上，这份心气比任何结局都金贵。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">当然得说清楚，这只是网友的脑洞，不是官方剧本，第二部拍不拍还是未知数。可一部剧能让这么多人自愿当编剧，本身就说明它成了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">留白不是没写完，是把最后一句，交到了观众手里。<\/strong> 一部剧能被这么多人惦记着续下去，本身就赢了。要是真拍第二部，你更想看到孝贤翻盘，还是孝君守住？<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《璀璨之城》", "created": "2026-11-17 08:46", "updated": "2026-11-17 08:46"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《兰香如故》全员", "latest": ["371fc182"], "articles": [{"id": "371fc182", "title": "《兰香如故》大结局：赵星棠算了一辈子账，只有最后一笔是自己的", "plain": "《兰香如故》大结局：赵星棠算了一辈子账，只有最后一笔是自己的\n\n她把半辈子活成了一件待价而沽的东西，临了才做了一回自己的主。\n\n赵星棠嫁进林府做正室，是联姻，六年没有孩子，夫妻之间也谈不上什么情分。后来她和旧人钱少泽的事被撞破，和离回了赵家。娘家不养闲人，转手把她再嫁给戴寺卿，换的还是朝堂上那点资源。她这一辈子看得最透的一句话，是嘴甜的男人不可靠，只有不会说话的银子可靠。\n\n汉王兵败，赵家跟着塌了。她从主母变成逃犯，流落芦苇荡，被乱兵打成重伤。临终前她把一份证据交给了许兰香，那是林锦岐私放前太子的凭据，交出去足以让林锦岐万劫不复。她把这个东西给了自己曾经最恨的女人，还说了一句，你比青葙还懂我。\n\n《兰香如故》｜古装剧｜大结局（第40集）\n\n一、她算得确实精，只是算的全是别人出的价\n\n这个人物最容易被骂势利，可她的精明里有一层可怜：她从来没算过自己想要什么，只算自己能换到什么。嫁进林府换的是正室的名分，和离换的是回赵家喘口气，再嫁换的是娘家在朝堂上多一个靠山。每一笔都算得清楚，每一笔的主语都不是她。\n\n一个人把自己当货物估价久了，就真的会忘了自己还有别的用法。 她比谁都明白银子可靠，因为银子是她唯一握得住的东西，男人、娘家、名分，全是别人一句话就能收回去的。\n\n所以最后那一步才显得重。证据在她手里，是保命符，也是投名状，交给谁都能再换一次价钱。她偏偏交给了许兰香，一个没给过她好处、还被她恨过的人。\n\n跑销售那两年，我学会一件事：酒桌上说得再热闹都不算数，只有回款单上的数字算数。有回一个客户拍着胸口说这单稳了，我高兴了半个月，月底对账，一分钱没到。后来我养成一个习惯，谈完就把能落的字落到纸上，能到账的才叫生意。嘴上给的东西随时能收回，落到手里的才算数。 这话搁在赵星棠身上一样对，只是她算了一辈子别人的出价，唯独没算过自己愿不愿意。\n\n二、最后那笔账，她算的是自己认谁\n\n她交出证据那一刻，等于把自己最后一枚筹码扔了。那东西留着，说不定还能跟新朝换条活路；交出去，她什么都没了。她要的其实不是活路，是有人懂她这一辈子怎么过来的。\n\n许兰香懂。两个人在同一个府里争过、恨过，一个被赐婚困住，一个被联姻卖进来，走的路不一样，处境却是同一种。赵星棠那句你比青葙还懂我，说的不是交情，是她们都被当成筹码使过。被人懂一次，比被人用一辈子都难得。 她这一生被人估过无数次价，只有这一次，是她自己挑的人。\n\n这也是全剧对她最公道的地方。没让她幡然悔悟，也没让她洗白，只是让她在最后关头做了一件不划算的事。一个人肯做不划算的事，才算是把自己当人看了。\n\n写在最后\n\n赵星棠的结局不体面，可她最后那一笔账算对了。会算账不是本事，知道哪一笔该算在自己头上才是。 前面的账都是别人替她算的，只有最后这一笔，她自己签了字。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "她把半辈子活成了一件待价而沽的东西，临了才做了一回自己的主。\n\n赵星棠嫁进林府做正室，是联姻，六年没有孩子，夫妻之间也谈不上什么情分。后来她和旧人钱少泽的事被撞破，和离回了赵家。娘家不养闲人，转手把她再嫁给戴寺卿，换的还是朝堂上那点资源。她这一辈子看得最透的一句话，是嘴甜的男人不可靠，只有不会说话的银子可靠。\n\n汉王兵败，赵家跟着塌了。她从主母变成逃犯，流落芦苇荡，被乱兵打成重伤。临终前她把一份证据交给了许兰香，那是林锦岐私放前太子的凭据，交出去足以让林锦岐万劫不复。她把这个东西给了自己曾经最恨的女人，还说了一句，你比青葙还懂我。\n\n《兰香如故》｜古装剧｜大结局（第40集）\n\n一、她算得确实精，只是算的全是别人出的价\n\n这个人物最容易被骂势利，可她的精明里有一层可怜：她从来没算过自己想要什么，只算自己能换到什么。嫁进林府换的是正室的名分，和离换的是回赵家喘口气，再嫁换的是娘家在朝堂上多一个靠山。每一笔都算得清楚，每一笔的主语都不是她。\n\n一个人把自己当货物估价久了，就真的会忘了自己还有别的用法。 她比谁都明白银子可靠，因为银子是她唯一握得住的东西，男人、娘家、名分，全是别人一句话就能收回去的。\n\n所以最后那一步才显得重。证据在她手里，是保命符，也是投名状，交给谁都能再换一次价钱。她偏偏交给了许兰香，一个没给过 pacing:0;background-color:transparent;\">一、她算得确实精，只是算的全是别人出的价<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这个人物最容易被骂势利，可她的精明里有一层可怜：她从来没算过自己想要什么，只算自己能换到什么。嫁进林府换的是正室的名分，和离换的是回赵家喘口气，再嫁换的是娘家在朝堂上多一个靠山。每一笔都算得清楚，每一笔的主语都不是她。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一个人把自己当货物估价久了，就真的会忘了自己还有别的用法。<\/strong> 她比谁都明白银子可靠，因为银子是她唯一握得住的东西，男人、娘家、名分，全是别人一句话就能收回去的。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">所以最后那一步才显得重。证据在她手里，是保命符，也是投名状，交给谁都能再换一次价钱。她偏偏交给了许兰香，一个没给过她好处、还被她恨过的人。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">跑销售那两年，我学会一件事：酒桌上说得再热闹都不算数，只有回款单上的数字算数。有回一个客户拍着胸口说这单稳了，我高兴了半个月，月底对账，一分钱没到。后来我养成一个习惯，谈完就把能落的字落到纸上，能到账的才叫生意。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">嘴上给的东西随时能收回，落到手里的才算数。<\/strong> 这话搁在赵星棠身上一样对，只是她算了一辈子别人的出价，唯独没算过自己愿不愿意。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、最后那笔账，她算的是自己认谁<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">她交出证据那一刻，等于把自己最后一枚筹码扔了。那东西留着，说不定还能跟新朝换条活路；交出去，她什么都没了。她要的其实不是活路，是有人懂她这一辈子怎么过来的。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">许兰香懂。两个人在同一个府里争过、恨过，一个被赐婚困住，一个被联姻卖进来，走的路不一样，处境却是同一种。赵星棠那句你比青葙还懂我，说的不是交情，是她们都被当成筹码使过。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">被人懂一次，比被人用一辈子都难得。<\/strong> 她这一生被人估过无数次价，只有这一次，是她自己挑的人。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这也是全剧对她最公道的地方。没让她幡然悔悟，也没让她洗白，只是让她在最后关头做了一件不划算的事。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一个人肯做不划算的事，才算是把自己当人看了。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">赵星棠的结局不体面，可她最后那一笔账算对了。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">会算账不是本事，知道哪一笔该算在自己头上才是。<\/strong> 前面的账都是别人替她算的，只有最后这一笔，她自己签了字。<\/p>\n<p style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《兰香如故》全员", "created": "2026-11-16 09:27", "updated": "2026-11-16 09:27"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《伟大的长征》", "latest": ["20261121-fengxiong-0ecc9cc3"], "articles": [{"id": "20261121-fengxiong-0ecc9cc3", "title": "新旧《长征》对比差距明显！唐国强版潇洒昂扬，苦难只是背景；于和伟新版满是沉重，直面惨烈牺牲，不喊口号不诵诗词。", "plain": "新旧《长征》对比差距明显！唐国强版潇洒昂扬，苦难只是背景；于和伟新版满是沉重，直面惨烈牺牲，不喊口号不诵诗词。\n\n把决策的代价拍出来，才算真正的写实，这一点新版《伟大的长征》做得很硬。\n\n我是学建筑的，后来转做程序，现在教机器人。职业病，看什么都先看它落不落地。新版里有场戏，博古在屋里对着地图勾画，前线战士却要拿命去填那决策的错误。我看到这儿坐直了，这说的不就是工地上最忌讳的那件事吗，图纸画得再漂亮，到现场一放线，尺寸对不上，返工是小，出事是大。\n\n在图纸上，一笔就是一笔；到了现场，一笔可能就是一条命。\n\n老版《长征》不这么看。它走的是宏大浪漫的路子，主席从容潇洒，围追堵截都能谈笑风生地化掉，镜头开阔，群山红旗，苦难退成背景，胜利当主线。那种叙事有它的道理，九十年代人心思进，需要有人告诉你方向对了，吃苦就有盼头。我理解，也不否认它的好。\n\n但新版选了另一条更难走的路。它把八万六千人打到只剩三万出头这个事实，直愣愣摆出来。湘江战役之后，队伍流血过多，镜头不给口号，不给诗词烘托，只给人沉重的背影和面对牺牲时那种无力感。它不替历史化妆，也不替观众消化情绪，就是让你直面那副重担。\n\n一、图纸上的一笔，和现场的一条命\n\n我特别服气的是，新版没有把于和伟演的角色拍成“早就算准了一切”的统帅。相反，他脸上常是愁苦的，是一个眼睁睁看战友倒下、急着找出路的探索者。这个处理特别真实，因为真正扛过事的人都知道，你不可能每一步都有把握，你能做的只是不停核对、不停修正，然后拿结果说话。\n\n承认自己还在找路，比装作胸有成竹，更接近担当。\n\n戏里那些具体的人，是这份真实的支点。易荡平、陈树湘，这些名字不再是名单上一笔带过，而是有血有肉地活过又凋零。陈树湘断肠明志那一段，个体层面的惨烈，让“牺牲”这两个字从抽象变具体。你会算一笔账，胜利是拿这些具体的命，一条一条垫出来的，不是一句喊出来的口号。\n\n这也正好戳中现在观众的代入感。我们不再轻易被“指点江山”打动，是因为见过太多轻飘飘的决策，落到具体的人身上就是一座山。戏里那张地图和前线之间的落差，现实里天天在演。\n\n二、我拆过太多方案，知道落地两个字有多重\n\n做建筑工程那几年，我在现场放线、测量、编资料。后来转 IT，做软件测试，又做 Java 后端和产品设计，现在站讲台教机器人。一路跨界，我最大的体会就一句话，方案好不好，不看它讲得多漂亮，看它能不能落地。踩过坑的人，才懂复盘两个字的分量。\n\n看新版的时候，我老把它当成一个大项目在拆。八万六到三万出头，是过程中的重大偏差；于和伟那张愁苦的脸，是负责人在盯着数据找原因；那些倒下的名字，是偏差背后真实的成本。它不喊口号，是因为口号解决不了偏差，只有一味一味地调，一步一步地走。\n\n信仰这东西，落到地上，就是一次次不逃避的核对和修正。\n\n我做事稳，不爱空谈，最烦那种模糊不落地的方案。所以新版那种老实劲儿，特别对我胃口。它没给你一个漂亮的结尾让你爽完就走，它把代价留在那儿，让你带出影院继续想。想明白了，长征就不只是一次战略转移，而是一次建立在巨大生命损耗上的信仰长征。\n\n文末小记\n\n老版我小时候看过，那时候只觉得人帅、旗帜好看。如今再看新版，我看懂了另一层，那些背影里的沉，是有人替我们把最难的那部分扛走了。做项目的人懂，一个方案能落地，靠的不是开场喊得多响，是中间无数次没人看见的较真。这戏，就是把那些没人看见的较真，拍了出来。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "把决策的代价拍出来，才算真正的写实，这一点新版《伟大的长征》做得很硬。\n\n我是学建筑的，后来转做程序，现在教机器人。职业病，看什么都先看它落不落地。新版里有场戏，博古在屋里对着地图勾画，前线战士却要拿命去填那决策的错误。我看到这儿坐直了，这说的不就是工地上最忌讳的那件事吗，图纸画得再漂亮，到现场一放线，尺寸对不上，返工是小，出事是大。\n\n在图纸上，一笔就是一笔；到了现场，一笔可能就是一条命。\n\n老版《长征》不这么看。它走的是宏大浪漫的路子，主席从容潇洒，围追堵截都能谈笑风生地化掉，镜头开阔， 里对着地图勾画，前线战士却要拿命去填那决策的错误。我看到这儿坐直了，这说的不就是工地上最忌讳的那件事吗，图纸画得再漂亮，到现场一放线，尺寸对不上，返工是小，出事是大。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">在图纸上，一笔就是一笔；到了现场，一笔可能就是一条命。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">老版《长征》不这么看。它走的是宏大浪漫的路子，主席从容潇洒，围追堵截都能谈笑风生地化掉，镜头开阔，群山红旗，苦难退成背景，胜利当主线。那种叙事有它的道理，九十年代人心思进，需要有人告诉你方向对了，吃苦就有盼头。我理解，也不否认它的好。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">但新版选了另一条更难走的路。它把八万六千人打到只剩三万出头这个事实，直愣愣摆出来。湘江战役之后，队伍流血过多，镜头不给口号，不给诗词烘托，只给人沉重的背影和面对牺牲时那种无力感。它不替历史化妆，也不替观众消化情绪，就是让你直面那副重担。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、图纸上的一笔，和现场的一条命<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我特别服气的是，新版没有把于和伟演的角色拍成“早就算准了一切”的统帅。相反，他脸上常是愁苦的，是一个眼睁睁看战友倒下、急着找出路的探索者。这个处理特别真实，因为真正扛过事的人都知道，你不可能每一步都有把握，你能做的只是不停核对、不停修正，然后拿结果说话。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">承认自己还在找路，比装作胸有成竹，更接近担当。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">戏里那些具体的人，是这份真实的支点。易荡平、陈树湘，这些名字不再是名单上一笔带过，而是有血有肉地活过又凋零。陈树湘断肠明志那一段，个体层面的惨烈，让“牺牲”这两个字从抽象变具体。你会算一笔账，胜利是拿这些具体的命，一条一条垫出来的，不是一句喊出来的口号。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这也正好戳中现在观众的代入感。我们不再轻易被“指点江山”打动，是因为见过太多轻飘飘的决策，落到具体的人身上就是一座山。戏里那张地图和前线之间的落差，现实里天天在演。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、我拆过太多方案，知道落地两个字有多重<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">做建筑工程那几年，我在现场放线、测量、编资料。后来转 IT，做软件测试，又做 Java 后端和产品设计，现在站讲台教机器人。一路跨界，我最大的体会就一句话，方案好不好，不看它讲得多漂亮，看它能不能落地。踩过坑的人，才懂复盘两个字的分量。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">看新版的时候，我老把它当成一个大项目在拆。八万六到三万出头，是过程中的重大偏差；于和伟那张愁苦的脸，是负责人在盯着数据找原因；那些倒下的名字，是偏差背后真实的成本。它不喊口号，是因为口号解决不了偏差，只有一味一味地调，一步一步地走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">信仰这东西，落到地上，就是一次次不逃避的核对和修正。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我做事稳，不爱空谈，最烦那种模糊不落地的方案。所以新版那种老实劲儿，特别对我胃口。它没给你一个漂亮的结尾让你爽完就走，它把代价留在那儿，让你带出影院继续想。想明白了，长征就不只是一次战略转移，而是一次建立在巨大生命损耗上的信仰长征。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">文末小记<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">老版我小时候看过，那时候只觉得人帅、旗帜好看。如今再看新版，我看懂了另一层，那些背影里的沉，是有人替我们把最难的那部分扛走了。做项目的人懂，一个方案能落地，靠的不是开场喊得多响，是中间无数次没人看见的较真。这戏，就是把那些没人看见的较真，拍了出来。<\/p>\n<p style=\"margin:26px 0 0 <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《走马上任》", "latest": ["0f679e3a"], "articles": [{"id": "0f679e3a", "title": "对假吃演员应激了！《走马上任》刘英真吃3个大包子，一口就分得出", "plain": "对假吃演员应激了！《走马上任》刘英真吃3个大包子，一口就分得出\n\n饭桌上最藏不住真假，戏里那一口饭也一样。\n\n《走马上任》里，王小利怕夫人吃不好，菜一筷子一筷子往她碗里盖，堆得冒尖。三个大包子端上来，又被压在饭上。蒋依杉没推，低头吃。对面的“女儿”看呆了，问她怎么吃这么多，她笑笑说，每天操劳，得多吃点。这一桌饭吃得热闹，桌底下压着的是秘密：她是假县长的夫人，女儿不能知道真相，所以再撑也得把这碗饭吃完。那顿饭吃得越香，越显得这家人表面上的和睦是真的。\n\n一、一口饭里，藏着一个女人怎么过日子\n\n来稿写她为这个角色增肥十几斤。剧里的县长夫人珠圆玉润，一出场就有气场，遇上土匪也不怯，恩威并施，几句话让人喊“大嫂”。这样的人吃饭不扭捏，才符合她的分量。县长夫人这个位置，说到底是被人安排上去的，假县长需要个体面的家，她就得坐在那里，笑得体面，吃得体面。\n\n假吃的演员不是坏，是怕。怕胖，怕镜头不好看，怕一遍不行要重来。可观众天天吃饭，太熟悉真吃的样子了。真咬下去，包子会缺，菜会少，喉咙会动；假吃只有动作，没有结果。假吃省下的那点力气，换来的是观众心里那句她在演，这三个字一出来，后面再多眼泪都补不回来。\n\n观众不是挑剔，是太熟悉真吃饭的样子了。\n\n二、女人被要求好看太久，忘了先要求自己站得住\n\n蒋依杉增肥，顶的是上镜要瘦的规矩。她没有先想着自己好不好看，而是先让县长夫人这个人物成立。这不是不爱惜自己，是把事情做扎实之后再谈其他。一个女人在饭桌上敢不敢吃，常常跟她在这个家里有没有位置连在一起。\n\n我这些年做过平面设计，一个月一千八，也做过软件测试，一万八左右，中间隔着的是无数个加班和搬家。刚结婚那几年，饭桌上我总把好菜往别人碗里夹，自己吃剩下的。时间久了，连自己想吃什么都说不上来。婆婆那辈人吃饭有个习惯，好菜先紧着男人和孩子，女人最后动筷子。我刚嫁过去那几年也跟着这样，后来有一回实在饿，先夹了一筷子，桌上安静了两秒，那两秒我记到现在。再后来慢慢改，先给自己盛一碗，再给别人添。家里那只用了很多年的饭碗边上磕了个小口，我一直没扔，它提醒我：这碗饭得先自己吃稳。现在回头看，那些年我不是不会吃，是不敢先动筷子，怕别人说馋，怕显得不顾家。蒋依杉敢在镜头前一口咬下去，说到底也是不怕被看。\n\n先把自己那碗端稳，才有力气照顾别人。\n\n写在最后\n\n假吃演员别演了。蒋依杉吃下去的三大个包子，不是逞强，是把一个女人的日子认真过了一遍。一个女人肯在镜头前把饭吃完，跟一个中年女人肯在饭桌上先给自己夹菜，是同一种底气。这口气不是争来的，是自己一口一口吃出来的。日子是吃出来的，不是摆出来的。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "饭桌上最藏不住真假，戏里那一口饭也一样。\n\n《走马上任》里，王小利怕夫人吃不好，菜一筷子一筷子往她碗里盖，堆得冒尖。三个大包子端上来，又被压在饭上。蒋依杉没推，低头吃。对面的“女儿”看呆了，问她怎么吃这么多，她笑笑说，每天操劳，得多吃点。这一桌饭吃得热闹，桌底下压着的是秘密：她是假县长的夫人，女儿不能知道真相，所以再撑也得把这碗饭吃完。那顿饭吃得越香，越显得这家人表面上的和睦是真的。\n\n一、一口饭里，藏着一个女人怎么过日子\n\n来稿写她为这个角色增肥十几斤。剧里的县长夫人珠圆玉润，一出场就有气场，遇上土匪也不怯，恩威并施，几句话让人喊“大嫂”。这样的人吃饭不扭捏，才符合她的分量。县长夫人这个位置，说到底是被人安排上去的，假县长需要个体面的家，她就得坐在那里，笑得体面，吃得体面。\n\n假吃的演员不是坏，是怕。怕胖，怕镜头不好看，怕一遍不行要重来。可观众天天吃饭，太熟悉真吃的样子了。真咬下去，包子会缺，菜会少，喉咙会动；假吃只有动作，没有结果。假吃省下的那点力气，换来的是观众心里那句她在演，这三个字一出来，后面再多眼泪都补不回来。\n\n观众不是挑剔，是太熟悉真吃饭的样子了。\n\n二、女人被要求好看太久，忘了先要求自己站得住\n\n蒋依杉增肥，顶的是上镜要瘦的规矩。她没有先想着自己好不好看，而是先让县长夫人这个人物成立。这不是不爱惜自己，是把事情做扎实之后再谈其他。一个女人在饭桌上敢不敢吃，常常跟她在这个家里有没有位置连在一起。\n\n我这些年做过平面设计，一个月一千八，也 nd-color:transparent;\">假吃的演员不是坏，是怕。怕胖，怕镜头不好看，怕一遍不行要重来。可观众天天吃饭，太熟悉真吃的样子了。真咬下去，包子会缺，菜会少，喉咙会动；假吃只有动作，没有结果。假吃省下的那点力气，换来的是观众心里那句她在演，这三个字一出来，后面再多眼泪都补不回来。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">观众不是挑剔，是太熟悉真吃饭的样子了。<\/strong><\/p>\n\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、女人被要求好看太久，忘了先要求自己站得住<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">蒋依杉增肥，顶的是上镜要瘦的规矩。她没有先想着自己好不好看，而是先让县长夫人这个人物成立。这不是不爱惜自己，是把事情做扎实之后再谈其他。一个女人在饭桌上敢不敢吃，常常跟她在这个家里有没有位置连在一起。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我这些年做过平面设计，一个月一千八，也做过软件测试，一万八左右，中间隔着的是无数个加班和搬家。刚结婚那几年，饭桌上我总把好菜往别人碗里夹，自己吃剩下的。时间久了，连自己想吃什么都说不上来。婆婆那辈人吃饭有个习惯，好菜先紧着男人和孩子，女人最后动筷子。我刚嫁过去那几年也跟着这样，后来有一回实在饿，先夹了一筷子，桌上安静了两秒，那两秒我记到现在。再后来慢慢改，先给自己盛一碗，再给别人添。家里那只用了很多年的饭碗边上磕了个小口，我一直没扔，它提醒我：这碗饭得先自己吃稳。现在回头看，那些年我不是不会吃，是不敢先动筷子，怕别人说馋，怕显得不顾家。蒋依杉敢在镜头前一口咬下去，说到底也是不怕被看。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">先把自己那碗端稳，才有力气照顾别人。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">假吃演员别演了。蒋依杉吃下去的三大个包子，不是逞强，是把一个女人的日子认真过了一遍。一个女人肯在镜头前把饭吃完，跟一个中年女人肯在饭桌上先给自己夹菜，是同一种底气。这口气不是争来的，是自己一口一口吃出来的。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">日子是吃出来的，不是摆出来的。<\/strong><\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAHwBDgDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAgMBBAUABgcI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAHMOO4+sqtiqmyq+o1psrWHIY+vkMzuKbQQQBWUYXmxTUhbmJm49Z5P2pP0q6iztjxDIQJwAFMgMGLSPM+j8yn6K1VttcBCBAcBDBkE5+pTZ8v8R7jw+Wgx3KpjuR3TxQdMC7o4JjuDhIXItWbRBIpsfWNMYHkzgZZPRId3SwYZAlA5bQl0h09yckPARLkGklibJHmTwEBTzADnyCJfIlXEWU3VX1pt5gY+7pQgSWyOiAXUt1BAJC5m1UtK33aN7PetRvUXBiQOW3qF9a26d2kY1pHtcDkeaJqXRroifc/Rm93dHL6ngLLaadyummpoUmtCxWstLyNfIFQIC0QrMAqgwbzNFmunZKJVRs4+uT9G0MXtcfQP8elr3neF5HvS8Exnu+8SwPUYeTkJ/UHeXsM34wTa2oxpZsznWEWKLaLPnHi/ZeNx2X3cn3dwp7oVREwyO7hd3cHCQueKCYIGCZGDE4g+TTDOEuTgB4+ZBTLSwYsOKGAnilMZKQiZ4JYBgXdLR8xokMsCMBuVQBbEtTcpWk3oYqNLLVMVd0QClmpqOjgCrZqiEZhz1qrZVvu0rue9ajdpVmwGAB6GdorS7Q0KCypTHbc5SMtE5D411YOOfoy+7ujl9LHTjtKG1RtpXqbVx6HCLH1clrNMD0QiQirAa7h1axXTuEJJx7HxvsSfpzFu3yqUrtdquL+BUXXIyk75p+JwvpOGhCfVw147vXmHiI9oAeQsbhBg5/sPPh88ydbJy3Du4O7uZ3TEuI7mR0wLomAkShqDEgESECYticxPJh3cPonhd3cB93NLWxbUsBgKnulzMSE9Nhi3wmoc5fMcxDUVtCtvy6tNmeyyyo1pqiBMlkE6WTWc33RAKW+Gq/N4K1W7UEsTFzFqvaVsv0rue9SneouGLMXJaWfenXQzrlMypcydudcslpdhbY11oWPP00O7ujk9NIzjt1azWTOnbrUrjkMCcfWyGqJwWiBZrJrhMXDa9iuncKJTj0fnPTk/R7abO+SJPmkjYAIIzQLCMdDzfpfMC9AaOZas0GBejy+UL2ne <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

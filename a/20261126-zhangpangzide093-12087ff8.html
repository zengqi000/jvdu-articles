:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">知道这层关系，娶她就不只是娶一个人，是接一条通向香港的路。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">再问第二层：林如意为什么动心？她从小缺父爱，遭遇绑架时，身边所谓朋友没人敢伸手，只有周海洋拼命救她。这份以命相护，对一个渴了很久的人太致命。后来她去他家暂住，他煮了一碗普通的面，偏偏这碗面戳中了她心里最软的地方。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">人缺什么，就容易被什么击中，跟对方给的东西值不值钱没关系。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">第三层问到李阿红头上。母女俩隔阂深，母亲满脑子是赚钱，从没好好陪过女儿。林如意故意在母亲面前和周海洋亲近，甚至搬去同住，说到底是在跟母亲赌气。而李阿红当众搅了那顿答谢饭，把关系闹僵，账单三万多，周海洋根本付不起，最后是程天豹解的围。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">一个母亲越想控场，越把女儿往对方怀里推。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">再往下追，周海洋的野心就露出来了。他先向严平安、欧阳煦亮出警察和税务的身份取得程天豹信任，转头就举报东乐庄园的地下钱庄，借公权力去掏程天豹和李阿红的老底。他想借刀杀人，把两大隐患一次除掉。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">嘴上交底换信任，手上借刀除隐患，这两件事他能同时做。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我记得有次备课，为了一个知识点翻了好几种资料，自以为准备得够全。上课时一个学生随口问了个细节，我才发现自己漏了一整个前提。那次之后我改了习惯，讲之前先站在学生的角度把问题重走一遍。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">自己以为的周全，常常只是没被戳破的疏漏。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">李阿红就是被戳破的那一个。她提携周海洋、防着程天豹，自认把局面握在手里，结果真心提携她的人被架空，她这个当娘的也失了实权。她输的不是识人不清，是把亲情当筹码、把女儿当棋子。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">当你把身边人当成可以摆布的对象，就别怪别人也把你摆上棋盘。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">程天豹到最后被取而代之，李阿红一步步失去说话的分量，这场局里，看似掌控的人其实早被牵着走。<\/p>\n<p style=\"margin:24px 0;line-height:1.85;font-weight:700;padding:14px 0;text-align:center;font-size:18.5px;color:#2f5b42;border-top:1px solid #2f5b42;border-bottom:1px solid #2f5b42;letter-spacing:0;background-color:transparent;\">文末小记<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">林如意那碗面记住的不是味道，是久违的被照顾。这份缺口本该由家人补，却被一个心怀算计的人填上。看这段的时候，我总想起一句话：<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">一个人最容易被拿捏的地方，往往是他最缺爱的那块。<\/strong> 李阿红醒悟得晚，可她至少看清了：女儿要的从来不是她赚来的钱，是她从没给过的那份在意。<\/p>\n<p style=\"margin:32px 0 0;text-align:center;line-height:1;font-size:13px;letter-spacing:10px;color:#2f5b42;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAIh (function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

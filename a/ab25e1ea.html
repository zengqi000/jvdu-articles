<script id="pageData" type="application/json">{"batch": "《伟大的长征》", "latest": ["ab25e1ea"], "articles": [{"id": "ab25e1ea", "title": "《伟大的长征》：6.5万里这四个字，得拆开看才知道有多重", "plain": "《伟大的长征》：6.5万里这四个字，得拆开看才知道有多重\n\n六万五千里不是一趟走完的，是每天走完当天那一段凑出来的。\n\n大结局给了一串数字：各路红军总行程约六万五千里，翻了四十多座高山，其中海拔四千米以上的二十多座，跨过近百条江河，打了六百多场仗。二十二万人上路，走到会师只余五万，十七万人留在途中。\n\n《伟大的长征》｜革命历史剧｜据「民国又见月琉璃」剧评整理\n\n一、听着像口号的大词，落到脚上就是今天这一段\n\n六万五千里，说出来一句话的工夫，可它是雪山上一脚深一脚浅踩出来的。剧里翻夹金山那几集，没有刻意煽情，就是走，踩空一个就少一个，走不动的人坐在雪里再也起不来。\n\n我尤其记得过草地。没路了，人就踩着前头人的脚印走，走错了方向整队都得折回来。把不可能拆成今天要走完的这一段，路才存在。 这句话听着像大道理，放在长征路上是实实在在的活法：今天翻过这座山，明天的事明天再说。\n\n湘江那一仗拍得不长，代价全在数字里。那一战之后队伍减了大半，很多人连名字都没来得及留下。戏没有把这一段拖成哭戏，只是让镜头跟着人群往下走，走不动的人被扶着，扶不动的人被抬着。一支队伍最硬的地方不是打得赢，是打残了还往前挪。\n\n海拔四千米以上那二十多座山，剧里只重点拍了两座。剩下的都融在一句「又翻过一座」里。真正难的不是最险的那座，是把一座接一座都要翻完的那种日常。\n\n巧渡金沙江、飞夺泸定桥那些段落被反复讲，我反倒更记住那些没名字的时刻：修桥的、抬担架的、背锅的、送信的。打仗的胜负是几场仗的事，走到陕北是一天一天攒的事。 戏里给这些人镜头不多，可每个镜头都很实：手上的绳子、肩上的担子、脚上磨破的草鞋。\n\n二、真本事，是把苦活拆成日常\n\n我这行是画画出身，高考复读那一年，专业分要冲全校前列，没什么捷径。每天一张速写，画到手腕发僵，第二天接着来。画室里那沓纸一天天变薄，我数过，四百多张。\n\n有时候画到半夜，一张也画不成，索性把笔放下坐着。可第二天早上还是坐到画架前，重新削一支铅笔。撑住人的从来不是雄心，是第二天照旧坐回去的那一下。 长征也是一样：四十多座山不是一起翻的，是一座一座翻的，最后那段路也没比第一段更轻松。\n\n后来我常觉得，所谓意志力没那么玄。它就是一件件具体的事：今天这一段走完，明天再走下一段。能拆开的事才做得完，拆不开的才叫空话。\n\n有人问我画那些速写图什么，画完也没人看。我说图的是手不凉、眼不钝，日子有个抓手。长征路上那些修桥的、抬担架的，大概也是这么想的，不管能不能被记住，手上的活先干完。把一件事做久了，它自己会长出意义来。\n\n写在最后\n\n大结局那场会师很短，没有长篇讲话，只有两个人抱在一起。十七万人没走到陕北，可这条路是他们一步步走完的。 六万五千里，说到底就是无数个「今天这一段」。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "六万五千里不是一趟走完的，是每天走完当天那一段凑出来的。\n\n大结局给了一串数字：各路红军总行程约六万五千里，翻了四十多座高山，其中海拔四千米以上的二十多座，跨过近百条江河，打了六百多场仗。二十二万人上路，走到会师只余五万，十七万人留在途中。\n\n《伟大的长征》｜革命历史剧｜据「民国又见月琉璃」剧评整理\n\n一、听着像口号的大词，落到脚上就是今天这一段\n\n六万五千里，说出来一句话的工夫，可它是雪山上一脚深一脚浅踩出来的。剧里翻夹金山那几集，没有刻意煽情，就是走，踩空一个就少一个，走不动的人坐在雪里再也起不来。\n\n我尤其记得过草地。没路了，人就踩着前头人的脚印走，走错了方向整队都得折回来。把不可能拆成今天要走完的这一段，路才存在。 这句话听着像大道理，放在长征路上是实实在在的活法：今天翻过这座山，明天的事明天再说。\n\n湘江那一仗拍得不长，代价全在数字里。那一战之后队伍减了大半，很多人连名字都没来得及留下。戏没有把这一段拖成哭戏，只是让镜头跟着人群往下走，走不动的人被扶着，扶不动的人被抬着。一支队伍最硬的地方不是打得赢，是打残了还往前挪。\n\n海拔四千米以上那二十多座山，剧里只重点拍了两座。剩下的都融在一句「又翻过一座」里。真正难的不是最险的那座，是把一座接一座都要翻完的那种日常。\n\n巧渡金沙江、飞夺泸定桥那些段落被反复讲，我反倒更记住 ign:left;letter-spacing:0;background-color:transparent;\">把不可能拆成今天要走完的这一段，路才存在。<\/strong> 这句话听着像大道理，放在长征路上是实实在在的活法：今天翻过这座山，明天的事明天再说。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">湘江那一仗拍得不长，代价全在数字里。那一战之后队伍减了大半，很多人连名字都没来得及留下。戏没有把这一段拖成哭戏，只是让镜头跟着人群往下走，走不动的人被扶着，扶不动的人被抬着。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">一支队伍最硬的地方不是打得赢，是打残了还往前挪。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">海拔四千米以上那二十多座山，剧里只重点拍了两座。剩下的都融在一句「又翻过一座」里。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">真正难的不是最险的那座，是把一座接一座都要翻完的那种日常。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">巧渡金沙江、飞夺泸定桥那些段落被反复讲，我反倒更记住那些没名字的时刻：修桥的、抬担架的、背锅的、送信的。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">打仗的胜负是几场仗的事，走到陕北是一天一天攒的事。<\/strong> 戏里给这些人镜头不多，可每个镜头都很实：手上的绳子、肩上的担子、脚上磨破的草鞋。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、真本事，是把苦活拆成日常<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我这行是画画出身，高考复读那一年，专业分要冲全校前列，没什么捷径。每天一张速写，画到手腕发僵，第二天接着来。画室里那沓纸一天天变薄，我数过，四百多张。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">有时候画到半夜，一张也画不成，索性把笔放下坐着。可第二天早上还是坐到画架前，重新削一支铅笔。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">撑住人的从来不是雄心，是第二天照旧坐回去的那一下。<\/strong> 长征也是一样：四十多座山不是一起翻的，是一座一座翻的，最后那段路也没比第一段更轻松。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">后来我常觉得，所谓意志力没那么玄。它就是一件件具体的事：今天这一段走完，明天再走下一段。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">能拆开的事才做得完，拆不开的才叫空话。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">有人问我画那些速写图什么，画完也没人看。我说图的是手不凉、眼不钝，日子有个抓手。长征路上那些修桥的、抬担架的，大概也是这么想的，不管能不能被记住，手上的活先干完。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">把一件事做久了，它自己会长出意义来。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">大结局那场会师很短，没有长篇讲话，只有两个人抱在一起。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">十七万人没走到陕北，可这条路是他们一步步走完的。<\/strong> 六万五千里，说到底就是无数个「今天这一段」。<\/p>\n<p style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "batch": "《伟大的长征》", "created": "2026-11-16 09:39", "updated": "2026-11-16 09:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

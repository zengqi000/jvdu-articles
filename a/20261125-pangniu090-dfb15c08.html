<script id="pageData" type="application/json">{"batch": "幼儿园接孩子", "latest": ["20261125-pangniu090-dfb15c08"], "articles": [{"id": "20261125-pangniu090-dfb15c08", "title": "放学接孩子，老师最犯愁的3种家长，碍于情面一直没直说", "plain": "放学接孩子，老师最犯愁的3种家长，碍于情面一直没直说\n\n很多家长以为，放学接娃就是把孩子领回家，至于路上那几分钟说什么、怎么做，根本不值一提。可在带过多年中班的幼师眼里，接孩子那十分钟里，家长的一言一行孩子都记着。我认识的幼儿园老师私下聊起，最让她们为难的，是三类接送家长。说白了，老师碍于情面不好当面讲，不代表这事不要紧。它关系到孩子的安全感，也考验家长的分寸。\n\n一、迟迟不到，孩子眼巴巴等到最后\n\n这类家长总卡着点来，班里别的小朋友都被接走了，只剩自家孩子趴在栏杆上往外望。老师走不了，只能留下来陪着，下班计划全打乱。\n\n孩子看着同伴一个个离开，心里容易不安、失落。儿童心理领域有观察提到，长期最后被接走的孩子，更容易往内向那边走，潜意识里觉得自己不被期待。这不是吓唬家长，是提醒你，晚到这件事在孩子心里有重量。\n\n真遇到加班堵车，第一时间私信或打电话告诉老师，让老师和孩子都有个准备。偶尔晚接，见到孩子先抱一抱，温和解释一句：“今天妈妈工作没做完来晚了，让你久等了，咱们回家吧。”\n\n我们小区有位妈妈，有阵子常加班晚到，后来她改成提前给老师发条语音，接到孩子先蹲下来道个歉。没两个月，孩子从一路闷着不说话，变成到家门口就叽叽喳喳讲今天的事。\n\n时间上守住了，接下来是见面第一句话，很多家长恰恰在这里踩了坑。\n\n二、一见到孩子就追问负面\n\n刚接到孩子，第一句不是“今天玩得开心吗”，而是当着老师和孩子的面盘问：“有没有人欺负你？”“老师是不是批评你了？”“有没有吃不饱？”\n\n这类家长习惯性预设幼儿园里会发生不好的事，把焦虑直接传给娃。三到六岁的孩子放学时心理防御最弱，这样的追问会引导他放大不愉快的细节，慢慢对幼儿园抵触，老师还得反复解释，平添很多沟通内耗。\n\n接娃时不妨记住“两问三不问”。不问“今天乖不乖”“有没有人欺负你”“今天学了什么”，换成正向引导：“宝贝，妈妈好想你”“今天在幼儿园有什么好玩的事”“你教教妈妈新学的儿歌好不好”。先接住情绪，再聊事情，让孩子觉得上幼儿园是件值得高兴的事。\n\n话该怎么说清楚了，还有一件是不少家长自己没意识到，接了孩子就堵在门口聊个没完。\n\n三、扎堆闲聊，接了孩子不走\n\n放学那会儿，园门口本来人多拥挤。有些家长接上孩子，拉着别的家长或老师唠家常，一聊就是十几分钟。通道堵了，后面排队的人不好走，老师还得维持秩序，担心孩子在人群里磕碰乱跑。\n\n孩子跟着家长逗留，迟迟不回家，作息也跟着乱了。接送时段沟通最好简洁高效，简单问题随口聊，复杂困惑私下谈。 真有详细情况要了解，提前跟老师约好时间，等老师忙完放学交接、清点人数再单独说。\n\n接到孩子，牵着他的手有序离园，不在门口逗留。你守秩序的样子，孩子都在学。\n\n结语\n\n接孩子不是一次简单的交接。守时、好好说话、不逗留，这三件事看着不起眼，孩子却一件件都记在心里。家长的分寸感，其实就是给孩子的言传身教。\n\n不用急着一次做到满分。明天接娃时，先把第一句问话换一换，孩子回应你的方式，就会不一样。把这点小事稳稳做好，你和孩子都能松快些。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "很多家长以为，放学接娃就是把孩子领回家，至于路上那几分钟说什么、怎么做，根本不值一提。可在带过多年中班的幼师眼里，接孩子那十分钟里，家长的一言一行孩子都记着。我认识的幼儿园老师私下聊起，最让她们为难的，是三类接送家长。说白了，老师碍于情面不好当面讲，不代表这事不要紧。它关系到孩子的安全感，也考验家长的分寸。\n\n一、迟迟不到，孩子眼巴巴等到最后\n\n这类家长总卡着点来，班里别的小朋友都被接走了，只剩自家孩子趴在栏杆上往外望。老师走不了，只能留下来陪着，下班计划全打乱。\n\n孩子看着同伴一个个离开，心里容易不安、失落。儿童心理领域有观察提到，长期最后被接走的孩子，更容易往内向那边走，潜意识里觉得自己不被期待。这不是吓唬家长，是提醒你，晚到这件事在孩子心里有重量。\n\n真遇到加班堵车，第一时间私信或打电话告诉老师，让老师和孩子都有个准备。偶尔晚接，见到孩子先抱一抱，温和解释一句：“今天妈妈工作没做完来晚了，让你久等了，咱们回家吧。”\n\n color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这类家长总卡着点来，班里别的小朋友都被接走了，只剩自家孩子趴在栏杆上往外望。老师走不了，只能留下来陪着，下班计划全打乱。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">孩子看着同伴一个个离开，心里容易不安、失落。儿童心理领域有观察提到，长期最后被接走的孩子，更容易往内向那边走，潜意识里觉得自己不被期待。<strong style=\"font-size:1.1em;font-weight:700;color:#6e4265;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#f3e9f1;\">这不是吓唬家长，是提醒你，晚到这件事在孩子心里有重量。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">真遇到加班堵车，第一时间私信或打电话告诉老师，让老师和孩子都有个准备。偶尔晚接，见到孩子先抱一抱，温和解释一句：“今天妈妈工作没做完来晚了，让你久等了，咱们回家吧。”<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我们小区有位妈妈，有阵子常加班晚到，后来她改成提前给老师发条语音，接到孩子先蹲下来道个歉。没两个月，孩子从一路闷着不说话，变成到家门口就叽叽喳喳讲今天的事。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">时间上守住了，接下来是见面第一句话，很多家长恰恰在这里踩了坑。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#7a4a70;letter-spacing:.02em;border-top:1px solid #e3d6e0;border-bottom:1px solid #e3d6e0;background-color:transparent;\">二、一见到孩子就追问负面<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">刚接到孩子，第一句不是“今天玩得开心吗”，而是当着老师和孩子的面盘问：“有没有人欺负你？”“老师是不是批评你了？”“有没有吃不饱？”<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这类家长习惯性预设幼儿园里会发生不好的事，把焦虑直接传给娃。三到六岁的孩子放学时心理防御最弱，这样的追问会引导他放大不愉快的细节，慢慢对幼儿园抵触，老师还得反复解释，平添很多沟通内耗。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">接娃时不妨记住“两问三不问”。不问“今天乖不乖”“有没有人欺负你”“今天学了什么”，换成正向引导：“宝贝，妈妈好想你”“今天在幼儿园有什么好玩的事”“你教教妈妈新学的儿歌好不好”。<strong style=\"font-size:1.1em;font-weight:700;color:#6e4265;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#f3e9f1;\">先接住情绪，再聊事情，让孩子觉得上幼儿园是件值得高兴的事。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">话该怎么说清楚了，还有一件是不少家长自己没意识到，接了孩子就堵在门口聊个没完。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#7a4a70;letter-spacing:.02em;border-top:1px solid #e3d6e0;border-bottom:1px solid #e3d6e0;background-color:transparent;\">三、扎堆闲聊，接了孩子不走<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">放学那会儿，园门口本来人多拥挤。有些家长接上孩子，拉着别的家长或老师唠家常，一聊就是十几分钟。通道堵了，后面排队的人不好走，老师还得维持秩序，担心孩子在人群里磕碰乱跑。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">孩子跟着家长逗留，迟迟不回家，作息也跟着乱了。<strong style=\"font-size:1.1em;font-weight:700;color:#6e4265;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#f3e9f1;\">接送时段沟通最好简洁高效，简单问题随口聊，复杂困惑私下谈。<\/strong> 真有详细情况要了解，提前跟老师约好时间，等老师忙完放学交接、清点人数再单独说。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">接到孩子，牵着他的手有序离园，不在门口逗留。你守秩序的样子，孩子都在学。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#7a4a70;letter-spacing:.02em;border-top:1px solid #e3d6e0;border-bottom:1px solid #e3d6e0;background-color:transparent;\">结语<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">接孩子不是一次简单的交接。守时、好好说话、不逗留，这三件事看着不起眼，孩子却一件件都记在心里。<strong style=\"font-size:1.1em;font-weight:700;color:#6e4265;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#f3e9f1;\">家长的分寸感，其实就是给孩子的言传身教。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#38343c;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不用急着一次做到满分。明天接娃时，先把第一句问话换一换，孩子回应你的方式，就会不一样。把这点小事稳稳做好，你和孩子都能松快些。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#ded0da;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAH+BLADASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAQIDBAUGBwAI/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAABquiZ5pVzIleFbbA75jSt2+rIoyyZ2W2QYSU6OwUXBs/gndTSoSWiiDbFjmyAkkqnNMI+SjzoYVS2U4z611K21jYuV52nyoglWLZUya6UOUXt2wdrUqUu3LaozaIswFM7ytUvHS2XW3TVJj1Iy0Y81yz1BRLXzrJfqRobTEHwDYmecPImTtkK1WGBnwr6C6ASMnHTYZ0yeMmpXTc41MbEj5snFsrDFDpYHCs48hiuR1bKNZGTONHzhMU1COSgPAQxRacuCTbGxGpaGvN0gdvoGZabETIwVW4JvUTJCcEb8CExBPE0125R26GVdssjB2vJniBks60B6Z+yOCQRJZwVhrzxrAkPdzcS+aUNHJCzbp01cyR5iA5KlyVBlmqw5Vs4awOLzRbrXCqKRr5TxcnFLSss3bTL09NIqnp5ZQODgtRuFHjrh9OzHVcPTlSu+Y0FzwIVS5U4KGYpguUq1llXKqHBFUxnOZwc5AiPs2L7WDciwTTBjMNTaCoWjZs4Xu1HvbzsxXIMQBcATp90paKiKZhbJE2Mw6Khf49OMexjAKMZMzm8ysRLx0Mw7sO4XDd9cZkkYm3mXLRs70Zi <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《走马上任》", "latest": ["851c9942"], "articles": [{"id": "851c9942", "title": "赵本山的徒弟程野直播吐真言：拍新戏《走马上任》时，赵本山死盯现场，把徒弟训得直冒虚汗", "plain": "赵本山的徒弟程野直播吐真言：拍新戏《走马上任》时，赵本山死盯现场，把徒弟训得直冒虚汗\n\n一个人被头衔抬得越高，越容易忘了自己是靠什么被人记住的。\n\n《走马上任》零宣发登顶，播放量破2.19亿，平台热度峰值26495。程野在直播里说，拍这部戏的时候赵本山下了死力气盯现场，把他们训得直冒虚汗，屋里没人敢吭声。\n\n一、他扒掉的不是脸面，是那层“我现在的身份不一样了”\n\n程野这些年晒过劳斯莱斯，晒过六千五百万的别墅，两万一套的睡衣。2026年1月又当选中华曲艺学会副会长。这些东西摞在一起，看着确实体面。\n\n赵本山一个电话打过去，骂的是“还想再封杀一次”。在片场，他当众把这层皮扒了：“你别看你是个什么会长什么主席，那都没用。你要回到舞台上去唱二人转，只有观众的掌声那才是真正的掌声。”\n\n头衔是别人给的，掌声是自己挣的，这两样东西从来不能互换。\n\n他还说了一句：“我这辈子虽然没有火过，但我一直有温度，因为我没有离开过观众。”火是热搜，是短视频里那十五秒的爆点。温度是你站在台上，底下人愿意花两百块买张票，坐俩小时不走。\n\n这话放在一个女人身上，我听着格外有感触。我们这半辈子，被安排的位置太多了：谁家的媳妇、谁的母亲、哪个部门的员工。这些身份听着也体面，可它们跟程野那些头衔一样，是别人给的，说得出口，却撑不住人。\n\n二、我用了十几年，才学会不靠别人给的名分活\n\n我是做软件测试的，现在在一家国企，工资不高但稳定。再往前推，我做过一个月一千八的平面设计，也做过一万八左右的测试，中间隔着的是无数个加班和搬家。\n\n年轻那几年，我最怕别人问我做什么的。答得小声，怕被看轻。刚结婚那阵子，婆媳之间那点事、孩子的事、工作上的内耗，全压在身上，我总想着先把家里顾好，自己的事往后放。放到最后，连自己想吃什么都说不上来。\n\n有一回在饭桌上，好菜都往别人碗里夹，我最后动筷子。那天实在饿，先夹了一筷子，桌上安静了两秒。那两秒我记到现在。\n\n后来慢慢改，先给自己盛一碗，再给别人添。家里那只用了很多年的饭碗边上磕了个小口，我一直没扔。它提醒我：这碗饭得先自己吃稳。\n\n先把自己那碗端稳，才有力气照顾别人。\n\n看《走马上任》这出戏，我最认同的不是那句骂，是背后那个判断：一个人值不值钱，不看名片上印着什么，看离开那个位置之后还有没有人找你。这话对程野成立，对我们这些普通女人也成立。\n\n写在最后\n\n赵本山今年彻底退了，商演不接，综艺不上，定居三亚，每天跑步遛鸟拉二胡。一个什么都不用管的人，还蹲在剧组里跟徒弟磨嘴皮子。他骂的是忘本，其实是在替他们守住那点还没凉的温度。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "一个人被头衔抬得越高，越容易忘了自己是靠什么被人记住的。\n\n《走马上任》零宣发登顶，播放量破2.19亿，平台热度峰值26495。程野在直播里说，拍这部戏的时候赵本山下了死力气盯现场，把他们训得直冒虚汗，屋里没人敢吭声。\n\n一、他扒掉的不是脸面，是那层“我现在的身份不一样了”\n\n程野这些年晒过劳斯莱斯，晒过六千五百万的别墅，两万一套的睡衣。2026年1月又当选中华曲艺学会副会长。这些东西摞在一起，看着确实体面。\n\n赵本山一个电话打过去，骂的是“还想再封杀一次”。在片场，他当众把这层皮扒了：“你别看你是个什么会长什么主席，那都没用。你要回到舞台上去唱二人转，只有观众的掌声那才是真正的掌声。”\n\n头衔是别人给的，掌声是自己挣的，这两样东西从来不能互换。\n\n他还说了一句：“我这辈子虽然没有火过，但我一直有温度，因为我没有离开过观众。”火是热搜，是短视频里那十五秒的爆点。温度是你站在台上，底下人愿意花两百块买张票，坐俩小时不走。\n\n这话放在一个女人身上，我听着格外有感触。我们这半辈子，被安排的位置太多了：谁家的媳妇、谁的母亲、哪个部门的员工。这些身份听着也体面，可它们跟程野那些头衔一样，是别人给的，说得出口，却撑不住人。\n\n二、我用了十几年，才学会不靠别人给的名分活\n\n我是做软件测试的，现在在一家国企，工资不高但稳定。再往前推，我做过一个月一千八的平面设计，也做过一万八左右的测试，中间隔着的是无数个加班和搬家。\n\n年轻那几年，我最怕别人问我做什 :0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">头衔是别人给的，掌声是自己挣的，这两样东西从来不能互换。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">他还说了一句：“我这辈子虽然没有火过，但我一直有温度，因为我没有离开过观众。”火是热搜，是短视频里那十五秒的爆点。温度是你站在台上，底下人愿意花两百块买张票，坐俩小时不走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这话放在一个女人身上，我听着格外有感触。我们这半辈子，被安排的位置太多了：谁家的媳妇、谁的母亲、哪个部门的员工。这些身份听着也体面，可它们跟程野那些头衔一样，是别人给的，说得出口，却撑不住人。<\/p>\n\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、我用了十几年，才学会不靠别人给的名分活<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我是做软件测试的，现在在一家国企，工资不高但稳定。再往前推，我做过一个月一千八的平面设计，也做过一万八左右的测试，中间隔着的是无数个加班和搬家。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">年轻那几年，我最怕别人问我做什么的。答得小声，怕被看轻。刚结婚那阵子，婆媳之间那点事、孩子的事、工作上的内耗，全压在身上，我总想着先把家里顾好，自己的事往后放。放到最后，连自己想吃什么都说不上来。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">有一回在饭桌上，好菜都往别人碗里夹，我最后动筷子。那天实在饿，先夹了一筷子，桌上安静了两秒。那两秒我记到现在。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">后来慢慢改，先给自己盛一碗，再给别人添。家里那只用了很多年的饭碗边上磕了个小口，我一直没扔。它提醒我：这碗饭得先自己吃稳。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">先把自己那碗端稳，才有力气照顾别人。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">看《走马上任》这出戏，我最认同的不是那句骂，是背后那个判断：一个人值不值钱，不看名片上印着什么，看离开那个位置之后还有没有人找你。这话对程野成立，对我们这些普通女人也成立。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">赵本山今年彻底退了，商演不接，综艺不上，定居三亚，每天跑步遛鸟拉二胡。一个什么都不用管的人，还蹲在剧组里跟徒弟磨嘴皮子。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">他骂的是忘本，其实是在替他们守住那点还没凉的温度。<\/strong><\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAJgBDgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAACAwUGAQcI/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB89cyTk7k9j0Pli6giUXssuUB6LJ9XwLuSgcGgmzKS1MmTTWyWMTDHgIfocnnfXHpD/Nms1uUicr9OM8o649Zf5L0PW++RdD193j3Q9jd4z0PZu+MoPZxvH2ATu/OHRfrWBo2ta70Xw14e498PdU+2rxBM9u54ike24XGqNNj6v5T6trz8wu68Wz6LHCX1Dl1AOmftiNK5gLi6PkUkbXOtVQ58biXzwmRpa2lJbcnU9hQudy5vS0G+AHet6uYjkRIm8IaD7enNmvdX+Y9fN6cvN33Poy87TNBnI8lzbbEFPVGW3m1+j1fvlvNM/Ul5e9P01eayJejLzvovRO+drQ9Dz+crcNtbqfLbJnoHMCzSLO4w <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

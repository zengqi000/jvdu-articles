<script id="pageData" type="application/json">{"batch": "《多喜一家人》", "latest": ["770b542f"], "articles": [{"id": "770b542f", "title": "《多喜一家人》原著敢写！赛多喜不在了，赛家五个孩子反倒开挂", "plain": "《多喜一家人》原著敢写！赛多喜不在了，赛家五个孩子反倒开挂\n\n一个家庭的顶梁柱倒了，系统没崩反而更稳，这才是《多喜一家人》原著结局藏得最深的设计。\n\n《多喜一家人》 原著大结局 赛家五兄妹 家庭关系拆解\n\n读《多喜一家人》原著大结局的时候，我习惯性地拿工程师的眼光去看。别人看的是煽情，我看到的是一套系统：一个核心节点失效之后，整个结构是怎么重新找平衡的。\n\n一、五个孩子各自出事，其实是一次压力测试\n\n先捋一遍赛家这五个孩子，你会发现他们几乎同时出了问题，个个都是 Hard 模式。\n\n老大赛秀明，做生意被拖欠货款，因烂桃花跟妻子闹离婚，为救人情敌挨两刀；老二赛秀亮，亲妈被家暴跳河，长成工作狂律师，替朋友担保欠债，还查出晚期肝癌；老三赛秀河月光族，爱上大十岁的女上司，被未来丈人关三楼拆梯子；小女儿赛千金吃醋作散婚姻，打工发现老板是前夫；小儿子赛秀利亲妈卷钱跑路，自卑到离家出走。\n\n表面看是一地鸡毛，其实这是一次把所有隐患一次性逼出来的压力测试。\n\n我做了十几年工程和IT，从土建施工、现场放线测量，到转型软件测试、Java后端、产品设计，踩过的坑不算少。我有个习惯，每次项目出问题，不先急着骂谁，而是画一张图，把每个环节的失效点标出来。因为我知道，一个系统同时暴露一堆问题，往往不是运气差，而是结构早就埋了隐患，只是平时被一个强人压着，没显出来。\n\n赛多喜就是那个强人。他在的时候，五个孩子各自为政，看似太平，其实每个人都在自己的小圈子里打转。他一走，压着的盖子掀开，所有问题一起冒头。这恰恰是重新搭建结构的机会。\n\n二、真正让系统稳下来的，不是钱，是一个共同坐标\n\n那赛家最后为什么没散，反而更团结？\n\n我拆了一下，发现关键不在物质，而在于赛多喜留下了一个“共同坐标”。原著里有个细节：端午家里人聚在一起吃饭，藤椅上没人坐，旁边搁着一杯没喝完的黄酒。就这么一个空位，成了全家的精神锚点。难过的时候，大家会到他坟前倾诉。\n\n一个组织真正的稳定器，从来不是谁最有钱，而是所有人都认同一件看不见的东西。\n\n这在工程上叫基准点。你盖楼、放线、测量，得先有一个所有人都认的基准，否则各量各的，误差越积越大。赛家以前各自为政，就是因为缺一个共同基准。赛多喜走了，他那把空藤椅、那杯黄酒，反而立起了一个所有人都认的基准。大家围着它，方向就一致了。\n\n再看每个人后来的解法，都挺“工程”：老二肝癌，老丈人捐肝、妹夫主刀，等于调来外部资源做了一次关键修复；老大靠妻子闻佳音把家里捋顺，用新生儿把破碎婚姻重新拼合，是重构关系；赛千金病房复婚、赛秀河地震救援感动丈人，都是在极端事件里完成一次硬重启。\n\n我后来从建筑转IT，做过测试、开发、产品设计，现在教机器人，跨了不少界。回头看，每次跨界其实就是一次主动的压力测试：把熟悉的体系拆开，逼自己暴露短板，再重新搭一遍。赛家这五个孩子，也是被生活这么拆了一遍，然后各自重建，最后反而更强。\n\n写在最后。我这个人不爱讲空话，就认一个理：结构稳不稳，看它在失去核心之后还能不能站住。赛多喜走了，赛家没散，端午那顿饭照旧热闹。那杯没人喝的黄酒，就是他们新的基准点。一个家也好，一个团队也好，能让人在难的时候还愿意坐回一张桌子的东西，才是真正扛事的东西。这大概就是《多喜一家人》原著结局，最值得咂摸的地方。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "一个家庭的顶梁柱倒了，系统没崩反而更稳，这才是《多喜一家人》原著结局藏得最深的设计。\n\n《多喜一家人》 原著大结局 赛家五兄妹 家庭关系拆解\n\n读《多喜一家人》原著大结局的时候，我习惯性地拿工程师的眼光去看。别人看的是煽情，我看到的是一套系统：一个核心节点失效之后，整个结构是怎么重新找平衡的。\n\n一、五个孩子各自出事，其实是一次压力测试\n\n先捋一遍赛家这五个孩子，你会发现他们几乎同时出了问题，个个都是 Hard 模式。\n\n老大赛秀明，做生意被拖欠货款，因烂桃花跟妻子闹离婚，为救人情敌挨两刀；老二赛秀亮，亲妈被家暴跳河，长成工作狂律师，替朋友担保欠债，还查出晚期肝癌；老三赛秀河月光族，爱上大十岁的女上司，被未来丈人关三楼拆梯子；小女儿赛千金吃醋作散婚姻，打工发现老板是前夫；小儿子赛秀利亲妈卷钱跑路，自卑到离 是《多喜一家人》原著结局藏得最深的设计。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《多喜一家人》 原著大结局 赛家五兄妹 家庭关系拆解<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">读《多喜一家人》原著大结局的时候，我习惯性地拿工程师的眼光去看。别人看的是煽情，我看到的是一套系统：一个核心节点失效之后，整个结构是怎么重新找平衡的。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、五个孩子各自出事，其实是一次压力测试<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">先捋一遍赛家这五个孩子，你会发现他们几乎同时出了问题，个个都是 Hard 模式。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">老大赛秀明，做生意被拖欠货款，因烂桃花跟妻子闹离婚，为救人情敌挨两刀；老二赛秀亮，亲妈被家暴跳河，长成工作狂律师，替朋友担保欠债，还查出晚期肝癌；老三赛秀河月光族，爱上大十岁的女上司，被未来丈人关三楼拆梯子；小女儿赛千金吃醋作散婚姻，打工发现老板是前夫；小儿子赛秀利亲妈卷钱跑路，自卑到离家出走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">表面看是一地鸡毛，其实这是一次把所有隐患一次性逼出来的压力测试。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我做了十几年工程和IT，从土建施工、现场放线测量，到转型软件测试、Java后端、产品设计，踩过的坑不算少。我有个习惯，每次项目出问题，不先急着骂谁，而是画一张图，把每个环节的失效点标出来。因为我知道，一个系统同时暴露一堆问题，往往不是运气差，而是结构早就埋了隐患，只是平时被一个强人压着，没显出来。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">赛多喜就是那个强人。他在的时候，五个孩子各自为政，看似太平，其实每个人都在自己的小圈子里打转。他一走，压着的盖子掀开，所有问题一起冒头。这恰恰是重新搭建结构的机会。<\/p>\n<p style=\"margin:0 0 20px;text-alig ;text-align:left;letter-spacing:0;background-color:transparent;\">再看每个人后来的解法，都挺“工程”：老二肝癌，老丈人捐肝、妹夫主刀，等于调来外部资源做了一次关键修复；老大靠妻子闻佳音把家里捋顺，用新生儿把破碎婚姻重新拼合，是重构关系；赛千金病房复婚、赛秀河地震救援感动丈人，都是在极端事件里完成一次硬重启。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAJgBDgDASIAAhEBAxEB/8QAHAAAAwEBAQEBAQAAAAAAAAAAAAECAwQFBgcI/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB+SA4UGgAGAjEblVD1LJeowLAC0AAAAAAAAAAAkABuS2yCsvkO3z81zShMNQTWdIAKTG86s0zmUcgttOEPQxnWVh083OtKXE6Gc09cHM92YLdJitJJVTYmmFJ2IHSAhuXTZMV9j8b7R9Jx9fLEgZAyVAJdZs3vlrGujg387N8/rz9fUvoHCAACVFG5E6YSzNabl9i06xgbCBEBYAIALICgFnmNvxdABEgVoRQKGAUSbzbgs0Ie5VQ9AChp0xiCYJUEDFQEBRZPm+j4a+ZhrOdSmIlWaMTlVy7CWpRkDQIhOW6m1Wtay4PqG8buohulgsliNUmMdGaZTtBjO02ZTrKZFzYmFyNOwTCWiWkUk9GDPuceLuJAgAgAAAAKWeqljpyqN6weLspalLQEZbk5OlO1dHTLAtAKSZcoGkgaAAAAAeXXJr4+myilYwAciGCGgAsAcqAqhGs04e1kmpYmlAWgFAqWVTSUFmHhe384vNU+nL5k6BlG+EJlQAqkCBMRA6mjTNVl53ppnrNaIbQqQh0slqMy1CVlmee8GE7RWUbRc4zrNzmrLMzRXKGkc0lKliKI9D6T5T6jKhtYGTKGVIxUME07E0xNBV5EvTpxuOjnBTsXbqIo6yQJQCgoskZLKpaSMuUBKAJ86fQed5d8ek5ZvZp5+h2vl0jclqi0SAzQOaQwQyILKQ1YOTcqs3uaPO6YKywKmNMa4fL9PydMfQ8vqjHWrOTl6+WSafWvJNSsjWaky5GmpcaY1Vzpnb1mpqqiqtMiqTaqbM3JbQmY1SVlmeXREY57xqYRvmxlOs6kDWoKkygYgYANV9b8j9LJ3sWYDKQ1CVCyNxm2XMsBDKQAAA0R29XlabvqVw7am5FU0PQAEMENEgrBClYCexPL1c9cvn/AEJHx/L9txYfJP3fPxrnvKc3r04NDsfNtFgQASgFgAAAhgmAAtRuHuaPJ6linpOPwvqfI6PL7ebaOXXg1jXi1yy09Dg9LTi5+vmlzdKSCplChZ1z1zq7V43TdSxpLrRDh0hbItpoUpNiZlpJnSDONo1OeN5Z542iyFa1nMZcyNUAIwGn7vhe1J7YyRDCRqACVMaIASaQASQdqGCAoAKqEdPR5709W/N6NOoy10oCxAKpuSU0gAM9Pm8+5341Z7Onh7aerlh1Vwed9JMfHcn2/Dzvyd+z5+LjrjOXXfHVvac9mgqRFBBRLIEAAACGW   }

  function allImageSrcs() {
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《兰香如故》", "latest": ["db6398a4"], "articles": [{"id": "db6398a4", "title": "《兰香如故》皇上怎么穿紫色袍服？皇帝不都是穿黄袍吗？", "plain": "《兰香如故》皇上怎么穿紫色袍服？皇帝不都是穿黄袍吗？\n\n别人都说皇帝穿黄，可《兰香如故》偏给他换紫，这跟过日子一样，得自己心里有数。\n《兰香如故》｜来源：公众号「小吴侃事」｜孔连顺饰皇帝｜剧照来自来稿\n\n《兰香如故》里那身紫团龙袍，我第一眼没觉得怪，倒是想起生活里常听到的一句话：别人都这么穿。朋友看剧时也顺口说了类似的话，皇帝不都穿黄吗。我们太习惯拿多数人的做法当标准，久了就忘了问一句，这标准到底是谁定的，又管不管用。\n\n一、黄色不是一开始就专属，紫色也不是谁都能碰\n\n来稿把这事说得很细。先秦天子按四时换青红白黑黄；秦代大朝尚黑；汉代接着换；魏晋南北朝礼制乱，深红、青、紫都穿过。那时候没人给皇帝定死一个颜色，规矩是慢慢长出来的。\n\n到了隋朝，柘黄袍出现，是后世黄袍的源头。唐高祖禁臣民用赤黄，唐高宗再禁浅黄，黄色这才彻底划归皇帝，宋元明清跟着沿用。所谓自古如此，往往只是某段历史被重复得够多。 皇帝的礼服本来就不止一套，祭祀、朝会、宴饮各穿各的，颜色跟着场合走。\n\n紫色更不是能随便用的颜色。唐宋公服里三品以上才准用紫；唐代皇帝也有紫色戎服，《新唐书》里有记载。明代禁的是臣民穿紫，皇帝不在禁令内，万历皇帝爱穿紫袍，穿到褪色还穿，《入跸图》里那件团龙紫袍就是证据。剧组给皇上换紫，不是破规矩，是把一条被忽略的旧规矩重新摆出来。\n\n二、穿什么颜色，最后还是要自己拿主意\n\n来源文章说剧组有两个考虑：暗紫衬得皇帝仁厚又心思深，也能跟满屏明黄的古装剧拉开距离。我读到这儿，想到的不是剧组，是自家衣柜。\n\n我以前特别在意别人怎么看。刚工作时工资不高，买件外套要犹豫半天，怕同事说不合时宜，怕家里人说我乱花钱。衣柜里有件浅紫风衣，买回来只穿了一次，就因为有人随口说了句太挑人，我把它塞进最里层，一挂好几年。后来人到中年，做过平面设计，也做软件测试，工资从一千八到一万八都经历过，慢慢就不那么听了。前年收拾衣柜，我把那件风衣翻出来，袖口有点发黄，穿上照镜子，发现自己反倒比以前更敢穿了。\n\n那件风衣没变，变的是我不再拿别人的眼光当尺子。剧里给皇帝换紫袍，难的也不是找布料，是敢把观众的默认认知拨开。 我那件压箱底的浅紫，和这身龙袍隔着几百年，道理却差不多：颜色穿在身上，判断得留在自己手里。\n\n“别人都这么穿”是最省事的说法，也是最省事的放弃。 真要看懂一件事，总得先弄明白它为什么是现在这个样子。\n\n写在最后\n\n回到标题那句：皇帝不都是穿黄袍吗？还真不是。黄袍是唐代以后才收紧的规则，紫袍在明代皇帝身上有记载、有画像。剧组选紫，是选了人设，也选了考据。日子里的很多“都这样”，跟明黄龙袍一样，只是被重复久了而已。 看清来路，才有可能挑自己真正想穿的那件。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "别人都说皇帝穿黄，可《兰香如故》偏给他换紫，这跟过日子一样，得自己心里有数。\n《兰香如故》｜来源：公众号「小吴侃事」｜孔连顺饰皇帝｜剧照来自来稿\n\n《兰香如故》里那身紫团龙袍，我第一眼没觉得怪，倒是想起生活里常听到的一句话：别人都这么穿。朋友看剧时也顺口说了类似的话，皇帝不都穿黄吗。我们太习惯拿多数人的做法当标准，久了就忘了问一句，这标准到底是谁定的，又管不管用。\n\n一、黄色不是一开始就专属，紫色也不是谁都能碰\n\n来稿把这事说得很细。先秦天子按四时换青红白黑黄；秦代大朝尚黑；汉代接着换；魏晋南北朝礼制乱，深红、青、紫都穿过。那时候没人给皇帝定死一个颜色，规矩是慢慢长出来的。\n\n到了隋朝，柘黄袍出现，是后世黄袍的源头。唐高祖禁臣民用赤黄，唐高宗再禁浅黄，黄色这才彻底划归皇帝，宋元明清跟着沿用。所谓自古如此，往往只是某段历史被重复得够多。 皇帝的礼服本来就不止一套，祭祀、朝会、宴饮各穿各的，颜色跟着场合走。\n\n紫色更不是能随便用的颜色。唐宋公服里三品以上才准用紫；唐代皇帝也有紫色戎服，《新唐书》里有记载。明代禁的是臣民穿紫，皇帝不在禁令内，万历皇帝爱穿紫袍，穿到褪色还穿，《入跸图》里那件团龙紫袍就是证据。剧组给皇上换紫，不是破规矩，是把一条被忽略的旧规矩重新摆出来。\n\n二、穿什么颜色，最后还是要自己拿主意\n\n来源文章说剧组有两个考虑：暗紫衬得皇帝仁厚又心思深，也能跟满屏明黄的古装剧拉开距离。我 r-spacing:0;background-color:transparent;\">到了隋朝，柘黄袍出现，是后世黄袍的源头。唐高祖禁臣民用赤黄，唐高宗再禁浅黄，黄色这才彻底划归皇帝，宋元明清跟着沿用。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">所谓自古如此，往往只是某段历史被重复得够多。<\/strong> 皇帝的礼服本来就不止一套，祭祀、朝会、宴饮各穿各的，颜色跟着场合走。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">紫色更不是能随便用的颜色。唐宋公服里三品以上才准用紫；唐代皇帝也有紫色戎服，《新唐书》里有记载。明代禁的是臣民穿紫，皇帝不在禁令内，万历皇帝爱穿紫袍，穿到褪色还穿，《入跸图》里那件团龙紫袍就是证据。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">剧组给皇上换紫，不是破规矩，是把一条被忽略的旧规矩重新摆出来。<\/strong><\/p>\n\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、穿什么颜色，最后还是要自己拿主意<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">来源文章说剧组有两个考虑：暗紫衬得皇帝仁厚又心思深，也能跟满屏明黄的古装剧拉开距离。我读到这儿，想到的不是剧组，是自家衣柜。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我以前特别在意别人怎么看。刚工作时工资不高，买件外套要犹豫半天，怕同事说不合时宜，怕家里人说我乱花钱。衣柜里有件浅紫风衣，买回来只穿了一次，就因为有人随口说了句太挑人，我把它塞进最里层，一挂好几年。后来人到中年，做过平面设计，也做软件测试，工资从一千八到一万八都经历过，慢慢就不那么听了。前年收拾衣柜，我把那件风衣翻出来，袖口有点发黄，穿上照镜子，发现自己反倒比以前更敢穿了。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">那件风衣没变，变的是我不再拿别人的眼光当尺子。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">剧里给皇帝换紫袍，难的也不是找布料，是敢把观众的默认认知拨开。<\/strong> 我那件压箱底的浅紫，和这身龙袍隔着几百年，道理却差不多：颜色穿在身上，判断得留在自己手里。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">“别人都这么穿”是最省事的说法，也是最省事的放弃。<\/strong> 真要看懂一件事，总得先弄明白它为什么是现在这个样子。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">回到标题那句：皇帝不都是穿黄袍吗？还真不是。黄袍是唐代以后才收紧的规则，紫袍在明代皇帝身上有记载、有画像。剧组选紫，是选了人设，也选了考据。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">日子里的很多“都这样”，跟明黄龙袍一样，只是被重复久了而已。<\/strong> 看清来路，才有可能挑自己真正想穿的那件。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAHhArkDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAwABAgQFBgf/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfLpQlHQ7JnDpmJIhuOaggkmdJJIbpkEnigkzSBnSBM7AySBJMDpISScbO7ISTgydDZztJBoHZXVsADWnBPPVurSinTTJIEzoGZ2BOziSSG6SBJIGToIqTBFOwkYNhVJiAm7Z69oeezsChODnRs17EaZbOzJxlCoGmm1WdnYym5I2K7kLndFd7DhWc6GBzuFdSiDpnBSi4OkgUXYEkgSSEknGnZA6ToZOhtZi0uENgYZT7meJt6tUioMcPRk45Fl5T3556Zq05IylrIMltdBkLYdGKttMxW2RhkKUdJZOwkzpjM6BrADJzBYAruWa1lPPZ2BRkzm/Zr2I0y2dmTGQdZjKEjVacJsISBJanGchCCLLJJTmovJBKBBtZNe7S3xTpDdpIIqSA9+XR89ctLv2ZwUe/ZPz4ndMHEl7JI45+viVx7ddUDnumfWyoeE5cbu8doZe+bXuxtS/Ld1+e6s7gNXNatDYsXB5PNQlJIjJOCUnCLTYICOBmMybowSTMSTAk0hIjurlBjKi <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';

  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';

      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

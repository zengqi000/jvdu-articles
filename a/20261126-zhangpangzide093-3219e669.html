olor:transparent;\">真正让闻佳音下定决心的，是丈夫那场出轨。对象怀了孩子，公公一听有孙子，转头劝她大度。孩子无辜这话没错，可拿它来堵一个受害者的嘴，就不厚道了。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">劝人宽容之前，先问问那份宽容要谁来买单。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">她离了婚，接手婚纱作坊，一点点做大。赛家这边，工程队交到儿子和新欢手里，被搅得一团糟，还被人下了套。这时候赛秀亮上门了，从前骂大嫂有多凶，现在低头就有多难看，换来的是一顿不留情面的回怼。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我改作业的时候有过类似的体会：一个孩子平时被说得最多的那科，往往后来最不愿意碰。不是他笨，是被否定久了，心里那点想做好的劲被磨没了。后来我特意把他的作业单独留着，批注写具体哪一步有进步，慢慢地他愿意交了。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">人被看见，才肯把真本事拿出来。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">闻佳音在赛家的处境就是这样：脏活累活是她扛，功劳簿上没她的名，想自主还要被防着。她离开不是赌气，是把力气收回来做自己的事。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">一个女人真正站稳，靠的从来不是谁批准，是自己手里有活、账上有钱。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">再看赛家父子后来的下场。公公查出重病，儿子欠下巨债，站上天台的是当初最看不起她的小叔子。天道好轮回这话不必喊得响，摆出来就够了。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">当初把人往死里压，如今求人救命，这账算得清清楚楚。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">偏心狭隘的家长，以为压住一个人就能保住家业，最后亲手把儿子拖垮，把能撑事的人推远。<\/p>\n<p style=\"margin:24px 0;line-height:1.85;font-weight:700;padding:14px 0;text-align:center;font-size:18.5px;color:#2f5b42;border-top:1px solid #2f5b42;border-bottom:1px solid #2f5b42;letter-spacing:0;background-color:transparent;\">最后想说<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#31372f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">这剧最解气的一处，不是闻佳音赚了多少钱，是她挣钱之后那副不回头的样子。她没有去辩解自己这些年受了多大委屈，只是把日子过好了，让当年那些看轻她的人自己看明白。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#fbeae7;\">有时候最好的回击，就是活得比他们预想的更好。<\/strong><\/p>\n<p style=\"margin:32px 0 0;text-align:center;line-height:1;font-size:13px;letter-spacing:10px;color:#2f5b42;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAIhBQADASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECAwQFBgcI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAHzlXwKoo5WIa1yMbLG+jaRXSkcqg0e4IorYyO0yUBUAVrgltC/ztLKY11p0scwpHNe5FVGOEAfLBIE4xRKKgIioCNVpSCuGiSCIo7LEVmXGiqMvRDqOlWa072fcy30blO5z9M12jew6rlyDax3rz3BHGcX7HzTy4FZa/XhZtYbXl1eXRi0zmWGXfB7VSs4mSxg1ySihmqyp2XxPKbh7GannPY+dRVHQqAKjklI5oFm/nXw9ssYfUtcKI6s40lZUMlZZtMZcBZ0dytNbDW1J16ZYpY0nmhmRMNdmI1zB05WrSsjeaH1Bm3USIKmqAMUBJXmgAlilCOzBYHntVoCoo7DVUImuQER7BMVqhA1rRTq2Jqpy+Nui5diohta5V3whjlZJGjkE0G2b8kV6Rjn6oQuvZgKrkY9k7QgZbUVBL0TWXx2/wA1QSMkqXTMmJV7Fac1GpuRiMmfA5qx   bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

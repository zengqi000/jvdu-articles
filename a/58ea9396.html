<script id="pageData" type="application/json">{"batch": "《谷雨》", "latest": ["58ea9396"], "articles": [{"id": "58ea9396", "title": "《谷雨》大结局，严平安“辞职”是假的，薛凝的“温柔”才是真刀子", "plain": "《谷雨》大结局，严平安“辞职”是假的，薛凝的“温柔”才是真刀子\n\n严平安摔警服和薛凝递牛奶，看着一明一暗两件事，拆开看其实是同一道题的两种解法：弱者怎么撬动强者那块铁板。\n\n《谷雨》大结局我一共看了两遍。第一遍跟着弹幕走，替严平安憋屈；第二遍我把人物关系在纸上捋了一遍，才发现问题根本不在辞职是真是假，而在这部剧把两个棋子摆成了对照组。\n\n一、主动跳进火坑的人，先把退路堵死\n\n先把严平安这条线拆开。他干了半辈子刑警，被沈启光穿小鞋，开枪之后没人替他说话，然后辞职、摔警服、转身投奔周海洋。表面看是一个老警察被逼崩了，可你把这个动作放到整盘棋里看，逻辑完全相反。\n\n一个在队里混了半辈子的人，心理防线早炼出来了，沈启光那点手段不至于让他崩。他偏偏崩得干脆，崩给谁看，崩给周海洋身边那些眼线看。周海洋是垄云县水产骗税那摊烂账的总操盘手，试探过严平安不止一回，两人还为分赃的事拍桌子摔杯子，严平安指着鼻子骂他把脑袋别裤腰带上。那场架不是失控，是设计，一个因为分赃不均闹脾气的合伙人，比一个忠心耿耿的跟班更让人不设防。他把自己伪装成一个可以被情绪带着走的人，等于主动把退路堵死，逼着对手相信他就是个莽撞的同伙。\n\n真正的卧底，不是藏得最深的那个人，是演得最像的那个人。\n\n这套东西我熟。我最早是做建筑的，现场放线测量、编工程资料，后来跨行做测试、写 Java、做产品设计，现在教机器人。每换一个领域我都得先把人家的活儿拆成步骤，哪一步在讲道理，哪一步其实在埋坑。严平安这出戏拆开就是一份周密的实施方案，目标、伪装、试探反馈、风险控制，一步不缺。他不是在发泄情绪，他是在执行一个把自己当耗材的方案。\n\n二、被推着走的人，连自己站在哪边都慢慢看不清\n\n再看薛凝，这条线就没那么痛快了。她在欧阳煦最低谷时出现，温柔体贴，主动提去北京，事业有成的女强人偏要跟着一个落魄男人，图上什么，剧情往下走才揭底，她是曹亦新的人。\n\n她的高明在于从不演坏。煲汤、陪聊、帮着分析案子，好得是真的好，欧阳煦自己都说你比我妈还操心。可正因为真，才最难防。曹亦新需要一个稳住欧阳煦的人，这个人太轴，软硬不吃，正面攻不破，就从侧面渗。薛凝的任务是两层，一层情感拉拢，一层监视，他见了谁、查了什么、手里攥着什么牌，全都要传回去。那杯热牛奶那段最典型，欧阳煦半夜接完匿名电话脸色铁青，她端着牛奶进去轻声问怎么了，他说没事，她就不问，只把手搭在他肩上，镜头扫过她低垂的眼睛，那里头没有心疼，只有盘算。她不用问，反应本身就是情报。\n\n温柔用对了地方是港湾，用错了地方就是绳子。\n\n严平安和薛凝，一个主动调动对手，一个被对手调动。严平安每一步是自己选的，薛凝每一步是被人推着走的。我做过几年产品设计，最怕的就是那种模糊不落地的需求，你以为自己在做判断，其实每个选项都是别人限定好的。薛凝的处境就是这样，她被安插进去，接任务时大概也说过就这一回，后来一回变两回，两回变无数回。她做的伤害是实打实的，没什么好开脱，可一个被推着走的人，最难的往往不是使坏，是慢慢忘了自己原本想去哪。\n\n写在最后\n\n曹亦新背后七把保护伞，明面冲锋的欧阳煦被人叫草芥，硬碰硬碎的只会是自己。所以严平安选了用最不像警察的方式当警察，薛凝被安排成最不像棋子的棋子。剧把这些摆出来，其实问的是一道很朴素的题：当对手比你强太多，你是宁可把自己当耗材去撬，还是在被推着走的过程里，把站在哪一边这件事也一并弄丢了。大结局没把话说满，留着这个空白，反倒比给个痛快的答案更值得琢磨。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "严平安摔警服和薛凝递牛奶，看着一明一暗两件事，拆开看其实是同一道题的两种解法：弱者怎么撬动强者那块铁板。\n\n《谷雨》大结局我一共看了两遍。第一遍跟着弹幕走，替严平安憋屈；第二遍我把人物关系在纸上捋了一遍，才发现问题根本不在辞职是真是假，而在这部剧把两个棋子摆成了对照组。\n\n一、主动跳进火坑的人，先把退路堵死\n\n先把严平安这条线拆开。他干了半辈子刑警，被沈启光穿小鞋，开枪之后没人替他说话，然后辞职、摔警服、转身投奔周海洋。表面看是一个老警察被逼崩了，可你把这个动作放到整盘棋里看，逻辑完全相反。\n\n一个在队里混了半辈子的人，心理防线早炼出来了，沈启光那点手段不至于让他崩 argin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《谷雨》大结局我一共看了两遍。第一遍跟着弹幕走，替严平安憋屈；第二遍我把人物关系在纸上捋了一遍，才发现问题根本不在辞职是真是假，而在这部剧把两个棋子摆成了对照组。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、主动跳进火坑的人，先把退路堵死<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">先把严平安这条线拆开。他干了半辈子刑警，被沈启光穿小鞋，开枪之后没人替他说话，然后辞职、摔警服、转身投奔周海洋。表面看是一个老警察被逼崩了，可你把这个动作放到整盘棋里看，逻辑完全相反。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">一个在队里混了半辈子的人，心理防线早炼出来了，沈启光那点手段不至于让他崩。他偏偏崩得干脆，崩给谁看，崩给周海洋身边那些眼线看。周海洋是垄云县水产骗税那摊烂账的总操盘手，试探过严平安不止一回，两人还为分赃的事拍桌子摔杯子，严平安指着鼻子骂他把脑袋别裤腰带上。那场架不是失控，是设计，一个因为分赃不均闹脾气的合伙人，比一个忠心耿耿的跟班更让人不设防。他把自己伪装成一个可以被情绪带着走的人，等于主动把退路堵死，逼着对手相信他就是个莽撞的同伙。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">真正的卧底，不是藏得最深的那个人，是演得最像的那个人。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这套东西我熟。我最早是做建筑的，现场放线测量、编工程资料，后来跨行做测试、写 Java、做产品设计，现在教机器人。每换一个领域我都得先把人家的活儿拆成步骤，哪一步在讲道理，哪一步其实在埋坑。严平安这出戏拆开就是一份周密的实施方案，目标、伪装、试探反馈、风险控制，一步不缺。他不是在发泄情绪，他是在执行一个把自己当耗材的方案。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx 8px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">再看薛凝，这条线就没那么痛快了。她在欧阳煦最低谷时出现，温柔体贴，主动提去北京，事业有成的女强人偏要跟着一个落魄男人，图上什么，剧情往下走才揭底，她是曹亦新的人。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">她的高明在于从不演坏。煲汤、陪聊、帮着分析案子，好得是真的好，欧阳煦自己都说你比我妈还操心。可正因为真，才最难防。曹亦新需要一个稳住欧阳煦的人，这个人太轴，软硬不吃，正面攻不破，就从侧面渗。薛凝的任务是两层，一层情感拉拢，一层监视，他见了谁、查了什么、手里攥着什么牌，全都要传回去。那杯热牛奶那段最典型，欧阳煦半夜接完匿名电话脸色铁青，她端着牛奶进去轻声问怎么了，他说没事，她就不问，只把手搭在他肩上，镜头扫过她低垂的眼睛，那里头没有心疼，只有盘算。她不用问，反应本身就是情报。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">温柔用对了地方是港湾，用错了地方就是绳子。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">严平安和薛凝，一个主动调动对手，一个被对手调动。严平安每一步是自己选的，薛凝每一步是被人推着走的。我做过几年产品设计，最怕的就是那种模糊不落地的需求，你以为自己在做判断，其实每个选项都是别人限定好的。薛凝的处境就是这样，她被安插进去，接任务时大概也说过就这一回，后来一回变两回，两回变无数回。她做的伤害是实打实的，没什么好开脱，可一个被推着走的人，最难的往往不是使坏，是慢慢忘了自己原本想去哪。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAFyA2YDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYAAQf/xAAaAQADAQEBAQAAAAAAAAAAAAABAgMABAUG/9oADAMBAAIQAxAAAAH5P7H3p5+jPtoe2RGiQU3db3wBiB0xBactgx2K3LXaSMU6E1dEWepme6WecWrc+zY4hgj3514p6uJ3o8y+4/ZbYXYlw7PjpOqyXX45169tTm0erzGpmleTeZdeot5dfgAj1NQZQ4yuiNSDhjG82HTkuqgTE4eg/iVnztvi6t73vC3lsb9mNN 7Ago3DJv8A7LEBWiErAhOJAdE1ZyjebPyTdjeT6OuCdPRtW1cd+8Ju94k0rS5Z+DjMDUvn5pX/AJo3kxN7Zomh7z5+4mrq4HuYmKwaPtNH/wA/y1+ltMsJfeej8KBP2M+/PzN02904+01T7T6TaNsJswjHR7+jZzhPxZ+d+5+GOpqm2faT801fafa/yz7j9z7B+Z9/n8/af0+YDWaI+8z7x+c/G9JG/wB/onacox9B9Pdn+TX7z+Ht6b8H9T+jzCaj/wAk0zdGlK6zZ7EHV8T3jtCbwbbLPs5//9k=\" alt=\"剧照\"><\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">曹亦新背后七把保护伞，明面冲锋的欧阳煦被人叫草芥，硬碰硬碎的只会是自己。所以严平安选了用最不像警察的方式当警察，薛凝被安排成最不像棋子的棋子。剧把这些摆出来，其实问的是一道很朴素的题：当对手比你强太多，你是宁可把自己当耗材去撬，还是在被推着走的过程里，把站在哪一边这件事也一并弄丢了。大结局没把话说满，留着这个空白，反倒比给个痛快的答案更值得琢磨。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["严平安把警服摔副驾、转头投奔周海洋，如果换成是你，你敢拿自己半辈子的名声演这出卧底吗？", "那场跟周海洋拍桌子摔杯子的吵架，原来全是演给眼线看的，我倒回去看了两遍才反应过来。", "我数了一下，严平安这出戏目标、伪装、试探、兜底一步不缺，简直像份实施方案，你们看第几集看出来的？", "薛凝端牛奶进去那段我越想越冷，她低垂的眼睛里全是盘算，一点心疼都没有，你们觉得她动过真心吗？", "一个主动跳火坑还自己浇油，一个坐着不动每根线都过她手，这两枚棋子你们更服哪一个？", "一个事业有成的女人，凭什么在男人最落魄时死心塌地，要是你突然遇到个薛凝，你会怎么判断她的来路？", "被曹亦新安插进去的人，接任务时说一句就这一回，后来一回变两回，你们身边见过这种回不了头的人吗？", "欧阳煦被人叫草芥、背后七把保护伞，这种硬碰硬必碎的局，换你会选择硬扛还是绕着来？", "我做过设计最怕模糊不落地的需求，薛凝那种每个选项都被人限定好的处境，看着真挺窒息的。", "结尾没说严平安警服穿没穿回去、薛凝有没有把自己捞出来，你们觉得这个留白是本事还是偷懒？"], "batch": "《谷雨》", "created": "2026-11-19 09:39", "updated": "2026-11-19 09:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

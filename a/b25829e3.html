<script id="pageData" type="application/json">{"batch": "《走马上任》", "latest": ["b25829e3"], "articles": [{"id": "b25829e3", "title": "程野在直播里吐了真言：拍《走马上任》那阵子，赵本山下了死力气盯现场，徒弟被训得直冒虚汗", "plain": "程野在直播里吐了真言：拍《走马上任》那阵子，赵本山下了死力气盯现场，徒弟被训得直冒虚汗\n\n现场盯得越狠，说明这活儿的验收标准越硬，容不下糊弄。\n\n《走马上任》零宣发空降，76.47的指数登顶，播放量2.19亿，平台热度峰值26495，刷新了板凳单元的纪录。程野在直播里说，拍那阵子赵本山下了死力气盯现场，要求严格，把他们训得直冒虚汗。一个人都退下来了，还蹲在剧组里一遍遍跟徒弟磨嘴皮子。\n\n一、他盯的不是演得好不好，是有没有把基本功当回事\n\n赵本山今年彻底退了。女儿球球七月在直播里说，商演不接，综艺不上，定居三亚，每天跑步遛鸟拉二胡。一个退了休的人，本来可以什么都不说，什么都不管。可他还是在片场蹲着。\n\n程野演反派黄金虎，戏份不少。师父盯的却不是他这场戏演得好不好，是这帮人下了戏之后还记不记得自己从哪儿来的。\n\n本山传媒的徒弟大多从撂地唱二人转起来，靠的是嘴皮子磨出来的功夫。现在直播间里喊两句老铁，带货佣金比唱一年戏都多。王小虎晒过流水，全年126万，直播占了90万，到手只剩25%。\n\n基本功不挣钱的时候，才最考验人还认不认它。\n\n赵本山那句“你要回到舞台上去唱二人转，只有观众的掌声那才是真正的掌声”，说的就是这个。掌声是最原始的验收单，没有剪辑，没有滤镜，也没有回放。\n\n二、我做过的每一行，验收线都是别人拿尺子量的\n\n我是学建筑工程施工管理的，毕业后干过土建施工、现场放线测量、工程资料编制。刚入行那年，师傅说线放歪了楼就歪了，差两毫米都得返工，没人替你在验收单上签字。\n\n那几年我养成了个毛病，看见什么都想先找那条线在哪。后来跨界进IT，做软件测试，这条线变成了数据：点几下都正常不算通过，数据一多就崩照样打回。再往后转Java开发、做产品设计，现在在厦门当机器人老师，带学生搭机器人、写程序，验收线又变成了“换个场地还能不能跑”。\n\n有一回课上讲传感器阈值，一个孩子死活不肯改示例里的数值，说上次就是这个数。我把示教器接上去，带他看实时读数，屏幕上的数字跳得厉害，他才明白那个值只是那天那间教室的光。那台示教器边角磨得发白，我到现在还留着。\n\n糊弄出来的效果，换个场地就露馅。\n\n赵本山在片场干的事，跟我干的其实是同一件事：不看你嘴上说得怎么样，看你在真场上能不能站住。他骂的是“忘本”，可“本”之所以被忘，是因为“本”不值钱了。这话听着丧，但很实在。一个师父用最传统的方式，试图拽住一群被流量拽着跑的人，拽不拽得住，得看徒弟自己。\n\n写在最后\n\n《走马上任》这部剧争议不小，一边刷“爷青回”，一边甩“加长版春晚小品”。可片场那顿骂跟剧好不好看没关系。观众不会替你签字，他们只会用看不看下去投票。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "现场盯得越狠，说明这活儿的验收标准越硬，容不下糊弄。\n\n《走马上任》零宣发空降，76.47的指数登顶，播放量2.19亿，平台热度峰值26495，刷新了板凳单元的纪录。程野在直播里说，拍那阵子赵本山下了死力气盯现场，要求严格，把他们训得直冒虚汗。一个人都退下来了，还蹲在剧组里一遍遍跟徒弟磨嘴皮子。\n\n一、他盯的不是演得好不好，是有没有把基本功当回事\n\n赵本山今年彻底退了。女儿球球七月在直播里说，商演不接，综艺不上，定居三亚，每天跑步遛鸟拉二胡。一个退了休的人，本来可以什么都不说，什么都不管。可他还是在片场蹲着。\n\n程野演反派黄金虎，戏份不少。师父盯的却不是他这场戏演得好不好，是这帮人下了戏之后还记不记得自己从哪儿来的。\n\n本山传媒的徒弟大多从撂地唱二人转起来，靠的是嘴皮子磨出来的功夫。现在直播间里喊两句老铁，带货佣金比唱一年戏都多。王小虎晒过流水，全年126万，直播占了90万，到手只剩25%。\n\n基本功不挣钱的时候，才最考验人还认不认它。\n\n赵本山那句“你要回到舞台上去唱二人转，只有观众的掌声那才是真正的掌声”，说的就是这个。掌声是最原始的验收单，没有剪辑，没有滤镜，也没有回放。\n\n二、我做过的每一行，验收线都是别人拿尺子量的\n\n我是学建筑工程施工管理的，毕业后干过土建施工、现场放线测量、工程资料编制。刚入行那年，师傅说线放歪了楼就歪了，差两毫米都得返工，没人替你在验收单上签字 >程野演反派黄金虎，戏份不少。师父盯的却不是他这场戏演得好不好，是这帮人下了戏之后还记不记得自己从哪儿来的。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">本山传媒的徒弟大多从撂地唱二人转起来，靠的是嘴皮子磨出来的功夫。现在直播间里喊两句老铁，带货佣金比唱一年戏都多。王小虎晒过流水，全年126万，直播占了90万，到手只剩25%。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">基本功不挣钱的时候，才最考验人还认不认它。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">赵本山那句“你要回到舞台上去唱二人转，只有观众的掌声那才是真正的掌声”，说的就是这个。掌声是最原始的验收单，没有剪辑，没有滤镜，也没有回放。<\/p>\n\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、我做过的每一行，验收线都是别人拿尺子量的<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我是学建筑工程施工管理的，毕业后干过土建施工、现场放线测量、工程资料编制。刚入行那年，师傅说线放歪了楼就歪了，差两毫米都得返工，没人替你在验收单上签字。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">那几年我养成了个毛病，看见什么都想先找那条线在哪。后来跨界进IT，做软件测试，这条线变成了数据：点几下都正常不算通过，数据一多就崩照样打回。再往后转Java开发、做产品设计，现在在厦门当机器人老师，带学生搭机器人、写程序，验收线又变成了“换个场地还能不能跑”。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">有一回课上讲传感器阈值，一个孩子死活不肯改示例里的数值，说上次就是这个数。我把示教器接上去，带他看实时读数，屏幕上的数字跳得厉害，他才明白那个值只是那天那间教室的光。那台示教器边角磨得发白，我到现在还留着。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">糊弄出来的效果，换个场地就露馅。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">赵本山在片场干的事，跟我干的其实是同一件事：不看你嘴上说得怎么样，看你在真场上能不能站住。他骂的是“忘本”，可“本”之所以被忘，是因为“本”不值钱了。这话听着丧，但很实在。一个师父用最传统的方式，试图拽住一群被流量拽着跑的人，拽不拽得住，得看徒弟自己。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《走马上任》这部剧争议不小，一边刷“爷青回”，一边甩“加长版春晚小品”。可片场那顿骂跟剧好不好看没关系。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">观众不会替你签字，他们只会用看不看下去投票。<\/strong><\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAJgBDgDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAAECAwQFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfGkVBRCgQFc0HvjkzXIq521HixqqWOY9sRIqawAWAACgj2vlWOSMQCgBEFAABRRoAoE0qOQQURNrG3Jvv4rEfL0c32PHdd35Yvn/oHn/PbGPYw1tqXXKgXxKK3nrmmtUlqJNPVeLbzM6rLZbrELpCoySNR8ehnVRNKjjq121e1jDt68smMzXcs+Ru17nlhF59kkyk3y1jJauu3JE1qcS2wva3fK5LnEuiykS3Jc5Zb0deOzRdmCaDaQaFWJzTXseE0M0pJHJnUdWzX3gRUuXMeyxytdCNc20AZQAcANRU1BUUAAVCHuYqzAY6Aig1xQ1zZIUVNYALAAAFV7HSujkjRAKAEAAAFc1VaqCOBZVY9iuAU3cLdmvQo3Lz78t1vK9V25Y/n3oXn3LcbHsub9iO1rjE6V0kL5H   }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

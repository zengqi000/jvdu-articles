<script id="pageData" type="application/json">{"batch": "《嫁金钗》", "latest": ["450c442f"], "articles": [{"id": "450c442f", "title": "我看完48小时就破万的《嫁金钗》，忽然就理解谭松韵了，大眼睛这东西，怼在镜头前真是把双刃剑", "plain": "我看完48小时就破万的《嫁金钗》，忽然就理解谭松韵了，大眼睛这东西，怼在镜头前真是把双刃剑\n\n大眼睛不算演技毛病，镜头一贴近，它把演员没管住的那点力放大了十几倍。\n\n《嫁金钗》开播两天，优酷站内热度破万，央视八套首播收视峰值一点二。豆瓣短评区没吵剧情，吵的是田曦薇那双眼睛。君黛训婢女那场，婢女说错一句话，她眼睛瞪圆，声音往上拔，红眼线配着大红唇正对镜头，弹幕刷的是五官乱飞，有人还专门造了个词，叫干拔式演技。\n\n《嫁金钗》· 2026 年 · 优酷、央视八套播出 · 田曦薇一人分饰阿丑、君黛\n\n我也觉得过了。后来把谭松韵翻出来重看，才知道这话说得早。\n\n一、镜头靠得越近，越藏不住手上那点力气\n\n《兰香如故》九月播的时候，弹幕也在说她老瞪眼，当时不少人直接判了演技下滑。那部戏里忍的戏特别多，前二十集连掌家权都没拿到，被大太太压着一场接一场地忍。忍戏最吃眼睛，眼眶先红，眼角发抖，然后才慢慢抬眼看人，这一套要走完得有时间，也得有镜头肯等。\n\n田曦薇在《嫁金钗》里演了两个人，阿丑和君黛。阿丑没人骂，阿丑的眼神是往下垂的，说话低着头，被赌鬼父亲打的时候整个人缩着，那股憋着的劲儿全在肩膀和下巴上。君黛的戏份不一样，几乎全是爆发，这个角色在剧里的设定就是跋扈骄纵，走路都往上挑着下巴，一场收着的都没有。一个被夸一个被骂，差的不是眼睛，是这个角色有没有给她留出收的空间。\n\n眼睛大的人有个天生的亏吃，一急，眼白先出来。你试试把眼睛睁到平时两倍，小眼睛的人只是撑开了些，大眼睛的人已经是一整片白。平时面对面还不明显，离得远，可镜头怼到脸上，等于把这张脸放大十几倍。镜头放大的从来不只是情绪，还有你没管住的那一点力。\n\n二、留不出收的空间，从来不只是演员一个人的事\n\n现在的古装剧有个毛病，前三秒必须炸。竖屏刷惯了，手指一动就划走，演员一上来就得把情绪砸到脸上，瞪眼是最快的办法，不用铺垫不用前情，一秒钟就让人知道这人在生气。可长剧不是这么看的，长剧要前面积累后面才炸，炸完还得有余味。把短剧的演法搬进四十集，等于让一个人从第一集喊到最后一集，喊到后面就没坡可上了。\n\n君黛这个角色，剧本递给她的就是骄纵跋扈四个字。她连一场把话咽回去的戏都没有，观众看到的不是她控制不住，是这个人物被写成了只能往外冲的样子。她不是不会收，是剧本没给她留一场收的戏。换个方向看，谭松韵那边成立得刚好相反：忍戏之所以看得进去，是因为角色的处境真的把人压住了，被大太太压着，掌家权拿不到，主动权不在自己手上，眼睛才有一层一层的东西可演。\n\n带学生备赛那阵子，有个孩子第一次调六轴机械臂，兴奋得不行，把关节速度参数一把拉到满格，按下启动，手臂甩出去，砸在台面上，限位块都撞歪了。他站在那儿说机器不行。我让他把记满参数的那张纸拿过来，速度砍掉一半，回程加一小段缓冲，机器跑了一整夜，一次没撞。第二天他问我，为什么慢下来反而准了。我说不是慢，是每一段动作收尾都得留一小截空。演员的爆发也一样，前面那截空被剪辑剪掉，观众就只剩下甩出去的那一下。\n\n更麻烦的是看剧的方式也变了，很多人刷到的就是一个十几秒的切片，前后文全没有，情绪一炸，结论就下了。《嫁金钗》自己还有个坎，原著讲的是贵女谈条件嫁人，聘金十万，五年不得和离，剧版改成了真假千金、身世调包、底层互撕，人物的前史被压掉，演员只能拿表演去填剧本挖的坑。数据倒是真的漂亮，开播四十八小时热度破万，二十几个国家和地区进了前十。\n\n写在最后\n\n所以下次再看到谁瞪眼，先别急着说演技差。有可能她只是长了一双镜头不肯放过的眼睛，也可能那一场戏，本来就没打算让她收着演。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "大眼睛不算演技毛病，镜头一贴近，它把演员没管住的那点力放大了十几倍。\n\n《嫁金钗》开播两天，优酷站内热度破万，央视八套首播收视峰值一点二。豆瓣短评区没吵剧情，吵的是田曦薇那双眼睛。君黛训婢女那场，婢女说错一句话，她眼睛瞪圆，声音往上拔，红眼线配着大红唇正对镜头，弹幕刷的是五官乱飞，有人还专门造了个词，叫干拔式演技。\n\n《嫁金钗》· 2026 年 · 优酷、央视八套播出 · 田曦薇一人分饰阿丑、君黛\n\n我也觉得过了。后来把谭松韵翻出来重看，才知道这话说得早 ackground-color:transparent;\">《嫁金钗》开播两天，优酷站内热度破万，央视八套首播收视峰值一点二。豆瓣短评区没吵剧情，吵的是田曦薇那双眼睛。君黛训婢女那场，婢女说错一句话，她眼睛瞪圆，声音往上拔，红眼线配着大红唇正对镜头，弹幕刷的是五官乱飞，有人还专门造了个词，叫干拔式演技。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《嫁金钗》· 2026 年 · 优酷、央视八套播出 · 田曦薇一人分饰阿丑、君黛<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我也觉得过了。后来把谭松韵翻出来重看，才知道这话说得早。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、镜头靠得越近，越藏不住手上那点力气<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《兰香如故》九月播的时候，弹幕也在说她老瞪眼，当时不少人直接判了演技下滑。那部戏里忍的戏特别多，前二十集连掌家权都没拿到，被大太太压着一场接一场地忍。忍戏最吃眼睛，眼眶先红，眼角发抖，然后才慢慢抬眼看人，这一套要走完得有时间，也得有镜头肯等。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAFEAqcDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAIBAwQFBgf/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAcHM6fNnp5XN6XMeeOuypyoDkZWKJiZCQFMklGrNobvwaMgKyskzLcn0/XcP1vN6GrqZujG8OzJjjslx2kHgSzMiQYKWHVNEsWarSxR01aKg43A9b5+suLz/AFPlNeemLatMHyaKqnNTopURIVMBIKABEgKSBDAEzD0n2ZNNr1miu7dchqXy1telir5plF+znbKnqClriczocbk0yczbgeeWm2pwsxLkZWVSEoJiWNI5UXLpDHnuqENEpN1MXq89tHqfO+r5/R2aa8yfQfFqaumLE5kiiYgFICUBBTkLNCMo0W2E6atNYZuV2sAed5fd5+mPl7Lo15cNsu459W3M4pHSoiYlERMUQAIACZWWM9c0XX5dDXsLMmvpXHmVy0dqmVPNchd0eb0mdADS lor:transparent;\">眼睛大的人有个天生的亏吃，一急，眼白先出来。你试试把眼睛睁到平时两倍，小眼睛的人只是撑开了些，大眼睛的人已经是一整片白。平时面对面还不明显，离得远，可镜头怼到脸上，等于把这张脸放大十几倍。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">镜头放大的从来不只是情绪，还有你没管住的那一点力。<\/strong><\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、留不出收的空间，从来不只是演员一个人的事<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">现在的古装剧有个毛病，前三秒必须炸。竖屏刷惯了，手指一动就划走，演员一上来就得把情绪砸到脸上，瞪眼是最快的办法，不用铺垫不用前情，一秒钟就让人知道这人在生气。可长剧不是这么看的，长剧要前面积累后面才炸，炸完还得有余味。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">把短剧的演法搬进四十集，等于让一个人从第一集喊到最后一集，喊到后面就没坡可上了。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">君黛这个角色，剧本递给她的就是骄纵跋扈四个字。她连一场把话咽回去的戏都没有，观众看到的不是她控制不住，是这个人物被写成了只能往外冲的样子。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">她不是不会收，是剧本没给她留一场收的戏。<\/strong>换个方向看，谭松韵那边成立得刚好相反：忍戏之所以看得进去，是因为角色的处境真的把人压住了，被大太太压着，掌家权拿不到，主动权不在自己手上，眼睛才有一层一层的东西可演。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">带学生备赛那阵子，有个孩子第一次调六轴机械臂，兴奋得不行，把关节速度参数一把拉到满格，按下启动，手臂甩出去，砸在台面上，限位块都撞歪了。他站在那儿说机器不行。我让他把记满参数的那张纸拿过来，速度砍掉一半，回程加一小段缓冲，机器跑了一整夜，一次没撞。第二天他问我，为什么慢下来反而准了。我说不是慢，是每一段动作收尾都得留一小截空。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">演员的爆发也一样，前面那截空被剪辑剪掉，观众就只剩下甩出去的那一下。<\/strong><\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:bl 没有，情绪一炸，结论就下了。《嫁金钗》自己还有个坎，原著讲的是贵女谈条件嫁人，聘金十万，五年不得和离，剧版改成了真假千金、身世调包、底层互撕，人物的前史被压掉，演员只能拿表演去填剧本挖的坑。数据倒是真的漂亮，开播四十八小时热度破万，二十几个国家和地区进了前十。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">所以下次再看到谁瞪眼，先别急着说演技差。有可能她只是长了一双镜头不肯放过的眼睛，也可能那一场戏，本来就没打算让她收着演。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["带学生调机械臂那会儿，你是那个一上来就把参数拉满的人，还是先留余量的那个？", "如果你是君黛，剧本只给你「跋扈骄纵」四个字，一场咽话的戏都没有，你演得下去吗？", "阿丑没人骂、君黛被骂，你觉得这口气该算在演员头上，还是算在剧本头上？", "忍戏要眼眶先红、眼角发抖、再慢慢抬眼，你觉得这种戏在短视频时代还有几个人愿意看完？", "同一双眼睛，离远了好看，贴到镜头前就失控，你身上有没有一样东西也是这样？", "你带过一个特别急的新人吗，他撞了墙之后，你是让他慢下来，还是换个人上？", "前三秒必须炸才留得住人，你要是做剧的，你会往前三秒塞高潮，还是敢让第一集慢一点？", "镜头把脸放大十几倍，你最怕被人放大看的是哪一部分？", "如果一场戏的力气是导演要的，最后挨骂的却是演员，这账该怎么算？", "你身边有没有那种「收着演」的人，一开始看着不起眼，越看越有东西？"], "batch": "《嫁金钗》", "created": "2026-11-18 17:02", "updated": "2026-11-18 17:02"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

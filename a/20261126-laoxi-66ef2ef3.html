<script id="pageData" type="application/json">{"batch": "60后晚年四篇", "latest": ["20261126-laoxi-66ef2ef3"], "articles": [{"id": "20261126-laoxi-66ef2ef3", "title": "渐老的60后：和儿女再亲，这四件事也别交底", "plain": "渐老的60后：和儿女再亲，这四件事也别交底\n\n咱们60后大半辈子都在为家里转，年轻时上班养家，中年拉扯孩子、照看老人，一晃就过了花甲。人老了，心里攒下的话，最想说给身边最亲的人听，也就是孩子。可这些年我慢慢明白，和孩子再亲，也得留一层分寸。有些事烂在自己心里，日子反而清爽，摊开说了，倒容易添堵。晚年过得安不安稳，一半靠心态，一半就靠这份懂藏事的清醒。\n\n一、手里那点养老钱，别跟孩子交底\n\n咱们这代人节俭惯了，一分钱掰两半花，攒下的那点钱，是往后过日子的底气。可有人偏喜欢把存款数跟孩子说得明明白白。\n\n我们楼里的老周，今年七十一，前些年跟儿子念叨自己存了二十来万。没多久，儿子换房张嘴就要十五万，侄子也跟着来借。老周抹不开面子，钱借出去，自己看病反倒要开口跟孩子讨。\n\n说白了，孩子知道你有积蓄，容易生出父母不缺这点的依赖；兄弟姐妹一比较，又容易起隔阂。守住老底不是不信孩子，是不给亲情添负担。你手头宽裕，孩子的担子自然轻些。\n\n钱的事守住，身体的事，也别什么都往孩子耳朵里灌。\n\n二、身体的小痛小病，别天天挂着说\n\n人过六十，腰酸背痛、头晕乏力都是常事。可有些人一有不舒服，就天天跟孩子念叨，一遍遍地说。\n\n我认识的刘阿姨，七十二了，膝盖疼，每周给女儿打三四回电话诉苦。女儿上班接到电话就心神不宁，干脆买了台理疗仪寄回来。刘阿姨用了一阵，疼还是那个疼，女儿的心倒先累了。\n\n其实孩子不是不关心，是怕你难受又搭不上手。小毛病按时吃药、规律作息、自己留神调理就够。心态放宽，身子反倒硬朗；天天念叨，把一份牵挂变成了孩子的负担。\n\n身体别放大，心里的旧账，更不能翻出来反复讲。\n\n三、过往的委屈心酸，别翻来覆去地说\n\n咱们这代人苦过累过，谁手里没几桩陈年旧事？年轻时受的委屈、跟亲友的隔阂，都真实存在。可过去的事就是过去了，再讲也改不了一分一毫。\n\n隔壁楼的陈叔，老伴走得早，一个人把两个孩子拉扯大。这些年他总跟儿女提当年吃了多少苦、受了多少白眼。孩子们小时候听着心疼，听得多了，慢慢就沉默了。陈叔后来跟我念叨，他才回过味来，翻旧账暖不了自己的心，还把孩子推远了。\n\n孩子没经历过我们的苦，很难真懂那份委屈。反复提，只会让他们跟着压抑。放下过往不是忘苦，是不再让苦拖着一家人的心。\n\n旧事放下了，眼下对儿女的那点不满，也得分寸拿捏。\n\n四、对儿女的不满，别随口就抱怨\n\n天下父母都盼孩子过得好。可孩子成家后有自己的活法，很多时候跟我们想的不一样。\n\n楼上一位大姐，六十五，儿子结婚后小两口手头紧，她逢人就说儿子不会过日子、儿媳不会持家。话传到小两口耳朵里，儿媳当场红了眼，儿子也跟她生分了不少。她后来才懂，嘴上那点抱怨换不来孩子争气，只换来一堵墙。\n\n孩子有孩子的压力和难处。真有想法，挑个心平气和的时候好好说一句；更多时候睁一只眼闭一只眼，日子反而顺。少一句抱怨，多一分体谅，家里的气就顺了。\n\n写在最后\n\n和儿女之间留点分寸，不是疏远，是让彼此都待得舒服。该守的养老钱守住，该放的旧事放下，跟孩子说话多留一分余地，看着都是不说，其实是把晚年的主动权，稳稳攥回了自己手里。\n\n老哥哥老姐姐们，有些话，咱们轻轻收在心里就好。日子终究是自己的，心里宽了，晚年自然舒坦。愿咱们都少些牵挂、多些自在，平平安安把每一天过踏实。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "咱们60后大半辈子都在为家里转，年轻时上班养家，中年拉扯孩子、照看老人，一晃就过了花甲。人老了，心里攒下的话，最想说给身边最亲的人听，也就是孩子。可这些年我慢慢明白，和孩子再亲，也得留一层分寸。有些事烂在自己心里，日子反而清爽，摊开说了，倒容易添堵。晚年过得安不安稳，一半靠心态，一半就靠这份懂藏事的清醒。\n\n一、手里那点养老钱，别跟孩子交底\n\n咱们这代人节俭惯了，一分钱掰两半花，攒下的那点钱，是往后过日子的底气。可有人偏喜欢把存款数跟孩子说得明明白白。\n\n我们楼里的老周，今年七十一，前些年跟儿子念叨自己存了二十来万。没多久，儿子换房张嘴就要十五万，侄子也跟着来借。老周抹不开面子，钱借出去，自己看病反倒要开口跟孩子讨。\n\n说白了，孩子知道你有积蓄，容易生出父母 ter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">一、手里那点养老钱，别跟孩子交底<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">咱们这代人节俭惯了，一分钱掰两半花，攒下的那点钱，是往后过日子的底气。可有人偏喜欢把存款数跟孩子说得明明白白。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我们楼里的老周，今年七十一，前些年跟儿子念叨自己存了二十来万。没多久，儿子换房张嘴就要十五万，侄子也跟着来借。老周抹不开面子，钱借出去，自己看病反倒要开口跟孩子讨。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">说白了，孩子知道你有积蓄，容易生出父母不缺这点的依赖；兄弟姐妹一比较，又容易起隔阂。守住老底不是不信孩子，是不给亲情添负担。你手头宽裕，孩子的担子自然轻些。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">钱的事守住，身体的事，也别什么都往孩子耳朵里灌。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">二、身体的小痛小病，别天天挂着说<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">人过六十，腰酸背痛、头晕乏力都是常事。可有些人一有不舒服，就天天跟孩子念叨，一遍遍地说。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我认识的刘阿姨，七十二了，膝盖疼，每周给女儿打三四回电话诉苦。女儿上班接到电话就心神不宁，干脆买了台理疗仪寄回来。刘阿姨用了一阵，疼还是那个疼，女儿的心倒先累了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">其实孩子不是不关心，是怕你难受又搭不上手。小毛病按时吃药、规律作息、自己留神调理就够。心态放宽，身子反倒硬朗；天天念叨，把一份牵挂变成了孩子的负担。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">身体别放大，心里的旧账，更不能翻出来反复讲。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">三、过往的委屈心酸，别翻来覆去地说<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">咱们这代人苦过累过，谁手里没几桩陈年旧事？年轻时受的委屈、跟亲友的隔阂，都真实存在。可过去的事就是过去了，再讲也改不了一分一毫。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">隔壁楼的陈叔，老伴走得早，一个人把两个孩子拉扯大。这些年他总跟儿女提当年吃了多少苦、受了多少白眼。孩子们小时候听着心疼，听得多了，慢慢就沉默了。陈叔后来跟我念叨，他才回过味来，翻旧账暖不了自己的心，还把孩子推远了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">孩子没经历过我们的苦，很难真懂那份委屈。反复提，只会让他们跟着压抑。放下过往不是忘苦，是不再让苦拖着一家人的心。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">旧事放下了，眼下对儿女的那点不满，也得分寸拿捏。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">四、对儿女的不满，别随口就抱怨<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">天下父母都盼孩子过得好。可孩子成家后有自己的活法，很多时候跟我们想的不一样。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">楼上一位大姐，六十五，儿子结婚后小两口手头紧，她逢人就说儿子不会过日子、儿媳不会持家。话传到小两口耳朵里，儿媳当场红了眼，儿子也跟她生分了不少。她后来才懂，嘴上那点抱怨换不来孩子争气，只换来一堵墙。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">孩子有孩子的压力和难处。真有想法，挑个心平气和的时候好好说一句；更多时候睁一只眼闭一只眼，日子反而顺。少一句抱怨，多一分体谅，家里的气就顺了。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">和儿女之间留点分寸，不是疏远，是让彼此都待得舒服。该守的养老钱守住，该放的旧事放下，跟孩子说话多留一分余地，看着都是不说，其实是把晚年的主动权，稳稳攥回了自己手里。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">老哥哥老姐姐们，有些话，咱们轻轻收在心里就好。日子终究是自己的，心里宽了，晚年自然舒坦。愿咱们都少些牵挂、多些自在，平平安安把每一天过踏实。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dddad5;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAIfBQADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYBAAf/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAGscPQcfMThH+eAE1DpdtHV+e0jlzldFnHmwEa0ctjsVwubeJ2I2QuVHI+kNMBIu5KSTmkXjK2hBTS6ZInOogQMcNpmjOpU+r0KeLYUTtwqsgjWQWGZzUraKLHgJ6sdutwDORqetHmGeWuD1qnlkNKhTeOFpgbhLR16dZyT81nVLrvsuGoPYL2mMsczpsxMroyba3cUINC2CDYIMpyTYlb0OjXomeFIBHAlh2hFd5HzZfq8t1GyzmtnslqQp1EigafKVWnDoN3l6J1dKJ <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>

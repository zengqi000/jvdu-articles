<script id="pageData" type="application/json">{"batch": "周末拉开差距", "latest": ["20261126-pangniudexinhao-39f96bfa"], "articles": [{"id": "20261126-pangniudexinhao-39f96bfa", "title": "同一个班的孩子慢慢拉开距离，拼的不是天赋和刷题，是周末怎么过", "plain": "同一个班的孩子慢慢拉开距离，拼的不是天赋和刷题，是周末怎么过\n\n同一个班上课，作业本交上来都差不多，可过了一个学期，有的孩子越学越松快，有的开始跟不上了。不少爸妈把这归因到天赋，或者怪刷题不够多，于是周六日排满了班和卷子。带毕业班的老师看得清楚：真正把孩子拉开的，是没人盯着的那两天周末。\n\n周末到底是补差的时间，还是喘口气的时间，很多家庭一直没想明白。排满和放养，看着是两种极端，其实都把这两天浪费掉了。真正会用周末的家庭，抓的是下面这四件事。\n\n一、先回头看错题，比多刷一套卷子管用\n\n不少家庭的周末是从买新卷子开始的，旧卷子往桌角一摞，孩子埋头往下写。有位妈妈给孩子连报了三门课，周六从早坐到晚，结果周一上课眼神发飘，老师讲过的灵活题还是不会转弯。\n\n道理不复杂。孩子在学校跟着进度往前走，白天根本没空回头看，错题和半懂的知识点一层层压着。一直往里塞新东西，看着学了很多，底下是空的。复盘是把洞补上，刷题只是把任务堆高。\n\n周末先拿出错题本，一条条分清：是概念没弄懂，还是单纯粗心，或者题目没读明白。分完类再动手，比闷头刷新题省一半力气。漏洞不清，到了初中知识点一难，就会一起冒出来。\n\n错题理清楚了，接下来的问题是：这些事该谁安排。\n\n二、把时间表交回孩子手里，他才学会管自己\n\n平时的作息是学校排好的，几点上课、几点交作业，孩子照着走就行。只有周末，是一周里唯一能练自己安排时间的时候。\n\n可不少爸妈把周末也排得满满的，几点写、几点练、几点背，一条条下指令。孩子照做没问题，但从来没练过自己决定。我认识的一位爸爸，周末只跟孩子商量当天要完成哪几件，剩下时间让孩子自己分。有一回孩子非要先玩再写，结果晚上赶作业赶到很晚，第二天自己就记住了。自己扛过一次后果，比家长催十遍都管用。\n\n具体做法不难：把必须做的事放在一起商量，写完作业、理完错题，剩下的时间怎么分配交给孩子。他安排得乱，别急着推翻，周末结束一起回头看看哪里卡住了，下次再调。到了高年级科目一多，能不能自己排时间，差距一下就显出来。\n\n孩子能自己安排了，还得给他留点什么都不安排的时间。\n\n三、留白不是浪费，理解力是在闲下来时长出来的\n\n一提周末，很多家长第一反应是别闲着。看书要有用，玩要能说得出好处，连发呆都觉得亏。可真正决定孩子能不能学深的，恰恰是这些看起来不出成绩的部分。\n\n阅读、拆装东西、蹲在楼下观察蚂蚁、趴在窗边乱想，这些事不产出分数，却撑着孩子的理解和想象。只会刷题的孩子，碰到没见过的题型容易卡住，因为他见的都是标准样子。认知的底子宽，孩子才有地方拐弯。\n\n每天留一段完全自由的时间，不布置任务、不追问收获。两个娃小时候我也跟风报过兴趣班，一算费用又犹豫，最后改成一人先试一样，试满一学期再说，坐得住的留下，坐不住的就收了。现在大的那个周末还会自己铺开纸画半天，这事让我明白：留白不是放任，是给孩子机会找到自己愿意投入的东西。\n\n留白解决的是脑子怎么长，情绪解决的是孩子还愿不愿意学。\n\n四、把这一周的累放一放，下周才有力气\n\n一周五天课加上测验，孩子攒下的压力不比大人少。这些情绪不会自己消失，只会憋成磨蹭、顶嘴和一句「我不想写」。\n\n有位妈妈发现，女儿每到周日晚上就莫名发火，作业拖到很晚。后来她把周六下午改成出门走路，不聊成绩，就随便说闲话。走了两三周，孩子晚上不再闹，写作业也利索了。孩子不是懒，是攒了一周的气没地方出。\n\n周末安排一次运动，或者出门走走，吃饭时聊点跟学习无关的闲事。孩子说学校里的委屈，先听完再回应，别急着讲道理。人歇过来了，新一周才坐得住。要是家长自己也累，就先把自己那口气顺一顺，别把坏情绪带到饭桌上。\n\n结语\n\n周末两天看着短，却是孩子一年里最能自己长出本事的一段。天赋改不了，刷题只能补一时，能长期起作用的，是回头看错题的习惯、自己排时间的本事、闲下来还能想着点什么的好奇，以及情绪被接住之后的稳当。\n\n不用把日程排得让人喘不过气，也别彻底撒手不管。作息稳住，要紧事先做，再给孩子留一段能自己说了算的时间，就够了。今晚不妨问问孩子：这个周末，你想先做哪一件？\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感 tyle=\"margin:30px 0 0;text-align:center;font-size:12px;letter-spacing:.18em;color:#6b4e9e;line-height:22px;background-color:transparent;\">· 家庭教育 ·<\/p>\n\n<p style=\"margin:0 0 24px;padding:16px 18px;border-left:3px solid #6b4e9e;border-radius:8px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:0;background-color:#f7f5fb;\">同一个班上课，作业本交上来都差不多，可过了一个学期，有的孩子越学越松快，有的开始跟不上了。不少爸妈把这归因到天赋，或者怪刷题不够多，于是周六日排满了班和卷子。带毕业班的老师看得清楚：<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">真正把孩子拉开的，是没人盯着的那两天周末。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">周末到底是补差的时间，还是喘口气的时间，很多家庭一直没想明白。排满和放养，看着是两种极端，其实都把这两天浪费掉了。真正会用周末的家庭，抓的是下面这四件事。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、先回头看错题，比多刷一套卷子管用<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不少家庭的周末是从买新卷子开始的，旧卷子往桌角一摞，孩子埋头往下写。有位妈妈给孩子连报了三门课，周六从早坐到晚，结果周一上课眼神发飘，老师讲过的灵活题还是不会转弯。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">道理不复杂。孩子在学校跟着进度往前走，白天根本没空回头看，错题和半懂的知识点一层层压着。一直往里塞新东西，看着学了很多，底下是空的。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">复盘是把洞补上，刷题只是把任务堆高。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">周末先拿出错题本，一条条分清：是概念没弄懂，还是单纯粗心，或者题目没读明白。分完类再动手，比闷头刷新题省一半力气。漏洞不清，到了初中知识点一难，就会一起冒出来。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">错题理清楚了，接下来的问题是：这些事该谁安排。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、把时间表交回孩子手里，他才学会管自己<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">平时的作息是学校排好的，几点上课、几点交作业，孩子照着走就行。只有周末，是一周里唯一能练自己安排时间的时候。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">可不少爸妈把周末也排得满满的，几点写、几点练、几点背，一条条下指令。孩子照做没问题，但从来没练过自己决定。我认识的一位爸爸，周末只跟孩子商量当天要完成哪几件，剩下时间让孩子自己分。有一回孩子非要先玩再写，结果晚上赶作业赶到很晚，第二天自己就记住了。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">自己扛过一次后果，比家长催十遍都管用。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">具体做法不难：把必须做的事放在一起商量，写完作业、理完错题，剩下的时间怎么分配交给孩子。他安排得乱，别急着推翻，周末结束一起回头看看哪里卡住了，下次再调。到了高年级科目一多，能不能自己排时间，差距一下就显出来。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">孩子能自己安排了，还得给他留点什么都不安排的时间。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">三、留白不是浪费，理解力是在闲下来时长出来的<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">一提周末，很多家长第一反应是别闲着。看书要有用，玩要能说得出好处，连发呆都觉得亏。可真正决定孩子能不能学深的，恰恰是这些看起来不出成绩的部分。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">阅读、拆装东西、蹲在楼下观察蚂蚁、趴在窗边乱想，这些事不产出分数，却撑着孩子的理解和想象。只会刷题的孩子，碰到没见过的题型容易卡住，因为他见的都是标准样子。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">认知的底子宽，孩子才有地方拐弯。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">每天留一段完全自由的时间，不布置任务、不追问收获。两个娃小时候我也跟风报过兴趣班，一算费用又犹豫，最后改成一人先试一样，试满一学期再说，坐得住的留下，坐不住的就收了。现在大的那个周末还会自己铺开纸画半天，这事让我明白：留白不是放任，是给孩子机会找到自己愿意投入的东西。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">留白解决的是脑子怎么长，情绪解决的是孩子还愿不愿意学。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">四、把这一周的累放一放，下周才有力气<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">一周五天课加上测验，孩子攒下的压力不比大人少。这些情绪不会自己消失，只会憋成磨蹭、顶嘴和一句「我不想写」。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">有位妈妈发现，女儿每到周日晚上就莫名发火，作业拖到很晚。后来她把周六下午改成出门走路，不聊成绩，就随便说闲话。走了两三周，孩子晚上不再闹，写作业也利索了。<strong style=\"font-size:1.1em;font-weight:700;color:#c0392b;padding:0;border-radius:0;text-align:left;letter-spacing:0;background-color:transparent;\">孩子不是懒，是攒了一周的气没地方出。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">周末安排一次运动，或者出门走走，吃饭时聊点跟学习无关的闲事。孩子说学校里的委屈，先听完再回应，别急着讲道理。人歇过来了，新一周才坐得住。要是家长自己也累，就先把自己那口气顺一顺，别把坏情绪带到饭桌上。<\/p>\n<p style=\"margin:35px 0 18px;font-size:18px;line-height:32px;font-weight:700;color:#1a1a1a;border-left:4px solid #6b4e9e;padding:0 0 0 12px;text-align:left;letter-spacing:0;background-color:transparent;\">结语<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">周末两天看着短，却是孩子一年里最能自己长出本事的一段。天赋改不了，刷题只能补一时，能长期起作用的，是回头看错题的习惯、自己排时间的本事、闲下来还能想着点什么的好奇，以及情绪被接住之后的稳当。<\/p>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:28px;color:#3a3a3a;text-align:justify;letter-spacing:.01em;background-color:transparent;\">不用把日程排得让人喘不过气，也别彻底撒手不管。作息稳住，要紧事先做，再给孩子留一段能自己说了算的时间，就够了。今晚不妨问问孩子：这个周末，你想先做哪一件？<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAH/BLADASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAQIDBAUGBwAI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAHWw7mu7ua7u5gcII7u5Pu7g7h5oOHk+7hAOHgDh4O4eaCm3OlwWUiSg5IDIaJq2dRqJ048xCu2GnwXYWbwG8HPV8bieZPmBwg0FGvWV5XZX0ZMqolyuUFBE1JSu2PPMr0Kap9zueER1zKBwETh4AASgUBCgCHKIAEBkA4SF7uAoG4CAcGGEDIMYBYMdJxrVPdoLVLlJZFy7j5GPG6RWTbM9ZPZq0rJqZV3dw+7uDk1E5KyyfMtZbysZJCmUVkc6Fm8aZ6IlUPNC/ZOrlCQjpFyePkY/TOIgZ+vuWlmrFnuKrZK9YgLBzkGybZP44CoOWoRt2pV1Bs0eNmRUrGSQHrdirwSaqa1KyPWbzHWjMnzLSJVJwi1wGBgNHjMWkGRW59x4BAQHmgAQGApnTHuEO7uDu4Rd3dR3dyBAeT7uEXQc5w4s8hwuHuobM5QUgKfhxtfuSUsw9wNkn3MiZcOFwiAm7avxme+hGA151yRgbVNLcIuC8YR8bgbEQ4ke7mgAxQKUxWAU5WFAQaL3dLABBhOMCA7uQAGABOUwGMU9Lo6RYDqZjJ1D5JVNy6YvGI3Sa6LfPWL6athyHyru4BjwcApnTkrjR6y1lrIxz4J9BdDOhZvmudteAsU7ds3ty1k42RqFI99H6RGV2x1pptZa1ZLzr09BTrCwc <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

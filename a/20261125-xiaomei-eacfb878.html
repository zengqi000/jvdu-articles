<script id="pageData" type="application/json">{"batch": "历史六对父子反差", "latest": ["20261125-xiaomei-eacfb878"], "articles": [{"id": "20261125-xiaomei-eacfb878", "title": "爹是一代人杰，儿子却把家底败光，这六对父子反差大到不敢认", "plain": "爹是一代人杰，儿子却把家底败光，这六对父子反差大到不敢认\n\n老话讲龙生龙凤生凤，老鼠的儿子会打洞。可翻开史书，偏偏有那么几对父子，爹是一代人杰，儿子却一个比一个离谱，像是专门来讨债的。\n\n最让人想不通的，是赵奢和赵括这一对。赵奢原本只是赵国一个收税的小官，后来带兵在阏与之战大破秦军，一战成名，被封为马服君，是赵国数得上的顶级将领。他那份本事，是从战场上一个一个跟头摔出来的。\n\n他的儿子赵括，从小熟读兵书，谈起兵法来头头是道，连赵奢都说不过他。可长平一战，赵王用他代替廉颇，结果被白起打得全军覆没，四十万赵军被坑杀。\n\n翻到这一段，我停了很久。一个把仗打赢过的人，儿子却把兵书读成了空话。\n\n一、兵书背得再熟，没上过战场也是空的\n\n赵奢那个马服君的封号，是拿命换来的。阏与之战里怎么判断敌情、怎么抓住战机，写在纸上就几行字，真打起来，每一步都要自己拿主意。赵括缺的正是这一步。他能把兵法讲得比父亲还漂亮，可真到了长平，他面对的是白起，不是课堂上的问答。\n\n纸上得来的本事，没经过现场那道坎，一到真章就塌。\n\n赵括的教训，后人反复吃过。真正能打的将领，几乎都是从实战里长出来的。只读兵书、没打过仗的人，一旦被推上主帅的位置，过去那些漂亮话就成了最危险的东西。父亲能打，不代表儿子也能打，能把仗打赢的经验，从来不是靠背下来就能继承的。\n\n二、父亲攒下的名声，儿子一件小事就能毁掉\n\n狄仁杰在武则天时期当宰相，断案如神，为官清廉，老百姓给他建生祠供奉。他的小儿子狄景晖后来当了魏州地方官，仗着老爹的权势贪财暴虐、横征暴敛，百姓恨他恨到把狄仁杰的生祠都拆了。\n\n房玄龄是凌烟阁二十四功臣，跟着李世民打天下、治天下，谨慎低调了一辈子。他的儿子房遗爱娶了高阳公主，没什么真本事，全靠父亲的功劳做官，后来跟着公主密谋造反，被赐死。房玄龄一世英名，连配享太庙的资格都被取消了。\n\n我把这两段来回读了几遍。父亲攒了一辈子的名声，挂在具体的人身上，儿子做错一件事，就能把它撕开一道口子。名声存不住，它不像粮仓，封上就有人在守。\n\n三、家底再厚，也架不住没人会守\n\n杨坚结束了南北朝近三百年的分裂，开创开皇之治，国库的粮食布帛多到溢出来。儿子杨广早年伪装得节俭又孝顺，骗过了杨坚和独孤皇后，夺得太子之位，登基后修东都、开运河，又三征高句丽，十几年把家底败了个精光，强盛的大隋二世而亡。\n\n嬴政扫平六国，废分封行郡县，统一文字度量衡，本想着江山能传万世。小儿子胡亥靠着赵高和李斯矫诏继位，宠信赵高，杀光自己的兄弟姐妹，横征暴敛，逼得陈胜吴广揭竿而起，秦朝三年就乱了。\n\n宇文邕灭掉北齐、统一北方，本来还要南下灭陈，三十多岁就病逝了。儿子宇文赟登基后荒淫残暴，一口气立了五个皇后，动不动就诛杀大臣，在位一年多把自己身体搞垮，留下年幼的小皇帝，江山转头送给了杨坚。\n\n合上书，那句“生子当如孙仲谋”我是不信了。赵奢留给儿子的，是实打实的打仗本事，赵括没接住；杨坚、嬴政留给儿子的，是厚实的家底，杨广、胡亥也没接住。虎父不一定出虎子，老子的本事儿子未必学得会，老子的家业儿子也未必守得住。\n\n翻开这六对父子，反差大到让人不敢认。父亲那一代从战场上、从乱世里挣来的东西，到了儿子手里，成了随手能花的存量。会挣不会守，家业再厚也经不起几折腾。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "老话讲龙生龙凤生凤，老鼠的儿子会打洞。可翻开史书，偏偏有那么几对父子，爹是一代人杰，儿子却一个比一个离谱，像是专门来讨债的。\n\n最让人想不通的，是赵奢和赵括这一对。赵奢原本只是赵国一个收税的小官，后来带兵在阏与之战大破秦军，一战成名，被封为马服君，是赵国数得上的顶级将领。他那份本事，是从战场上一个一个跟头摔出来的。\n\n他的儿子赵括，从小熟读兵书，谈起兵法来头头是道，连赵奢都说不过他。可长平一战，赵王用他代替廉颇，结果被白起打得全军覆没，四十万赵军被坑杀。\n\n翻到这一段，我停了很久。一个把仗打赢过的人，儿子却把兵书读成了空话。\n\n一、兵书背得再熟，没上过战场也是空的\n\n赵奢那个马服君的封号，是拿命换来的。阏与之战里怎么判断敌情、怎么抓住战机，写在纸上就几行字， 个一个跟头摔出来的。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">他的儿子赵括，从小熟读兵书，谈起兵法来头头是道，连赵奢都说不过他。可长平一战，赵王用他代替廉颇，结果被白起打得全军覆没，四十万赵军被坑杀。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">翻到这一段，我停了很久。一个把仗打赢过的人，儿子却把兵书读成了空话。<\/p>\n<p style=\"margin:34px 0 16px;font-size:18px;line-height:1.55;font-weight:800;color:#4a453f;border-left:0;text-align:center;letter-spacing:.06em;background-color:transparent;\">一、兵书背得再熟，没上过战场也是空的<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">赵奢那个马服君的封号，是拿命换来的。阏与之战里怎么判断敌情、怎么抓住战机，写在纸上就几行字，真打起来，每一步都要自己拿主意。赵括缺的正是这一步。他能把兵法讲得比父亲还漂亮，可真到了长平，他面对的是白起，不是课堂上的问答。<\/p>\n<p style=\"margin:26px 0;padding:16px 0;text-align:center;font-size:18.5px;line-height:1.8;font-weight:700;color:#4a453f;letter-spacing:.02em;border-top:1px solid #dddad5;border-bottom:1px solid #dddad5;background-color:transparent;\">纸上得来的本事，没经过现场那道坎，一到真章就塌。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">赵括的教训，后人反复吃过。真正能打的将领，几乎都是从实战里长出来的。只读兵书、没打过仗的人，一旦被推上主帅的位置，过去那些漂亮话就成了最危险的东西。父亲能打，不代表儿子也能打，能把仗打赢的经验，从来不是靠背下来就能继承的。<\/p>\n<p style=\"margin:34px 0 16px;font-size:18px;line-height:1.55;font-weight:800;color:#4a453f;border-left:0;text-align:center;letter-spacing:.06em;background-color:transparent;\">二、父亲攒下的名声，儿子一件小事就能毁掉<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">狄仁杰在武则天时期当宰相，断案如神，为官清廉，老百姓给他建生祠供奉。他的小儿子狄景晖后来当了魏州地方官，仗着老爹的权势贪财暴虐、横征暴敛，百姓恨他恨到把狄仁杰的生祠都拆了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">房玄龄是凌烟阁二十四功臣，跟着李世民打天下、治天下，谨慎低调了一辈子。他的儿子房遗爱娶了高阳公主，没什么真本事，全靠父亲的功劳做官，后来跟着公主密谋造反，被赐死。房玄龄一世英名，连配享太庙的资格都被取消了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">我把这两段来回读了几遍。父亲攒了一辈子的名声，挂在具体的人身上，儿子做错一件事，就能把它撕开一道口子。<strong style=\"font-size:1.1em;font-weight:700;color:#3f3a35;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#ecebe8;\">名声存不住，它不像粮仓，封上就有人在守。<\/strong><\/p>\n<p style=\"margin:34px 0 16px;font-size:18px;line-height:1.55;font-weight:800;color:#4a453f;border-left:0;text-align:center;letter-spacing:.06em;background-color:transparent;\">三、家底再厚，也架不住没人会守<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">杨坚结束了南北朝近三百年的分裂，开创开皇之治，国库的粮食布帛多到溢出来。儿子杨广早年伪装得节俭又孝顺，骗过了杨坚和独孤皇后，夺得太子之位，登基后修东都、开运河，又三征高句丽，十几年把家底败了个精光，强盛的大隋二世而亡。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">嬴政扫平六国，废分封行郡县，统一文字度量衡，本想着江山能传万世。小儿子胡亥靠着赵高和李斯矫诏继位，宠信赵高，杀光自己的兄弟姐妹，横征暴敛，逼得陈胜吴广揭竿而起，秦朝三年就乱了。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">宇文邕灭掉北齐、统一北方，本来还要南下灭陈，三十多岁就病逝了。儿子宇文赟登基后荒淫残暴，一口气立了五个皇后，动不动就诛杀大臣，在位一年多把自己身体搞垮，留下年幼的小皇帝，江山转头送给了杨坚。<\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">合上书，那句“生子当如孙仲谋”我是不信了。赵奢留给儿子的，是实打实的打仗本事，赵括没接住；杨坚、嬴政留给儿子的，是厚实的家底，杨广、胡亥也没接住。<strong style=\"font-size:1.1em;font-weight:700;color:#3f3a35;padding:1px 4px;border-radius:3px;text-align:left;letter-spacing:0;background-color:#ecebe8;\">虎父不一定出虎子，老子的本事儿子未必学得会，老子的家业儿子也未必守得住。<\/strong><\/p>\n<p style=\"margin:0 0 21px;font-size:16.5px;line-height:1.92;color:#2f2f2f;text-align:justify;letter-spacing:.01em;background-color:transparent;\">翻开这六对父子，反差大到让人不敢认。父亲那一代从战场上、从乱世里挣来的东西，到了儿子手里，成了随手能花的存量。会挣不会守，家业再厚也经不起几折腾。<\/p>\n<p style=\"margin:34px 0 0;text-align:center;line-height:1;font-size:12px;letter-spacing:8px;color:#dddad5;background-color:transparent;\">· · ·<\/p>\n<p style=\"margin:18px 0 0;padding-top:14px;border-top:1px solid #EDEAE6;font-size:13px;line-height:1.75;color:#A5A5A5;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wgARCAEuAsUDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABQYEBwECAwAI/8QAGQEAAwEBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAFn8epXg1fMHxyBO/eZahQZ8FnEQyRtUiWLBEp27tF6cV9YXZVo2yOObI9xka81KDGvMXQp3tPcrBY24bI53jyMn72u6Wyq1L9kilrsqbqjtrF31TpJQCcU0Coc5ipb1PXFm9Cg4py1z901Tx7Owa765l5XmGLaqCwIrF0yLW28BLl8SoVEhqXpkoukkZio1XNjLDKjB/R4LqzpF7ANdTakCPA4ejkEsNW1ldtMMZicZzjF89ttg2zp5Lpp71P3PfVLbPPUffGvmve28jlXdiJfQE4zaOSIBRUqjGcl5S9CP+oX19xTdk3t6/GwbN4Iflh48Wewxn3sWrmg5bdT987c9L3DtH2k3Ijy8q0313RlaY1y3KqC4qh6s5GNimk6776jiTttRh7Mr6xMjJMfvz0Q0r71Fh9Kt9RaGldG5GuP3zm0NkWG/dZXCwYGlRrZypTeJVSp2J1hk8DoFMi5qAzzfJVpLKrXQm1hiy+TT1eWJWOsvBpObpXt8bZmufYZrvjDNve8LPsYRvjXIe21yHvc/UaVw9BdkbJqG8jXzAVxafONZ2zoiUuGv51IHM65SL+YO2ZXghyrrpTAoLo3RWE//P73M2QYCysLYsqLXz0C594+gXlR5uNaex5PZZYlrVFKstNA3gz1cwsgHQ7IBFD2iqWLllVrZiffGYWDUYbKO6JF6l0DWWSShyqLTF1NaEkaKvNDH1RFiZYG+KstHN7qLF0zcKJ0ktnhg1cktSLC5ZvmNE150qw7BhwM6ZqxsFEmSrwmucHve2zfsZ8LX2dm+ed/JextgMe9hvOPZSx7X1JQZEOZuWBWD5883I/uOz2QwOtZlof0T2Snjg0RpcZn1JfPuo5JZqay6y75xjc/UL0pgEpvi8RV0+lkVZyFZpWkpkv6VlVs4cWhjoPmZV0WGdX0CVbPqRvFirvLrBn0hfpld1WLoiL5XFkQ+4g3A52GENcrRV4iXaE3VaS7E4aRVLel2 <script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });
})();
</script>
</body>
</html>

<script id="pageData" type="application/json">{"batch": "《伟大的长征》", "latest": ["fb79cee0"], "articles": [{"id": "fb79cee0", "title": "《伟大的长征》大结局：蒋介石到死也搞不懂，“优势在我”为啥输得这么惨？", "plain": "《伟大的长征》大结局：蒋介石到死也搞不懂，“优势在我”为啥输得这么惨？\n\n老蒋输得不冤，他把所有人都当成可调动的兵力，忘了人是要被当人看的。\n\n东北军丢了老家，背了个“不抵抗将军”的骂名，走到哪儿都被人戳脊梁骨。老蒋还让张学良去打红军，东北军将士心里那个憋屈，我们在关外被小鬼子撵着跑，现在还要跟自己人拼命？这一场戏没有开一枪，可那股闷气隔着屏幕都压得人喘不上来。\n\n《伟大的长征》｜革命历史剧｜西安事变前后\n\n一个背着骂名的人，最怕的不是打不过，是连自己人都觉得他该被骂。\n\n一、骂名压下来，先垮的是他自己\n\n张学良那几年不好过。老家丢了，账全算在他头上，不抵抗的名声一传开，谁的唾沫都能落在他身上。骂名是最便宜的评价，扔出去不用负责，接住的人却要拿半辈子去洗。老蒋看得清楚，所以他不劝，只派活，你去打红军。这一步算得很阴，你越急着证明自己不是懦夫，越容易被当成一把刀使。\n\n二、三次谈话，把人从别人的评价里拉出来\n\n周公出场。他跟张学良聊了八天两夜，第一夜就打通了对方的任督二脉。临走时张学良又是送地图又是送钱，那是真交心。第二次见面细化方案，第三次直接在张学良家里住了八天，连西安事变怎么收尾都商量好了。三次谈话，把一个手握重兵的军阀变成了铁杆盟友。这不是口才好，是他从头到尾没把张学良当成“不抵抗将军”，只当成一个想打回老家的人。\n\n剧里还有一段“半条被子”。三个女红军借宿在徐解秀家，走的时候把仅有的一床被子剪成两半，留半条给她。她们改变不了大局，能做的只是把手里那点东西分出去一半。徐解秀后来守着那半条被子等了很多年。这一段里没有大人物，也没有一句豪言，可它跟周公那八天两夜讲的是同一件事，一个人被当成人的时候，才愿意替你把路走下去。女人的位置也常是这样挣来的，不是靠谁给，是靠自己在最难的时候还肯分出一半。\n\n我毕业那年从雨衣厂实习出来，厂长留我，说留下就是厂里最年轻的设计师，工资还能加。亲戚里有人说我不识好歹，女孩子有份稳当活干就不错了，跑什么大城市。我哥没劝，他送我去车站，塞给我一张火车票和几百块钱，说先去闯，不行就回来。就这一句，把我从别人怎么看的秤上捞了下来。被真正信任过的人，才敢自己拿主意。\n\n后来我在义乌落脚，做着普通的活，攒钱买人生第一台相机。这些跟张学良的八天两夜当然没法比，可道理是一样的，一个人肯往前走，多半是因为有人先把他当成能走的人。老蒋最后被逼到墙角，军事上打不赢，舆论上压不住，连最信任的部下都反了，只能坐下来谈判，答应共同抗日。签协议时那张脸，估计比吃了苍蝇还难看。\n\n写在最后\n\n所以老蒋到底输在哪儿？他手里全是牌，却没有一个人是自愿站在他那边。长征路上牺牲的战士，很多连名字都没留下，可他们用命给后人铺了一条路。你数得出红军有多少人多少枪，那叫账面；你数不出有多少人愿意跟着走，那才叫力量。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "老蒋输得不冤，他把所有人都当成可调动的兵力，忘了人是要被当人看的。\n\n东北军丢了老家，背了个“不抵抗将军”的骂名，走到哪儿都被人戳脊梁骨。老蒋还让张学良去打红军，东北军将士心里那个憋屈，我们在关外被小鬼子撵着跑，现在还要跟自己人拼命？这一场戏没有开一枪，可那股闷气隔着屏幕都压得人喘不上来。\n\n《伟大的长征》｜革命历史剧｜西安事变前后\n\n一个背着骂名的人，最怕的不是打不过，是连自己人都觉得他该被骂。\n\n一、骂名压下来，先垮的是他自己\n\n张学良那几年不好过。老家丢了，账全算在他头上，不抵抗的名声一传开，谁的唾沫都能落在他身上。骂名是最便宜的评价，扔出去不用负责，接住的人却要拿半辈子去洗。老蒋看得清楚，所以他不劝，只派活，你去打红军。这一步算得很阴，你越急着证明自己不是懦夫，越容易被当成一把刀使。\n\n二、三次谈话，把人从别人的评价里拉出来\n\n周公出场。他跟张学良聊了八天两夜，第一夜就打通了对方的任督二脉。临走时张学良又是送地图又是送钱，那是真交心。第二次见面细化方案，第三次直接在张学良家里住了八天，连西安事变怎么收尾都商量好了。三次谈话，把一个手握重兵的军阀变成了铁杆盟友。这不是口才好，是他从头到尾没把张学良当成“不抵抗将军”，只当成一个想打回老家的人。\n\n剧里还有一段“半条被子”。三 >\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">《伟大的长征》｜革命历史剧｜西安事变前后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">一个背着骂名的人，最怕的不是打不过，是连自己人都觉得他该被骂。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、骂名压下来，先垮的是他自己<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">张学良那几年不好过。老家丢了，账全算在他头上，不抵抗的名声一传开，谁的唾沫都能落在他身上。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">骂名是最便宜的评价，扔出去不用负责，接住的人却要拿半辈子去洗。<\/strong>老蒋看得清楚，所以他不劝，只派活，你去打红军。这一步算得很阴，你越急着证明自己不是懦夫，越容易被当成一把刀使。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、三次谈话，把人从别人的评价里拉出来<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">周公出场。他跟张学良聊了八天两夜，第一夜就打通了对方的任督二脉。临走时张学良又是送地图又是送钱，那是真交心。第二次见面细化方案，第三次直接在张学良家里住了八天，连西安事变怎么收尾都商量好了。三次谈话，把一个手握重兵的军阀变成了铁杆盟友。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">这不是口才好，是他从头到尾没把张学良当成“不抵抗将军”，只当成一个想打回老家的人。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">剧里还有一段“半条被子”。三个女红军借宿在徐解秀家，走的时候把仅有的一床被子剪成两半，留半条给她。她们改变不了大局，能做的只是把手里那点东西分出去一半。徐解秀后来守着那半条被子等了很多年。这一段里没有大人物，也没有一句豪言，可它跟周公那八天两夜讲的是同一件事，一个人被当成人的时候，才愿意替你把路走下去。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">女人的位置也常是这样挣来的，不是靠谁给，是靠自己在最难的时候还肯分出一半。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我毕业那年从雨衣厂实习出来，厂长留我，说留下就是厂里最年轻的设计师，工资还能加。亲戚里有人说我不识好歹，女孩子有份稳当活干就不错了，跑什么大城市。我哥没劝，他送我去车站，塞给我一张火车票和几百块钱，说先去闯，不行就回来。就这一句，把我从别人怎么看的秤上捞了下来。<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">被真正信任过的人，才敢自己拿主意。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">后来我在义乌落脚，做着普通的活，攒钱买人生第一台相机。这些跟张学良的八天两夜当然没法比，可道理是一样的，一个人肯往前走，多半是因为有人先把他当成能走的人。老蒋最后被逼到墙角，军事上打不赢，舆论上压不住，连最信任的部下都反了，只能坐下来谈判，答应共同抗日。签协议时那张脸，估计比吃了苍蝇还难看。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">所以老蒋到底输在哪儿？<strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">他手里全是牌，却没有一个人是自愿站在他那边。<\/strong>长征路上牺牲的战士，很多连名字都没留下，可他们用命给后人铺了一条路。你数得出红军有多少人多少枪，那叫账面；你数不出有多少人愿意跟着走，那才叫力量。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["如果你是张学良，老家丢了、全国都在骂你不抵抗，老蒋还让你去打红军，你会怎么回他？", "周公跟张学良聊了八天两夜，你觉得真正说服他的是道理，还是那句我知道你想打回老家？", "“不抵抗将军”四个字压了他半辈子，你身边有没有被一个标签定死的人？", "三个女红军把仅有的一床被子剪成两半，换你是徐解秀，那半条你收不收？", "徐解秀守着半条被子等了很多年，你觉得她等的是人，还是一个说法？", "老蒋偏要东北军去打红军，你猜他是不信任这支队伍，还是故意消耗？", "签协议那天老蒋那张脸，你觉得他服的是道理，还是服了实在没办法？", "亲戚说你“不识好歹”的时候，你是听劝留下，还是像剧里那样赌一把？", "被信任过的人才敢自己拿主意，你身上有没有这样一个先把你当人的人？", "军事打不赢、舆论压不住、部下也反了，你觉得这三条是哪一条先断的？"], "batch": "《伟大的长征》", "created": "2026-11-18 16:05", "updated": "2026-11-18 16:13"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function allImageSrcs() {
    // 新文章正文里不放图，图片清单随文章数据下发，只在「复制图片」面板里显示。
    // 老文章没有 images 字段，仍从正文 img 里取，保持旧页面原样。
    if (post.images && post.images.length) return post.images.slice();
    var imgs = bodyEl.querySelectorAll('img');
    var out = [];
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) out.push(imgs[i].src);
    return out;
  }

  // 把所有图片一次性列出来：第一张标封面，其余按出现顺序编号，逐张长按/右键保存。
  function showPanel(srcs, note) {
    imgList.innerHTML = '';
    for (var i = 0; i < srcs.length; i++) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = srcs.length === 1 ? '封面' : ('第 ' + (i + 1) + ' 张 / 共 ' + srcs.length + ' 张' + (i === 0 ? '（封面）' : ''));
      var im = document.createElement('img');
      im.src = srcs[i];
      im.alt = '文章图片 ' + (i + 1);
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || ('共 ' + srcs.length + ' 张图：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。');
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-plain').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('正文已复制（不含标题和图片），直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var srcs = allImageSrcs();
    if (!srcs.length) { setStatus('这篇没有图片', true); return; }
    if (srcs.length > 1) {
      showPanel(srcs);
      setStatus('共 ' + srcs.length + ' 张图已打开，逐张长按或右键保存', true);
      return;
    }
    var src = srcs[0];
    if (isWX || !navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) {
      showPanel(srcs);
      setStatus('图片已打开，长按图片保存即可', true);
      return;
    }
    imageBlob().then(function (blob) {
      if (!blob) { showPanel(srcs); setStatus('浏览器没法直接写剪贴板，已在页面上打开图片', true); return; }
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
        setStatus('图片已复制，去公众号后台上传');
      }).catch(function () {
        showPanel(srcs);
        setStatus('复制被浏览器拦了，右键保存这张图也可以用', true);
      });
    });
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>

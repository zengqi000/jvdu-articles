<script id="pageData" type="application/json">{"batch": "《谷雨》", "latest": ["a564cd5f"], "articles": [{"id": "a564cd5f", "title": "《谷雨》大结局，严平安的“辞职”是假动作，薛凝的“温柔”才是真刀子", "plain": "《谷雨》大结局，严平安的“辞职”是假动作，薛凝的“温柔”才是真刀子\n\n一个干了半辈子刑警的人，把警服摔在车上摔门走人，看着像被逼到绝路，其实是他自己往火坑里跳的第一步。\n\n《谷雨》大结局播完，弹幕都在替严平安憋屈，被沈启光穿小鞋，开枪之后没人替他说话，这辞职看着太心寒。可我把最后几集倒回去看了两遍，越看越觉得，这场辞职是整盘棋里下得最狠的一步。\n\n一、他演得越像崩了，对手就越不设防\n\n你换个角度想，一个在刑警队混了半辈子的人，什么大风大浪没见过，沈启光那点小鞋，搁别人脚上磨出血泡，搁严平安身上顶多硌一下。他偏偏就崩了，崩得那么干脆，辞了职转头就往周海洋身边凑。\n\n周海洋是谁，垄云县水产骗税那摊烂账的总操盘手，壳公司一摞一摞，账面风平浪静，水底下全是暗礁。严平安凑过去那天起，周海洋试探了他不止一回。两人为水产骗税的事大吵一架，拍桌子摔杯子，严平安指着他鼻子骂你把脑袋别裤腰带上了。那场架吵给谁看，吵给周海洋身边那些眼线看。一个因为分赃不均闹脾气的合伙人，比一个忠心耿耿的跟班更让人不设防。\n\n真正的卧底，不是藏得最深的那个人，是演得最像的那个人。\n\n我看着严平安那身被扔掉的警服，忽然想起自己跑销售那几年。那会儿我在南昌，女朋友在永修村小教书，两头跑，赶车和等人的空当全靠追剧打发。有一回厂里催款催得紧，我当着客户的面摔了单据发火，转头人家反而放心把尾款结了，觉得我这人真性情、不揣着心思。那时候我不懂，现在看严平安才回过味来，有时候你越把情绪摆到台面上，别人越不会往深处防你。他不是失控，他是把失控演给对的人看。\n\n二、明着堕落的那个人，心里那条线一直没断\n\n可你别以为演戏就容易。严平安每一步都是自己选的，选了就得扛住所有误解。老婆跟他吵，同事躲着他走，连亲闺女都小声问一句爸你是不是犯错误了。这些话搁谁身上不扎心，他愣是一句没解释。一个警察最难的不是挨枪子，是穿着这身被人指着脊梁骨的时候，还得继续把戏演下去。\n\n这剧最扎我的其实不是严平安，是薛凝那杯热牛奶。欧阳煦半夜接了个匿名电话，脸色铁青，薛凝端着牛奶进来轻声问怎么了，欧阳煦说没事，她就没追问，只坐在旁边把手搭在他肩上。镜头扫过她低垂的眼睛，那里头没有心疼，全是盘算。她不用问，欧阳煦的反应本身就是情报。曹亦新需要一个人稳住这个太轴、软硬不吃的检察官，正面攻不破，就从侧面渗进去。\n\n温柔这东西，用对了地方是港湾，用错了地方就是绳子。\n\n一个想方设法调动对手，一个不知不觉被对手调动，编剧把这两枚棋子摆在棋盘两头，心思就透亮了。严平安是主动往火坑里跳，跳之前还自己浇了桶油；薛凝是坐在后方，手指头都不沾灰，可每一根线都从她手里过。她那份好是真的好，煲汤陪聊帮着分析案子，恰恰是这份真最要命，因为欧阳煦把心掏出来给她看，她转手就把这份信任过了秤。一个被安插进去的人，她有多少选择余地，我不知道，但有些路迈出第一步就回不了头，这才是最狠的地方。\n\n写在最后\n\n严平安的女人在家里问他是不是犯错误了，他没答；薛凝低头搅咖啡的时候，手腕上那块表硌不硌得慌，剧也没说。这剧把话留在这两个没答的动作里，其实是在问我们：被推到那个位置上，你还有没有本事分清楚，自己到底站在哪一边。看剧图个热闹，可散场之后想想，生活里那些笑着递过来的热牛奶，未必每一杯都是好意。\n\n温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢", "body_plain": "一个干了半辈子刑警的人，把警服摔在车上摔门走人，看着像被逼到绝路，其实是他自己往火坑里跳的第一步。\n\n《谷雨》大结局播完，弹幕都在替严平安憋屈，被沈启光穿小鞋，开枪之后没人替他说话，这辞职看着太心寒。可我把最后几集倒回去看了两遍，越看越觉得，这场辞职是整盘棋里下得最狠的一步。\n\n一、他演得越像崩了，对手就越不设防\n\n你换个角度想，一个在刑警队混了半辈子的人，什么大风大浪没见过，沈启光那点小鞋，搁别人脚上磨出血泡，搁严平安身上顶多硌一下。他偏偏就崩了，崩得那么干脆，辞了职转头就往周海洋身边凑。\n\n周海洋是谁，垄云县水产骗税那摊烂账的总操盘手，壳公司一摞一摞，账面风平浪静，水底下全是暗礁。严平安凑过去那天起，周海洋试探了他不止一回。两人为水产骗税的事大吵一架，拍桌子摔杯子，严平安指着他鼻子骂你把脑袋别裤腰带上了。那场架吵给谁看，吵给周海洋 8M/PTV7Js9Jv5n/adJ1P8+jf9R2+kMI6juGpz6PHSfu9PZ7Td/1qb/L6DXxNH3mr0H40N/Y9NnKPpzOWcvabQ3NE5mnpo94eg7n/2Q==\" alt=\"剧照\"><\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">一、他演得越像崩了，对手就越不设防<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">你换个角度想，一个在刑警队混了半辈子的人，什么大风大浪没见过，沈启光那点小鞋，搁别人脚上磨出血泡，搁严平安身上顶多硌一下。他偏偏就崩了，崩得那么干脆，辞了职转头就往周海洋身边凑。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">周海洋是谁，垄云县水产骗税那摊烂账的总操盘手，壳公司一摞一摞，账面风平浪静，水底下全是暗礁。严平安凑过去那天起，周海洋试探了他不止一回。两人为水产骗税的事大吵一架，拍桌子摔杯子，严平安指着他鼻子骂你把脑袋别裤腰带上了。那场架吵给谁看，吵给周海洋身边那些眼线看。一个因为分赃不均闹脾气的合伙人，比一个忠心耿耿的跟班更让人不设防。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">真正的卧底，不是藏得最深的那个人，是演得最像的那个人。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">我看着严平安那身被扔掉的警服，忽然想起自己跑销售那几年。那会儿我在南昌，女朋友在永修村小教书，两头跑，赶车和等人的空当全靠追剧打发。有一回厂里催款催得紧，我当着客户的面摔了单据发火，转头人家反而放心把尾款结了，觉得我这人真性情、不揣着心思。那时候我不懂，现在看严平安才回过味来，有时候你越把情绪摆到台面上，别人越不会往深处防你。他不是失控，他是把失控演给对的人看。<\/p>\n<p style=\"margin:0 0 20px;text-align:left;letter-spacing:0;background-color:transparent;\"><img style=\"display:block;max-width:100%;height:auto;margin:20px auto;text-align:left;letter-spacing:0;background-color:transparent;\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC 0qCqXmFPH1BeiLTRHnF0uDPcOdW+JaNmIm1QZVQBuy/MbK06gfJSfsSlwlxi6ajvEEe8R11mIptOsQQIQe8qVgfwShCZjii7lSnFQvaOKzrcNSIszPyQ5gQJXZ5hKIGOIamua/Sb7DdsOGfcgG8NwFXxQjReh/HNKFn1I8qWyPhiKw7VtcsTP+TzCaiFoI/lNc+7E7eJu/lgGwN/3GzRPASitEJeiE6IhZgiFaJReiAVoiFmJozd6P3HcBqP8AtNH+G04Tn+TT+QjabRhK+r8P4iWzOYK5L/5n+v2TDHqbPWE9+apz9P49z1nD+AAezoGjj+A/1eI/V/H8GARTv8p9/wDiAaj/AMJp8Ye1YQAoUA0GYyvCFUWacz7H5Tb2mj/BOP8A43gviNGnxAdEzME4AlpDyIi1dP5lAFnNG9wmdF1MrOpQFtRfK8jwn3v4SYr/ABraWOXwT//Z\" alt=\"剧照\"><\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">二、明着堕落的那个人，心里那条线一直没断<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">可你别以为演戏就容易。严平安每一步都是自己选的，选了就得扛住所有误解。老婆跟他吵，同事躲着他走，连亲闺女都小声问一句爸你是不是犯错误了。这些话搁谁身上不扎心，他愣是一句没解释。一个警察最难的不是挨枪子，是穿着这身被人指着脊梁骨的时候，还得继续把戏演下去。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">这剧最扎我的其实不是严平安，是薛凝那杯热牛奶。欧阳煦半夜接了个匿名电话，脸色铁青，薛凝端着牛奶进来轻声问怎么了，欧阳煦说没事，她就没追问，只坐在旁边把手搭在他肩上。镜头扫过她低垂的眼睛，那里头没有心疼，全是盘算。她不用问，欧阳煦的反应本身就是情报。曹亦新需要一个人稳住这个太轴、软硬不吃的检察官，正面攻不破，就从侧面渗进去。<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\"><strong style=\"font-size:1.12em;font-weight:700;color:#8f3f45;text-align:left;letter-spacing:0;background-color:transparent;\">温柔这东西，用对了地方是港湾，用错了地方就是绳子。<\/strong><\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">一个想方设法调动对手，一个不知不觉被对手调动，编剧把这两枚棋子摆在棋盘两头，心思就透亮了。严平安是主动往火坑里跳，跳之前还自己浇了桶油；薛凝是坐在后方，手指头都不沾灰，可每一根线都从她手里过。她那份好是真的好，煲汤陪聊帮着分析案子，恰恰是这份真最要命，因为欧阳煦把心掏出来给她看，她转手就把这份信任过了秤。一个被安插进去的人，她有多少选择余地，我不知道，但有些路迈出第一步就回不了头，这才是最狠的地方。<\/p>\n<p style=\"margin:30px 0 18px;font-size:19px;line-height:1.55;font-weight:700;color:#1f1f1f;border-left:4px solid #8f3f45;padding:10px 12px;text-align:left;letter-spacing:0;background-color:transparent;\">写在最后<\/p>\n<p style=\"margin:0 0 18px;font-size:17px;line-height:1.95;color:#303030;text-align:left;letter-spacing:0;background-color:transparent;\">严平安的女人在家里问他是不是犯错误了，他没答；薛凝低头搅咖啡的时候，手腕上那块表硌不硌得慌，剧也没说。这剧把话留在这两个没答的动作里，其实是在问我们：被推到那个位置上，你还有没有本事分清楚，自己到底站在哪一边。看剧图个热闹，可散场之后想想，生活里那些笑着递过来的热牛奶，未必每一杯都是好意。<\/p>\n<p style=\"margin:26px 0 0;border-top:1px solid #E8E4DF;font-size:13px;line-height:1.75;color:#9A9A9A;font-family:-apple-system,BlinkMacSystemFont,&#x27;Segoe UI&#x27;,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;text-align:left;letter-spacing:0;background-color:transparent;\">温馨提示：文中图片/视频来源网络，如有侵权请立刻联系我们及时删除，感谢<\/p>\n<\/section>", "comments": ["如果换成我是严平安，被沈启光穿了一整部剧的小鞋，我可能第一集就摔门走了，哪还能憋到结局演这出卧底，你们忍得住吗？", "那场跟周海洋的吵架戏我倒回去看了两遍，摔杯子指鼻子骂，原来全是演给眼线看的，这演技我给满分。", "严平安把警服扔副驾那一下，我一个男的看着都心里发酸，被自己人指着脊梁骨还得继续演，这比挨枪子难多了。", "薛凝端那杯热牛奶进去、手搭在欧阳煦肩上那段，我越看越后背发凉，她低垂的眼睛里真的一点心疼都没有。", "要是你身边有个薛凝这样的人，事业低谷时突然出现、温柔体贴还帮你分析，你会不会也一头栽进去？", "我盯着数了一下，欧阳煦把心掏给她看，她转手就把信任过了秤卖钱，这算不算最不动声色的背叛？", "一个主动往火坑跳还自己浇油，一个坐着不动每根线都过她手，编剧这俩棋子的对照摆得太狠了。", "我第一反应是，被安插进去的人哪有多少选择余地，可话又说回来，伤害是实打实的，这两件事能一块儿算吗？", "女儿问那句爸你是不是犯错误了，严平安愣是一句没解释，看到这儿我眼眶就热了，你们呢？", "你们觉得薛凝最后有没有过一瞬间动摇，还是从头到尾就把欧阳煦当成一盘棋里的子？"], "batch": "《谷雨》", "created": "2026-11-19 09:39", "updated": "2026-11-19 09:39"}]}</script>
<script>
(function(){
  var data = null;
  try { data = JSON.parse(document.getElementById('pageData').textContent || '{}'); } catch (e) { return; }
  var arts = (data && data.articles) || [];
  if (!arts.length) return;
  var latest = (data && data.latest) || [];

  function pickPost() {
    var params = new URLSearchParams(location.search);
    var a = params.get('a');
    if (a) {
      for (var i = 0; i < arts.length; i++) if (arts[i].id === a) return arts[i];
    }
    var n = parseInt(params.get('p') || '1', 10);
    if (!(n >= 1 && n <= latest.length)) n = 1;
    if (latest.length) {
      var want = latest[n - 1];
      for (var j = 0; j < arts.length; j++) if (arts[j].id === want) return arts[j];
    }
    return arts[0];
  }

  var post = pickPost();

  var bodyEl = document.getElementById('body');
  bodyEl.innerHTML = post.html || '';
  document.title = post.title || data.batch || '文章';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', String(post.plain || '').replace(/\s+/g, ' ').slice(0, 70));

  var isWX = /MicroMessenger/i.test(navigator.userAgent || '');
  var statusEl = document.getElementById('status');
  var panel = document.getElementById('imgpanel');
  var imgList = document.getElementById('imglist');
  var panelTip = document.getElementById('imgtip');
  var cpanel = document.getElementById('cpanel');
  var cList = document.getElementById('clist');
  var cTip = document.getElementById('ctip');

  function setStatus(text, warn) {
    statusEl.textContent = text || '';
    statusEl.className = warn ? 'status warn' : 'status';
  }

  function copyViaTextarea(value) {
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, value.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function coverSrc() {
    // 每篇只保留封面一张图，点「复制封面」显示原文章的封面。
    // 新文章 images 字段只有封面；老文章没有 images 字段，从正文 img 里取第一张。
    if (post.images && post.images.length) return post.images[0];
    var imgs = bodyEl.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) if (imgs[i].src) return imgs[i].src;
    return '';
  }

  // 面板只显示原文章封面这一张图，供长按/右键保存。
  function showCover(src, note) {
    imgList.innerHTML = '';
    if (src) {
      var box = document.createElement('div');
      box.className = 'imgitem';
      var label = document.createElement('p');
      label.className = 'imglabel';
      label.textContent = '封面';
      var im = document.createElement('img');
      im.src = src;
      im.alt = '文章封面';
      box.appendChild(label);
      box.appendChild(im);
      imgList.appendChild(box);
    }
    panelTip.textContent = note || '这是原文章的封面：电脑上右键「复制图片」，手机上长按图片保存，再上传到公众号。';
    panel.hidden = false;
  }

  // 评论参考面板：列出本篇的 10 条评论，每条独立复制，避免整段长文本难选。
  function showComments(list) {
    cList.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      (function (val, idx) {
        var item = document.createElement('div');
        item.className = 'citem';
        var num = document.createElement('span');
        num.className = 'cnum';
        num.textContent = '第 ' + (idx + 1) + ' 条';
        var txt = document.createElement('div');
        txt.textContent = val;
        var btn = document.createElement('button');
        btn.className = 'cbtn';
        btn.type = 'button';
        btn.textContent = '复制这条';
        btn.addEventListener('click', function (ev) {
          var ok = copyViaTextarea(val);
          if (ok) {
            var all = cList.querySelectorAll('.cbtn');
            for (var k = 0; k < all.length; k++) { all[k].classList.remove('copied'); all[k].textContent = '复制这条'; }
            btn.classList.add('copied');
            btn.textContent = '已复制 ✓';
            setStatus('第 ' + (idx + 1) + ' 条评论已复制，去留言区粘贴');
          } else {
            setStatus('复制失败，长按这条评论手动选择', true);
          }
        });
        item.appendChild(num);
        item.appendChild(txt);
        item.appendChild(btn);
        cList.appendChild(item);
      })(String(list[i]), i);
    }
    cTip.textContent = '共 ' + list.length + ' 条。点某条下面的「复制这条」，粘到公众号留言区。';
    cpanel.hidden = false;
  }

  document.getElementById('imgclose').addEventListener('click', function () {
    panel.hidden = true;
    setStatus('');
  });
  document.getElementById('cclose').addEventListener('click', function () {
    cpanel.hidden = true;
    setStatus('');
  });
  function imageBlob() {
    var img = bodyEl.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return Promise.resolve(null);
    return new Promise(function (res) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (b) { res(b); }, 'image/png');
      } catch (e) { res(null); }
    });
  }

  function selectBody() {
    var range = document.createRange();
    range.selectNodeContents(bodyEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function hideCopyExtras() {
    var extras = bodyEl.querySelectorAll('h1, img');
    for (var i = 0; i < extras.length; i++) extras[i].classList.add('copy-hide');
    document.addEventListener('pointerdown', showCopyExtras, { once: true });
  }

  function showCopyExtras() {
    var extras = bodyEl.querySelectorAll('.copy-hide');
    for (var i = 0; i < extras.length; i++) extras[i].classList.remove('copy-hide');
  }

  function copyRichSync(rich, plain) {
    var buffer = document.createElement('div');
    buffer.contentEditable = 'true';
    buffer.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;';
    buffer.innerHTML = rich;
    document.body.appendChild(buffer);
    var sel = window.getSelection();
    var range = document.createRange();
    range.selectNodeContents(buffer);
    sel.removeAllRanges();
    sel.addRange(range);
    var handled = false;
    function onCopy(ev) {
      if (!ev.clipboardData) return;
      try {
        ev.clipboardData.setData('text/html', rich);
        ev.clipboardData.setData('text/plain', plain);
        handled = true;
        ev.preventDefault();
      } catch (e) {}
    }
    document.addEventListener('copy', onCopy, true);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.removeEventListener('copy', onCopy, true);
    buffer.remove();
    sel.removeAllRanges();
    return ok && handled;
  }

  function copyRich() {
    // 复制内容只要正文：去掉标题（h1）和封面图（img），避免公众号助手粘贴时报上传失败
    var cloneEl = bodyEl.cloneNode(true);
    var drop = cloneEl.querySelectorAll('h1, img');
    for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
    var rich = cloneEl.innerHTML;
    var plain = post.body_plain || (function () {
      var t = cloneEl.textContent || '';
      return t;
    })();
    // 微信内置浏览器不给网页写富文本剪贴板：execCommand 会静默降级成纯文本却报成功，
    // 导致格式丢失。微信里一律不走程序化富文本复制，改用系统长按复制真实 DOM。
    if (isWX) return Promise.resolve(false);
    try {
      if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
        var writing = navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([rich], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        return writing.then(function () { return true; }).catch(function () { return copyRichSync(rich, plain); });
      }
    } catch (e) {}
    return Promise.resolve(copyRichSync(rich, plain));
  }

  // 精确选中正文：跳过标题 h1 与封面图所在块，从第一段正文选到末尾。
  // 这样微信系统长按复制带走的只有正文（含内联样式），不会带上标题和封面。
  function selectBodyText() {
    var blocks = bodyEl.querySelectorAll('p, h2, h3, blockquote');
    var start = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.querySelector('img')) continue;
      if ((b.textContent || '').trim()) { start = b; break; }
    }
    var range = document.createRange();
    if (start) range.setStartBefore(start); else range.selectNodeContents(bodyEl);
    var last = bodyEl.lastChild;
    while (last && last.nodeType === 3 && !(last.textContent || '').trim()) last = last.previousSibling;
    if (last) range.setEndAfter(last);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // 微信里保住格式的关键：选中真实渲染的正文 DOM（内联样式随选区带走），再让用户长按复制。
  function selectAndHint() {
    selectBodyText();
    try { document.getElementById('body').scrollIntoView({ block: 'start' }); } catch (e) {}
    setStatus('已全选正文，请在正文上长按 → 全选 → 复制，格式会一起带过去', true);
  }

  // 蓝色主按钮：与本地 HTML 的「复制全文」一致。微信无法写富文本剪贴板，
  // 走系统长按复制正文（保住格式）；桌面走一键富文本复制。
  document.getElementById('btn-rich').addEventListener('click', function () {
    if (isWX) { selectAndHint(); return; }
    copyRich().then(function (ok) {
      if (ok) { setStatus('带排版的全文已复制，直接去公众号助手粘贴即可'); return; }
      selectAndHint();
    });
  });

  document.getElementById('btn-title').addEventListener('click', function () {
    var ok = copyViaTextarea(post.title || '');
    setStatus(ok ? '标题已复制' : '复制失败，长按标题手动选择', !ok);
  });

  document.getElementById('btn-image').addEventListener('click', function () {
    var src = coverSrc();
    if (!src) { setStatus('这篇没有封面', true); return; }
    showCover(src);
    setStatus('已打开原文章封面，长按或右键保存即可', true);
  });

  document.getElementById('btn-comment').addEventListener('click', function () {
    var list = post.comments || [];
    if (!list.length) { setStatus('这篇没有配评论', true); return; }
    showComments(list);
    setStatus('已打开 ' + list.length + ' 条评论，点「复制这条」挑一条', true);
  });
})();
</script>
</body>
</html>
